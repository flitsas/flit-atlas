asyncapi: '2.6.0'
info:
  title: Eventos Demo
  description: Eventos ficticios del Organismo Demo para probar el workflow atlas-publicar (HU 3.10).
  version: 1.0.0
channels:
  demo.tramite.creado:
    subscribe:
      operationId: tramiteCreado
      message:
        $ref: '#/components/messages/TramiteCreado'
components:
  messages:
    TramiteCreado:
      name: demo.tramite.creado
      payload:
        allOf:
          - $ref: './comun/sobre.yaml#/Sobre'
          - type: object
            properties:
              data:
                type: object
                properties:
                  numero: { type: string }
