apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  annotations:
    atlas.ejemplo.com/nota: anotacion-ficticia
spec:
  replicas: 2
  selector:
    matchLabels: { app: demo-web }
  template:
    metadata:
      labels: { app: demo-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/flitsas-demo/web:1.2.3@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          env:
            - name: CLAVE_FICTICIA
              value: VALOR-SECRETO-FICTICIO
            - name: BASE_HOST
              value: 192.0.2.10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
spec:
  selector:
    matchLabels: { app: demo-api }
  template:
    metadata:
      labels: { app: demo-api }
    spec:
      containers:
        - name: api
          image: registro.interno.local/demo/api:1
          args: ["--conexion=interno.svc.cluster.local"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-limpieza
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: limpiar
              image: ghcr.io/flitsas-demo/limpieza:1
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
spec:
  tls:
    - hosts: [app.ejemplo.com, nodo.internal]
  rules:
    - host: app.ejemplo.com
    - host: interno.svc.cluster.local
    - host: 198.51.100.7
