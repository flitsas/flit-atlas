  /api/v1/pretramites/{id}:
    patch:
      operationId: patchPretramitesById
      summary: Editar un pre-trámite antes de materializar
      description: 'Edición parcial con concurrencia optimista (rowVersion). Si cambian campos que afectan la validación,
        se resetean los flags y se re-encola el pipeline. Una vez materializado (borrador creado) responde 409 already_materialized,
        salvo cuando el body trae SOLO sellingPrice (Bug #13304): entonces se aplica en el borrador de FLIT mientras siga
        en borrador, sin resetear validaciones (409 not_draft si ya avanzó, 400 invalid_selling_price si el precio no es mayor
        que cero con hasta 2 decimales y 16 dígitos enteros, 409 core_api_not_found si FLIT no encuentra el trámite, 503 core_api_unavailable
        si FLIT no responde, 502 core_api_error ante cualquier otro error de FLIT, cuyo código interno no se propaga).'
      tags:
      - ICT · Pre-trámites
      security:
      - ictClientToken: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          examples:
          - texto
        description: Parámetro `id` (path).
        example: texto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreTramitePatchRequest'
            example:
              rowVersion: 1
              sellingDate: texto
              sellingPrice: 1
              trafficSecretaryCode: texto
              processWithoutAttachedDocuments: true
        description: Cuerpo de la petición.
      responses:
        '200':
          description: Pre-trámite actualizado (row_version incrementado).
        '400':
          description: Datos inválidos (p. ej. invalid_selling_price, también cuando FLIT rechaza el valor).
        '409':
          description: |
            Conflicto de concurrencia (stale), ya materializado, no editable, not_draft o core_api_not_found (el pre-trámite existe en ICT pero FLIT no encuentra el trámite).
        '502':
          description: core_api_error — FLIT devolvió un error no previsto (sin propagar su código interno).
        '503':
          description: core_api_unavailable — FLIT no respondió al editar el precio; reintentar.
        '401':
          description: No autorizado. Se requiere autenticación para acceder al recurso solicitado. El cliente debe autenticarse
            para obtener acceso. A diferencia de 403 Forbidden, este código indica que la autenticación es posible, pero ha
            fallado o aún no se ha proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorIct'
              example:
                error: texto
        '500':
          description: Error interno del servidor. El servidor encontró una condición inesperada que le impidió cumplir con
            la solicitud. Es un error genérico que indica que algo salió mal en el servidor, pero el servidor no puede ser
            más específico sobre el problema
