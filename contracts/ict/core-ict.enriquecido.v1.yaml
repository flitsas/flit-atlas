      - ICT · Ingesta
      security:
      - ictClientToken: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                oneOf:
                - $ref: '#/components/schemas/TramiteTraspasoBilateral'
                - $ref: '#/components/schemas/TramiteTraspasoUnilateral'
