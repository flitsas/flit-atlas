openapi: 3.1.0
info:
  title: FLIT Core ICT API
  version: 1.1.0
  description: |-
    Contrato público de la Integración con Terceros (services/core-ict, Feature #10888). Un cliente gestor se autentica con su PROPIO token ICT (independiente del login de plataforma), registra trámites en lote, consulta su estado y los reprocesa. El submódulo de observabilidad (logs/alertas) usa el JWT de plataforma. Todas las rutas pasan por el Gateway YARP.

    Enriquecido con el Excel de contratos ICT (8 hojas: «1 - Auth», «2 - Transacction», «3 - Attachments», «4 - WebHookTransaction», «5 - StatusTransaction», «9 - Secretaries», «10 - PauseDraftProcess», «11 - AbortProcess»). Una sola URL base por ambiente: todo entra por el host público de core-ict.

    Archivo generado con `python -m atlas_docs.ict` (ATLAS-ADR-0037) desde `contracts/openapi/core-ict.v1.yaml` del repo `flit`; no se edita a mano. Las operaciones con `x-public` son las que se pueden compartir con clientes; las `x-internal` las quita la poda de Atlas.
  contact:
    name: FLIT S.A.S.
  x-flit-visibilidad: compartible
  x-flit-fuente:
    repo: flitsas/flit
    contrato: contracts/openapi/core-ict.v1.yaml
    version_contrato: 1.0.0
    gateway: services/core-api/src/Flit.Gateway/appsettings.json
    excel: Contratos_Integraciones_31Jul2025.xlsx
    hojas:
    - 1 - Auth
    - 2 - Transacction
    - 3 - Attachments
    - 4 - WebHookTransaction
    - 5 - StatusTransaction
    - 9 - Secretaries
    - 10 - PauseDraftProcess
    - 11 - AbortProcess
  x-flit-changelog:
  - version: 1.5.0
    fecha: '2025-05-16'
    hoja: 1 - Auth
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 1.5 de la hoja «1 - Auth» del Excel de contratos ICT.
  - version: 1.8.0
    fecha: '2025-05-16'
    hoja: 3 - Attachments
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 1.8 de la hoja «3 - Attachments» del Excel de contratos ICT.
  - version: 1.7.0
    fecha: '2025-05-16'
    hoja: 5 - StatusTransaction
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 1.7 de la hoja «5 - StatusTransaction» del Excel de contratos ICT.
  - version: 1.0.0
    fecha: '2025-05-16'
    hoja: 9 - Secretaries
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 1 de la hoja «9 - Secretaries» del Excel de contratos ICT.
  - version: 1.0.0
    fecha: '2025-07-31'
    hoja: 10 - PauseDraftProcess
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 1 de la hoja «10 - PauseDraftProcess» del Excel de contratos ICT.
  - version: 1.0.0
    fecha: '2025-07-31'
    hoja: 11 - AbortProcess
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 1 de la hoja «11 - AbortProcess» del Excel de contratos ICT.
  - version: 3.0.0
    fecha: '2025-10-06'
    hoja: 2 - Transacction
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 3 de la hoja «2 - Transacction» del Excel de contratos ICT.
  - version: 1.1.0
    fecha: null
    hoja: null
    colaborador: Equipo de integraciones de FLIT
    cambio: 'Contrato `contracts/openapi/core-ict.v1.yaml` 1.0.0 de FLIT 2 enriquecido con el Excel: operaciones de compatibilidad
      v1 que core-ict implementa, webhook, tablas de referencia, obligatoriedad por tipo de trámite, ejemplos y URL base única
      por ambiente.'
  x-flit-ambientes:
    qa: ict.qa.flitsas.com
    pdn: ict.flitsas.com
servers:
- url: https://{host}
  description: QA (pruebas de integración). La consola «probar ahora» de Atlas solo apunta aquí o al sandbox. URL base única
    de core-ict (todas las operaciones).
  variables:
    host:
      default: ict.qa.flitsas.com
      description: Host público de core-ict en qa.
  x-flit-ambiente: qa
- url: https://{host}
  description: Producción. URL base única de core-ict (todas las operaciones).
  variables:
    host:
      default: ict.flitsas.com
      description: Host público de core-ict en pdn.
  x-flit-ambiente: pdn
tags:
- name: ICT · Auth
  description: Login propio del cliente de integración (token independiente del de plataforma).
- name: ICT · Ingesta
  description: Registro por lote de pre-trámites (matrículas/traspasos/otros).
- name: ICT · Estado
  description: Consulta de estado (forma v1 de compatibilidad y forma v2-native) y reproceso.
- name: ICT · Pre-trámites
  description: Edición de pre-trámites antes de materializar (mejora v2).
- name: ICT · Observabilidad
  description: Logs y alertas ICT (submódulo frontend, JWT de plataforma con permiso ict.logs.read).
- name: ICT · Adjuntos
  description: Carga de los documentos adjuntos de un trámite (compatibilidad v1).
- name: ICT · Secretarías
  description: Secretarías de tránsito activas (compatibilidad v1).
- name: ICT · Ciclo de vida
  description: Pausa, reanudación y anulación de trámites en borrador (compatibilidad v1).
- name: Webhooks
  description: Notificaciones que FLIT envía a la URL que registró el gestor.
paths:
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Servicio de autenticacion para el uso de servicios
      description: |-
        Servicio de autenticacion para el uso de servicios.

        Autentica al cliente ICT por usuario/contraseña y emite un token propio (aud=flit-ict). `companyManagerId` se acepta y descarta (compat v1); el tenant se deriva del cliente. Aplica rate-limit (bloqueo tras varios intentos fallidos).
      tags:
      - ICT · Auth
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IctLoginRequest'
            example:
              username: usuario@ejemplo.com
              password: $CLAVE
        description: Cuerpo de la petición según la hoja «1 - Auth» del Excel.
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IctLoginResponse'
              example:
                token: $TOKEN
        '401':
          description: Credenciales inválidas o cliente bloqueado/inactivo.
        '403':
          description: Cliente inactivo, bloqueado o sin compañía disponible (`inactive`, `locked`, `tenant_unavailable`).
        '500':
          description: Error interno del servidor. El servidor encontró una condición inesperada que le impidió cumplir con
            la solicitud. Es un error genérico que indica que algo salió mal en el servidor, pero el servidor no puede ser
            más específico sobre el problema
      x-flit-hoja-excel: 1 - Auth
      x-public: true
      x-flit-sin-autenticacion: true
  /api/v1/external-transaction/register:
    post:
      operationId: postExternalTransactionRegister
      summary: Servicio para creacion y actualizacion de datos de tramites
      description: |-
        Servicio para creacion y actualizacion de datos de tramites.

        Ingresa un lote de trámites (respuesta con la forma v1). Valida el límite de lote (422 si se excede, sin persistir nada), el NIT del token contra cada fila y los duplicados intra-lote. NO crea nada en trámites todavía: el pipeline valida y, al pasar, materializa el borrador por gRPC.
