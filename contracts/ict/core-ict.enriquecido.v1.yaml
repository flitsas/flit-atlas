    NotificacionEstadoTramite:
      type: object
      required:
      - managerIdTransaction
      - ictEstado
      - transactionFlit
      - status
      properties:
        managerIdTransaction:
          type: string
          maxLength: 20
          description: Id Propio o interno de la herramienta del Gestor
          examples:
          - GESTOR-0001
        ictEstado:
          type: string
          enum:
          - recibido
          - en_validacion_negocio
          - en_validacion_externa
          - procesado
          - borrador_creado
          - con_novedades
          - anulado
          description: Estado del pre-trámite en el vocabulario v2 de core-ict.
          examples:
          - recibido
        procedureInstanceId:
          type:
          - string
          - 'null'
          examples:
          - texto
        transactionType:
          type: integer
          examples:
          - 1
        message:
          type: string
          examples:
          - texto
        timestamp:
          type: string
          format: date-time
          examples:
          - '2025-01-31T15:00:00Z'
        transactionFlit:
          type: string
          description: Id del tramite asociado entregado en la creacion
          examples:
          - '1290'
        status:
          type: integer
          description: Código del estado del trámite
          examples:
          - 4
        statusDescription:
          type: string
          maxLength: 250
          description: Nombre o descripción del estado del trámite
          examples:
          - En validación
        statusMessage:
          type: string
          maxLength: 250
          description: Mensaje general del estado(es opcional)
          examples:
          - Errores en el proceso de validación
        statusObservation:
          type: string
          maxLength: 1000
          description: Descripción detalla del estado o novedad(es opcional)
          examples:
          - El documento del comprador está vacío
        statusText:
          type: string
          examples:
          - texto
      description: Esquema `NotificacionEstadoTramite` de core-ict.
      examples:
      - transactionFlit: '1290'
        managerIdTransaction: GESTOR-0001
        status: 4
        statusDescription: En validación
        statusMessage: Errores en el proceso de validación
        statusObservation: El documento del comprador está vacío
        ictEstado: recibido
    RespuestaNotificacion:
      type: object
      properties:
        Status:
          type: integer
          description: Estado de proceso de registro de documento(1-Registrado, 2-No Registrado)
          examples:
          - 1
        Message:
          type: string
          maxLength: 250
