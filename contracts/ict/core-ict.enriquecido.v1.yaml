components:
  securitySchemes:
    ictClientToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token propio del cliente de integración (aud=flit-ict, scope ict.transactions.write). Lo entrega `POST
        /api/v1/auth/login` y viaja en la cabecera `Authorization: Bearer $TOKEN`. [por verificar] cumplimiento de RFC8725
        en el emisor.'
    platformJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de plataforma FLIT (para el submódulo de observabilidad). [por verificar] cumplimiento de RFC8725 en
        el emisor.
  schemas:
    IctLoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: Email asociado a cuenta del gestor externo
          examples:
          - usuario@ejemplo.com
        password:
          type: string
          description: contraseña de autenticación
          examples:
          - $CLAVE
        companyManagerId:
          type: string
          description: Aceptado y descartado (compat v1); el tenant se deriva del cliente.
          examples:
          - texto
      description: Esquema `IctLoginRequest` de core-ict.
      examples:
      - username: usuario@ejemplo.com
        password: $CLAVE
    IctLoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Clave de seguridad que sera solicitada para todas las operaciones.
          examples:
          - $TOKEN
        expiresInSeconds:
          type: integer
          examples:
          - 1
        mustRotate:
          type: boolean
          examples:
          - true
      description: Esquema `IctLoginResponse` de core-ict.
      examples:
      - token: $TOKEN
    RegisterBatchResponse:
      type: object
      properties:
        TotalRows:
          type: integer
          description: Cantidad de registros recibidos
          examples:
          - 2
        TotalRowsProcessed:
          type: integer
          description: Cantidad de registros procesados satisfactoriamente
          examples:
          - 1
        Detail:
          type: array
          items:
            type: object
            properties:
              Plate:
                type: string
                maxLength: 15
                description: Placa asociada al registro
                examples:
                - ABC123
              Status:
                type: integer
                description: Estado de proceso de registro de la placa (1-Registrado, 2-No Registrado)
                examples:
                - 1
              Message:
                type: string
                maxLength: 255
                description: Mensaje asociado a la respuesta del estado del registro
                examples:
                - Registered Successfully
              TransactionFlit:
                type: string
                description: Id del tramite de la creacion en FLIT
                examples:
                - '123'
            examples:
            - Plate: ABC123
              Status: 1
              Message: Registered Successfully
              TransactionFlit: '123'
          examples:
          - - Plate: ABC123
              Status: 1
              Message: Registered Successfully
              TransactionFlit: '123'
            - Plate: ABC123
              Status: 2
              Message: Error registering information, Buyer/DocumentNumber field exceeds length
              TransactionFlit: texto
      description: Esquema `RegisterBatchResponse` de core-ict.
      examples:
      - TotalRows: 2
        TotalRowsProcessed: 1
        Detail:
        - Plate: ABC123
          Status: 1
          Message: Registered Successfully
          TransactionFlit: '123'
        - Plate: ABC123
          Status: 2
          Message: Error registering information, Buyer/DocumentNumber field exceeds length
          TransactionFlit: texto
    StatusProcessV1Response:
      type: object
      properties:
        transactionFlit:
          type: string
          examples:
          - texto
        statusValidation:
          type: integer
          description: Estado de proceso de registro de documento(1-Registrado,  2-En Validacion, 3-Procesado, 4-Con Novedades)
          examples:
          - 1
        statusDescription:
          type: string
          examples:
          - texto
        messageValidation:
          type: string
          maxLength: 250
          description: Mensaje asociado a la respuesta del estado del registro
          examples:
          - ' '
        statusObservation:
          type: string
          examples:
          - texto
        status:
          type: integer
          examples:
          - 1
        statusMessage:
          type: string
          examples:
          - texto
        statusProcess:
          type: array
          items:
            type: object
            properties:
              status:
                type: integer
                description: Estado del proceso del Tramite (1-Borrador, 2-Preparado, 3-Enviado OT, 4-entregado, 5- aprobado,
                  6 rechazado)
                examples:
                - 1
              statusDescription:
                type: string
                maxLength: 250
                description: Descripcion asociado al estado del Tramite
                examples:
                - Borrador
              observation:
                type: string
                maxLength: 250
                description: Observacion asociada al estado del Tramite
                examples:
                - Actualización de datos personales
              userMailRegistered:
                type: string
                maxLength: 50
                description: Email asociado al usuario o sistema que realizo el cambio de estado del tramite
                examples:
                - usuario@ejemplo.com
