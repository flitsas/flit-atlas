  /api/v1/status-process/byId/{id}:
    get:
      operationId: getStatusProcessById
      summary: Servicio de consulta de estado de un tramite o transaccion
      description: |-
        Servicio de consulta de estado de un tramite o transaccion.

        Devuelve el histórico de estados con códigos numéricos (contrato v1). El id es el TransactionFlit (manager_id_transaction).
      tags:
      - ICT · Estado
      security:
      - ictClientToken: []
      parameters:
      - name: id
        in: path
        required: true
        description: Id del tramite asociado entregado en la creacion
        schema:
          type: string
          examples:
          - texto
        example: '123'
      responses:
        '200':
          description: Estado en forma v1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusProcessV1Response'
              example:
                statusValidation: 1
                messageValidation: ' '
                statusProcess:
                - status: 1
                  statusDescription: Borrador
                  observation: Actualización de datos personales
                  userMailRegistered: usuario@ejemplo.com
                  userRoleRegistered: Documentador
                  userNameRegistered: Nombre Demo
                  dateRegistered: '2024-03-12T20:45:43.170Z'
                  companyRegistered: Organismo Demo
                - status: 2
                  statusDescription: Borrador
                  observation: Actualización de datos personales
                  userMailRegistered: usuario@ejemplo.com
                  userRoleRegistered: Documentador
                  userNameRegistered: Nombre Demo
                  dateRegistered: '2024-03-12T20:45:43.170Z'
                  companyRegistered: Organismo Demo
        '404':
          description: No existe un pre-trámite con ese id para el tenant.
        '401':
          description: No autorizado. Se requiere autenticación para acceder al recurso solicitado. El cliente debe autenticarse
            para obtener acceso. A diferencia de 403 Forbidden, este código indica que la autenticación es posible, pero ha
            fallado o aún no se ha proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorIct'
              example:
                error: texto
        '500':
          description: Error interno del servidor. El servidor encontró una condición inesperada que le impidió cumplir con
            la solicitud. Es un error genérico que indica que algo salió mal en el servidor, pero el servidor no puede ser
            más específico sobre el problema
      x-flit-hoja-excel: 5 - StatusTransaction
      x-public: true
  /api/v1/ict/status/{id}:
    get:
      operationId: getIctStatusById
      summary: Estado del pre-trámite (v2-native)
      description: Proyecta el estado interno al vocabulario v2 (sin códigos numéricos) y, si el pre-trámite ya se materializó,
        adjunta el estado v2 del trámite (Plano C).
      tags:
      - ICT · Estado
      security:
      - ictClientToken: []
      parameters:
      - name: id
        in: path
        required: true
        description: TransactionFlit (manager_id_transaction) devuelto por el registro.
        schema:
          type: string
          examples:
          - texto
        example: texto
      responses:
        '200':
          description: Estado en vocabulario v2.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IctStatusV2Response'
              example:
                managerIdTransaction: texto
                ictEstado: recibido
                procedureInstanceId: texto
                tramiteStatus: texto
                comments: texto
        '404':
          description: No existe un pre-trámite con ese id para el tenant.
        '401':
          description: No autorizado. Se requiere autenticación para acceder al recurso solicitado. El cliente debe autenticarse
