        creadoEn:
          type: string
          description: Cuándo se creó o se regeneró.
          format: date-time
        ultimoUsoEn:
          type:
            - 'null'
            - string
          description: Última vez que un calendario lo leyó (con precisión de una hora).
          format: date-time
