          format: date-time
      description: 'Renovación: vencimiento nuevo del acceso. Si la invitación no se ha aceptado, también se envía un enlace nuevo.'
    SolicitudRestauracion:
      required:
        - nota
        - revisionBase
      type: object
      properties:
        nota:
          type: string
          description: 'Mensaje del cambio, hasta 500 caracteres.'
        revisionBase:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: La última revisión que vio la persona (409 si ya hay otra más nueva).
          format: int32
      description: 'Restaurar una revisión: crea otra igual a ella.'
    SolicitudSegundoFactor:
