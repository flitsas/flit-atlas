      description: 'Personas de Atlas por nombre o correo, sin distinguir mayúsculas ni tildes (cada palabra debe estar en el nombre o en el correo), o por su id exacto. Mínimo 2 caracteres; hasta 50 resultados ordenados por nombre, sin paginación (hayMas pide afinar la búsqueda). Devuelve lo mínimo para abrir las asignaciones de la persona, con sus roles asignados vigentes. Un externo solo vería personas de su organización (predicado obligatorio y RLS). Requiere atlas.roles.ver.'
      operationId: BuscarPersonas
      parameters:
        - name: q
          in: query
          description: 'Texto a buscar en el nombre o el correo (mínimo 2 caracteres, máximo 100), o el id de la persona.'
          schema:
            type: string
        - name: tipo
          in: query
          description: 'empleado o externo; vacío, ambos.'
          schema:
            type: string
        - name: organizacion
          in: query
          description: 'Id de la organización de las personas; vacío, todas las visibles.'
          schema:
            type: string
            format: uuid
        - name: limite
          in: query
          description: 'Máximo de resultados, de 1 a 50 (por defecto 20).'
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      responses:
        '200':
          description: OK
          content:
