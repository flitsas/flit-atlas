openapi: '3.1.1'
info:
  title: Flit Atlas
  description: 'API de Flit Atlas para su PWA (BFF, ATLAS-ADR-0008). La sesión viaja en la cookie `__Host-atlas` (HttpOnly, Secure, SameSite=Strict); las peticiones que cambian estado exigen además la cabecera `X-Atlas-Csrf` y el mismo origen. Los clientes que no son el navegador (atlas-cli, MCP, servicios internos) usan tokens Bearer del servidor OpenIddict de Atlas solo en las operaciones que declaran el esquema `tokenAtlas`; el protocolo (`/connect/*`) se describe en `/.well-known/openid-configuration` (ATLAS-ADR-0024). Este archivo se genera desde el código: no se edita a mano.'
  version: 1.0.0
servers:
  - url: https://atlas.flitsas.com
    description: Producción (pdn)
  - url: https://qa.atlas.flitsas.com
    description: Pruebas (qa)
paths:
  /api/v1/plataforma/yo:
    get:
      tags:
        - Plataforma
      summary: Usuario en sesión
      description: 'Persona, organización, proveedor de ingreso, roles vigentes y permisos efectivos de la sesión actual. Roles y permisos se calculan en el servidor en cada petición con las asignaciones vigentes: un rol vencido o retirado ya no aparece (ATLAS-ADR-0023).'
      operationId: ObtenerUsuarioActual
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Yo'
        '401':
          description: No hay una sesión activa o venció.
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - sesionAtlas: [ ]
  /api/v1/plataforma/errores-cliente:
    post:
      tags:
        - Plataforma
      summary: Reportar un error de la PWA
      description: 'La PWA envía aquí los errores de la pantalla «Algo salió mal» (salvo los de descarga de un módulo tras un despliegue, que se resuelven recargando). Se escriben como advertencia en el log estructurado con la referencia que la persona ve y el id de la persona (no su correo); no se guardan en la base. Requiere la sesión de la PWA (empleado, externo o cuenta de emergencia; no acepta tokens Bearer): sin sesión responde 401 y la PWA no reporta. Tiene límite de tasa por persona y por IP y un cuerpo de máximo 8 KB. El servidor recorta los campos y tacha correos, números largos y cadenas con forma de token.'
      operationId: ReportarErrorDeCliente
      requestBody:
        description: Error de la PWA que la persona vio en la pantalla «Algo salió mal». Solo datos técnicos.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReporteErrorCliente'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorClienteRegistrado'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '413':
          description: Payload Too Large
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
  /api/v1/version:
    get:
      tags:
        - Plataforma
      summary: Versión de atlas-api
      description: Nombre del servicio y versión del ensamblado desplegado. No requiere sesión.
      operationId: ObtenerVersion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionApi'
  /api/v1/identidad/proveedores:
    get:
      tags:
        - Identidad
      summary: Proveedores de ingreso habilitados
      description: Qué botones de ingreso muestra la PWA en este ambiente. No requiere sesión.
      operationId: ListarProveedoresDeIngreso
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedoresHabilitados'
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
  /api/v1/identidad/entrar/microsoft:
    get:
      tags:
        - Identidad
      summary: Iniciar sesión con Microsoft
      description: 'Navegación completa del navegador (no fetch). Redirige a Entra ID (OIDC con PKCE); al volver por /api/auth/callback/azure-ad crea una sesión nueva y lleva a «volver», que solo puede ser una ruta local de la PWA. Con reautenticar=true, Entra vuelve a pedir las credenciales (prompt=login).'
      operationId: EntrarConMicrosoft
      parameters:
        - name: volver
          in: query
          description: Ruta local de la PWA a la que se vuelve después del ingreso (por defecto «/»).
          schema:
            type: string
        - name: reautenticar
          in: query
          description: true cuando una acción sensible pidió reautenticación (responde 401 con codigo reautenticacion_requerida).
          schema:
            type: boolean
      responses:
        '302':
          description: Found
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
  /api/v1/identidad/salir:
    post:
      tags:
        - Identidad
      summary: Cerrar sesión
      description: 'Revoca la sesión en el servidor, borra la cookie y envía Clear-Site-Data para que el navegador limpie caché, almacenamiento y cookies del origen. Responde 204 aunque no haya sesión.'
      operationId: CerrarSesion
      responses:
        '204':
          description: No Content
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - csrfAtlas: [ ]
  /api/v1/identidad/token/yo:
    get:
      tags:
        - Identidad
      summary: Portador del token de acceso
      description: 'Para clientes que no son el navegador (atlas-cli, MCP, servicios internos): devuelve a quién representa el token Bearer y con qué scopes y audiencias. Exige un token de Atlas con al menos un scope de módulo; la cookie de la PWA no sirve aquí.'
      operationId: ObtenerPortadorDelToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortadorToken'
        '401':
          description: 'Falta el token Bearer de Atlas, venció, fue revocado o es para otra audiencia (la cookie de la PWA no sirve aquí).'
        '403':
          description: 'El token no tiene ninguno de los scopes que exige la operación (atlas.mcp, atlas.publicar, atlas.widget).'
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - tokenAtlas:
            - atlas.mcp
            - atlas.publicar
            - atlas.widget
  /api/v1/identidad/terminos:
    get:
      tags:
        - Identidad
      summary: Términos de uso y aviso de privacidad vigentes
      description: Versión y texto (Markdown) de los documentos que acepta un externo al crear su cuenta (Ley 1581). No requiere sesión.
      operationId: ListarDocumentosLegales
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentoVigente'
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
  /api/v1/identidad/sesiones:
    get:
      tags:
        - Identidad
      summary: Dispositivos conectados
      description: 'Sesiones activas del usuario, de la más reciente a la más antigua; «actual» marca la de esta petición.'
      operationId: ListarMisSesiones
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SesionDispositivo'
        '401':
          description: No hay una sesión activa o venció.
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - sesionAtlas: [ ]
  '/api/v1/identidad/sesiones/{id}':
    delete:
      tags:
        - Identidad
      summary: Cerrar una sesión
      description: Cierra una sesión del propio usuario. Si es la actual equivale a salir (Clear-Site-Data); si es la de otro dispositivo exige un ingreso de menos de 10 minutos (401 con codigo reautenticacion_requerida).
      operationId: CerrarMiSesion
      parameters:
        - name: id
          in: path
          description: 'Id de la sesión, tal como lo lista «dispositivos conectados».'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
        '401':
          description: 'No hay una sesión activa, o el último ingreso tiene más de 10 minutos (problem+json con codigo «reautenticacion_requerida»: la PWA lleva a reingresar).'
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
  /api/v1/identidad/sesiones/cerrar-otras:
    post:
      tags:
        - Identidad
      summary: Cerrar las demás sesiones
      description: Cierra todas las sesiones del usuario salvo la actual. Exige reautenticación.
      operationId: CerrarMisOtrasSesiones
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCierre'
        '401':
          description: 'No hay una sesión activa, o el último ingreso tiene más de 10 minutos (problem+json con codigo «reautenticacion_requerida»: la PWA lleva a reingresar).'
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
  '/api/v1/identidad/admin/personas/{personaId}/sesiones/cerrar':
    post:
      tags:
        - Identidad
      summary: Cerrar todas las sesiones de una persona
      description: 'Administración: requiere atlas.identidad.administrar. Cambia el sello de seguridad de la persona y revoca todas sus sesiones, sin suspenderla. Exige reautenticación.'
      operationId: CerrarSesionesDePersona
      parameters:
        - name: personaId
          in: path
          description: Persona de Atlas (plataforma_persona).
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoCierre'
        '404':
          description: Not Found
        '401':
          description: 'No hay una sesión activa, o el último ingreso tiene más de 10 minutos (problem+json con codigo «reautenticacion_requerida»: la PWA lleva a reingresar).'
        '403':
          description: 'Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host, o la sesión no tiene el permiso atlas.identidad.administrar.'
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
      x-atlas-permisos:
        - atlas.identidad.administrar
  '/api/v1/identidad/admin/personas/{personaId}/suspender':
    post:
      tags:
        - Identidad
      summary: Suspender a una persona
      description: 'Administración: requiere atlas.identidad.administrar. Marca la persona como suspendida, invalida sus sesiones de inmediato y le impide volver a entrar. 409 si intentas suspenderte o si es la cuenta de administrador de emergencia (se rota con el comando de consola). Exige reautenticación.'
      operationId: SuspenderPersona
      parameters:
        - name: personaId
          in: path
          description: Persona de Atlas (plataforma_persona).
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
        '409':
          description: Conflict
        '401':
          description: 'No hay una sesión activa, o el último ingreso tiene más de 10 minutos (problem+json con codigo «reautenticacion_requerida»: la PWA lleva a reingresar).'
        '403':
          description: 'Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host, o la sesión no tiene el permiso atlas.identidad.administrar.'
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
      x-atlas-permisos:
        - atlas.identidad.administrar
  '/api/v1/identidad/admin/personas/{personaId}/reactivar':
    post:
      tags:
        - Identidad
      summary: Reactivar a una persona
      description: 'Administración: requiere atlas.identidad.administrar. Devuelve a activa una persona suspendida; vuelve a entrar con un ingreso nuevo. Exige reautenticación.'
      operationId: ReactivarPersona
      parameters:
        - name: personaId
          in: path
          description: Persona de Atlas (plataforma_persona).
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
        '401':
          description: 'No hay una sesión activa, o el último ingreso tiene más de 10 minutos (problem+json con codigo «reautenticacion_requerida»: la PWA lleva a reingresar).'
        '403':
          description: 'Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host, o la sesión no tiene el permiso atlas.identidad.administrar.'
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
      x-atlas-permisos:
        - atlas.identidad.administrar
  /api/v1/identidad/invitaciones/consultar:
    post:
      tags:
        - Identidad
      summary: Ver una invitación antes de aceptarla
      description: 'Organización, rol, vencimientos y documentos de la invitación del enlace. 410 si el enlace se usó, venció, se revocó o no existe (la misma respuesta en todos los casos). No requiere sesión.'
      operationId: ConsultarInvitacion
      requestBody:
        description: Token del enlace de la invitación.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudToken'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitacionPublica'
        '410':
          description: Gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorExternos'
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - csrfAtlas: [ ]
  /api/v1/identidad/invitaciones/passkey/opciones:
    post:
      tags:
        - Identidad
      summary: Opciones para crear la passkey de la cuenta
      description: Desafío de WebAuthn (navigator.credentials.create) para la cuenta que se crea con la invitación. Vence en 5 minutos y sirve una sola vez. No requiere sesión.
      operationId: OpcionesPasskeyInvitacion
      requestBody:
        description: Token de la invitación y nombre para la passkey.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudOpcionesInvitacion'
        required: true
      responses:
        '200':
