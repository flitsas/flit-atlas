      tags:
        - Contratos
      summary: Publicar una versión de contrato desde la CI
      description: 'Solo con el token OIDC de GitHub Actions del workflow reutilizable oficial (Authorization: Bearer, audiencia del ambiente), desde un repo, rama y workflow de la lista blanca del catálogo para ese aplicativo y tipo. Valida el spec (OpenAPI 3.x, AsyncAPI 2.x/3.x o proto), lo guarda inmutable con su SHA-256 y su procedencia (repo, rama, workflow, commit y ejecución del token) y arma el índice de operaciones. 201 si es nueva; 200 si la misma versión ya existe con el mismo hash (idempotente); 409 si existe con otro hash (sube la versión); 422 si el spec no es válido. La cookie de la PWA no sirve aquí.'
      operationId: PublicarVersionContrato
      requestBody:
        description: La versión a publicar.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudPublicacion'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPublicada'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPublicada'
        '403':
          description: 'El dueño del repo, el evento o el workflow reutilizable no están permitidos (sin cuerpo), o el repo, la rama, el workflow, el aplicativo o el tipo no están en la lista blanca (con el código).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPublicacion'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPublicacion'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPublicacion'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: 'Falta el token OIDC de GitHub Actions, venció, no lo firmó GitHub o es para otra audiencia (la cookie de la PWA no sirve aquí).'
        '404':
          description: El módulo está apagado para la organización de la sesión (bandera modulo.contratos).
      security:
        - githubActions: [ ]
