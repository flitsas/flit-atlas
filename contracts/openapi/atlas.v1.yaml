        slug:
          type: string
          description: 'Slug del aplicativo: es la URL de su ficha.'
        nombre:
          type: string
          description: Nombre del aplicativo.
        tipo:
          type: string
          description: 'producto, modulo o servicio.'
      description: 'Aplicativo del catálogo, para enlazar su ficha.'
    AplicativoResumen:
      required:
        - id
        - slug
        - nombre
        - tipo
        - grupo
        - estado
        - criticidad
        - manejaDatosPersonales
        - padreId
        - descripcion
        - tecnologias
        - etiquetas
        - ancestros
        - hijos
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: 'Clave natural (minúsculas, números y guiones).'
        nombre:
          type: string
        tipo:
          type: string
          description: 'producto, modulo o servicio.'
        grupo:
          type: string
          description: 'flit2, flito, satelite, legado o infraestructura.'
        estado:
          type: string
          description: 'planeado, activo, en_retiro o retirado.'
        criticidad:
          type: string
          description: 'alta, media o baja.'
        manejaDatosPersonales:
          type: boolean
          description: Si trata datos personales.
        padreId:
          type:
            - 'null'
            - string
          description: Padre directo; vacío en un producto.
          format: uuid
        descripcion:
          type:
            - 'null'
            - string
          description: 'Descripción; lo que falta confirmar lleva «[por verificar]».'
        tecnologias:
          type: array
          items:
            type: string
        etiquetas:
          type: array
          items:
            type: string
        ancestros:
          type: array
          items:
            $ref: '#/components/schemas/ReferenciaAplicativo'
          description: Del producto al padre directo.
        hijos:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Cuántos hijos directos tiene.
          format: int32
      description: Aplicativo del catálogo en un listado.
    AQuienLlamoDto:
      required:
        - aplicativo
        - hoy
        - esSabado
        - soporte
        - principal
        - secundario
        - heredadoDe
        - veContacto
      type: object
      properties:
        aplicativo:
          description: El aplicativo.
          $ref: '#/components/schemas/AplicativoRefDto'
        hoy:
          type: string
          description: Hoy en Bogotá.
          format: date
        esSabado:
          type: boolean
          description: Si hoy es sábado.
        soporte:
          oneOf:
            - type: 'null'
            - description: Soporte de turno de hoy; vacío si no es sábado o no hay módulo de soporte.
              $ref: '#/components/schemas/SoporteHoyDto'
        principal:
          oneOf:
            - type: 'null'
            - description: Principal.
              $ref: '#/components/schemas/ResponsableDto'
        secundario:
          oneOf:
            - type: 'null'
            - description: Secundario.
              $ref: '#/components/schemas/ResponsableDto'
        heredadoDe:
          oneOf:
            - type: 'null'
            - description: Si los responsables son de un ancestro.
              $ref: '#/components/schemas/AplicativoRefDto'
        veContacto:
          type: boolean
          description: Si la persona ve teléfonos (atlas.equipo.ver_contacto).
      description: '«¿A quién llamo?»: soporte de turno si hoy es sábado, y el principal y el secundario del aplicativo.'
    AsignacionVista:
      required:
        - id
        - personaId
        - rol
        - rolNombre
        - tipoRol
        - organizacionId
        - alcance
        - vigenteDesde
        - vigenteHasta
        - origen
        - vigente
        - asignadoPor
        - creadoEn
      type: object
      properties:
        id:
          type: string
          format: uuid
        personaId:
          type: string
          format: uuid
        rol:
          type: string
        rolNombre:
          type: string
        tipoRol:
          type: string
          description: interno o externo.
        organizacionId:
          type:
            - 'null'
            - string
          format: uuid
        alcance:
          $ref: '#/components/schemas/AlcanceVista'
        vigenteDesde:
          type: string
          format: date-time
        vigenteHasta:
          type:
            - 'null'
            - string
          format: date-time
        origen:
          type: string
          description: 'manual, grupo_entra, invitacion o emergencia.'
        vigente:
          type: boolean
          description: Si concede permisos en este momento (empezó y no ha vencido).
        asignadoPor:
          type:
            - 'null'
            - string
          format: uuid
        creadoEn:
          type: string
          format: date-time
      description: 'Asignación de un rol a una persona, con su organización, alcance y vigencia.'
    AusenciaDto:
      required:
        - id
        - personaId
        - nombre
        - desde
        - hasta
        - tipo
      type: object
      properties:
        id:
          type: string
          description: Id de la ausencia.
          format: uuid
        personaId:
          type: string
          description: Id de la persona.
          format: uuid
        nombre:
          type: string
          description: Nombre de la persona.
        desde:
          type: string
          description: Primer día (aaaa-mm-dd).
          format: date
        hasta:
          type: string
          description: 'Último día, incluido (aaaa-mm-dd).'
          format: date
        tipo:
          type: string
          description: 'vacaciones, incapacidad u otra.'
      description: Ausencia de una persona (vale en todos sus equipos).
    BajaSuscripcionDto:
      required:
        - endpoint
      type: object
      properties:
        endpoint:
          type: string
      description: Suscripción que se da de baja.
    BandejaDto:
      required:
        - noLeidas
        - elementos
      type: object
      properties:
        noLeidas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/NotificacionDto'
      description: 'Bandeja de la persona: total sin leer y las más recientes primero.'
    BaseComparacion:
      required:
        - contratoId
        - versionId
        - version
        - sha256
        - origen
        - ambiente
        - spec
      type: object
      properties:
        contratoId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        version:
          type: string
        sha256:
          type: string
          description: SHA-256 del spec (hexadecimal).
        origen:
          type: string
          description: 'canal: la versión que corre en el ambiente de referencia; ultima_estable: aún no hay canal en ese ambiente.'
        ambiente:
          type: string
          description: Ambiente de referencia (pdn).
        spec:
          type: string
          description: 'El spec completo, tal como se publicó.'
      description: La versión base para comparar en la CI (oasdiff breaking y changelog).
    BloqueCodeownersDto:
      required:
        - repo
        - texto
        - lineas
      type: object
      properties:
        repo:
          type: string
          description: Repo como dueño/nombre.
        texto:
          type: string
          description: 'El bloque, listo para copiar.'
        lineas:
          type: array
          items:
            $ref: '#/components/schemas/LineaCodeownersDto'
          description: Sus líneas.
      description: Bloque CODEOWNERS sugerido para un repo.
    BreakingPendientes:
      required:
        - desde
        - hasta
        - estado
        - fuente
        - cambios
      type: object
      properties:
        desde:
          type: string
          description: Versión en pdn.
        hasta:
          type: string
          description: Versión en qa.
        estado:
          type: string
          description: 'sin_breaking, con_breaking, no_disponible (atlas-render no respondió o una spec no es válida) o no_soportado (AsyncAPI y proto sin changelog que sirva).'
        fuente:
          type:
            - 'null'
            - string
          description: changelog (el que guardó la CI al publicar) o render (calculado ahora); vacío si no se pudo calcular.
        cambios:
          type: array
          items:
            $ref: '#/components/schemas/CambioBreaking'
      description: 'Breaking pendientes: lo que rompería pdn si se promueve la versión de qa.'
    CalendarioDto:
      required:
        - desde
        - hasta
        - equipoId
        - turnos
        - festivos
      type: object
      properties:
        desde:
          type: string
          description: Primer día del rango.
          format: date
        hasta:
          type: string
          description: Último día del rango (incluido).
          format: date
        equipoId:
          type:
            - 'null'
            - string
          description: 'Equipo filtrado; vacío, todos.'
          format: uuid
        turnos:
          type: array
          items:
            $ref: '#/components/schemas/TurnoDto'
          description: 'Turnos del rango, por fecha y equipo; incluye reemplazados y cancelados como historia.'
        festivos:
          type: array
          items:
            $ref: '#/components/schemas/FestivoDto'
          description: Festivos del rango.
      description: 'Turnos y festivos de un rango de fechas, para las vistas de lista, semana y mes.'
    CambioBreaking:
      required:
        - regla
        - texto
        - metodo
        - ruta
      type: object
      properties:
        regla:
          type: string
          description: Id de la regla de oasdiff (api-removed-without-deprecation…).
        texto:
          type: string
        metodo:
          type:
            - 'null'
            - string
        ruta:
          type:
            - 'null'
            - string
      description: Un cambio incompatible (nivel error de oasdiff) entre la versión de pdn y la de qa.
    CambioCompensacion:
      required:
        - fechaCompensada
        - estado
        - nota
      type: object
      properties:
        fechaCompensada:
          type:
            - 'null'
            - string
          description: Día compensado.
          format: date
        estado:
          maxLength: 20
          type:
            - 'null'
            - string
          description: pendiente o tomada.
        nota:
          maxLength: 500
          type:
            - 'null'
            - string
          description: Nota.
      description: 'Cambio de una compensación: el día y el estado (tomada exige el día).'
    CambioConfiguracion:
      required:
        - horaInicioPorDefecto
        - horaFinPorDefecto
        - reglaFestivos
        - diasAnticipacionRecordatorio
        - canalExterno
      type: object
      properties:
        horaInicioPorDefecto:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora de inicio por defecto (HH:mm, Bogotá).'
        horaFinPorDefecto:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora de fin por defecto (HH:mm, Bogotá); posterior al inicio.'
        reglaFestivos:
          maxLength: 20
          type:
            - 'null'
            - string
          description: sin_turno o turno_normal.
        diasAnticipacionRecordatorio:
          maximum: 30
          minimum: 1
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          description: 'Días de anticipación de los recordatorios, de 1 a 30.'
          format: int32
        canalExterno:
          maxLength: 200
          type:
            - 'null'
            - string
          description: 'Canal de soporte del sábado para externos, sin nombres de personas.'
        horaRecordatorios:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora (HH:mm, Bogotá) del trabajo diario de recordatorios; vacío, 07:00.'
      description: 'Configuración global nueva: reemplaza toda la anterior.'
    CambioDiff:
      required:
        - regla
        - nivel
        - breaking
        - texto
        - comentario
        - metodo
        - ruta
        - operationId
        - seccion
      type: object
      properties:
        regla:
          type: string
          description: Id de la regla de oasdiff (api-path-removed-without-deprecation…).
        nivel:
          type: string
          description: 'error, warning o info. error y warning rompen compatibilidad.'
        breaking:
          type: boolean
          description: Si rompe compatibilidad (está en oasdiff breaking).
        texto:
          type: string
          description: 'Texto del cambio, en español cuando oasdiff lo trae traducido.'
        comentario:
          type:
            - 'null'
            - string
        metodo:
          type:
            - 'null'
            - string
        ruta:
          type:
            - 'null'
            - string
        operationId:
          type:
            - 'null'
            - string
        seccion:
          type:
            - 'null'
            - string
          description: 'paths, components, webhooks…'
      description: 'Un cambio entre dos versiones, como lo reporta oasdiff.'
    CambioEquipo:
      required:
        - nombre
        - area
        - personasMinimo
        - personasMaximo
        - horaInicio
        - horaFin
        - activo
      type: object
      properties:
        nombre:
          maxLength: 100
          minLength: 1
          type:
            - 'null'
            - string
          description: 'Nombre del equipo, único.'
        area:
          maxLength: 100
          type:
            - 'null'
            - string
          description: Área.
        personasMinimo:
          maximum: 10
          minimum: 1
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Mínimo de personas por sábado (1 a 10).
          format: int32
        personasMaximo:
          maximum: 10
          minimum: 1
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Máximo de personas por sábado (mínimo a 10).
          format: int32
        horaInicio:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora de inicio propia (HH:mm); vacía, la global.'
        horaFin:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora de fin propia (HH:mm); vacía, la global.'
        activo:
          type:
            - 'null'
            - boolean
          description: 'Si está activo; vacío, activo.'
      description: Equipo nuevo o cambio de un equipo (reemplaza todos sus datos).
    CambioEstadoTurno:
      required:
        - estado
        - observacion
      type: object
      properties:
        estado:
          maxLength: 20
          type:
            - 'null'
            - string
          description: 'confirmado, aplicado o cancelado.'
        observacion:
          maxLength: 500
          type:
            - 'null'
            - string
          description: Observación (se agrega a la del turno).
      description: 'Cambio de estado de un turno: confirmado, aplicado o cancelado (el reemplazo tiene su propia operación).'
    CambioParticipante:
      required:
        - activo
      type: object
      properties:
        activo:
          type: boolean
          description: Si entra en la generación.
      description: Cambio de estado de un participante.
    CambioPreferencia:
      required:
        - tipo
        - canal
        - activa
      type: object
      properties:
        tipo:
          type: string
        canal:
          type: string
          description: push (app no se puede apagar).
        activa:
          type: boolean
      description: 'Cambio de una preferencia: activar o apagar un canal para un tipo.'
    CambioTurno:
      required:
        - horaInicio
        - horaFin
        - observacion
      type: object
      properties:
        horaInicio:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora de inicio (HH:mm); vacía, sin horario.'
        horaFin:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora de fin (HH:mm); vacía, sin horario.'
        observacion:
          maxLength: 500
          type:
            - 'null'
            - string
          description: Observación.
      description: Horario y observación de un turno que aún no está aplicado. Reemplaza los valores anteriores.
    CambioVersionDto:
      required:
        - aplicativo
        - tipo
        - cambio
        - antes
        - despues
        - campos
      type: object
      properties:
        aplicativo:
          description: El aplicativo.
          $ref: '#/components/schemas/AplicativoRefDto'
        tipo:
          type: string
          description: principal o secundario.
        cambio:
          type: string
          description: 'agregada, retirada, persona o datos.'
        antes:
          type:
            - 'null'
            - string
          description: Persona antes.
        despues:
          type:
            - 'null'
            - string
          description: Persona después.
        campos:
          type: array
          items:
            type: string
          description: 'Campos que cambiaron (dedicacion, vigencia, orden).'
      description: Un cambio entre dos versiones.
    CanalActualizado:
      required:
        - contratoId
        - ambiente
        - version
        - versionAnterior
        - desplegadoEn
        - cambio
      type: object
      properties:
        contratoId:
          type: string
          format: uuid
        ambiente:
          type: string
          description: 'dev, qa o pdn (los de Contratos:Canales:Ambientes).'
        version:
          type: string
        versionAnterior:
          type:
            - 'null'
            - string
          description: La que estaba antes; vacío la primera vez.
        desplegadoEn:
          type: string
          format: date-time
        cambio:
          type: boolean
          description: 'false si el canal ya tenía esa versión (idempotente, sin historial nuevo).'
      description: El canal después del aviso del CD.
    CanalConsolidado:
      required:
        - ambiente
        - version
        - esEstable
        - desplegadoEn
      type: object
      properties:
        ambiente:
          type: string
        version:
          type:
            - 'null'
            - string
        esEstable:
          type:
            - 'null'
            - boolean
        desplegadoEn:
          type:
            - 'null'
            - string
          format: date-time
      description: Versión de un contrato en un ambiente; vacía si nunca se desplegó allí.
    CanalDto:
      required:
        - ambiente
        - versionId
        - version
        - esEstable
        - desplegadoEn
        - desplegadoPor
        - commit
        - ejecucion
      type: object
      properties:
        ambiente:
          type: string
        versionId:
          type: string
          format: uuid
        version:
          type: string
        esEstable:
          type: boolean
        desplegadoEn:
          type: string
          format: date-time
        desplegadoPor:
          type: string
          description: github:dueño/repo@rama del CD que avisó.
        commit:
          type: string
          description: Commit desplegado.
        ejecucion:
          type:
            - 'null'
            - string
          description: run_id de GitHub Actions.
      description: Versión de un contrato en un ambiente.
    CanalesContrato:
      required:
        - ambientes
        - canales
        - historial
      type: object
      properties:
        ambientes:
          type: array
          items:
            type: string
          description: Ambientes en orden de promoción.
        canales:
          type: array
          items:
            $ref: '#/components/schemas/CanalDto'
        historial:
          type: array
          items:
            $ref: '#/components/schemas/HistorialCanalDto'
          description: Hasta 100 cambios.
      description: 'Canales de un contrato: la versión actual por ambiente y el historial, del más reciente al más antiguo.'
    CanalesRecordatorioDto:
      required:
        - push
        - correo
        - teams
      type: object
      properties:
        push:
          type: boolean
          description: 'Hay llaves VAPID: push puede llegar a los dispositivos suscritos.'
        correo:
          type: boolean
          description: Hay proveedor de correo (SMTP en qa).
        teams:
          type: boolean
          description: 'El canal de Teams del soporte está configurado (HU 2.10): el aviso del sábado al equipo sale por ahí. No hay aviso personal por Teams.'
      description: Canales de los recordatorios que tiene este ambiente.
    CanalSoporteDto:
      required:
        - fecha
        - configurado
        - canal
        - horaInicio
        - horaFin
        - haySoporte
      type: object
      properties:
        fecha:
          type: string
          description: 'El próximo sábado (hoy, si es sábado).'
          format: date
        configurado:
          type: boolean
          description: Si se configuró un canal para externos.
        canal:
          type:
            - 'null'
            - string
          description: 'Canal de contacto (correo, línea o canal); vacío si no está configurado.'
        horaInicio:
          type:
            - 'null'
            - string
          description: 'Hora de inicio del soporte ese sábado (HH:mm), si se conoce.'
        horaFin:
          type:
            - 'null'
            - string
          description: 'Hora de fin del soporte ese sábado (HH:mm), si se conoce.'
        haySoporte:
          type: boolean
          description: Si ese sábado hay soporte programado.
      description: 'Canal de soporte del sábado para externos: sin nombres de personas.'
    CancelacionSolicitud:
      required:
        - nota
        - llaveIdempotencia
        - hechaEn
      type: object
      properties:
        nota:
          maxLength: 500
          type:
            - 'null'
            - string
          description: Nota.
        llaveIdempotencia:
          type: string
          description: Llave de idempotencia de la acción.
          format: uuid
        hechaEn:
          type:
            - 'null'
            - string
          description: 'Cuándo la hizo la persona, si la hizo sin conexión.'
          format: date-time
      description: Cancelación de una solicitud por quien la pidió.
    CandidataDto:
      required:
        - id
        - nombre
        - activa
      type: object
      properties:
        id:
          type: string
          description: Id de la persona.
          format: uuid
        nombre:
          type: string
          description: Nombre.
        activa:
          type: boolean
          description: Si está activa en Atlas.
      description: Persona candidata para un nombre ambiguo.
    CandidatoDto:
      required:
        - id
        - nombre
        - correo
        - cargo
      type: object
      properties:
        id:
          type: string
          description: Id de la persona.
          format: uuid
        nombre:
          type: string
          description: Nombre.
        correo:
          type: string
          description: Correo.
        cargo:
          type:
            - 'null'
            - string
          description: 'Cargo, si se conoce.'
      description: Persona interna que se puede agregar a la rotación.
    CargaPersonaDto:
      required:
        - persona
        - principales
        - secundarias
        - puntaje
        - nivel
      type: object
      properties:
        persona:
          description: La persona.
          $ref: '#/components/schemas/PersonaEquipoDto'
        principales:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: De cuántos aplicativos es principal.
          format: int32
        secundarias:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: De cuántos es secundaria.
          format: int32
        puntaje:
          pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?$'
          type:
            - number
            - string
          description: 'Principales + la dedicación de cada secundaria (20 % = 0,2).'
          format: double
        nivel:
          type: string
          description: 'alta, normal o baja frente a la media.'
      description: Carga de una persona en el reparto.
    ClavePushDto:
      required:
        - habilitado
        - clavePublica
      type: object
      properties:
        habilitado:
          type: boolean
        clavePublica:
          type:
            - 'null'
            - string
      description: Llave pública VAPID para suscribir el dispositivo; habilitado es falso si el ambiente no tiene llaves.
    ClaveTotp:
      required:
        - estado
        - clave
        - uri
        - qr
      type: object
      properties:
        estado:
          type: string
          description: Id del paso; vence en 5 minutos.
        clave:
          type: string
          description: 'Clave en base32, en grupos de 4, para escribirla a mano.'
        uri:
          type: string
          description: URI otpauth:// (la misma que lleva el QR).
        qr:
          type: string
          description: 'QR de la URI como imagen SVG en data URI (img-src data: de la CSP).'
      description: Clave TOTP nueva para registrar en la aplicación de autenticación.
    CodeownersDto:
      required:
        - version
        - gitHubConfigurado
        - modoGitHub
        - repos
        - personasSinUsuario
      type: object
      properties:
        version:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          description: Versión vigente del reparto.
          format: int32
        gitHubConfigurado:
          type: boolean
          description: Si este ambiente puede leer GitHub (Plataforma:GitHub).
        modoGitHub:
          type: string
          description: 'token, app o ninguno.'
        repos:
          type: array
          items:
            $ref: '#/components/schemas/BloqueCodeownersDto'
          description: Un bloque por repo.
        personasSinUsuario:
          type: array
          items:
            $ref: '#/components/schemas/PersonaEquipoDto'
          description: Responsables sin usuario de GitHub.
      description: 'CODEOWNERS sugerido por repo y carpeta, desde el catálogo y el reparto.'
    ComparacionDto:
      required:
        - desde
        - hasta
        - iguales
        - cambios
      type: object
      properties:
        desde:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Versión base.
          format: int32
        hasta:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Versión comparada.
          format: int32
        iguales:
          type: boolean
          description: Si reparten igual (misma huella).
        cambios:
          type: array
          items:
            $ref: '#/components/schemas/CambioVersionDto'
          description: Cambios de la base a la comparada.
      description: Comparación de dos versiones del reparto.
    CompensacionDto:
      required:
        - id
        - turno
        - persona
        - fechaCompensada
        - estado
        - aprobadaPor
        - nota
        - puedeCambiar
        - creadaEn
      type: object
      properties:
        id:
          type: string
          description: Id de la compensación.
          format: uuid
        turno:
          description: Turno por el que se compensa.
          $ref: '#/components/schemas/TurnoResumenDto'
        persona:
          description: A quién se compensa.
          $ref: '#/components/schemas/PersonaSoporteDto'
        fechaCompensada:
          type:
            - 'null'
            - string
          description: Día compensado; vacío mientras no se elija.
          format: date
        estado:
          type: string
          description: pendiente o tomada.
        aprobadaPor:
          oneOf:
            - type: 'null'
            - description: Quien la aprobó; vacío si vino del Excel sin ese dato.
              $ref: '#/components/schemas/PersonaSoporteDto'
        nota:
          type:
            - 'null'
            - string
          description: Nota; solo la ven la persona compensada y quien aprueba o gestiona el equipo.
        puedeCambiar:
          type: boolean
          description: Si la persona en sesión puede cambiarla (atlas.soporte.aprobar sobre el equipo).
        creadaEn:
          type: string
          description: Cuándo se registró.
          format: date-time
      description: Día compensado por un turno.
    CompensacionImportacionDto:
      required:
        - para
        - fecha
        - estado
      type: object
      properties:
        para:
          type: string
          description: 'responsable o reemplazo: a quién se compensa.'
        fecha:
          type:
            - 'null'
            - string
          description: Día compensado; vacío si el Excel no lo dice.
          format: date
        estado:
          type: string
          description: pendiente o tomada.
      description: Compensación leída de la columna «Compensado».
    ConfiguracionDto:
      required:
        - horaInicioPorDefecto
        - horaFinPorDefecto
        - reglaFestivos
        - diasAnticipacionRecordatorio
        - canalExterno
        - actualizadoEn
        - horaRecordatorios
      type: object
      properties:
        horaInicioPorDefecto:
          type: string
          description: 'Hora de inicio por defecto (HH:mm, Bogotá).'
        horaFinPorDefecto:
          type: string
          description: 'Hora de fin por defecto (HH:mm, Bogotá).'
        reglaFestivos:
          type: string
          description: 'sin_turno o turno_normal: qué hace la generación con un sábado festivo.'
        diasAnticipacionRecordatorio:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          description: 'Días antes del turno en que sale el recordatorio a la persona (HU 2.11); vacío, solo el del mismo sábado.'
          format: int32
        canalExterno:
          type:
            - 'null'
            - string
          description: 'Canal de soporte del sábado que ven los externos; vacío, no ven nada.'
        actualizadoEn:
          type:
            - 'null'
            - string
          description: Cuándo se guardó por última vez; vacío si nunca (valores por defecto).
          format: date-time
        horaRecordatorios:
          type: string
          description: 'Hora (HH:mm, Bogotá) a la que corre cada día el trabajo de recordatorios (HU 2.11); 07:00 si nunca se cambió.'
      description: Configuración global del soporte de los sábados.
    ConfirmacionGeneracion:
      required:
        - equipoId
        - meses
        - desde
        - huella
      type: object
      properties:
        equipoId:
          type: string
          description: Equipo (el mismo de la vista previa).
          format: uuid
        meses:
          maximum: 12
          minimum: 1
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'Meses hacia adelante, de 1 a 12 (los mismos de la vista previa).'
          format: int32
        desde:
          type:
            - 'null'
            - string
          description: Primer día de la ventana (el mismo de la vista previa).
          format: date
        huella:
          maxLength: 64
          type:
            - 'null'
            - string
          description: 'Huella de la vista previa: si algo cambió desde entonces, la confirmación se rechaza.'
      description: 'Confirmación de una vista previa: el mismo equipo, la misma ventana y la huella que devolvió.'
    ConsolidadoContratos:
      required:
        - ambientes
        - total
        - conDesfases
        - conBreaking
        - elementos
      type: object
      properties:
        ambientes:
          type: array
          items:
            type: string
          description: 'Ambientes en orden de promoción (dev, qa, pdn).'
        total:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Cuántos contratos devuelve (después de todos los filtros; a lo sumo 500).
          format: int32
        conDesfases:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'Cuántos de los que cumplen aplicativo, tipo y texto tienen algún desfase.'
          format: int32
        conBreaking:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'Cuántos de los que cumplen aplicativo, tipo y texto tienen breaking pendientes.'
          format: int32
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/ContratoConsolidado'
      description: El consolidado de contratos por ambiente.
    ContratoConsolidado:
      required:
        - id
        - codigo
        - nombre
        - tipo
        - aplicativo
        - canales
        - desfases
        - breakingPendientes
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        nombre:
          type: string
        tipo:
          type: string
          description: 'openapi, asyncapi o proto.'
        aplicativo:
          $ref: '#/components/schemas/AplicativoDelContrato'
        canales:
          type: array
          items:
            $ref: '#/components/schemas/CanalConsolidado'
          description: 'Uno por ambiente, en el orden de «ambientes».'
        desfases:
          type: array
          items:
            $ref: '#/components/schemas/Desfase'
        breakingPendientes:
          oneOf:
            - type: 'null'
            - description: Vacío si qa o pdn no tienen versión o tienen la misma versión base (X.Y.Z).
              $ref: '#/components/schemas/BreakingPendientes'
      description: Un contrato con su versión por ambiente.
    ContratoResumen:
      required:
        - id
        - codigo
        - nombre
        - descripcion
        - tipo
        - visibilidad
        - aplicativo
        - repositorio
        - versiones
        - ultimaVersion
        - ultimaEstable
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          description: Código del contrato dentro del aplicativo.
        nombre:
          type: string
          description: 'info.title de la última versión, o el paquete en proto.'
        descripcion:
          type:
            - 'null'
            - string
        tipo:
          type: string
          description: 'openapi, asyncapi o proto.'
        visibilidad:
          type: string
          description: interna o compartible.
        aplicativo:
          $ref: '#/components/schemas/AplicativoDelContrato'
        repositorio:
          type: string
          description: Repositorio de la última publicación.
        versiones:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Cuántas versiones tiene.
          format: int32
        ultimaVersion:
          oneOf:
            - type: 'null'
            - description: La última publicada (por fecha).
              $ref: '#/components/schemas/VersionResumen'
        ultimaEstable:
          oneOf:
            - type: 'null'
            - description: 'La última estable, si la hay.'
              $ref: '#/components/schemas/VersionResumen'
      description: Contrato de un aplicativo con su última versión publicada.
    CorridaRecordatoriosDto:
      required:
        - fecha
        - disparo
        - iniciadaEn
        - terminadaEn
        - enviados
        - fallidos
        - omitidos
      type: object
      properties:
        fecha:
          type: string
          description: Día de Bogotá.
          format: date
        disparo:
          type: string
          description: programada o manual.
        iniciadaEn:
          type: string
          description: Cuándo empezó.
          format: date-time
        terminadaEn:
          type:
            - 'null'
            - string
          description: Cuándo terminó; vacío si se cortó o sigue en curso.
          format: date-time
        enviados:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Envíos que salieron (un recordatorio por canal).
          format: int32
        fallidos:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Envíos que fallaron; se reintentan en la corrida siguiente.
          format: int32
        omitidos:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'Canales que no se intentaron: preferencia apagada, sin dispositivos o canal sin configurar.'
          format: int32
      description: Una corrida del trabajo de recordatorios.
    CuentaARecuperar:
      required:
        - correo
        - nombre
      type: object
      properties:
        correo:
          type: string
        nombre:
          type: string
      description: Cuenta que se va a recuperar.
    CuentaEmergenciaPublica:
      required:
        - correo
        - nombre
      type: object
      properties:
        correo:
          type: string
        nombre:
          type: string
      description: Cuenta de emergencia del enlace de activación.
    CuentaLista:
      required:
        - codigosRecuperacion
        - sesionIniciada
      type: object
      properties:
        codigosRecuperacion:
          type: array
          items:
            type: string
          description: Diez códigos de recuperación de un solo uso.
        sesionIniciada:
          type: boolean
          description: true si ya quedó la sesión abierta.
      description: 'Cuenta creada o recuperada: los códigos de recuperación se muestran esta única vez.'
    DefinicionRolDto:
      required:
        - rol
        - titulo
        - puntos
      type: object
      properties:
        rol:
          type: string
          description: principal o secundario.
        titulo:
          type: string
          description: Título del documento («Responsable principal»).
        puntos:
          type: array
          items:
            type: string
          description: 'Cada punto, sin cambiar una letra.'
      description: Definición de un rol tal como está en el §1 del documento de responsables.
    Desfase:
      required:
        - ambiente
        - respectoDe
        - tipo
        - mensaje
      type: object
      properties:
        ambiente:
          type: string
          description: El ambiente al que se refiere el aviso.
        respectoDe:
          type: string
          description: El ambiente con el que se compara.
        tipo:
          type: string
          description: 'adelante (lleva una versión mayor), atrasado (una menor) o ausente (no tiene versión y el anterior sí).'
        mensaje:
          type: string
      description: Diferencia entre dos ambientes vecinos en el orden de promoción (dev → qa → pdn).
    DiferenciaDto:
      required:
        - patron
        - estado
        - enAtlas
        - enGitHub
      type: object
      properties:
        patron:
          type: string
          description: Patrón (carpeta o *).
        estado:
          type: string
          description: 'igual, distinto, falta_en_github o solo_en_github.'
        enAtlas:
          type: array
          items:
            type: string
          description: Propietarios según Atlas.
        enGitHub:
          type: array
          items:
            type: string
          description: Propietarios en GitHub.
      description: Diferencia de un patrón entre Atlas y GitHub.
    DiferenciasCodeownersDto:
      required:
        - repo
        - configurado
        - mensaje
        - archivo
        - diferencias
      type: object
      properties:
        repo:
          type: string
          description: Repo como dueño/nombre.
        configurado:
          type: boolean
          description: Si GitHub está configurado en este ambiente.
        mensaje:
          type:
            - 'null'
            - string
          description: Qué falló o qué falta configurar; vacío si se leyó bien.
        archivo:
          type:
            - 'null'
            - string
          description: Ruta del CODEOWNERS en el repo; vacía si no tiene.
        diferencias:
          type: array
          items:
            $ref: '#/components/schemas/DiferenciaDto'
          description: Diferencias por patrón.
      description: Diferencias entre el CODEOWNERS sugerido y el real de un repo (lectura de la API de GitHub).
    DiffContrato:
      required:
        - contratoId
        - desde
        - hasta
        - motor
        - sinDiferencias
        - resumen
        - cambios
        - changelog
        - desdeCache
      type: object
      properties:
        contratoId:
          type: string
          format: uuid
        desde:
          type: string
          description: Versión base.
        hasta:
          type: string
          description: Versión que se compara contra la base.
        motor:
          type: string
          description: 'Motor y versión, p. ej. oasdiff v1.33.0.'
        sinDiferencias:
          type: boolean
          description: oasdiff no encontró diferencias estructurales.
        resumen:
          $ref: '#/components/schemas/ResumenDiff'
        cambios:
          type: array
          items:
            $ref: '#/components/schemas/CambioDiff'
        changelog:
          type: string
          description: Changelog legible en Markdown.
        desdeCache:
          type: boolean
          description: La respuesta salió de la caché de atlas-render.
      description: 'Diff entre dos versiones de un contrato: primero los cambios que rompen compatibilidad, del más grave al menos.'
    DocumentoVigente:
      required:
        - documento
        - version
        - titulo
        - texto
        - hash
      type: object
      properties:
        documento:
          type: string
          description: terminos o privacidad.
        version:
          type: string
          description: Versión que se acepta; cambia cuando cambia el texto.
        titulo:
          type: string
        texto:
          type: string
          description: 'Texto en Markdown, tal como se muestra.'
        hash:
          type: string
          description: 'SHA-256 (hex) del texto: queda en la evidencia de la aceptación.'
      description: 'Documento legal vigente (términos de uso o aviso de privacidad, Ley 1581) con su versión y su texto en Markdown.'
    EquipoDto:
      required:
        - id
        - nombre
        - area
        - personasMinimo
        - personasMaximo
        - horaInicio
        - horaFin
        - horarioEfectivo
        - activo
        - puedeGestionar
        - puedeAprobar
      type: object
      properties:
        id:
          type: string
          description: Id del equipo.
          format: uuid
        nombre:
          type: string
          description: 'Nombre del equipo (p. ej. Desarrollo TI, Operaciones).'
        area:
          type:
            - 'null'
            - string
          description: Área a la que pertenece.
        personasMinimo:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Mínimo de personas por sábado.
          format: int32
        personasMaximo:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Máximo de personas por sábado.
          format: int32
        horaInicio:
          type:
            - 'null'
            - string
          description: 'Hora de inicio propia del equipo (HH:mm); vacía, la global.'
        horaFin:
          type:
            - 'null'
            - string
          description: 'Hora de fin propia del equipo (HH:mm); vacía, la global.'
        horarioEfectivo:
          type: string
          description: 'Horario que se aplica a sus turnos nuevos: el propio o el global (HH:mm a HH:mm).'
        activo:
          type: boolean
          description: Si está activo (los inactivos no se generan ni se muestran en Inicio).
        puedeGestionar:
          type: boolean
          description: Si la persona en sesión puede gestionar este equipo (atlas.soporte.gestionar global o con alcance al equipo).
        puedeAprobar:
          type: boolean
          description: Si la persona en sesión puede publicar su generación (atlas.soporte.aprobar global o con alcance al equipo).
      description: Equipo de soporte de los sábados de un área.
    EquipoEsteSabadoDto:
      required:
        - equipo
        - turnos
