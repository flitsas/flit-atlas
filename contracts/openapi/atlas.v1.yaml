        estadoPersona:
          type: string
          description: 'Estado de la persona en Atlas: activa, inactiva o suspendida.'
      description: Participante de la rotación de un equipo.
    PasoIngreso:
      required:
        - paso
        - estado
      type: object
      properties:
        paso:
          type: string
          description: totp.
        estado:
          type: string
          description: Id del paso; vence en 5 minutos.
      description: Siguiente paso del ingreso.
    PermisoMatriz:
      required:
        - codigo
        - descripcion
        - roles
      type: object
      properties:
        codigo:
          type: string
        descripcion:
          type: string
        roles:
          type: array
          items:
            type: string
      description: Permiso atlas.<modulo>.<accion> y los roles que lo conceden.
    PersonaEncontrada:
      required:
        - id
        - nombre
        - correo
        - tipo
        - organizacion
        - estado
        - emergencia
        - roles
      type: object
      properties:
        id:
          type: string
          description: Id de la persona (plataforma_persona).
          format: uuid
        nombre:
          type: string
          description: Nombre de la persona.
        correo:
          type: string
          description: 'Correo de la persona, en minúsculas.'
        tipo:
          type: string
          description: empleado o externo.
        organizacion:
          description: Organización de la persona.
          $ref: '#/components/schemas/OrganizacionResumen'
        estado:
          type: string
          description: 'activa, inactiva o suspendida.'
        emergencia:
          type: boolean
          description: Si es la cuenta de administrador de emergencia (ATLAS-ADR-0027).
        roles:
          type: array
          items:
            type: string
          description: 'Códigos de los roles asignados y vigentes, ordenados. No incluye atlas.lector (lo tiene todo empleado) ni los implícitos.'
      description: 'Persona encontrada: lo mínimo para elegirla y abrir sus asignaciones.'
    PersonaPreviaDto:
      required:
        - personaId
        - nombre
        - nueva
      type: object
      properties:
        personaId:
          type: string
          description: Id de la persona.
          format: uuid
        nombre:
          type: string
          description: Nombre.
        nueva:
          type: boolean
          description: 'Si es un turno nuevo (falso: ya publicado y no cambia).'
      description: Persona de un sábado de la vista previa.
    PersonaSoporteDto:
      required:
        - id
        - nombre
        - correo
        - cargo
        - telefono
      type: object
      properties:
        id:
          type: string
          description: Id de la persona (plataforma_persona).
          format: uuid
        nombre:
          type: string
          description: Nombre de la persona.
        correo:
          type:
            - 'null'
            - string
          description: Correo de la persona.
        cargo:
          type:
            - 'null'
            - string
          description: 'Cargo, si se conoce.'
        telefono:
          type:
            - 'null'
            - string
          description: Teléfono; vacío sin atlas.equipo.ver_contacto.
      description: 'Persona de un turno. El correo y el cargo los ve todo interno con atlas.soporte.ver; el teléfono, solo con atlas.equipo.ver_contacto.'
    PortadorToken:
      required:
        - sub
        - cliente
        - tipoPrincipal
        - personaId
        - organizacionId
        - scopes
        - audiencias
        - expiraEn
      type: object
      properties:
        sub:
          type: string
          description: 'sub del token: el id del usuario de Atlas o, para un servicio, su client_id.'
        cliente:
          type:
            - 'null'
            - string
          description: Cliente que obtuvo el token.
        tipoPrincipal:
          type: string
          description: 'empleado, externo o servicio.'
        personaId:
          type:
            - 'null'
            - string
          format: uuid
        organizacionId:
          type:
            - 'null'
            - string
          format: uuid
        scopes:
          type: array
          items:
            type: string
        audiencias:
          type: array
          items:
            type: string
        expiraEn:
          type:
            - 'null'
            - string
          format: date-time
      description: 'Quién es el portador del token de acceso: un usuario de Atlas (código con PKCE) o un servicio (client_credentials).'
    PreferenciaCanalDto:
      required:
        - canal
        - activa
        - disponible
        - editable
      type: object
      properties:
        canal:
          type: string
          description: 'app, push, correo o teams.'
        activa:
          type: boolean
        disponible:
          type: boolean
        editable:
          type: boolean
      description: Estado de un canal para un tipo de notificación.
    PreferenciaTipoDto:
      required:
        - tipo
        - nombre
        - descripcion
        - canales
      type: object
      properties:
        tipo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        canales:
          type: array
          items:
            $ref: '#/components/schemas/PreferenciaCanalDto'
      description: Tipo de notificación con sus canales.
    ProveedoresHabilitados:
      required:
        - microsoft
        - simulado
      type: object
      properties:
        microsoft:
          type: boolean
        simulado:
          type: boolean
      description: Proveedores de ingreso que ofrece este ambiente. El simulado solo existe en local y dev.
    PruebaPushDto:
      required:
        - dispositivos
      type: object
      properties:
        dispositivos:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Dispositivos a los que llegó el push.
          format: int32
      description: Resultado de la notificación de prueba.
    ReemplazoTurno:
      required:
        - personaId
        - observacion
      type: object
      properties:
        personaId:
          type: string
          description: Persona que toma el turno.
          format: uuid
        observacion:
          maxLength: 500
          type:
            - 'null'
            - string
          description: Observación.
      description: Reemplazo de la persona de un turno por otra del mismo equipo.
    ReporteErrorCliente:
      required:
        - referencia
        - nombre
        - mensaje
        - pila
        - ruta
        - version
      type: object
      properties:
        referencia:
          type:
            - 'null'
            - string
          description: 'Referencia corta que la PWA mostró a la persona (6 a 12 letras mayúsculas o dígitos). Si no es válida, el servidor asigna otra.'
        nombre:
          type:
            - 'null'
            - string
          description: 'Tipo del error (TypeError, Error…).'
        mensaje:
          type:
            - 'null'
            - string
          description: Mensaje del error (se recorta a 500 caracteres).
        pila:
          type:
            - 'null'
            - string
          description: Pila del error (se recorta a 4000 caracteres).
        ruta:
          type:
            - 'null'
            - string
          description: 'Ruta de la PWA donde ocurrió, sin consulta ni fragmento.'
        version:
          type:
            - 'null'
            - string
          description: Versión de la PWA.
      description: Error de la PWA que la persona vio en la pantalla «Algo salió mal». Solo datos técnicos.
    ResultadoBusquedaPersonas:
      required:
        - personas
        - hayMas
      type: object
      properties:
        personas:
          type: array
          items:
            $ref: '#/components/schemas/PersonaEncontrada'
          description: 'Personas encontradas, hasta el límite pedido.'
        hayMas:
          type: boolean
          description: 'Si hay más personas que el límite: la búsqueda se debe afinar.'
      description: 'Resultado de la búsqueda de personas, ordenado por nombre.'
    ResultadoCierre:
      required:
        - cerradas
      type: object
      properties:
        cerradas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
      description: Cuántas sesiones activas se cerraron.
    ResultadoGeneracionDto:
      required:
        - generacionId
        - creados
        - eliminados
      type: object
      properties:
        generacionId:
          type: string
          description: Id de esta generación (queda en cada turno creado).
          format: uuid
        creados:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Turnos creados.
          format: int32
        eliminados:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Turnos generados antes que se quitaron.
          format: int32
      description: Resultado de publicar la generación.
    ResultadoRestablecimiento:
      required:
        - correoEnviado
      type: object
      properties:
        correoEnviado:
          type: boolean
          description: false si el correo con el enlace no salió.
      description: Resultado del restablecimiento forzado.
    RolConPermisos:
      required:
        - codigo
        - nombre
        - tipo
        - descripcion
        - asignable
        - permisos
      type: object
      properties:
        codigo:
          type: string
          description: Código del rol (atlas.* o ext.*).
        nombre:
          type: string
        tipo:
          type: string
          description: 'interno, externo o implicito.'
        descripcion:
          type: string
        asignable:
          type: boolean
          description: Si se puede asignar a mano (los implícitos y atlas.lector no).
        permisos:
          type: array
          items:
            type: string
      description: Rol de Atlas con los permisos que concede según los manifiestos del código.
    RolInvitable:
      required:
        - codigo
        - nombre
        - descripcion
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
      description: Rol externo que se puede invitar.
    RolMatriz:
      required:
        - codigo
        - nombre
        - tipo
        - descripcion
        - asignable
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        tipo:
          type: string
        descripcion:
          type: string
        asignable:
          type: boolean
      description: 'Rol de Atlas: interno (§7.2), externo (§7.3) o implícito por propiedad.'
    SabadoPreviaDto:
      required:
        - fecha
        - decision
        - personas
        - festivo
        - cambia
        - ausenteEnFijo
        - faltan
      type: object
      properties:
        fecha:
          type: string
          description: El sábado.
          format: date
        decision:
          type: string
          description: 'asignado (con turnos nuevos), fijo (ya completo, no cambia), festivo (sin turno por la regla) o sin_disponibles (no se llega al mínimo).'
        personas:
          type: array
          items:
            $ref: '#/components/schemas/PersonaPreviaDto'
          description: 'Personas de turno ese sábado: las que ya están y las nuevas.'
        festivo:
          type:
            - 'null'
            - string
          description: 'Nombre del festivo, si lo es.'
        cambia:
          type: boolean
          description: Si confirmar cambia lo que hoy está publicado para ese sábado.
        ausenteEnFijo:
          type: boolean
          description: Un turno fijo es de alguien con una ausencia ese día (revisar a mano).
        faltan:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Personas que faltan para el mínimo del equipo.
          format: int32
      description: Un sábado de la vista previa.
    SaludoDto:
      required:
        - id
        - texto
        - organizacionId
        - creadoEn
      type: object
      properties:
        id:
          type: string
          format: uuid
        texto:
          maxLength: 280
          type: string
          description: Texto del saludo.
        organizacionId:
          type: string
          description: Organización a la que pertenece el saludo.
          format: uuid
        creadoEn:
          type: string
          format: date-time
      description: Saludo de una organización (módulo de ejemplo).
    SesionDispositivo:
      required:
        - id
        - dispositivo
        - ip
        - creadaEn
        - ultimoUsoEn
        - expiraEn
        - actual
      type: object
      properties:
        id:
          type: string
          format: uuid
        dispositivo:
          type: string
        ip:
          type:
            - 'null'
            - string
        creadaEn:
          type: string
          format: date-time
        ultimoUsoEn:
          type: string
          format: date-time
        expiraEn:
          type: string
          format: date-time
        actual:
          type: boolean
      description: Sesión activa del usuario en un dispositivo («dispositivos conectados»). La IP es un dato personal.
    SolicitudAceptacion:
      required:
        - token
        - nombre
        - documentos
        - factor
      type: object
      properties:
        token:
          type: string
          description: Token del enlace (el fragmento de la URL del correo).
        nombre:
          type: string
          description: Nombre completo del invitado.
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/AceptacionDocumento'
          description: Versiones vigentes de los términos y del aviso de privacidad.
        factor:
          $ref: '#/components/schemas/SolicitudFactor'
      description: 'Aceptación de la invitación: nombre, versiones de los documentos aceptados y el factor de la cuenta.'
    SolicitudActivacionEmergencia:
      required:
        - enlace
        - factor
      type: object
      properties:
        enlace:
          type: string
        factor:
          $ref: '#/components/schemas/SolicitudFactor'
      description: Enlace de activación y el factor de la cuenta de emergencia.
    SolicitudAsignacion:
      required:
        - rol
        - organizacionId
        - alcance
        - vigenteDesde
        - vigenteHasta
      type: object
      properties:
        rol:
          type: string
          description: Código del rol (atlas.* o ext.*).
        organizacionId:
          type:
            - 'null'
            - string
          description: 'Organización de la asignación; por defecto, la de la persona.'
          format: uuid
        alcance:
          oneOf:
            - type: 'null'
            - description: 'Alcance; por defecto, global.'
              $ref: '#/components/schemas/AlcanceVista'
        vigenteDesde:
          type:
            - 'null'
            - string
          description: 'Desde cuándo vale; por defecto, ahora.'
          format: date-time
        vigenteHasta:
          type:
            - 'null'
            - string
          description: Hasta cuándo vale; obligatoria para roles externos.
          format: date-time
      description: Rol que se asigna a una persona. Un rol externo exige vencimiento (máximo 90 días) y queda en la organización de la persona.
    SolicitudCompletarRecuperacion:
      required:
        - enlace
        - factor
      type: object
      properties:
        enlace:
          type: string
        factor:
          $ref: '#/components/schemas/SolicitudFactor'
      description: Enlace de recuperación y el factor nuevo.
    SolicitudCorreo:
      required:
        - correo
      type: object
      properties:
        correo:
          type: string
      description: Correo de la cuenta externa que se quiere recuperar.
    SolicitudEnlace:
      required:
        - enlace
      type: object
      properties:
        enlace:
          type: string
      description: Enlace de recuperación (el fragmento de la URL del correo).
    SolicitudEnlaceEmergencia:
      required:
        - enlace
      type: object
      properties:
        enlace:
          type: string
      description: Enlace de activación de la cuenta de emergencia (el fragmento de la URL que imprime el comando).
    SolicitudFactor:
      required:
        - metodo
        - estado
        - credencial
        - contrasena
        - codigo
      type: object
      properties:
        metodo:
          type: string
          description: passkey o contrasena.
        estado:
          type: string
          description: Id del paso de las opciones de passkey o de la clave TOTP.
        credencial:
          type:
            - 'null'
            - string
          description: 'Con passkey: la respuesta del autenticador (PublicKeyCredential.toJSON()) como texto JSON.'
        contrasena:
          type:
            - 'null'
            - string
          description: 'Con contraseña: mínimo 12 caracteres; se revisa contra contraseñas filtradas.'
        codigo:
          type:
            - 'null'
            - string
          description: 'Con contraseña: el código de 6 dígitos que muestra la aplicación de autenticación.'
      description: 'Factor con el que se crea o se recupera una cuenta externa: passkey (preferida) o contraseña más TOTP.'
    SolicitudGeneracion:
      required:
        - equipoId
        - meses
        - desde
      type: object
      properties:
        equipoId:
          type: string
          description: Equipo que se genera.
          format: uuid
        meses:
          maximum: 12
          minimum: 1
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'Meses hacia adelante, de 1 a 12.'
          format: int32
        desde:
          type:
            - 'null'
            - string
          description: 'Primer día de la ventana; vacío, mañana. Debe ser posterior a hoy.'
          format: date
      description: Ventana de la generación automática de un equipo.
    SolicitudIngresoLocal:
      required:
        - correo
        - contrasena
      type: object
      properties:
        correo:
          type: string
        contrasena:
          type: string
      description: Correo y contraseña de una cuenta externa (primer paso; el segundo es el TOTP).
    SolicitudInvitacion:
      required:
        - correo
        - nombre
        - organizacionId
        - rol
        - alcance
        - accesoVenceEn
        - permisosExtra
      type: object
      properties:
        correo:
          type: string
        nombre:
          type:
            - 'null'
            - string
          description: 'Nombre del invitado, si lo conoces (opcional).'
        organizacionId:
          type: string
          format: uuid
        rol:
          type: string
          description: Rol externo (ext.*).
        alcance:
          type:
            - 'null'
            - array
          items:
            $ref: '#/components/schemas/AlcanceVista'
          description: 'Aplicativos, paquetes o documentos concedidos; vacío = lo que se comparta con la organización.'
        accesoVenceEn:
          type:
            - 'null'
            - string
          description: 'Vencimiento del acceso; por defecto, el máximo configurado (90 días).'
          format: date-time
        permisosExtra:
          type:
            - 'null'
            - array
          items:
            type: string
          description: 'exportar, sandbox.'
      description: Invitación nueva. Un proveedor exige vencimiento y alcance; el vencimiento no supera el máximo configurado.
    SolicitudMapeoGrupo:
      required:
        - grupoId
        - grupoNombre
        - rol
      type: object
      properties:
        grupoId:
          type: string
          format: uuid
        grupoNombre:
          type: string
        rol:
          type: string
      description: Grupo de Entra ID (object id y nombre) y el rol interno que otorga.
    SolicitudOpcionesInvitacion:
      required:
        - token
        - nombre
      type: object
      properties:
        token:
          type: string
        nombre:
          type: string
      description: Token de la invitación y el nombre que se mostrará en la passkey.
    SolicitudOrganizacion:
      required:
        - nombre
        - tipo
        - adminOrganizacionHabilitado
      type: object
      properties:
        nombre:
          type: string
          description: Nombre único (hasta 200 caracteres).
        tipo:
          type: string
          description: cliente o proveedor (la interna ya existe).
        adminOrganizacionHabilitado:
          type: boolean
          description: Habilita el rol ext.admin_organizacion en esta organización.
      description: Organización nueva o cambios de una existente.
    SolicitudPasskey:
      required:
        - estado
        - credencial
      type: object
      properties:
        estado:
          type: string
        credencial:
          type: string
          description: 'PublicKeyCredential.toJSON() de navigator.credentials.get(), como texto JSON.'
      description: Respuesta del autenticador para entrar con passkey.
    SolicitudRenovacion:
      required:
        - accesoVenceEn
      type: object
      properties:
        accesoVenceEn:
          type:
            - 'null'
            - string
          description: 'Vencimiento nuevo; por defecto, el máximo configurado.'
          format: date-time
      description: 'Renovación: vencimiento nuevo del acceso. Si la invitación no se ha aceptado, también se envía un enlace nuevo.'
    SolicitudSegundoFactor:
      required:
        - estado
        - codigo
        - codigoRecuperacion
      type: object
      properties:
        estado:
          type: string
        codigo:
          type:
            - 'null'
            - string
          description: Código de 6 dígitos de la aplicación de autenticación.
        codigoRecuperacion:
          type:
            - 'null'
            - string
          description: 'Código de recuperación de un solo uso, en lugar del TOTP.'
      description: 'Segundo factor del ingreso con contraseña: el código TOTP o un código de recuperación.'
    SolicitudTerminos:
      required:
        - estado
        - documentos
      type: object
      properties:
        estado:
          type: string
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/AceptacionDocumento'
      description: Aceptación de las versiones nuevas de los documentos legales para terminar el ingreso.
    SolicitudToken:
      required:
        - token
      type: object
      properties:
        token:
          type: string
      description: Token del enlace de la invitación (el fragmento de la URL del correo).
    SuscripcionDto:
      required:
        - endpoint
        - p256dh
        - auth
        - dispositivo
      type: object
      properties:
        endpoint:
          type: string
          description: URL https del servicio de push del navegador.
        p256dh:
          type: string
          description: 'Llave pública del navegador, base64url (65 bytes).'
        auth:
          type: string
          description: 'Secreto de autenticación, base64url (16 bytes).'
        dispositivo:
          type:
            - 'null'
            - string
          description: 'Resumen del dispositivo, p. ej. «Chrome en Android».'
      description: Suscripción Web Push de un dispositivo (PushSubscription del navegador).
    TerminosPendientes:
      required:
        - error
        - estado
        - documentos
      type: object
      properties:
        error:
          type: string
          description: terminos_pendientes.
        estado:
          type: string
          description: Id del paso para POST /api/v1/identidad/entrar/terminos.
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoVigente'
      description: Antes de entrar hay que aceptar versiones nuevas de los documentos legales.
    TurnoDto:
      required:
        - id
        - equipo
        - fecha
        - persona
        - horaInicio
        - horaFin
        - estado
        - origen
        - turnoReemplazadoId
        - festivo
        - observacion
        - requiereRevision
      type: object
      properties:
        id:
          type: string
          description: Id del turno.
          format: uuid
        equipo:
          description: Equipo del turno.
          $ref: '#/components/schemas/EquipoResumenDto'
        fecha:
          type: string
          description: Sábado del turno (aaaa-mm-dd).
          format: date
        persona:
          description: Persona de turno.
          $ref: '#/components/schemas/PersonaSoporteDto'
        horaInicio:
          type:
            - 'null'
            - string
          description: Hora de inicio en Bogotá (HH:mm).
        horaFin:
          type:
            - 'null'
            - string
          description: Hora de fin en Bogotá (HH:mm).
        estado:
          type: string
          description: 'programado, confirmado, aplicado, reemplazado o cancelado.'
        origen:
          type: string
          description: 'importado, generado o manual.'
        turnoReemplazadoId:
          type:
            - 'null'
            - string
          description: 'Turno al que este reemplaza, si es un reemplazo.'
          format: uuid
        festivo:
          type:
            - 'null'
            - string
          description: Nombre del festivo si el sábado lo es.
        observacion:
          type:
            - 'null'
            - string
          description: Observación del turno.
        requiereRevision:
          type: boolean
          description: Marcado para revisión humana (importación del Excel).
      description: Turno de una persona de un equipo en un sábado.
    VersionApi:
      required:
        - servicio
        - version
      type: object
      properties:
        servicio:
          type: string
        version:
          type:
            - 'null'
            - string
      description: Servicio y versión del ensamblado desplegado.
    VistaPreviaDto:
      required:
        - equipo
        - desde
        - hasta
        - huella
        - sabados
        - turnosPorPersona
        - desbalance
        - nuevos
        - eliminados
        - avisos
      type: object
      properties:
        equipo:
          description: Equipo.
          $ref: '#/components/schemas/EquipoResumenDto'
        desde:
          type: string
          description: Primer día de la ventana.
          format: date
        hasta:
          type: string
          description: Último día de la ventana (incluido).
          format: date
        huella:
          type: string
          description: Huella para confirmar exactamente esta propuesta.
        sabados:
          type: array
          items:
            $ref: '#/components/schemas/SabadoPreviaDto'
          description: Cada sábado de la ventana.
        turnosPorPersona:
          type: array
          items:
            $ref: '#/components/schemas/ConteoPersonaDto'
          description: Turnos por persona en la ventana.
        desbalance:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Diferencia entre quien más y quien menos turnos tiene.
          format: int32
        nuevos:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Turnos nuevos que se crearían.
          format: int32
        eliminados:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'Turnos generados antes que se quitarían (cambio de persona, festivo o sin disponibles).'
          format: int32
        avisos:
          type: array
          items:
            type: string
          description: Avisos para quien publica.
      description: 'Vista previa de la generación de un equipo: nada se publica hasta que alguien con permiso de aprobar la confirme.'
    Yo:
      required:
        - sub
        - personaId
        - nombre
        - tipoPrincipal
        - organizacionId
        - proveedor
        - roles
        - permisos
        - emergencia
      type: object
      properties:
        sub:
          type: string
          format: uuid
        personaId:
          type: string
          format: uuid
        nombre:
          type: string
        tipoPrincipal:
          type: string
        organizacionId:
          type: string
          format: uuid
        proveedor:
          type: string
        roles:
          type: array
          items:
            type: string
          description: 'Códigos de los roles vigentes en este momento, ordenados; incluye atlas.lector de todo empleado.'
        permisos:
          type: array
          items:
            type: string
          description: 'Permisos efectivos (atlas.<modulo>.<accion>) en este momento, ordenados: la PWA filtra la navegación con ellos. Se recalculan en cada petición.'
        emergencia:
          type: boolean
          description: 'true si la sesión es de la cuenta de administrador de emergencia (ATLAS-ADR-0027): la PWA muestra el aviso.'
      description: 'Usuario de la sesión actual: persona, organización, proveedor con el que entró, roles vigentes y permisos efectivos.'
  securitySchemes:
    sesionAtlas:
      type: apiKey
      description: 'Cookie de sesión del BFF. La emite el ingreso y solo lleva el id cifrado de la sesión, que vive en el servidor.'
      name: __Host-atlas
      in: cookie
    csrfAtlas:
      type: apiKey
      description: 'Antifalsificación: obligatoria (cualquier valor) en POST, PUT, PATCH y DELETE bajo /api/. Sin ella, o con otro Origin, la respuesta es 403.'
      name: X-Atlas-Csrf
      in: header
    tokenAtlas:
      type: oauth2
      description: 'Token de acceso de Atlas (OpenIddict, ATLAS-ADR-0024) en «Authorization: Bearer». Vida de 15 minutos, audiencia atlas-api. Código con PKCE para atlas-cli y MCP; client_credentials para servicios internos. JWT firmado (RS256) y cifrado según RFC8725 (buenas prácticas de JWT). La cookie de la PWA no sirve en estas operaciones.'
      flows:
        clientCredentials:
          tokenUrl: /connect/token
          scopes:
            atlas.mcp: Usar el servidor MCP de Atlas con los permisos de la persona.
            atlas.publicar: 'Publicar contratos, documentación y modelos en Atlas.'
            atlas.widget: Usar el asistente de Atlas embebido en otra aplicación de FLIT.
        authorizationCode:
          authorizationUrl: /connect/authorize
          tokenUrl: /connect/token
          refreshUrl: /connect/token
          scopes:
            atlas.mcp: Usar el servidor MCP de Atlas con los permisos de la persona.
            atlas.publicar: 'Publicar contratos, documentación y modelos en Atlas.'
            atlas.widget: Usar el asistente de Atlas embebido en otra aplicación de FLIT.
tags:
  - name: Identidad
    description: 'Ingreso de empleados con Microsoft, proveedores habilitados, cierre de sesión, dispositivos conectados, suspensión y reautenticación (ATLAS-ADR-0004 y ATLAS-ADR-0022), tokens para clientes que no son el navegador (ATLAS-ADR-0024), y las cuentas locales de externos: aceptar invitación, passkey, contraseña con TOTP y recuperación (ATLAS-ADR-0025).'
  - name: Plataforma
    description: Datos del usuario en sesión (con sus roles y permisos efectivos) y de la propia API.
  - name: Organizaciones
    description: 'FLIT, clientes y proveedores: crear, editar, suspender y eliminar, y habilitar el administrador de la organización (HU 1.5, ATLAS-ADR-0025).'
  - name: Invitaciones
    description: 'Invitaciones de externos con rol, alcance, vencimiento y permisos extra: crear, reenviar, suspender, renovar y revocar (HU 1.5, ATLAS-ADR-0025).'
  - name: Permisos
    description: 'Roles internos y externos, asignaciones con alcance y vigencia, mapeo de grupos de Entra y la matriz rol × permiso generada desde el código (ATLAS-ADR-0023).'
  - name: Hola
    description: 'Módulo de ejemplo de docs/como-crear-un-modulo.md: saludos por organización con permisos, predicado obligatorio y RLS. Apagado por defecto (bandera modulo.hola).'
  - name: Soporte
    description: 'Soporte de los sábados por equipos de cada área: configuración, equipos, participantes, turnos con estados y horario, ausencias, festivos de Colombia, generación automática con vista previa e indicadores.'
