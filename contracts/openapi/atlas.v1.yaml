    VersionPublicada:
      required:
        - contratoId
        - versionId
        - aplicativo
        - contrato
        - tipo
        - version
        - esEstable
        - sha256
        - operaciones
        - tieneBreaking
        - advertencias
        - publicadoEn
        - creada
      type: object
      properties:
        contratoId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        aplicativo:
          type: string
          description: Slug del aplicativo.
        contrato:
          type: string
          description: Código del contrato.
        tipo:
          type: string
          description: 'openapi, asyncapi o proto.'
        version:
          type: string
        esEstable:
          type: boolean
