      description: 'Módulos activos para la organización de la persona, como «modulo.<id>» → activo (ATLAS-ADR-0016). Un módulo que no aparece usa el valor por defecto de su manifiesto en la PWA.'
      operationId: ObtenerBanderasDeModulo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
        '401':
          description: No hay una sesión activa o venció.
      security:
        - sesionAtlas: [ ]
  /api/v1/plataforma/notificaciones:
    get:
      tags:
        - Plataforma
      summary: Bandeja de notificaciones
      description: 'Notificaciones de la persona, de la más reciente a la más vieja (máximo 100), y cuántas no ha leído.'
      operationId: ListarNotificaciones
      parameters:
        - name: limite
          in: query
          description: 'Cuántas notificaciones devolver (1 a 100, por defecto 30).'
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandejaDto'
        '401':
          description: No hay una sesión activa o venció.
      security:
        - sesionAtlas: [ ]
  '/api/v1/plataforma/notificaciones/{id}/leida':
    post:
      tags:
        - Plataforma
      summary: Marcar una notificación como leída
      description: Marca como leída una notificación de la persona. 404 si no existe o es de otra persona.
      operationId: MarcarNotificacionLeida
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
  /api/v1/plataforma/notificaciones/leidas:
    post:
      tags:
        - Plataforma
      summary: Marcar todas como leídas
      description: Marca como leídas todas las notificaciones pendientes de la persona.
      operationId: MarcarNotificacionesLeidas
      responses:
        '204':
          description: No Content
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
  /api/v1/plataforma/notificaciones/preferencias:
    get:
      tags:
        - Plataforma
      summary: Preferencias de notificación
      description: 'Cada tipo de notificación con el estado de sus canales (app, push, correo y Teams).'
      operationId: ListarPreferenciasDeNotificacion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreferenciaTipoDto'
        '401':
          description: No hay una sesión activa o venció.
      security:
        - sesionAtlas: [ ]
    put:
      tags:
        - Plataforma
      summary: Guardar preferencias de notificación
      description: Activa o apaga canales por tipo. El canal app no se puede apagar; correo y Teams aún no están disponibles.
      operationId: GuardarPreferenciasDeNotificacion
      requestBody:
        description: Cambios de preferencia a aplicar.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CambioPreferencia'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
  /api/v1/plataforma/push/clave:
    get:
      tags:
        - Plataforma
      summary: Llave pública VAPID
      description: Llave con la que el navegador suscribe el dispositivo a Web Push.
      operationId: ObtenerClavePush
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClavePushDto'
        '401':
          description: No hay una sesión activa o venció.
      security:
        - sesionAtlas: [ ]
  /api/v1/plataforma/push/suscripciones:
    post:
      tags:
        - Plataforma
      summary: Registrar el dispositivo para push
      description: 'Crea o actualiza la suscripción del dispositivo y la deja a nombre de la persona en sesión. Solo se aceptan servicios de push conocidos (FCM, Mozilla, Apple y Windows).'
      operationId: RegistrarSuscripcionPush
      requestBody:
        description: Suscripción que entrega el navegador (PushSubscription.toJSON) y el resumen del dispositivo.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuscripcionDto'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
  /api/v1/plataforma/push/suscripciones/baja:
    post:
      tags:
        - Plataforma
      summary: Quitar el dispositivo de push
      description: Borra la suscripción del dispositivo; la PWA la llama al desactivar push y al cerrar sesión.
      operationId: DarDeBajaSuscripcionPush
      requestBody:
        description: Endpoint de la suscripción del dispositivo.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BajaSuscripcionDto'
        required: true
      responses:
        '204':
          description: No Content
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
  /api/v1/plataforma/push/prueba:
    post:
      tags:
        - Plataforma
      summary: Enviar una notificación de prueba
      description: Crea una notificación de prueba en la bandeja y la envía por push a los dispositivos de la persona.
      operationId: EnviarPushDePrueba
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PruebaPushDto'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
  /api/v1/hola/saludos:
    get:
      tags:
        - Hola
      summary: Saludos de tu organización
      description: 'Los saludos que puedes ver, del más reciente al más viejo (máximo 50). Un externo solo ve los de su organización.'
      operationId: ListarSaludos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaludoDto'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: La sesión no tiene el permiso atlas.hola.ver.
        '404':
          description: El módulo está apagado para la organización de la sesión (bandera modulo.hola).
      security:
        - sesionAtlas: [ ]
      x-atlas-permisos:
        - atlas.hola.ver
    post:
      tags:
        - Hola
      summary: Escribir un saludo
      description: Crea un saludo en la organización de la persona en sesión.
      operationId: CrearSaludo
      requestBody:
        description: Texto del saludo.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoSaludo'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaludoDto'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: 'Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host, o la sesión no tiene el permiso atlas.hola.gestionar.'
        '404':
          description: El módulo está apagado para la organización de la sesión (bandera modulo.hola).
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
      x-atlas-permisos:
        - atlas.hola.gestionar
  '/api/v1/hola/saludos/{id}':
    get:
      tags:
        - Hola
      summary: Un saludo
      description: Un saludo por su id. 404 si no existe o es de una organización que no puedes ver.
      operationId: ObtenerSaludo
      parameters:
        - name: id
          in: path
          description: Id del saludo.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaludoDto'
        '404':
          description: 'No existe o no lo puedes ver, o el módulo está apagado para la organización de la sesión (bandera modulo.hola).'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: La sesión no tiene el permiso atlas.hola.ver.
      security:
        - sesionAtlas: [ ]
      x-atlas-permisos:
        - atlas.hola.ver
components:
  schemas:
    AceptacionDocumento:
      required:
        - documento
        - version
      type: object
      properties:
        documento:
          type: string
          description: terminos o privacidad.
        version:
          type: string
          description: La versión vigente que se mostró.
      description: Versión de un documento legal que la persona acepta.
    AlcanceVista:
      required:
        - tipo
        - id
      type: object
      properties:
        tipo:
          type: string
          description: Tipo de alcance.
        id:
          type:
            - 'null'
            - string
          description: Id del recurso; vacío si es global.
      description: 'Alcance de una asignación: global o un recurso (organizacion, aplicativo, paquete, documento, ambiente…).'
    AsignacionVista:
      required:
        - id
        - personaId
        - rol
        - rolNombre
        - tipoRol
        - organizacionId
        - alcance
        - vigenteDesde
        - vigenteHasta
        - origen
        - vigente
        - asignadoPor
        - creadoEn
      type: object
      properties:
        id:
          type: string
          format: uuid
        personaId:
          type: string
          format: uuid
        rol:
          type: string
        rolNombre:
          type: string
        tipoRol:
          type: string
          description: interno o externo.
        organizacionId:
          type:
            - 'null'
            - string
          format: uuid
        alcance:
          $ref: '#/components/schemas/AlcanceVista'
        vigenteDesde:
          type: string
          format: date-time
        vigenteHasta:
          type:
            - 'null'
            - string
          format: date-time
        origen:
          type: string
          description: 'manual, grupo_entra o invitacion.'
        vigente:
          type: boolean
          description: Si concede permisos en este momento (empezó y no ha vencido).
        asignadoPor:
          type:
            - 'null'
            - string
          format: uuid
        creadoEn:
          type: string
          format: date-time
      description: 'Asignación de un rol a una persona, con su organización, alcance y vigencia.'
    BajaSuscripcionDto:
      required:
        - endpoint
      type: object
      properties:
        endpoint:
          type: string
      description: Suscripción que se da de baja.
    BandejaDto:
      required:
        - noLeidas
        - elementos
      type: object
      properties:
        noLeidas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/NotificacionDto'
      description: 'Bandeja de la persona: total sin leer y las más recientes primero.'
    CambioPreferencia:
      required:
        - tipo
        - canal
        - activa
      type: object
      properties:
        tipo:
          type: string
        canal:
          type: string
          description: push (app no se puede apagar).
        activa:
          type: boolean
      description: 'Cambio de una preferencia: activar o apagar un canal para un tipo.'
    ClavePushDto:
      required:
        - habilitado
        - clavePublica
      type: object
      properties:
        habilitado:
          type: boolean
        clavePublica:
          type:
            - 'null'
            - string
      description: Llave pública VAPID para suscribir el dispositivo; habilitado es falso si el ambiente no tiene llaves.
    ClaveTotp:
      required:
        - estado
        - clave
        - uri
        - qr
      type: object
      properties:
        estado:
          type: string
          description: Id del paso; vence en 5 minutos.
        clave:
          type: string
          description: 'Clave en base32, en grupos de 4, para escribirla a mano.'
        uri:
          type: string
          description: URI otpauth:// (la misma que lleva el QR).
        qr:
          type: string
          description: 'QR de la URI como imagen SVG en data URI (img-src data: de la CSP).'
      description: Clave TOTP nueva para registrar en la aplicación de autenticación.
    CuentaARecuperar:
      required:
        - correo
        - nombre
      type: object
      properties:
        correo:
          type: string
        nombre:
          type: string
      description: Cuenta que se va a recuperar.
    CuentaLista:
      required:
        - codigosRecuperacion
        - sesionIniciada
      type: object
      properties:
        codigosRecuperacion:
          type: array
          items:
            type: string
          description: Diez códigos de recuperación de un solo uso.
        sesionIniciada:
          type: boolean
          description: true si ya quedó la sesión abierta.
      description: 'Cuenta creada o recuperada: los códigos de recuperación se muestran esta única vez.'
    DocumentoVigente:
      required:
        - documento
        - version
        - titulo
        - texto
        - hash
      type: object
      properties:
        documento:
          type: string
          description: terminos o privacidad.
        version:
          type: string
          description: Versión que se acepta; cambia cuando cambia el texto.
        titulo:
          type: string
        texto:
          type: string
          description: 'Texto en Markdown, tal como se muestra.'
        hash:
          type: string
          description: 'SHA-256 (hex) del texto: queda en la evidencia de la aceptación.'
      description: 'Documento legal vigente (términos de uso o aviso de privacidad, Ley 1581) con su versión y su texto en Markdown.'
    ErrorExternos:
      required:
        - error
        - mensaje
      type: object
      properties:
        error:
          type: string
          description: Código estable del error.
        mensaje:
          type: string
      description: Error de una operación de invitaciones o de cuentas externas.
    ErrorRoles:
      required:
        - error
        - mensaje
      type: object
      properties:
        error:
          type: string
          description: Código estable del error.
        mensaje:
          type: string
      description: Error de una operación de administración de roles.
    HttpValidationProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    InvitacionEnviada:
      required:
        - invitacion
        - correoEnviado
      type: object
      properties:
        invitacion:
          $ref: '#/components/schemas/InvitacionVista'
        correoEnviado:
          type: boolean
          description: 'false si el ambiente no tiene correo o el envío falló: reenvíala más tarde.'
      description: Resultado de una operación que envía el correo de la invitación.
    InvitacionPublica:
      required:
        - correo
        - nombre
        - organizacion
        - rol
        - rolNombre
        - accesoVenceEn
        - enlaceVenceEn
        - documentos
      type: object
      properties:
        correo:
          type: string
          description: 'Correo invitado: será el de la cuenta.'
        nombre:
          type:
            - 'null'
            - string
        organizacion:
          type: string
        rol:
          type: string
        rolNombre:
          type: string
        accesoVenceEn:
          type:
            - 'null'
            - string
          format: date-time
        enlaceVenceEn:
          type: string
          format: date-time
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoVigente'
      description: 'Lo que ve el invitado antes de aceptar: a qué organización y con qué rol, y los documentos que debe aceptar.'
    InvitacionVista:
      required:
        - id
        - correo
        - nombre
        - organizacionId
        - organizacionNombre
        - rol
        - rolNombre
        - alcance
        - permisosExtra
        - accesoVenceEn
        - enlaceVenceEn
        - estado
        - personaId
        - aceptadaEn
        - enviadaEn
        - envios
        - creadaEn
      type: object
      properties:
        id:
          type: string
          format: uuid
        correo:
          type: string
          description: Correo invitado (dato personal).
        nombre:
          type:
            - 'null'
            - string
        organizacionId:
          type: string
          format: uuid
        organizacionNombre:
          type: string
        rol:
          type: string
          description: Código del rol externo (ext.*).
        rolNombre:
          type: string
        alcance:
          type: array
          items:
            $ref: '#/components/schemas/AlcanceVista'
          description: Recursos concedidos; vacío = lo que se comparta con la organización.
        permisosExtra:
          type: array
          items:
            type: string
          description: 'exportar, sandbox.'
        accesoVenceEn:
          type:
            - 'null'
            - string
          description: Cuándo vence el acceso.
          format: date-time
        enlaceVenceEn:
          type: string
          description: Cuándo vence el enlace actual (72 h después de cada envío).
          format: date-time
        estado:
          type: string
          description: 'pendiente, enlace_vencido, aceptada, acceso_vencido, suspendida o revocada.'
        personaId:
          type:
            - 'null'
            - string
          description: Persona creada al aceptar.
          format: uuid
        aceptadaEn:
          type:
            - 'null'
            - string
          format: date-time
        enviadaEn:
          type:
            - 'null'
            - string
          description: Último envío del correo que salió bien.
          format: date-time
        envios:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        creadaEn:
          type: string
          format: date-time
      description: 'Invitación de una persona externa, con su estado calculado en este momento.'
    MapeoGrupoVista:
      required:
        - id
        - grupoId
        - grupoNombre
        - rol
        - creadoEn
      type: object
      properties:
        id:
          type: string
          format: uuid
        grupoId:
          type: string
          format: uuid
        grupoNombre:
          type: string
        rol:
          type: string
        creadoEn:
          type: string
          format: date-time
      description: Grupo de Entra ID que otorga un rol interno a sus miembros al entrar.
    MatrizPermisos:
      required:
        - roles
        - modulos
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolMatriz'
        modulos:
          type: array
          items:
            $ref: '#/components/schemas/ModuloMatriz'
      description: Matriz rol × permiso generada desde los manifiestos de permisos del código (ATLAS-ADR-0023).
    ModuloMatriz:
      required:
        - id
        - nombre
        - permisos
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        permisos:
          type: array
          items:
            $ref: '#/components/schemas/PermisoMatriz'
      description: Módulo y los permisos que declara en su manifiesto.
    NotificacionDto:
      required:
        - id
        - tipo
        - titulo
        - cuerpo
        - enlace
        - creadaEn
        - leidaEn
      type: object
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
        titulo:
          type: string
        cuerpo:
          type: string
        enlace:
          type:
            - 'null'
            - string
        creadaEn:
          type: string
          format: date-time
        leidaEn:
          type:
            - 'null'
            - string
          format: date-time
      description: Notificación del centro de notificaciones.
    NuevoSaludo:
      required:
        - texto
      type: object
      properties:
        texto:
          maxLength: 280
          minLength: 1
          type: string
          description: Texto del saludo; se recortan los espacios de los extremos.
      description: Saludo nuevo; queda en la organización de la persona en sesión.
    OpcionesInvitacion:
      required:
        - organizaciones
        - roles
        - tiposAlcance
        - permisosExtra
        - vigenciaMaximaDias
        - soloSuOrganizacion
      type: object
      properties:
        organizaciones:
          type: array
          items:
            $ref: '#/components/schemas/OrganizacionInvitable'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RolInvitable'
        tiposAlcance:
          type: array
          items:
            type: string
          description: Tipos de alcance que acepta una invitación.
        permisosExtra:
          type: array
          items:
            type: string
        vigenciaMaximaDias:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Días máximos de acceso desde hoy.
          format: int32
        soloSuOrganizacion:
          type: boolean
          description: 'true si invita un administrador de su organización: solo dentro de su alcance.'
      description: Lo que la sesión puede elegir al invitar.
    OpcionesPasskey:
      required:
        - estado
        - opciones
      type: object
      properties:
        estado:
          type: string
          description: Id del paso; se devuelve con la respuesta del autenticador. Vence en 5 minutos y sirve una sola vez.
        opciones:
          type: string
          description: 'PublicKeyCredentialCreationOptionsJSON o PublicKeyCredentialRequestOptionsJSON (WebAuthn nivel 3), como texto JSON.'
      description: Opciones para que el navegador cree o use una passkey (WebAuthn) y el id del paso que las acompaña.
    OrganizacionInvitable:
      required:
        - id
        - nombre
        - tipo
        - adminOrganizacionHabilitado
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        tipo:
          type: string
          description: cliente o proveedor.
        adminOrganizacionHabilitado:
          type: boolean
      description: Organización a la que se puede invitar.
    OrganizacionVista:
      required:
        - id
        - nombre
        - tipo
        - estado
        - adminOrganizacionHabilitado
        - personas
        - invitacionesPendientes
        - creadaEn
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        tipo:
          type: string
          description: 'interna, cliente o proveedor.'
        estado:
          type: string
          description: activa o suspendida.
        adminOrganizacionHabilitado:
          type: boolean
          description: Si sus ext.admin_organizacion pueden invitar a colegas.
        personas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Personas de la organización.
          format: int32
        invitacionesPendientes:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Invitaciones pendientes.
          format: int32
        creadaEn:
          type: string
          format: date-time
      description: 'Organización de Atlas: FLIT (interna), un cliente o un proveedor.'
    PasoIngreso:
      required:
        - paso
        - estado
      type: object
      properties:
        paso:
          type: string
          description: totp.
        estado:
          type: string
          description: Id del paso; vence en 5 minutos.
      description: Siguiente paso del ingreso.
    PermisoMatriz:
      required:
        - codigo
        - descripcion
        - roles
      type: object
      properties:
        codigo:
          type: string
        descripcion:
          type: string
        roles:
          type: array
          items:
            type: string
      description: Permiso atlas.<modulo>.<accion> y los roles que lo conceden.
    PortadorToken:
      required:
        - sub
        - cliente
        - tipoPrincipal
        - personaId
        - organizacionId
        - scopes
        - audiencias
        - expiraEn
      type: object
      properties:
        sub:
          type: string
          description: 'sub del token: el id del usuario de Atlas o, para un servicio, su client_id.'
        cliente:
          type:
            - 'null'
            - string
          description: Cliente que obtuvo el token.
        tipoPrincipal:
          type: string
          description: 'empleado, externo o servicio.'
        personaId:
          type:
            - 'null'
            - string
          format: uuid
        organizacionId:
          type:
            - 'null'
            - string
          format: uuid
        scopes:
          type: array
          items:
            type: string
        audiencias:
          type: array
          items:
            type: string
        expiraEn:
          type:
            - 'null'
            - string
          format: date-time
      description: 'Quién es el portador del token de acceso: un usuario de Atlas (código con PKCE) o un servicio (client_credentials).'
    PreferenciaCanalDto:
      required:
        - canal
        - activa
        - disponible
        - editable
      type: object
      properties:
        canal:
          type: string
          description: 'app, push, correo o teams.'
        activa:
          type: boolean
        disponible:
          type: boolean
        editable:
          type: boolean
      description: Estado de un canal para un tipo de notificación.
    PreferenciaTipoDto:
      required:
        - tipo
        - nombre
        - descripcion
        - canales
      type: object
      properties:
        tipo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        canales:
          type: array
          items:
            $ref: '#/components/schemas/PreferenciaCanalDto'
      description: Tipo de notificación con sus canales.
    ProveedoresHabilitados:
      required:
        - microsoft
        - simulado
      type: object
      properties:
        microsoft:
          type: boolean
        simulado:
          type: boolean
      description: Proveedores de ingreso que ofrece este ambiente. El simulado solo existe en local y dev.
    PruebaPushDto:
      required:
        - dispositivos
      type: object
      properties:
        dispositivos:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Dispositivos a los que llegó el push.
          format: int32
      description: Resultado de la notificación de prueba.
    ResultadoCierre:
      required:
        - cerradas
      type: object
      properties:
        cerradas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
      description: Cuántas sesiones activas se cerraron.
    ResultadoRestablecimiento:
      required:
        - correoEnviado
      type: object
      properties:
        correoEnviado:
          type: boolean
          description: false si el correo con el enlace no salió.
      description: Resultado del restablecimiento forzado.
    RolConPermisos:
      required:
        - codigo
        - nombre
        - tipo
        - descripcion
        - asignable
        - permisos
      type: object
      properties:
        codigo:
          type: string
          description: Código del rol (atlas.* o ext.*).
        nombre:
          type: string
        tipo:
          type: string
          description: 'interno, externo o implicito.'
        descripcion:
          type: string
        asignable:
          type: boolean
          description: Si se puede asignar a mano (los implícitos y atlas.lector no).
        permisos:
          type: array
          items:
            type: string
      description: Rol de Atlas con los permisos que concede según los manifiestos del código.
    RolInvitable:
      required:
        - codigo
        - nombre
        - descripcion
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
      description: Rol externo que se puede invitar.
    RolMatriz:
      required:
        - codigo
        - nombre
        - tipo
        - descripcion
        - asignable
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        tipo:
          type: string
        descripcion:
          type: string
        asignable:
          type: boolean
      description: 'Rol de Atlas: interno (§7.2), externo (§7.3) o implícito por propiedad.'
    SaludoDto:
      required:
        - id
        - texto
        - organizacionId
        - creadoEn
      type: object
      properties:
        id:
          type: string
          format: uuid
        texto:
          maxLength: 280
          type: string
          description: Texto del saludo.
        organizacionId:
          type: string
          description: Organización a la que pertenece el saludo.
          format: uuid
        creadoEn:
          type: string
          format: date-time
      description: Saludo de una organización (módulo de ejemplo).
    SesionDispositivo:
      required:
        - id
        - dispositivo
        - ip
        - creadaEn
        - ultimoUsoEn
        - expiraEn
        - actual
      type: object
      properties:
        id:
          type: string
          format: uuid
        dispositivo:
          type: string
        ip:
          type:
            - 'null'
            - string
        creadaEn:
          type: string
          format: date-time
        ultimoUsoEn:
          type: string
          format: date-time
        expiraEn:
          type: string
          format: date-time
        actual:
          type: boolean
      description: Sesión activa del usuario en un dispositivo («dispositivos conectados»). La IP es un dato personal.
    SolicitudAceptacion:
      required:
        - token
        - nombre
        - documentos
        - factor
      type: object
      properties:
        token:
          type: string
          description: Token del enlace (el fragmento de la URL del correo).
        nombre:
          type: string
          description: Nombre completo del invitado.
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/AceptacionDocumento'
          description: Versiones vigentes de los términos y del aviso de privacidad.
        factor:
          $ref: '#/components/schemas/SolicitudFactor'
      description: 'Aceptación de la invitación: nombre, versiones de los documentos aceptados y el factor de la cuenta.'
    SolicitudAsignacion:
      required:
        - rol
        - organizacionId
        - alcance
        - vigenteDesde
        - vigenteHasta
      type: object
      properties:
        rol:
          type: string
          description: Código del rol (atlas.* o ext.*).
        organizacionId:
          type:
            - 'null'
            - string
          description: 'Organización de la asignación; por defecto, la de la persona.'
          format: uuid
        alcance:
          oneOf:
            - type: 'null'
            - description: 'Alcance; por defecto, global.'
              $ref: '#/components/schemas/AlcanceVista'
        vigenteDesde:
          type:
            - 'null'
            - string
          description: 'Desde cuándo vale; por defecto, ahora.'
          format: date-time
        vigenteHasta:
          type:
            - 'null'
            - string
          description: Hasta cuándo vale; obligatoria para roles externos.
          format: date-time
      description: Rol que se asigna a una persona. Un rol externo exige vencimiento (máximo 90 días) y queda en la organización de la persona.
    SolicitudCompletarRecuperacion:
      required:
        - enlace
        - factor
      type: object
      properties:
        enlace:
          type: string
        factor:
          $ref: '#/components/schemas/SolicitudFactor'
      description: Enlace de recuperación y el factor nuevo.
    SolicitudCorreo:
      required:
        - correo
      type: object
      properties:
        correo:
          type: string
      description: Correo de la cuenta externa que se quiere recuperar.
    SolicitudEnlace:
      required:
        - enlace
      type: object
      properties:
        enlace:
          type: string
      description: Enlace de recuperación (el fragmento de la URL del correo).
    SolicitudFactor:
      required:
        - metodo
        - estado
        - credencial
        - contrasena
        - codigo
      type: object
      properties:
        metodo:
          type: string
          description: passkey o contrasena.
        estado:
          type: string
          description: Id del paso de las opciones de passkey o de la clave TOTP.
        credencial:
          type:
            - 'null'
            - string
          description: 'Con passkey: la respuesta del autenticador (PublicKeyCredential.toJSON()) como texto JSON.'
        contrasena:
          type:
            - 'null'
            - string
          description: 'Con contraseña: mínimo 12 caracteres; se revisa contra contraseñas filtradas.'
        codigo:
          type:
            - 'null'
            - string
          description: 'Con contraseña: el código de 6 dígitos que muestra la aplicación de autenticación.'
      description: 'Factor con el que se crea o se recupera una cuenta externa: passkey (preferida) o contraseña más TOTP.'
    SolicitudIngresoLocal:
      required:
        - correo
        - contrasena
      type: object
      properties:
        correo:
          type: string
        contrasena:
          type: string
      description: Correo y contraseña de una cuenta externa (primer paso; el segundo es el TOTP).
    SolicitudInvitacion:
      required:
        - correo
        - nombre
        - organizacionId
        - rol
        - alcance
        - accesoVenceEn
        - permisosExtra
      type: object
      properties:
        correo:
          type: string
        nombre:
          type:
            - 'null'
            - string
          description: 'Nombre del invitado, si lo conoces (opcional).'
        organizacionId:
          type: string
          format: uuid
        rol:
          type: string
          description: Rol externo (ext.*).
        alcance:
          type:
            - 'null'
            - array
          items:
            $ref: '#/components/schemas/AlcanceVista'
          description: 'Aplicativos, paquetes o documentos concedidos; vacío = lo que se comparta con la organización.'
        accesoVenceEn:
          type:
            - 'null'
            - string
          description: 'Vencimiento del acceso; por defecto, el máximo configurado (90 días).'
          format: date-time
        permisosExtra:
          type:
            - 'null'
            - array
          items:
            type: string
          description: 'exportar, sandbox.'
      description: Invitación nueva. Un proveedor exige vencimiento y alcance; el vencimiento no supera el máximo configurado.
    SolicitudMapeoGrupo:
      required:
        - grupoId
        - grupoNombre
        - rol
      type: object
      properties:
        grupoId:
          type: string
          format: uuid
        grupoNombre:
          type: string
        rol:
          type: string
      description: Grupo de Entra ID (object id y nombre) y el rol interno que otorga.
    SolicitudOpcionesInvitacion:
      required:
        - token
        - nombre
      type: object
      properties:
        token:
          type: string
        nombre:
          type: string
      description: Token de la invitación y el nombre que se mostrará en la passkey.
    SolicitudOrganizacion:
      required:
        - nombre
        - tipo
        - adminOrganizacionHabilitado
      type: object
      properties:
        nombre:
          type: string
          description: Nombre único (hasta 200 caracteres).
        tipo:
          type: string
          description: cliente o proveedor (la interna ya existe).
        adminOrganizacionHabilitado:
          type: boolean
          description: Habilita el rol ext.admin_organizacion en esta organización.
      description: Organización nueva o cambios de una existente.
    SolicitudPasskey:
      required:
        - estado
        - credencial
      type: object
      properties:
        estado:
          type: string
        credencial:
          type: string
          description: 'PublicKeyCredential.toJSON() de navigator.credentials.get(), como texto JSON.'
      description: Respuesta del autenticador para entrar con passkey.
    SolicitudRenovacion:
      required:
        - accesoVenceEn
      type: object
      properties:
        accesoVenceEn:
          type:
            - 'null'
            - string
          description: 'Vencimiento nuevo; por defecto, el máximo configurado.'
          format: date-time
      description: 'Renovación: vencimiento nuevo del acceso. Si la invitación no se ha aceptado, también se envía un enlace nuevo.'
    SolicitudSegundoFactor:
      required:
        - estado
        - codigo
        - codigoRecuperacion
      type: object
      properties:
        estado:
          type: string
        codigo:
          type:
            - 'null'
            - string
          description: Código de 6 dígitos de la aplicación de autenticación.
        codigoRecuperacion:
          type:
            - 'null'
            - string
          description: 'Código de recuperación de un solo uso, en lugar del TOTP.'
      description: 'Segundo factor del ingreso con contraseña: el código TOTP o un código de recuperación.'
    SolicitudTerminos:
      required:
        - estado
        - documentos
      type: object
      properties:
        estado:
          type: string
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/AceptacionDocumento'
      description: Aceptación de las versiones nuevas de los documentos legales para terminar el ingreso.
    SolicitudToken:
      required:
        - token
      type: object
      properties:
        token:
          type: string
      description: Token del enlace de la invitación (el fragmento de la URL del correo).
    SuscripcionDto:
      required:
        - endpoint
        - p256dh
        - auth
        - dispositivo
      type: object
      properties:
        endpoint:
          type: string
          description: URL https del servicio de push del navegador.
        p256dh:
          type: string
          description: 'Llave pública del navegador, base64url (65 bytes).'
        auth:
          type: string
          description: 'Secreto de autenticación, base64url (16 bytes).'
        dispositivo:
          type:
            - 'null'
            - string
          description: 'Resumen del dispositivo, p. ej. «Chrome en Android».'
      description: Suscripción Web Push de un dispositivo (PushSubscription del navegador).
    TerminosPendientes:
      required:
        - error
        - estado
        - documentos
      type: object
      properties:
        error:
          type: string
          description: terminos_pendientes.
        estado:
          type: string
          description: Id del paso para POST /api/v1/identidad/entrar/terminos.
        documentos:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoVigente'
      description: Antes de entrar hay que aceptar versiones nuevas de los documentos legales.
    VersionApi:
      required:
        - servicio
        - version
      type: object
      properties:
        servicio:
          type: string
        version:
          type:
            - 'null'
            - string
      description: Servicio y versión del ensamblado desplegado.
    Yo:
      required:
        - sub
        - personaId
        - nombre
        - tipoPrincipal
        - organizacionId
        - proveedor
        - roles
        - permisos
      type: object
      properties:
        sub:
          type: string
          format: uuid
        personaId:
          type: string
          format: uuid
        nombre:
          type: string
        tipoPrincipal:
          type: string
        organizacionId:
          type: string
          format: uuid
        proveedor:
          type: string
        roles:
          type: array
          items:
            type: string
          description: 'Códigos de los roles vigentes en este momento, ordenados; incluye atlas.lector de todo empleado.'
        permisos:
          type: array
          items:
            type: string
          description: 'Permisos efectivos (atlas.<modulo>.<accion>) en este momento, ordenados: la PWA filtra la navegación con ellos. Se recalculan en cada petición.'
      description: 'Usuario de la sesión actual: persona, organización, proveedor con el que entró, roles vigentes y permisos efectivos.'
  securitySchemes:
    sesionAtlas:
      type: apiKey
      description: 'Cookie de sesión del BFF. La emite el ingreso y solo lleva el id cifrado de la sesión, que vive en el servidor.'
      name: __Host-atlas
      in: cookie
    csrfAtlas:
      type: apiKey
      description: 'Antifalsificación: obligatoria (cualquier valor) en POST, PUT, PATCH y DELETE bajo /api/. Sin ella, o con otro Origin, la respuesta es 403.'
      name: X-Atlas-Csrf
      in: header
    tokenAtlas:
      type: oauth2
      description: 'Token de acceso de Atlas (OpenIddict, ATLAS-ADR-0024) en «Authorization: Bearer». Vida de 15 minutos, audiencia atlas-api. Código con PKCE para atlas-cli y MCP; client_credentials para servicios internos. JWT firmado (RS256) y cifrado según RFC8725 (buenas prácticas de JWT). La cookie de la PWA no sirve en estas operaciones.'
      flows:
        clientCredentials:
          tokenUrl: /connect/token
          scopes:
            atlas.mcp: Usar el servidor MCP de Atlas con los permisos de la persona.
            atlas.publicar: 'Publicar contratos, documentación y modelos en Atlas.'
            atlas.widget: Usar el asistente de Atlas embebido en otra aplicación de FLIT.
        authorizationCode:
          authorizationUrl: /connect/authorize
          tokenUrl: /connect/token
          refreshUrl: /connect/token
          scopes:
            atlas.mcp: Usar el servidor MCP de Atlas con los permisos de la persona.
            atlas.publicar: 'Publicar contratos, documentación y modelos en Atlas.'
            atlas.widget: Usar el asistente de Atlas embebido en otra aplicación de FLIT.
tags:
  - name: Identidad
    description: 'Ingreso de empleados con Microsoft, proveedores habilitados, cierre de sesión, dispositivos conectados, suspensión y reautenticación (ATLAS-ADR-0004 y ATLAS-ADR-0022), tokens para clientes que no son el navegador (ATLAS-ADR-0024), y las cuentas locales de externos: aceptar invitación, passkey, contraseña con TOTP y recuperación (ATLAS-ADR-0025).'
  - name: Plataforma
    description: Datos del usuario en sesión (con sus roles y permisos efectivos) y de la propia API.
  - name: Organizaciones
    description: 'FLIT, clientes y proveedores: crear, editar, suspender y eliminar, y habilitar el administrador de la organización (HU 1.5, ATLAS-ADR-0025).'
  - name: Invitaciones
    description: 'Invitaciones de externos con rol, alcance, vencimiento y permisos extra: crear, reenviar, suspender, renovar y revocar (HU 1.5, ATLAS-ADR-0025).'
  - name: Permisos
    description: 'Roles internos y externos, asignaciones con alcance y vigencia, mapeo de grupos de Entra y la matriz rol × permiso generada desde el código (ATLAS-ADR-0023).'
  - name: Hola
    description: 'Módulo de ejemplo de docs/como-crear-un-modulo.md: saludos por organización con permisos, predicado obligatorio y RLS. Apagado por defecto (bandera modulo.hola).'
