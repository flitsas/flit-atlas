          description: El módulo está apagado para la organización de la sesión (bandera modulo.hola).
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
      x-atlas-permisos:
        - atlas.hola.gestionar
  '/api/v1/hola/saludos/{id}':
    get:
      tags:
        - Hola
      summary: Un saludo
      description: Un saludo por su id. 404 si no existe o es de una organización que no puedes ver.
      operationId: ObtenerSaludo
      parameters:
        - name: id
          in: path
          description: Id del saludo.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaludoDto'
        '404':
          description: 'No existe o no lo puedes ver, o el módulo está apagado para la organización de la sesión (bandera modulo.hola).'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: La sesión no tiene el permiso atlas.hola.ver.
      security:
        - sesionAtlas: [ ]
      x-atlas-permisos:
        - atlas.hola.ver
components:
  schemas:
    AceptacionDocumento:
      required:
        - documento
        - version
      type: object
      properties:
        documento:
          type: string
          description: terminos o privacidad.
        version:
          type: string
          description: La versión vigente que se mostró.
      description: Versión de un documento legal que la persona acepta.
    AlcanceVista:
      required:
        - tipo
        - id
      type: object
      properties:
        tipo:
          type: string
          description: Tipo de alcance.
        id:
          type:
            - 'null'
            - string
          description: Id del recurso; vacío si es global.
      description: 'Alcance de una asignación: global o un recurso (organizacion, aplicativo, paquete, documento, ambiente…).'
    AplicativoResumen:
      required:
        - id
        - slug
        - nombre
        - tipo
        - grupo
        - estado
        - criticidad
        - manejaDatosPersonales
        - padreId
        - descripcion
        - tecnologias
        - etiquetas
        - ancestros
        - hijos
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: 'Clave natural (minúsculas, números y guiones).'
        nombre:
          type: string
        tipo:
          type: string
          description: 'producto, modulo o servicio.'
        grupo:
          type: string
          description: 'flit2, flito, satelite, legado o infraestructura.'
        estado:
          type: string
          description: 'planeado, activo, en_retiro o retirado.'
        criticidad:
          type: string
          description: 'alta, media o baja.'
        manejaDatosPersonales:
          type: boolean
          description: Si trata datos personales.
        padreId:
          type:
            - 'null'
            - string
          description: Padre directo; vacío en un producto.
          format: uuid
        descripcion:
          type:
            - 'null'
            - string
          description: 'Descripción; lo que falta confirmar lleva «[por verificar]».'
        tecnologias:
          type: array
          items:
            type: string
        etiquetas:
          type: array
          items:
            type: string
        ancestros:
          type: array
          items:
            $ref: '#/components/schemas/ReferenciaAplicativo'
          description: Del producto al padre directo.
        hijos:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Cuántos hijos directos tiene.
          format: int32
      description: Aplicativo del catálogo en un listado.
    AsignacionVista:
      required:
        - id
        - personaId
        - rol
        - rolNombre
        - tipoRol
        - organizacionId
        - alcance
        - vigenteDesde
        - vigenteHasta
        - origen
        - vigente
        - asignadoPor
        - creadoEn
      type: object
      properties:
        id:
          type: string
          format: uuid
        personaId:
          type: string
          format: uuid
        rol:
          type: string
        rolNombre:
          type: string
        tipoRol:
          type: string
          description: interno o externo.
        organizacionId:
          type:
            - 'null'
            - string
          format: uuid
        alcance:
          $ref: '#/components/schemas/AlcanceVista'
        vigenteDesde:
          type: string
          format: date-time
        vigenteHasta:
          type:
            - 'null'
            - string
          format: date-time
        origen:
          type: string
          description: 'manual, grupo_entra, invitacion o emergencia.'
        vigente:
          type: boolean
          description: Si concede permisos en este momento (empezó y no ha vencido).
        asignadoPor:
          type:
            - 'null'
            - string
          format: uuid
        creadoEn:
          type: string
          format: date-time
      description: 'Asignación de un rol a una persona, con su organización, alcance y vigencia.'
    BajaSuscripcionDto:
      required:
        - endpoint
      type: object
      properties:
        endpoint:
          type: string
      description: Suscripción que se da de baja.
    BandejaDto:
      required:
        - noLeidas
        - elementos
      type: object
      properties:
        noLeidas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/NotificacionDto'
      description: 'Bandeja de la persona: total sin leer y las más recientes primero.'
    CambioPreferencia:
      required:
        - tipo
        - canal
        - activa
      type: object
      properties:
        tipo:
          type: string
        canal:
          type: string
          description: push (app no se puede apagar).
        activa:
          type: boolean
      description: 'Cambio de una preferencia: activar o apagar un canal para un tipo.'
    ClavePushDto:
      required:
        - habilitado
        - clavePublica
      type: object
      properties:
        habilitado:
          type: boolean
        clavePublica:
          type:
            - 'null'
            - string
      description: Llave pública VAPID para suscribir el dispositivo; habilitado es falso si el ambiente no tiene llaves.
    ClaveTotp:
      required:
        - estado
        - clave
        - uri
        - qr
      type: object
      properties:
        estado:
          type: string
          description: Id del paso; vence en 5 minutos.
        clave:
          type: string
          description: 'Clave en base32, en grupos de 4, para escribirla a mano.'
        uri:
          type: string
          description: URI otpauth:// (la misma que lleva el QR).
        qr:
          type: string
          description: 'QR de la URI como imagen SVG en data URI (img-src data: de la CSP).'
      description: Clave TOTP nueva para registrar en la aplicación de autenticación.
    CuentaARecuperar:
      required:
        - correo
        - nombre
      type: object
      properties:
        correo:
          type: string
        nombre:
          type: string
      description: Cuenta que se va a recuperar.
    CuentaEmergenciaPublica:
      required:
        - correo
        - nombre
      type: object
      properties:
        correo:
          type: string
        nombre:
          type: string
      description: Cuenta de emergencia del enlace de activación.
    CuentaLista:
      required:
        - codigosRecuperacion
        - sesionIniciada
      type: object
      properties:
        codigosRecuperacion:
          type: array
          items:
            type: string
          description: Diez códigos de recuperación de un solo uso.
        sesionIniciada:
          type: boolean
          description: true si ya quedó la sesión abierta.
      description: 'Cuenta creada o recuperada: los códigos de recuperación se muestran esta única vez.'
    DocumentoVigente:
      required:
        - documento
        - version
        - titulo
        - texto
        - hash
      type: object
      properties:
        documento:
          type: string
          description: terminos o privacidad.
        version:
          type: string
          description: Versión que se acepta; cambia cuando cambia el texto.
        titulo:
          type: string
        texto:
          type: string
          description: 'Texto en Markdown, tal como se muestra.'
        hash:
          type: string
          description: 'SHA-256 (hex) del texto: queda en la evidencia de la aceptación.'
      description: 'Documento legal vigente (términos de uso o aviso de privacidad, Ley 1581) con su versión y su texto en Markdown.'
    ErrorCatalogo:
      required:
        - codigo
        - mensaje
      type: object
      properties:
        codigo:
          type: string
          description: 'slug_en_uso, tiene_hijos o requiere_permiso (falta el permiso sobre este aplicativo).'
        mensaje:
          type: string
      description: Error del catálogo con un código estable.
    ErrorClienteRegistrado:
      required:
        - referencia
      type: object
      properties:
        referencia:
          type: string
      description: 'Reporte recibido: la referencia con la que quedó en el log.'
    ErrorExternos:
      required:
        - error
        - mensaje
      type: object
      properties:
        error:
          type: string
          description: Código estable del error.
        mensaje:
          type: string
      description: Error de una operación de invitaciones o de cuentas externas.
    ErrorRoles:
      required:
        - error
        - mensaje
      type: object
      properties:
        error:
          type: string
          description: Código estable del error.
        mensaje:
          type: string
      description: Error de una operación de administración de roles.
    ErrorSincronizacion:
      required:
        - error
        - mensaje
      type: object
      properties:
        error:
          type: string
          description: sincronizacion_no_disponible o sincronizacion_en_curso.
        mensaje:
          type: string
      description: Error de la sincronización.
    EstadoSincronizacion:
      required:
        - id
        - disparo
        - origen
        - resultado
        - inicio
        - fin
        - creadas
        - actualizadas
        - deshabilitadas
        - reactivadas
        - sinCambios
        - omitidas
        - retenidas
        - error
      type: object
      properties:
        id:
          type: string
          description: Id de la corrida (recurso_id del evento de auditoría).
          format: uuid
        disparo:
          type: string
          description: programada o manual.
        origen:
          type: string
          description: 'enlazadas, grupo o tenant.'
        resultado:
          type: string
          description: 'exitosa, fallida o en_curso.'
        inicio:
          type: string
          format: date-time
        fin:
          type:
            - 'null'
            - string
          format: date-time
        creadas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Personas nuevas en Atlas.
          format: int32
        actualizadas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'Personas con algún dato cambiado (nombre, cargo, área, teléfono o foto).'
          format: int32
        deshabilitadas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Personas que quedaron inactivas porque su cuenta está deshabilitada o ya no existe en Entra; sus sesiones se cerraron.
          format: int32
        reactivadas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Personas que volvieron a activa porque su cuenta se rehabilitó en Entra.
          format: int32
        sinCambios:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Personas leídas sin cambios.
          format: int32
        omitidas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'Usuarios de Entra que no se trajeron: invitados, sin correo, deshabilitados que Atlas no conocía o con un correo que ya es de otra persona.'
          format: int32
        retenidas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Deshabilitaciones que el freno de seguridad retuvo (más de la fracción configurada en una sola corrida); no se aplicó ninguna.
          format: int32
        error:
          type:
            - 'null'
            - string
          description: 'Tipo de la excepción si la corrida falló (sin el mensaje, que podría traer datos).'
      description: 'Resultado de la última corrida de la sincronización de personas con Microsoft Graph. Solo conteos, sin datos personales.'
    FichaAplicativo:
      required:
        - id
        - slug
        - nombre
        - tipo
        - grupo
        - estado
        - criticidad
        - manejaDatosPersonales
        - padreId
        - descripcion
        - repo
        - rutaEnRepo
        - tecnologias
        - ambientes
        - etiquetas
        - ancestros
        - hijos
        - permisos
        - creadoEn
        - actualizadoEn
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        nombre:
          type: string
        tipo:
          type: string
          description: 'producto, modulo o servicio.'
        grupo:
          type: string
          description: 'flit2, flito, satelite, legado o infraestructura.'
        estado:
          type: string
          description: 'planeado, activo, en_retiro o retirado.'
        criticidad:
          type: string
          description: 'alta, media o baja.'
        manejaDatosPersonales:
          type: boolean
        padreId:
          type:
            - 'null'
            - string
          format: uuid
        descripcion:
          type:
            - 'null'
            - string
        repo:
          type:
            - 'null'
            - string
          description: Repositorio de GitHub como dueño/nombre.
        rutaEnRepo:
          type:
            - 'null'
            - string
          description: Carpeta dentro del repo.
        tecnologias:
          type: array
          items:
            type: string
        ambientes:
          type: array
          items:
            type: string
          description: 'dev, qa y pdn.'
        etiquetas:
          type: array
          items:
            type: string
        ancestros:
          type: array
          items:
            $ref: '#/components/schemas/ReferenciaAplicativo'
        hijos:
