  /api/v1/catalogo/aplicativos:
    get:
      tags:
        - Catálogo
      summary: Catálogo de aplicativos
      description: 'Productos, módulos y servicios que cumplen el filtro, ordenados por grupo y por su ruta en la jerarquía (máximo 500). Cada filtro admite varios valores. Requiere atlas.catalogo.ver.'
      operationId: ListarAplicativos
      parameters:
        - name: texto
          in: query
          description: 'Texto a buscar en el nombre, el slug, la descripción, el repo o una etiqueta exacta; sin distinguir tildes ni mayúsculas.'
          schema:
            type: string
        - name: grupo
          in: query
          description: 'Grupos: flit2, flito, satelite, legado, infraestructura.'
          schema:
            type: array
            items:
              type: string
        - name: estado
          in: query
          description: 'Estados: planeado, activo, en_retiro, retirado.'
          schema:
            type: array
            items:
              type: string
        - name: criticidad
          in: query
          description: 'Criticidades: alta, media, baja.'
          schema:
            type: array
            items:
              type: string
        - name: tipo
          in: query
          description: 'Tipos: producto, modulo, servicio.'
          schema:
            type: array
            items:
              type: string
        - name: padreId
          in: query
          description: Solo los hijos directos de este aplicativo.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListadoAplicativos'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: La sesión no tiene el permiso atlas.catalogo.ver.
        '404':
          description: El módulo está apagado para la organización de la sesión (bandera modulo.catalogo).
      security:
        - sesionAtlas: [ ]
      x-atlas-permisos:
        - atlas.catalogo.ver
    post:
      tags:
        - Catálogo
      summary: Crear un aplicativo
      description: 'Producto, módulo o servicio nuevo. Queda en la auditoría. Requiere atlas.catalogo.gestionar (para un hijo, sobre el padre o un ancestro; para un producto, global).'
      operationId: CrearAplicativo
      requestBody:
        description: Datos del aplicativo nuevo.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudAplicativo'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaAplicativo'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCatalogo'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCatalogo'
        '401':
          description: No hay una sesión activa o venció.
        '404':
          description: El módulo está apagado para la organización de la sesión (bandera modulo.catalogo).
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
      x-atlas-permisos:
        - atlas.catalogo.gestionar
  '/api/v1/catalogo/aplicativos/{slug}':
    get:
      tags:
        - Catálogo
      summary: Ficha de un aplicativo
      description: 'Datos del aplicativo, su ruta (ancestros), sus hijos y lo que la persona puede hacer con él. 404 si no existe. Requiere atlas.catalogo.ver.'
      operationId: ObtenerFichaAplicativo
      parameters:
        - name: slug
          in: path
          description: Slug del aplicativo.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaAplicativo'
        '404':
          description: 'No existe o no lo puedes ver, o el módulo está apagado para la organización de la sesión (bandera modulo.catalogo).'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: La sesión no tiene el permiso atlas.catalogo.ver.
      security:
        - sesionAtlas: [ ]
      x-atlas-permisos:
        - atlas.catalogo.ver
  '/api/v1/catalogo/aplicativos/{id}':
    put:
      tags:
        - Catálogo
      summary: Editar un aplicativo
      description: 'Reemplaza sus datos. Cambiar slug, tipo, padre o grupo exige además atlas.catalogo.gestionar; el grupo de un producto se propaga a sus descendientes. Queda en la auditoría. Requiere atlas.catalogo.editar sobre el aplicativo o un ancestro.'
      operationId: ActualizarAplicativo
      parameters:
        - name: id
          in: path
          description: Id del aplicativo.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: 'Todos los datos del aplicativo, con los cambios.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudAplicativo'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaAplicativo'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: 'No existe o no lo puedes ver, o el módulo está apagado para la organización de la sesión (bandera modulo.catalogo).'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCatalogo'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCatalogo'
        '401':
          description: No hay una sesión activa o venció.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
      x-atlas-permisos:
        - atlas.catalogo.editar
    delete:
      tags:
        - Catálogo
      summary: Eliminar un aplicativo sin hijos
      description: 'Solo si no tiene hijos (si los tiene, elimínalos primero o márcalo retirado). La semilla no lo vuelve a crear. Queda en la auditoría. Requiere atlas.catalogo.gestionar.'
      operationId: EliminarAplicativo
      parameters:
        - name: id
          in: path
          description: Id del aplicativo.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: 'No existe o no lo puedes ver, o el módulo está apagado para la organización de la sesión (bandera modulo.catalogo).'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCatalogo'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCatalogo'
        '401':
          description: No hay una sesión activa o venció.
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
      x-atlas-permisos:
        - atlas.catalogo.gestionar
  /api/v1/hola/saludos:
    get:
      tags:
        - Hola
      summary: Saludos de tu organización
      description: 'Los saludos que puedes ver, del más reciente al más viejo (máximo 50). Un externo solo ve los de su organización.'
      operationId: ListarSaludos
      responses:
        '200':
