                format: int32
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    format: int32
                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - csrfAtlas: [ ]
  /api/v1/identidad/invitaciones/passkey/opciones:
    post:
      tags:
        - Identidad
      summary: Opciones para crear la passkey de la cuenta
      description: Desafío de WebAuthn (navigator.credentials.create) para la cuenta que se crea con la invitación. Vence en 5 minutos y sirve una sola vez. No requiere sesión.
      operationId: OpcionesPasskeyInvitacion
      requestBody:
        description: Token de la invitación y nombre para la passkey.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudOpcionesInvitacion'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpcionesPasskey'
        '410':
          description: Gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorExternos'
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
        '429':
