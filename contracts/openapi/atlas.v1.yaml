      operationId: ListarAusenciasSoporte
      parameters:
        - name: desde
          in: query
          description: 'Incluye las ausencias que terminan desde este día (aaaa-mm-dd); vacío, hoy.'
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AusenciaDto'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: La sesión no tiene el permiso atlas.soporte.gestionar.
        '404':
          description: El módulo está apagado para la organización de la sesión (bandera modulo.soporte).
      security:
        - sesionAtlas: [ ]
      x-atlas-permisos:
        - atlas.soporte.gestionar
    post:
      tags:
        - Soporte
      summary: Registrar una ausencia
      description: 'Ausencia de una persona de la rotación entre dos fechas (incluidas, máximo 366 días). La generación no la asigna esos días; los turnos ya creados no cambian solos. Vale en todos los equipos de la persona. Requiere atlas.soporte.gestionar global o sobre un equipo de la persona.'
      operationId: CrearAusenciaSoporte
      requestBody:
        description: 'Persona, fechas y motivo de la ausencia.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaAusencia'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AusenciaDto'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: 'Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host, o la sesión no tiene el permiso atlas.soporte.gestionar.'
        '404':
          description: El módulo está apagado para la organización de la sesión (bandera modulo.soporte).
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
      x-atlas-permisos:
        - atlas.soporte.gestionar
  '/api/v1/soporte/ausencias/{id}':
    delete:
      tags:
        - Soporte
      summary: Quitar una ausencia
      description: Borra una ausencia registrada por error o cancelada. Requiere atlas.soporte.gestionar global o sobre un equipo de la persona.
      operationId: EliminarAusenciaSoporte
      parameters:
        - name: id
          in: path
          description: Id de la ausencia.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: 'No existe o no lo puedes ver, o el módulo está apagado para la organización de la sesión (bandera modulo.soporte).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSoporte'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: 'Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host, o la sesión no tiene el permiso atlas.soporte.gestionar.'
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
      x-atlas-permisos:
        - atlas.soporte.gestionar
  /api/v1/soporte/festivos:
    get:
      tags:
        - Soporte
      summary: Festivos del año
      description: 'Los festivos de Colombia del año, calculados en Atlas con la Ley 51 de 1983 y, desde 2026, la Ley 2578 (Pascua por algoritmo, fijos, trasladables al lunes y relativos a Pascua), más los días adicionales registrados. Sin año, el actual. Requiere atlas.soporte.ver.'
      operationId: ListarFestivosSoporte
      parameters:
        - name: anio
          in: query
          description: 'Año (1984 a 9999); vacío, el actual.'
          schema:
            pattern: '^-?(?:0|[1-9]\d*)$'
            type:
              - integer
              - string
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FestivoDto'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: La sesión no tiene el permiso atlas.soporte.ver.
        '404':
          description: El módulo está apagado para la organización de la sesión (bandera modulo.soporte).
      security:
        - sesionAtlas: [ ]
      x-atlas-permisos:
        - atlas.soporte.ver
    post:
      tags:
        - Soporte
      summary: Agregar un día no laborable
      description: Día adicional (p. ej. un día cívico decretado) que la generación trata como festivo. 409 si ya existe un día adicional en esa fecha. Requiere atlas.soporte.gestionar con alcance global.
      operationId: CrearFestivoSoporte
      requestBody:
        description: Fecha y nombre del día no laborable.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoFestivo'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FestivoDto'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSoporte'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: 'Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host, o la sesión no tiene el permiso atlas.soporte.gestionar.'
        '404':
          description: El módulo está apagado para la organización de la sesión (bandera modulo.soporte).
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
      x-atlas-permisos:
        - atlas.soporte.gestionar
  '/api/v1/soporte/festivos/{id}':
    delete:
      tags:
        - Soporte
      summary: Quitar un día no laborable
      description: Borra un día adicional; los festivos de ley no se pueden quitar. Requiere atlas.soporte.gestionar con alcance global.
      operationId: EliminarFestivoSoporte
      parameters:
        - name: id
          in: path
          description: Id del día adicional.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: 'No existe o no lo puedes ver, o el módulo está apagado para la organización de la sesión (bandera modulo.soporte).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSoporte'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: 'Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host, o la sesión no tiene el permiso atlas.soporte.gestionar.'
      security:
        - sesionAtlas: [ ]
          csrfAtlas: [ ]
      x-atlas-permisos:
        - atlas.soporte.gestionar
  /api/v1/soporte/indicadores:
    get:
      tags:
        - Soporte
      summary: Indicadores del soporte
      description: 'Turnos por persona, reemplazos, compensaciones pendientes y cumplimiento (aplicados sobre los turnos ya pasados) entre dos fechas; sin fechas, el año en curso. Requiere atlas.soporte.ver.'
      operationId: ObtenerIndicadoresSoporte
      parameters:
        - name: desde
          in: query
          description: 'Primer día (aaaa-mm-dd); vacío, el 1 de enero del año en curso.'
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          description: 'Último día, incluido (aaaa-mm-dd); vacío, el 31 de diciembre del año en curso.'
          schema:
            type: string
            format: date
        - name: equipo
          in: query
          description: 'Id del equipo; vacío, todos.'
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicadoresDto'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: La sesión no tiene el permiso atlas.soporte.ver.
        '404':
          description: El módulo está apagado para la organización de la sesión (bandera modulo.soporte).
      security:
        - sesionAtlas: [ ]
      x-atlas-permisos:
        - atlas.soporte.ver
  /api/v1/soporte/canal:
    get:
      tags:
        - Soporte
      summary: Canal de soporte del sábado
      description: 'Lo único del soporte que ve un externo: el canal configurado y el horario del próximo sábado, sin nombres ni datos de personas. Sin canal configurado, configurado es falso. Requiere atlas.soporte.ver_canal.'
      operationId: ObtenerCanalSoporte
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanalSoporteDto'
        '401':
          description: No hay una sesión activa o venció.
        '403':
          description: La sesión no tiene el permiso atlas.soporte.ver_canal.
        '404':
          description: El módulo está apagado para la organización de la sesión (bandera modulo.soporte).
      security:
        - sesionAtlas: [ ]
      x-atlas-permisos:
        - atlas.soporte.ver_canal
components:
  schemas:
    AceptacionDocumento:
      required:
        - documento
        - version
      type: object
      properties:
        documento:
          type: string
          description: terminos o privacidad.
        version:
          type: string
          description: La versión vigente que se mostró.
      description: Versión de un documento legal que la persona acepta.
    AlcanceVista:
      required:
        - tipo
        - id
      type: object
      properties:
        tipo:
          type: string
          description: Tipo de alcance.
        id:
          type:
            - 'null'
            - string
          description: Id del recurso; vacío si es global.
      description: 'Alcance de una asignación: global o un recurso (organizacion, aplicativo, paquete, documento, ambiente…).'
    AsignacionVista:
      required:
        - id
        - personaId
        - rol
        - rolNombre
        - tipoRol
        - organizacionId
        - alcance
        - vigenteDesde
        - vigenteHasta
        - origen
        - vigente
        - asignadoPor
        - creadoEn
      type: object
      properties:
        id:
          type: string
          format: uuid
        personaId:
          type: string
          format: uuid
        rol:
          type: string
        rolNombre:
          type: string
        tipoRol:
          type: string
          description: interno o externo.
        organizacionId:
          type:
            - 'null'
            - string
          format: uuid
        alcance:
          $ref: '#/components/schemas/AlcanceVista'
        vigenteDesde:
          type: string
          format: date-time
        vigenteHasta:
          type:
            - 'null'
            - string
          format: date-time
        origen:
          type: string
          description: 'manual, grupo_entra, invitacion o emergencia.'
        vigente:
          type: boolean
          description: Si concede permisos en este momento (empezó y no ha vencido).
        asignadoPor:
          type:
            - 'null'
            - string
          format: uuid
        creadoEn:
          type: string
          format: date-time
      description: 'Asignación de un rol a una persona, con su organización, alcance y vigencia.'
    AusenciaDto:
      required:
        - id
        - personaId
        - nombre
        - desde
        - hasta
        - tipo
      type: object
      properties:
        id:
          type: string
          description: Id de la ausencia.
          format: uuid
        personaId:
          type: string
          description: Id de la persona.
          format: uuid
        nombre:
          type: string
          description: Nombre de la persona.
        desde:
          type: string
          description: Primer día (aaaa-mm-dd).
          format: date
        hasta:
          type: string
          description: 'Último día, incluido (aaaa-mm-dd).'
          format: date
        tipo:
          type: string
          description: 'vacaciones, incapacidad u otra.'
      description: Ausencia de una persona (vale en todos sus equipos).
    BajaSuscripcionDto:
      required:
        - endpoint
      type: object
      properties:
        endpoint:
          type: string
      description: Suscripción que se da de baja.
    BandejaDto:
      required:
        - noLeidas
        - elementos
      type: object
      properties:
        noLeidas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          format: int32
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/NotificacionDto'
      description: 'Bandeja de la persona: total sin leer y las más recientes primero.'
    CalendarioDto:
      required:
        - desde
        - hasta
        - equipoId
        - turnos
        - festivos
      type: object
      properties:
        desde:
          type: string
          description: Primer día del rango.
          format: date
        hasta:
          type: string
          description: Último día del rango (incluido).
          format: date
        equipoId:
          type:
            - 'null'
            - string
          description: 'Equipo filtrado; vacío, todos.'
          format: uuid
        turnos:
          type: array
          items:
            $ref: '#/components/schemas/TurnoDto'
          description: 'Turnos del rango, por fecha y equipo; incluye reemplazados y cancelados como historia.'
        festivos:
          type: array
          items:
            $ref: '#/components/schemas/FestivoDto'
          description: Festivos del rango.
      description: 'Turnos y festivos de un rango de fechas, para las vistas de lista, semana y mes.'
    CambioConfiguracion:
      required:
        - horaInicioPorDefecto
        - horaFinPorDefecto
        - reglaFestivos
        - diasAnticipacionRecordatorio
        - canalExterno
      type: object
      properties:
        horaInicioPorDefecto:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora de inicio por defecto (HH:mm, Bogotá).'
        horaFinPorDefecto:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora de fin por defecto (HH:mm, Bogotá); posterior al inicio.'
        reglaFestivos:
          maxLength: 20
          type:
            - 'null'
            - string
          description: sin_turno o turno_normal.
        diasAnticipacionRecordatorio:
          maximum: 30
          minimum: 1
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          description: 'Días de anticipación de los recordatorios, de 1 a 30.'
          format: int32
        canalExterno:
          maxLength: 200
          type:
            - 'null'
            - string
          description: 'Canal de soporte del sábado para externos, sin nombres de personas.'
      description: 'Configuración global nueva: reemplaza toda la anterior.'
    CambioEquipo:
      required:
        - nombre
        - area
        - personasMinimo
        - personasMaximo
        - horaInicio
        - horaFin
        - activo
      type: object
      properties:
        nombre:
          maxLength: 100
          minLength: 1
          type:
            - 'null'
            - string
          description: 'Nombre del equipo, único.'
        area:
          maxLength: 100
          type:
            - 'null'
            - string
          description: Área.
        personasMinimo:
          maximum: 10
          minimum: 1
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Mínimo de personas por sábado (1 a 10).
          format: int32
        personasMaximo:
          maximum: 10
          minimum: 1
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Máximo de personas por sábado (mínimo a 10).
          format: int32
        horaInicio:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora de inicio propia (HH:mm); vacía, la global.'
        horaFin:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora de fin propia (HH:mm); vacía, la global.'
        activo:
          type:
            - 'null'
            - boolean
          description: 'Si está activo; vacío, activo.'
      description: Equipo nuevo o cambio de un equipo (reemplaza todos sus datos).
    CambioEstadoTurno:
      required:
        - estado
        - observacion
      type: object
      properties:
        estado:
          maxLength: 20
          type:
            - 'null'
            - string
          description: 'confirmado, aplicado o cancelado.'
        observacion:
          maxLength: 500
          type:
            - 'null'
            - string
          description: Observación (se agrega a la del turno).
      description: 'Cambio de estado de un turno: confirmado, aplicado o cancelado (el reemplazo tiene su propia operación).'
    CambioParticipante:
      required:
        - activo
      type: object
      properties:
        activo:
          type: boolean
          description: Si entra en la generación.
      description: Cambio de estado de un participante.
    CambioPreferencia:
      required:
        - tipo
        - canal
        - activa
      type: object
      properties:
        tipo:
          type: string
        canal:
          type: string
          description: push (app no se puede apagar).
        activa:
          type: boolean
      description: 'Cambio de una preferencia: activar o apagar un canal para un tipo.'
    CambioTurno:
      required:
        - horaInicio
        - horaFin
        - observacion
      type: object
      properties:
        horaInicio:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora de inicio (HH:mm); vacía, sin horario.'
        horaFin:
          maxLength: 5
          type:
            - 'null'
            - string
          description: 'Hora de fin (HH:mm); vacía, sin horario.'
        observacion:
          maxLength: 500
          type:
            - 'null'
            - string
          description: Observación.
      description: Horario y observación de un turno que aún no está aplicado. Reemplaza los valores anteriores.
    CanalSoporteDto:
      required:
        - fecha
        - configurado
        - canal
        - horaInicio
        - horaFin
        - haySoporte
      type: object
      properties:
        fecha:
          type: string
          description: 'El próximo sábado (hoy, si es sábado).'
          format: date
        configurado:
          type: boolean
          description: Si se configuró un canal para externos.
        canal:
          type:
            - 'null'
            - string
          description: 'Canal de contacto (correo, línea o canal); vacío si no está configurado.'
        horaInicio:
          type:
            - 'null'
            - string
          description: 'Hora de inicio del soporte ese sábado (HH:mm), si se conoce.'
        horaFin:
          type:
            - 'null'
            - string
          description: 'Hora de fin del soporte ese sábado (HH:mm), si se conoce.'
        haySoporte:
          type: boolean
          description: Si ese sábado hay soporte programado.
      description: 'Canal de soporte del sábado para externos: sin nombres de personas.'
    CandidatoDto:
      required:
        - id
        - nombre
        - correo
        - cargo
      type: object
      properties:
        id:
          type: string
          description: Id de la persona.
          format: uuid
        nombre:
          type: string
          description: Nombre.
        correo:
          type: string
          description: Correo.
        cargo:
          type:
            - 'null'
            - string
          description: 'Cargo, si se conoce.'
      description: Persona interna que se puede agregar a la rotación.
    ClavePushDto:
      required:
        - habilitado
        - clavePublica
      type: object
      properties:
        habilitado:
          type: boolean
        clavePublica:
          type:
            - 'null'
            - string
      description: Llave pública VAPID para suscribir el dispositivo; habilitado es falso si el ambiente no tiene llaves.
    ClaveTotp:
      required:
        - estado
        - clave
        - uri
        - qr
      type: object
      properties:
        estado:
          type: string
          description: Id del paso; vence en 5 minutos.
        clave:
          type: string
          description: 'Clave en base32, en grupos de 4, para escribirla a mano.'
        uri:
          type: string
          description: URI otpauth:// (la misma que lleva el QR).
        qr:
          type: string
          description: 'QR de la URI como imagen SVG en data URI (img-src data: de la CSP).'
      description: Clave TOTP nueva para registrar en la aplicación de autenticación.
    ConfiguracionDto:
      required:
        - horaInicioPorDefecto
        - horaFinPorDefecto
        - reglaFestivos
        - diasAnticipacionRecordatorio
        - canalExterno
        - actualizadoEn
      type: object
      properties:
        horaInicioPorDefecto:
          type: string
          description: 'Hora de inicio por defecto (HH:mm, Bogotá).'
        horaFinPorDefecto:
          type: string
          description: 'Hora de fin por defecto (HH:mm, Bogotá).'
        reglaFestivos:
          type: string
          description: 'sin_turno o turno_normal: qué hace la generación con un sábado festivo.'
        diasAnticipacionRecordatorio:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          description: Días antes del turno en que salen los recordatorios (HU 2.11).
          format: int32
        canalExterno:
          type:
            - 'null'
            - string
          description: 'Canal de soporte del sábado que ven los externos; vacío, no ven nada.'
        actualizadoEn:
          type:
            - 'null'
            - string
          description: Cuándo se guardó por última vez; vacío si nunca (valores por defecto).
          format: date-time
      description: Configuración global del soporte de los sábados.
    ConfirmacionGeneracion:
      required:
        - equipoId
        - meses
        - desde
        - huella
      type: object
      properties:
        equipoId:
          type: string
          description: Equipo (el mismo de la vista previa).
          format: uuid
        meses:
          maximum: 12
          minimum: 1
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'Meses hacia adelante, de 1 a 12 (los mismos de la vista previa).'
          format: int32
        desde:
          type:
            - 'null'
            - string
          description: Primer día de la ventana (el mismo de la vista previa).
          format: date
        huella:
          maxLength: 64
          type:
            - 'null'
            - string
          description: 'Huella de la vista previa: si algo cambió desde entonces, la confirmación se rechaza.'
      description: 'Confirmación de una vista previa: el mismo equipo, la misma ventana y la huella que devolvió.'
    ConteoPersonaDto:
      required:
        - personaId
        - nombre
        - turnos
      type: object
      properties:
        personaId:
          type: string
          description: Id de la persona.
          format: uuid
        nombre:
          type: string
          description: Nombre.
        turnos:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
