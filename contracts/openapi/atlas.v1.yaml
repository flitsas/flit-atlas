      description: A quién llamar este sábado en un equipo.
    EquipoResumenDto:
      required:
        - id
        - nombre
      type: object
      properties:
        id:
          type: string
          description: Id del equipo.
          format: uuid
        nombre:
          type: string
          description: Nombre del equipo.
      description: Equipo de un turno.
    EquipoTurnoDto:
      required:
        - id
        - nombre
        - area
        - horaInicio
        - horaFin
        - personas
      type: object
      properties:
        id:
          type: string
          description: Id del equipo de soporte.
          format: uuid
        nombre:
          type: string
          description: Nombre del equipo.
        area:
          type:
            - 'null'
            - string
          description: Área del equipo.
        horaInicio:
          type:
            - 'null'
            - string
          description: 'Hora de inicio (HH:mm, Bogotá).'
        horaFin:
          type:
            - 'null'
            - string
          description: 'Hora de fin (HH:mm, Bogotá).'
        personas:
          type: array
          items:
            $ref: '#/components/schemas/PersonaEquipoDto'
          description: Personas de turno; vacío si nadie.
