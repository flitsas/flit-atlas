          description: Equipo que se genera.
          format: uuid
        meses:
          maximum: 12
          minimum: 1
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'Meses hacia adelante, de 1 a 12.'
          format: int32
        desde:
          type:
            - 'null'
            - string
          description: 'Primer día de la ventana; vacío, mañana. Debe ser posterior a hoy.'
          format: date
      description: Ventana de la generación automática de un equipo.
    SolicitudGuia:
      required:
        - titulo
        - contenido
        - operacion
        - aplicaDesde
        - aplicaHasta
        - visibilidad
        - nota
        - revisionBase
      type: object
      properties:
        titulo:
          type: string
          description: Hasta 200 caracteres.
        contenido:
          type: string
          description: 'Cuerpo en Markdown, hasta 200 mil caracteres. El HTML no se interpreta.'
        operacion:
          type:
            - 'null'
            - string
          description: Clave de una operación del índice de alguna versión del contrato; vacío si la guía es de todo el contrato.
        aplicaDesde:
          type:
            - 'null'
            - string
          description: Versión semántica inicial; vacío = desde la primera.
        aplicaHasta:
          type:
            - 'null'
            - string
          description: Versión semántica final; vacío = hasta la última.
        visibilidad:
          type: string
          description: interna o compartible. Publicar una compartible exige la aprobación del principal o del secundario.
        nota:
          type: string
          description: 'Mensaje del cambio, hasta 500 caracteres.'
        revisionBase:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          description: 'Al editar: la revisión sobre la que se trabajó (409 si ya hay otra más nueva). Al crear se ignora.'
          format: int32
      description: Lo que se guarda en una revisión nueva.
    SolicitudImportacion:
      required:
        - markdown
        - huella
        - traspaso
      type: object
      properties:
        markdown:
          maxLength: 100000
          minLength: 1
          type: string
          description: 'Contenido del documento (Markdown, hasta 100 KB).'
        huella:
          maxLength: 64
          minLength: 64
          type: string
          description: 'Huella de la vista previa: si algo cambió, la importación se rechaza (409).'
        traspaso:
          type:
            - 'null'
            - string
          description: 'Estado de traspaso de los secundarios importados: habilitado (por defecto) o en_acompanamiento.'
      description: 'Confirmación de la importación: el mismo Markdown y la huella de su vista previa.'
    SolicitudIngresoLocal:
      required:
        - correo
        - contrasena
      type: object
      properties:
        correo:
          type: string
        contrasena:
          type: string
      description: Correo y contraseña de una cuenta externa (primer paso; el segundo es el TOTP).
    SolicitudInvitacion:
      required:
        - correo
        - nombre
        - organizacionId
        - rol
        - alcance
        - accesoVenceEn
        - permisosExtra
      type: object
      properties:
        correo:
          type: string
        nombre:
          type:
            - 'null'
            - string
          description: 'Nombre del invitado, si lo conoces (opcional).'
        organizacionId:
          type: string
          format: uuid
        rol:
          type: string
          description: Rol externo (ext.*).
        alcance:
          type:
            - 'null'
            - array
          items:
            $ref: '#/components/schemas/AlcanceVista'
          description: 'Aplicativos, paquetes o documentos concedidos; vacío = lo que se comparta con la organización.'
        accesoVenceEn:
          type:
            - 'null'
            - string
          description: 'Vencimiento del acceso; por defecto, el máximo configurado (90 días).'
          format: date-time
        permisosExtra:
          type:
            - 'null'
            - array
          items:
            type: string
          description: 'exportar, sandbox.'
      description: Invitación nueva. Un proveedor exige vencimiento y alcance; el vencimiento no supera el máximo configurado.
    SolicitudMapeoGrupo:
      required:
        - grupoId
        - grupoNombre
        - rol
      type: object
      properties:
        grupoId:
          type: string
          format: uuid
        grupoNombre:
          type: string
        rol:
          type: string
      description: Grupo de Entra ID (object id y nombre) y el rol interno que otorga.
    SolicitudNota:
      required:
        - nota
      type: object
      properties:
        nota:
          maxLength: 500
          minLength: 1
          type: string
          description: Por qué se hace (hasta 500).
      description: Nota de un cambio.
    SolicitudOpcionesInvitacion:
      required:
        - token
        - nombre
      type: object
      properties:
        token:
          type: string
        nombre:
          type: string
      description: Token de la invitación y el nombre que se mostrará en la passkey.
    SolicitudOrganizacion:
      required:
        - nombre
        - tipo
        - adminOrganizacionHabilitado
      type: object
      properties:
        nombre:
          type: string
          description: Nombre único (hasta 200 caracteres).
        tipo:
          type: string
          description: cliente o proveedor (la interna ya existe).
        adminOrganizacionHabilitado:
          type: boolean
          description: Habilita el rol ext.admin_organizacion en esta organización.
      description: Organización nueva o cambios de una existente.
    SolicitudPasskey:
      required:
        - estado
        - credencial
      type: object
      properties:
        estado:
          type: string
        credencial:
          type: string
          description: 'PublicKeyCredential.toJSON() de navigator.credentials.get(), como texto JSON.'
      description: Respuesta del autenticador para entrar con passkey.
    SolicitudPublicacion:
      required:
        - aplicativo
        - contrato
        - tipo
        - version
        - spec
        - changelog
      type: object
      properties:
        aplicativo:
          type: string
          description: Slug del aplicativo del catálogo al que pertenece el contrato (flit2-core-api).
        contrato:
          type: string
          description: 'Código del contrato dentro del aplicativo: minúsculas, números y guiones (external-api).'
        tipo:
          type: string
          description: 'openapi, asyncapi o proto.'
        version:
          type:
            - 'null'
            - string
          description: 'Versión semántica sin +metadatos. En OpenAPI y AsyncAPI, por defecto info.version; si se manda, debe ser info.version o info.version-<prerelease>. En proto es obligatoria y su MAJOR debe ser la del paquete (v1 → 1). release publica X.Y.Z; develop, X.Y.Z-dev.<sha7>; staging, X.Y.Z-rc.<sha7>.'
        spec:
          type: string
          description: 'El spec completo tal como está en el repo (JSON o YAML; proto en texto), hasta 5 MB. Su SHA-256 decide la idempotencia.'
        changelog:
          type:
            - 'null'
            - string
          description: 'Salida JSON de «oasdiff changelog» contra la versión de pdn (texto con un arreglo), hasta 1 MB; vacío si no hay base.'
        prerelease:
          type:
            - 'null'
            - string
          description: 'Prerelease que agrega el workflow según la rama (dev.<sha7>, rc.<sha7>): la versión publicada es <version o info.version>-<prerelease>, y esa parte debe ser estable. Vacío: la versión tal cual.'
        changelogBase:
          type:
            - 'null'
            - string
          description: 'Versión contra la que se calculó el changelog (la que Atlas entregó en GET /publicaciones/base), si la hubo. El Consolidado usa el changelog guardado cuando coincide con la versión que corre en pdn.'
      description: Una versión de contrato publicada desde la CI de su repo.
    SolicitudPublicacionGuia:
      required:
        - revision
      type: object
      properties:
        revision:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'La revisión a publicar: debe ser la última (409 si no).'
          format: int32
      description: Publicar la última revisión de una guía.
    SolicitudRenovacion:
      required:
        - accesoVenceEn
      type: object
      properties:
        accesoVenceEn:
          type:
            - 'null'
            - string
