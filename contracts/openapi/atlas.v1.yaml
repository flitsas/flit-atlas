components:
  schemas:
    AceptacionDocumento:
      required:
        - documento
        - version
      type: object
      properties:
        documento:
          type: string
          description: terminos o privacidad.
        version:
          type: string
          description: La versión vigente que se mostró.
      description: Versión de un documento legal que la persona acepta.
    ActividadTraspasoDto:
      required:
        - id
        - tipo
        - fecha
        - nota
        - registradaEn
      type: object
      properties:
        id:
          type: string
          description: Id de la actividad.
          format: uuid
        tipo:
          type: string
          description: despliegue o guardia.
        fecha:
          type: string
          description: Día de la actividad.
          format: date
        nota:
          type:
            - 'null'
            - string
          description: Nota.
        registradaEn:
          type: string
          description: Cuándo se registró.
          format: date-time
      description: Una actividad del traspaso acompañado.
    AlcanceVista:
      required:
        - tipo
        - id
      type: object
      properties:
        tipo:
          type: string
          description: Tipo de alcance.
        id:
          type:
            - 'null'
            - string
          description: Id del recurso; vacío si es global.
      description: 'Alcance de una asignación: global o un recurso (organizacion, aplicativo, paquete, documento, ambiente…).'
    AplicativoDelContrato:
      required:
        - id
        - slug
        - nombre
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type:
            - 'null'
            - string
          description: Slug del aplicativo; vacío si ya no está en el catálogo.
        nombre:
          type:
            - 'null'
            - string
          description: Nombre del aplicativo; vacío si ya no está en el catálogo.
      description: Aplicativo del catálogo al que pertenece el contrato.
    AplicativoRefDto:
      required:
        - id
        - slug
        - nombre
        - tipo
      type: object
      properties:
        id:
          type: string
          description: Id del aplicativo en el catálogo.
