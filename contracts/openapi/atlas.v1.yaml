    ErrorCatalogo:
      required:
        - codigo
        - mensaje
      type: object
      properties:
        codigo:
          type: string
          description: 'slug_en_uso, tiene_hijos, fuente_repetida o requiere_permiso (falta el permiso sobre este aplicativo).'
        mensaje:
          type: string
      description: Error del catálogo con un código estable.
    ErrorClienteRegistrado:
      required:
        - referencia
      type: object
      properties:
        referencia:
          type: string
      description: 'Reporte recibido: la referencia con la que quedó en el log.'
    ErrorDiff:
      required:
        - codigo
        - mensaje
      type: object
      properties:
        codigo:
          type: string
          description: 'diff_no_soportado, spec_invalida, diff_rechazado (422); render_no_disponible (503).'
        mensaje:
          type: string
      description: 'Por qué no se pudo calcular el diff, con un código estable.'
    ErrorEquipo:
      required:
        - codigo
        - mensaje
      type: object
      properties:
        codigo:
          type: string
          description: 'Código: no_encontrado, version_no_valida, hay_pendientes, vista_previa_cambio, sin_reparto, checklist_incompleto, no_es_secundario, ya_habilitado, version_repetida.'
        mensaje:
          type: string
          description: 'Qué pasó, en español.'
      description: Error del módulo de equipo con un código estable.
    ErrorExternos:
      required:
        - error
        - mensaje
      type: object
      properties:
        error:
          type: string
          description: Código estable del error.
        mensaje:
          type: string
      description: Error de una operación de invitaciones o de cuentas externas.
    ErrorGuia:
      required:
        - codigo
        - mensaje
      type: object
      properties:
        codigo:
          type: string
          description: 'no_encontrado (404); sin_permiso, aprobacion_requerida (403); revision_desactualizada, sin_cambios, ya_publicada (409).'
        mensaje:
          type: string
      description: 'Por qué no se hizo, con un código estable.'
    ErrorPublicacion:
      required:
        - codigo
        - mensaje
        - errores
      type: object
      properties:
        codigo:
          type: string
          description: 'fuente_no_autorizada, aplicativo_no_autorizado, tipo_no_autorizado, ambiente_no_permitido (403); sin_base, contrato_inexistente, version_inexistente, ambiente_inexistente (404); spec_invalida, version_invalida, version_distinta_del_spec, version_no_permitida_en_rama, version_no_estable (422); version_existente, tipo_distinto (409).'
        mensaje:
          type: string
        errores:
          type:
            - 'null'
            - array
          items:
            type: string
          description: 'Detalle de la validación del spec (422), si lo hay.'
      description: 'Por qué no se publicó, con un código estable.'
    ErrorRoles:
      required:
        - error
        - mensaje
      type: object
      properties:
        error:
          type: string
          description: Código estable del error.
        mensaje:
          type: string
      description: Error de una operación de administración de roles.
    ErrorSincronizacion:
      required:
        - error
        - mensaje
      type: object
      properties:
        error:
          type: string
          description: sincronizacion_no_disponible o sincronizacion_en_curso.
        mensaje:
          type: string
      description: Error de la sincronización.
    ErrorSoporte:
      required:
        - error
        - mensaje
      type: object
      properties:
        error:
          type: string
          description: Código estable del error.
        mensaje:
          type: string
          description: 'Mensaje para la persona, en español.'
      description: Error de una operación de soporte.
    EstadoCalendarioM365Dto:
      required:
        - activo
        - motivo
        - nombreCalendario
        - pendientes
        - conErrores
        - ultimaSincronizacion
      type: object
      properties:
        activo:
          type: boolean
          description: Si los turnos se sincronizan con el calendario compartido.
        motivo:
          type:
            - 'null'
            - string
          description: Por qué está apagado; vacío si está activo.
        nombreCalendario:
          type: string
          description: Nombre del calendario.
        pendientes:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Turnos con cambios que aún no llegan a Outlook.
          format: int32
        conErrores:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'De esos, los que fallaron al menos una vez (se reintentan solos).'
          format: int32
        ultimaSincronizacion:
          type:
            - 'null'
            - string
          description: Última vez que un evento quedó sincronizado.
          format: date-time
      description: Estado del calendario compartido «Soporte TI sábados».
    EstadoM365Dto:
      required:
        - calendario
        - teams
      type: object
      properties:
        calendario:
          description: Calendario compartido de Outlook.
          $ref: '#/components/schemas/EstadoCalendarioM365Dto'
        teams:
          description: Avisos en el canal de Teams.
          $ref: '#/components/schemas/EstadoTeamsM365Dto'
      description: Estado de la integración del soporte con Microsoft 365 en este ambiente.
    EstadoRecordatoriosDto:
      required:
        - programados
        - hora
        - diasAnticipacion
        - canales
        - enCurso
        - corridas
      type: object
      properties:
        programados:
          type: boolean
          description: Si la corrida diaria está encendida en este ambiente (Soporte__Recordatorios__Habilitados).
        hora:
          type: string
          description: 'Hora (HH:mm, Bogotá) de la corrida diaria.'
        diasAnticipacion:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          description: 'Días de anticipación del recordatorio a la persona; vacío, solo el del mismo sábado.'
          format: int32
        canales:
          description: Canales que tiene el ambiente.
          $ref: '#/components/schemas/CanalesRecordatorioDto'
        enCurso:
          type: boolean
          description: Si esta réplica tiene una corrida pedida o en curso.
        corridas:
          type: array
          items:
            $ref: '#/components/schemas/CorridaRecordatoriosDto'
          description: 'Las últimas corridas, de la más reciente a la más vieja.'
      description: Estado de los recordatorios de turno (HU 2.11).
    EstadoSincronizacion:
      required:
        - id
        - disparo
        - origen
        - resultado
        - inicio
        - fin
        - creadas
        - actualizadas
        - deshabilitadas
        - reactivadas
        - sinCambios
        - omitidas
        - retenidas
        - error
      type: object
      properties:
        id:
          type: string
          description: Id de la corrida (recurso_id del evento de auditoría).
          format: uuid
        disparo:
          type: string
          description: programada o manual.
        origen:
          type: string
          description: 'enlazadas, grupo o tenant.'
        resultado:
          type: string
          description: 'exitosa, fallida o en_curso.'
        inicio:
          type: string
          format: date-time
        fin:
          type:
            - 'null'
            - string
          format: date-time
        creadas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Personas nuevas en Atlas.
          format: int32
        actualizadas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'Personas con algún dato cambiado (nombre, cargo, área, teléfono o foto).'
          format: int32
        deshabilitadas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Personas que quedaron inactivas porque su cuenta está deshabilitada o ya no existe en Entra; sus sesiones se cerraron.
          format: int32
        reactivadas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Personas que volvieron a activa porque su cuenta se rehabilitó en Entra.
          format: int32
        sinCambios:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Personas leídas sin cambios.
          format: int32
        omitidas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: 'Usuarios de Entra que no se trajeron: invitados, sin correo, deshabilitados que Atlas no conocía o con un correo que ya es de otra persona.'
          format: int32
        retenidas:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Deshabilitaciones que el freno de seguridad retuvo (más de la fracción configurada en una sola corrida); no se aplicó ninguna.
          format: int32
        error:
          type:
            - 'null'
            - string
          description: 'Tipo de la excepción si la corrida falló (sin el mensaje, que podría traer datos).'
      description: 'Resultado de la última corrida de la sincronización de personas con Microsoft Graph. Solo conteos, sin datos personales.'
    EstadoTeamsM365Dto:
      required:
        - activo
        - motivo
        - pendientes
      type: object
      properties:
        activo:
          type: boolean
          description: Si los avisos salen al canal.
        motivo:
          type:
            - 'null'
            - string
          description: Por qué está apagado; vacío si está activo.
        pendientes:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Avisos en cola.
          format: int32
      description: Estado de los avisos en el canal de Teams del soporte.
    EsteSabadoDto:
      required:
        - fecha
        - festivo
        - equipos
      type: object
      properties:
        fecha:
          type: string
          description: El sábado (aaaa-mm-dd).
          format: date
        festivo:
          type:
            - 'null'
            - string
          description: Nombre del festivo si el sábado lo es.
        equipos:
          type: array
          items:
            $ref: '#/components/schemas/EquipoEsteSabadoDto'
          description: Cada equipo activo con sus turnos de ese sábado.
      description: 'Soporte del próximo sábado (hoy, si es sábado), por equipo: lo que muestra el widget de Inicio.'
    EventoSolicitudDto:
      required:
        - accion
        - persona
        - nota
        - ocurridoEn
        - hechaEn
      type: object
      properties:
        accion:
          type: string
          description: 'solicitada, aceptada, rechazada_por_reemplazo, aprobada, rechazada o cancelada.'
        persona:
          description: Quién lo hizo.
          $ref: '#/components/schemas/PersonaResumenDto'
        nota:
          type:
            - 'null'
            - string
          description: Nota de quien lo hizo.
        ocurridoEn:
          type: string
          description: Cuándo llegó al servidor.
          format: date-time
        hechaEn:
          type:
            - 'null'
            - string
          description: 'Cuándo lo hizo la persona en su dispositivo, si lo hizo sin conexión.'
          format: date-time
      description: Paso del historial de una solicitud de cambio.
    FeedIcsCreadoDto:
      required:
        - id
        - tipo
        - equipo
        - url
        - urlWebcal
        - creadoEn
      type: object
      properties:
        id:
          type: string
