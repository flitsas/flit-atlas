                  title:
                    maxLength: 200
                    type: string
                  codigo:
                    maxLength: 50
                    type: string
                  reintentarEnSegundos:
                    type: integer
                    format: int32
                description: Problem Details (RFC 9457) con el código que interpreta la PWA.
      security:
        - csrfAtlas: [ ]
  /api/v1/identidad/invitaciones/totp/clave:
    post:
      tags:
        - Identidad
      summary: Clave TOTP para la cuenta con contraseña
      description: Clave nueva y su QR (SVG) para la aplicación de autenticación. Se confirma con el primer código al aceptar. No requiere sesión.
      operationId: ClaveTotpInvitacion
      requestBody:
        description: Token del enlace de la invitación.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudToken'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaveTotp'
        '410':
          description: Gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorExternos'
        '403':
          description: Falta la cabecera X-Atlas-Csrf o el Origin no es el mismo host.
        '429':
          description: Demasiadas peticiones desde esta IP o este usuario (problem+json con codigo «limite_de_tasa»).
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                minimum: 1
                type: integer
                format: int32
          content:
            application/problem+json:
              schema:
                type: object
