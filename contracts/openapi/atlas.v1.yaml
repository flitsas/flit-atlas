          type:
            - 'null'
            - integer
            - string
          description: Versión que dice el documento.
          format: int32
        fecha:
          type:
            - 'null'
            - string
          description: Fecha del documento.
          format: date
        definidoPor:
          type:
            - 'null'
            - string
          description: 'Quién definió el reparto, según el documento.'
        descripcionVersion:
          type:
            - 'null'
            - string
          description: 'Descripción de la versión, según el documento.'
        dedicacionSecundario:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          description: Dedicación del secundario que dice el §1.
          format: int32
        proximaRevision:
          type:
            - 'null'
            - string
          description: Próxima revisión que dice el documento.
          format: date
        definiciones:
          type: array
          items:
            $ref: '#/components/schemas/DefinicionRolDto'
          description: Definiciones de cada rol (§1).
        filas:
          type: array
          items:
            $ref: '#/components/schemas/FilaVistaPreviaDto'
          description: Responsabilidades enlazadas que quedarían.
        pendientes:
          type: array
          items:
            $ref: '#/components/schemas/PendienteDto'
          description: 'Lo que no se pudo enlazar: hay que resolverlo antes de confirmar.'
        inconsistencias:
          type: array
          items:
            type: string
          description: Diferencias entre la tabla 2 y las tablas 3.1 y 3.2.
        avisos:
          type: array
          items:
            type: string
          description: Avisos que no impiden confirmar.
        errores:
          type: array
          items:
            type: string
          description: Errores de lectura del documento.
        versionActual:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          description: Versión vigente en Atlas; vacía si aún no hay reparto.
          format: int32
        puedeConfirmar:
          type: boolean
          description: Si se puede confirmar tal cual.
        huella:
          type: string
          description: Huella para confirmar exactamente esto.
      description: Vista previa de la importación del documento de responsables. Nada se guarda hasta confirmar.
    VistaPreviaImportacionDto:
      required:
        - equipo
        - hoja
        - huella
        - resumen
        - filas
        - personasNuevas
        - nombresAmbiguos
        - participantesNuevos
        - avisos
      type: object
      properties:
        equipo:
          description: Equipo destino.
          $ref: '#/components/schemas/EquipoResumenDto'
        hoja:
          type: string
          description: Hoja leída.
        huella:
          type: string
          description: Huella para confirmar exactamente esta vista previa.
        resumen:
          description: Conteos.
          $ref: '#/components/schemas/ResumenImportacionDto'
        filas:
          type: array
          items:
            $ref: '#/components/schemas/FilaImportacionDto'
          description: Cada fila con sus interpretaciones y casos ambiguos (el informe).
        personasNuevas:
          type: array
          items:
            $ref: '#/components/schemas/PersonaNuevaDto'
          description: Personas que no existen en Atlas.
        nombresAmbiguos:
          type: array
          items:
            $ref: '#/components/schemas/NombreAmbiguoDto'
          description: Nombres que encajan con varias personas.
        participantesNuevos:
          type: array
          items:
            $ref: '#/components/schemas/ParticipanteNuevoDto'
          description: Personas que entran a la rotación del equipo.
        avisos:
          type: array
          items:
            type: string
          description: Avisos para quien importa.
      description: 'Vista previa de la importación: nada se guarda hasta confirmar con la misma huella.'
    VistaSincronizacion:
      required:
        - disponible
        - programada
        - origen
        - hora
        - proxima
        - enCurso
        - ultima
      type: object
      properties:
        disponible:
          type: boolean
          description: Hay Entra ID configurado en este ambiente; sin él no se puede sincronizar.
        programada:
          type: boolean
          description: El trabajo diario está habilitado (Identidad:Personas:Habilitada).
        origen:
          type: string
          description: 'enlazadas, grupo o tenant (Identidad:Personas:Origen).'
        hora:
          type: string
          description: 'Hora del día de la corrida, en la de Bogotá (HH:mm).'
        proxima:
          type:
            - 'null'
            - string
          description: Próxima corrida programada; vacía si no hay.
          format: date-time
        enCurso:
          type: boolean
          description: Hay una corrida en curso o pedida en esta réplica.
        ultima:
          oneOf:
            - type: 'null'
            - description: Última corrida (en cualquier réplica); vacía si nunca corrió.
              $ref: '#/components/schemas/EstadoSincronizacion'
      description: Estado de la sincronización diaria de personas con Graph.
    Yo:
      required:
        - sub
        - personaId
        - nombre
        - tipoPrincipal
        - organizacionId
        - proveedor
        - roles
        - permisos
        - emergencia
        - foto
      type: object
      properties:
        sub:
          type: string
          format: uuid
        personaId:
          type: string
          format: uuid
        nombre:
          type: string
        tipoPrincipal:
          type: string
        organizacionId:
          type: string
          format: uuid
        proveedor:
          type: string
        roles:
          type: array
          items:
            type: string
          description: 'Códigos de los roles vigentes en este momento, ordenados; incluye atlas.lector de todo empleado.'
        permisos:
          type: array
          items:
            type: string
          description: 'Permisos efectivos (atlas.<modulo>.<accion>) en este momento, ordenados: la PWA filtra la navegación con ellos. Se recalculan en cada petición.'
        emergencia:
          type: boolean
          description: 'true si la sesión es de la cuenta de administrador de emergencia (ATLAS-ADR-0027): la PWA muestra el aviso.'
        foto:
          type:
            - 'null'
            - string
          description: 'URL relativa de la foto de la persona (sincronizada con Graph, ATLAS-ADR-0030), versionada por su hash; vacía si no tiene.'
      description: 'Usuario de la sesión actual: persona, organización, proveedor con el que entró, roles vigentes y permisos efectivos.'
  securitySchemes:
    sesionAtlas:
      type: apiKey
      description: 'Cookie de sesión del BFF. La emite el ingreso y solo lleva el id cifrado de la sesión, que vive en el servidor.'
      name: __Host-atlas
      in: cookie
    csrfAtlas:
      type: apiKey
      description: 'Antifalsificación: obligatoria (cualquier valor) en POST, PUT, PATCH y DELETE bajo /api/. Sin ella, o con otro Origin, la respuesta es 403.'
      name: X-Atlas-Csrf
      in: header
    tokenAtlas:
      type: oauth2
      description: 'Token de acceso de Atlas (OpenIddict, ATLAS-ADR-0024) en «Authorization: Bearer». Vida de 15 minutos, audiencia atlas-api. Código con PKCE para atlas-cli y MCP; client_credentials para servicios internos. JWT firmado (RS256) y cifrado según RFC8725 (buenas prácticas de JWT). La cookie de la PWA no sirve en estas operaciones.'
      flows:
        clientCredentials:
          tokenUrl: /connect/token
          scopes:
            atlas.mcp: Usar el servidor MCP de Atlas con los permisos de la persona.
            atlas.publicar: 'Publicar contratos, documentación y modelos en Atlas.'
            atlas.widget: Usar el asistente de Atlas embebido en otra aplicación de FLIT.
        authorizationCode:
          authorizationUrl: /connect/authorize
          tokenUrl: /connect/token
          refreshUrl: /connect/token
          scopes:
            atlas.mcp: Usar el servidor MCP de Atlas con los permisos de la persona.
            atlas.publicar: 'Publicar contratos, documentación y modelos en Atlas.'
            atlas.widget: Usar el asistente de Atlas embebido en otra aplicación de FLIT.
    githubActions:
      type: openIdConnect
      description: 'Token OIDC de GitHub Actions (ATLAS-ADR-0009 y ATLAS-ADR-0035) en «Authorization: Bearer», pedido por el workflow reutilizable oficial con la audiencia del ambiente (la URL pública de Atlas). Atlas valida la firma (RS256, JWKS de GitHub), el emisor, la audiencia y la vigencia, y luego el dueño, el evento, la rama, el workflow y la lista blanca del catálogo. Sin secretos en los repos. La cookie de la PWA no sirve en estas operaciones.'
      openIdConnectUrl: https://token.actions.githubusercontent.com/.well-known/openid-configuration
tags:
  - name: Identidad
    description: 'Ingreso de empleados con Microsoft, proveedores habilitados, cierre de sesión, dispositivos conectados, suspensión y reautenticación (ATLAS-ADR-0004 y ATLAS-ADR-0022), tokens para clientes que no son el navegador (ATLAS-ADR-0024), y las cuentas locales de externos: aceptar invitación, passkey, contraseña con TOTP y recuperación (ATLAS-ADR-0025).'
  - name: Plataforma
    description: Datos del usuario en sesión (con sus roles y permisos efectivos) y de la propia API.
  - name: Organizaciones
    description: 'FLIT, clientes y proveedores: crear, editar, suspender y eliminar, y habilitar el administrador de la organización (HU 1.5, ATLAS-ADR-0025).'
  - name: Invitaciones
    description: 'Invitaciones de externos con rol, alcance, vencimiento y permisos extra: crear, reenviar, suspender, renovar y revocar (HU 1.5, ATLAS-ADR-0025).'
  - name: Directorio
    description: 'Directorio interno de empleados sincronizado a diario con Microsoft Graph: nombre, cargo, área, foto y estado; el teléfono solo con atlas.equipo.ver_contacto (ATLAS-ADR-0030).'
  - name: Permisos
    description: 'Roles internos y externos, asignaciones con alcance y vigencia, mapeo de grupos de Entra y la matriz rol × permiso generada desde el código (ATLAS-ADR-0023).'
  - name: Catálogo
    description: 'Catálogo de aplicativos de FLIT: productos, módulos y servicios con su repo, tecnología, ambientes, criticidad, datos personales, estado y etiquetas, y la ficha de cada uno.'
  - name: Contratos
    description: 'Contratos de integración (OpenAPI, AsyncAPI y proto) publicados desde la CI de cada repo con el token OIDC de GitHub Actions y la lista blanca del catálogo: versiones semánticas inmutables con su hash y su procedencia, el spec de cada versión y el índice de operaciones, webhooks, canales y rpc.'
  - name: Equipo
    description: 'Responsables principal y secundario de cada producto y módulo: reparto importado del documento, vistas por persona y por aplicativo, mapa de carga, historial versionado, traspasos, revisión trimestral, CODEOWNERS y «¿A quién llamo?».'
  - name: Hola
    description: 'Módulo de ejemplo de docs/como-crear-un-modulo.md: saludos por organización con permisos, predicado obligatorio y RLS. Apagado por defecto (bandera modulo.hola).'
  - name: Soporte
    description: 'Soporte de los sábados por equipos de cada área: configuración, equipos, participantes, turnos con estados y horario, ausencias, festivos de Colombia, generación automática con vista previa, indicadores, importador del Excel con revisión, cambios de turno y compensaciones, y Microsoft 365: calendario compartido de Outlook, avisos en el canal de Teams y feeds .ics.'
