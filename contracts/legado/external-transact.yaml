openapi: 3.1.0
info:
  title: API externa ICT · Trámites (BackApiExternalTransact)
  version: 3.0.0
  description: |-
    Registro, pausa y anulación de trámites de gestores externos y consulta de secretarías de tránsito.

    Fuente: swagger de tsoa del repo y hojas «2 - Transacction», «9 - Secretaries», «10 - PauseDraftProcess», «11 - AbortProcess» del Excel de contratos ICT.

    Archivo generado con `python -m atlas_docs.legado` (ATLAS-ADR-0037); no se edita a mano. Las operaciones con `x-public` son las que se pueden compartir con clientes; las `x-internal` las quita la poda de Atlas.
  contact:
    name: FLIT S.A.S.
  x-flit-visibilidad: compartible
  x-flit-fuente:
    repo: flitsas/BackApiExternalTransact
    swagger: swagger.json
    excel: Contratos_Integraciones_31Jul2025.xlsx
    hojas:
    - 2 - Transacction
    - 9 - Secretaries
    - 10 - PauseDraftProcess
    - 11 - AbortProcess
  x-flit-changelog:
  - version: 1.0.0
    fecha: '2025-05-16'
    hoja: 9 - Secretaries
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 1 de la hoja «9 - Secretaries» del Excel de contratos ICT.
  - version: 1.0.0
    fecha: '2025-07-31'
    hoja: 10 - PauseDraftProcess
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 1 de la hoja «10 - PauseDraftProcess» del Excel de contratos ICT.
  - version: 1.0.0
    fecha: '2025-07-31'
    hoja: 11 - AbortProcess
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 1 de la hoja «11 - AbortProcess» del Excel de contratos ICT.
  - version: 3.0.0
    fecha: '2025-10-06'
    hoja: 2 - Transacction
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 3 de la hoja «2 - Transacction» del Excel de contratos ICT.
  x-flit-ambientes:
    dev: por confirmar
    qa: ict.qa.flitsas.online
    pdn: por confirmar
servers:
- url: https://{host}
  description: QA. Host tomado del Excel [por verificar]; el Excel no trae URL de dev ni de pdn.
  variables:
    host:
      default: ict.qa.flitsas.online
      description: Host de la API ICT en el ambiente.
  x-flit-ambiente: qa
