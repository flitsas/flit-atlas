paths:
  /api/v1/transactions/reprocess/{id}:
    post:
      operationId: ReprocessTransactionById
      summary: Reprocesa una transacción en estado 4
      description: |-
        Reprocesa una transacción en estado 4 (Con Novedades).
        Valida permisos, estado y reglas de negocio antes de cambiar el estado a 1
        y disparar el pipeline de validaciones original.
        Los datos del usuario (manager_user, manager_mail, company_manager_document)
        se obtienen de la tabla maestra.
      tags:
      - Transaction Reprocess
      security:
      - bearer: []
      parameters:
      - description: '- ID de la transacción a reprocesar'
        in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/Identity'
        example: texto
      responses:
        '200':
          description: OK - Reproceso aplicado inmediatamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReprocessResponseDto'
              example:
                id: 1
                estadoAnterior: 1
                estadoNuevo: 1
                logId: texto
                message: texto
        '403':
          description: FORBIDDEN - Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
              example:
                errors:
                - texto
        '404':
          description: NOT FOUND - Transacción no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                message: texto
        '409':
          description: CONFLICT - Estado no reprocesable / trámite ya generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
              example:
                errors:
                - texto
        '500':
          description: INTERNAL SERVER ERROR - Error inesperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
              example:
                errors:
                - texto
      x-internal: true
