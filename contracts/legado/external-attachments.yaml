info:
  title: API externa ICT · Archivos (interna) (BackApiExternalAttachments)
  version: 1.0.0
  description: |-
    Almacenamiento de archivos y URL prefirmadas que usan los demás servicios de la API ICT. Uso interno.

    Fuente: swagger de tsoa del repo (el Excel de contratos ICT no documenta este servicio).

    Archivo generado con `python -m atlas_docs.legado` (ATLAS-ADR-0037); no se edita a mano. Las operaciones con `x-public` son las que se pueden compartir con clientes; las `x-internal` las quita la poda de Atlas.
  contact:
    name: FLIT S.A.S.
  x-flit-visibilidad: interna
  x-flit-fuente:
    repo: flitsas/BackApiExternalAttachments
    swagger: swagger.json
    excel: null
    hojas: []
  x-flit-changelog: []
  x-flit-ambientes:
    dev: por confirmar
    qa: por confirmar
    pdn: por confirmar
