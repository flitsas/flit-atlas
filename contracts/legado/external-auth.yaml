openapi: 3.1.0
info:
  title: API externa ICT · Autenticación (BackApiExternalAuth)
  version: 1.5.0
  description: |-
    Autenticación de los gestores externos: entrega el token que piden las demás operaciones de la API ICT.

    Fuente: swagger de tsoa del repo y hojas «1 - Auth» del Excel de contratos ICT.

    Archivo generado con `python -m atlas_docs.legado` (ATLAS-ADR-0037); no se edita a mano. Las operaciones con `x-public` son las que se pueden compartir con clientes; las `x-internal` las quita la poda de Atlas.
  contact:
    name: FLIT S.A.S.
  x-flit-visibilidad: compartible
  x-flit-fuente:
    repo: flitsas/BackApiExternalAuth
    swagger: swagger.json
    excel: Contratos_Integraciones_31Jul2025.xlsx
    hojas:
    - 1 - Auth
  x-flit-changelog:
  - version: 1.5.0
    fecha: '2025-05-16'
    hoja: 1 - Auth
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 1.5 de la hoja «1 - Auth» del Excel de contratos ICT.
  x-flit-ambientes:
    dev: por confirmar
    qa: ict.qa.flitsas.online
    pdn: por confirmar
servers:
- url: https://{host}
  description: QA. Host tomado del Excel [por verificar]; el Excel no trae URL de dev ni de pdn.
  variables:
    host:
      default: ict.qa.flitsas.online
      description: Host de la API ICT en el ambiente.
  x-flit-ambiente: qa
tags:
- name: Health
  description: Este controlador implementa el estado de salud del servicio
- name: Company Parameters
  description: Este controlador administra toda la gestión relacionada con los clientes de FLIT
- name: Controlador para la autenticación de usuarios en la integración de terceros
  description: Controlador para la autenticación de usuarios en la integración de terceros
paths:
  /api/v1/health:
    get:
      operationId: HealthCheck
      summary: Verifica el estado de salud del servicio.
      description: |-
        Verifica el estado de salud del servicio.

        Este endpoint se utiliza para comprobar si el servicio está funcionando correctamente.
      tags:
      - Health
      security: []
      parameters: []
      responses:
        '200':
          description: Respuesta exitosa.
      x-internal: true
  /api/v1/ping:
    get:
      operationId: Ping
      summary: Realiza una prueba de ping en el servicio.
      description: |-
        Realiza una prueba de ping en el servicio.

        Utiliza este endpoint para realizar una prueba de ping en el servicio y verificar su disponibilidad.
      tags:
