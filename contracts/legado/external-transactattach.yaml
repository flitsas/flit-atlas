          description: Marca que indica que es el ultimo documento adjunto
          examples:
          - false
        file:
          type: string
          contentMediaType: application/pdf
          description: archivo pdf para el upload
          examples:
          - documento.pdf
      required:
      - transactionFlit
      - idAttachment
      - filename
      - file
      - closed
      description: Esquema `SolicitudCargaAdjunto` del código (tsoa).
      examples:
      - transactionFlit: 35
        filename: pruebaImpuestos12.pdf
        idAttachment: 2
        closed: false
        file: documento.pdf
    RespuestaCargaAdjunto:
      type: object
      properties:
        Status:
          type: number
          description: Estado de proceso de registro de documento(1-Registrado, 2-No Registrado)
          examples:
          - 1
        Message:
          type: string
          maxLength: 250
          description: Mensaje asociado a la respuesta del estado del registro
          examples:
          - Registered Successfully
      description: Esquema `RespuestaCargaAdjunto` del código (tsoa).
      examples:
      - Status: 1
        Message: Registered Successfully
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT que entrega `POST /api/v1/auth/login` de `external-auth`; viaja en la cabecera `Authorization:
        Bearer $TOKEN`. [por verificar] cumplimiento de RFC8725 en el emisor.'
