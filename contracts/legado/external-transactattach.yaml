openapi: 3.1.0
info:
  title: API externa ICT · Adjuntos de trámites (BackApiExternalTransactAttach)
  version: 1.8.0
  description: |-
    Carga de los documentos adjuntos de un trámite según la guía de documentos por tipo de trámite.

    Fuente: swagger de tsoa del repo y hojas «3 - Attachments» del Excel de contratos ICT.

    Archivo generado con `python -m atlas_docs.legado` (ATLAS-ADR-0037); no se edita a mano. Las operaciones con `x-public` son las que se pueden compartir con clientes; las `x-internal` las quita la poda de Atlas.
  contact:
    name: FLIT S.A.S.
  x-flit-visibilidad: compartible
  x-flit-fuente:
    repo: flitsas/BackApiExternalTransactAttach
    swagger: swagger.json
    excel: Contratos_Integraciones_31Jul2025.xlsx
    hojas:
    - 3 - Attachments
  x-flit-changelog:
  - version: 1.8.0
    fecha: '2025-05-16'
    hoja: 3 - Attachments
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 1.8 de la hoja «3 - Attachments» del Excel de contratos ICT.
  x-flit-ambientes:
    dev: por confirmar
    qa: ict.qa.flitsas.online
    pdn: por confirmar
servers:
- url: https://{host}
  description: QA. Host tomado del Excel [por verificar]; el Excel no trae URL de dev ni de pdn.
  variables:
    host:
      default: ict.qa.flitsas.online
      description: Host de la API ICT en el ambiente.
  x-flit-ambiente: qa
