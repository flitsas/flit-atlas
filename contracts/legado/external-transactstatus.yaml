openapi: 3.1.0
info:
  title: API externa ICT · Estado de trámites (BackApiExternalTransactStatus)
  version: 1.7.0
  description: |-
    Consulta del estado de validación y del historial de estados de un trámite.

    Fuente: swagger de tsoa del repo y hojas «5 - StatusTransaction» del Excel de contratos ICT.

    Archivo generado con `python -m atlas_docs.legado` (ATLAS-ADR-0037); no se edita a mano. Las operaciones con `x-public` son las que se pueden compartir con clientes; las `x-internal` las quita la poda de Atlas.
  contact:
    name: FLIT S.A.S.
  x-flit-visibilidad: compartible
  x-flit-fuente:
    repo: flitsas/BackApiExternalTransactStatus
    swagger: swagger.json
    excel: Contratos_Integraciones_31Jul2025.xlsx
    hojas:
    - 5 - StatusTransaction
  x-flit-changelog:
  - version: 1.7.0
    fecha: '2025-05-16'
    hoja: 5 - StatusTransaction
    colaborador: Equipo de integraciones de FLIT
    cambio: Versión 1.7 de la hoja «5 - StatusTransaction» del Excel de contratos ICT.
  x-flit-ambientes:
    dev: por confirmar
    qa: ict.qa.flitsas.online
    pdn: por confirmar
servers:
- url: https://{host}
  description: QA. Host tomado del Excel [por verificar]; el Excel no trae URL de dev ni de pdn.
  variables:
    host:
      default: ict.qa.flitsas.online
      description: Host de la API ICT en el ambiente.
  x-flit-ambiente: qa
tags:
- name: Controlador para obtener el estado de un proceso en la integración de terceros
  description: Controlador para obtener el estado de un proceso en la integración de terceros
- name: Health
  description: Este controlador implementa el estado de salud del servicio
paths:
  /api/v1/status-process/{id}:
    get:
      operationId: GetStatusProcessService
      description: Operación `GetStatusProcessService` de `BackApiExternalTransactStatus` (sin descripción en el código).
      tags:
      - Controlador para obtener el estado de un proceso en la integración de terceros
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          examples:
          - texto
        description: Parámetro `id` (path).
        example: texto
      responses:
        '200':
          description: Respuesta exitosa.
          content:
            application/json:
              schema: {}
              example: {}
        '400':
          description: Solicitud incorrecta. El servidor no puede o no procesará la solicitud debido a algo que se percibe
            como un error del cliente (por ejemplo, sintaxis de solicitud mal formada, enrutamiento de solicitud no válido
            o enrutamiento de consulta engañoso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
              example:
                errors:
                - texto
        '404':
          description: No encontrado. El servidor no pudo encontrar el recurso solicitado. Este código se envía con mayor
            frecuencia cuando el servidor web no encuentra una página web u otro recurso solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                message: texto
      x-internal: true
  /api/v1/status-process/transaction/{id}:
    get:
      operationId: GetStatusByid
      summary: Servicio de consulta de estado de un tramite o transaccion
      description: |-
        Servicio de consulta de estado de un tramite o transaccion.

        Operación `GetStatusByid` de `BackApiExternalTransactStatus` (sin descripción en el código).
      tags:
      - Controlador para obtener el estado de un proceso en la integración de terceros
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          examples:
          - texto
        description: Id del tramite asociado entregado en la creacion
        example: '123'
      responses:
        '200':
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoTramite'
              example:
                StatusValidation: 1
                MessageValidation: ' '
                StatusProccess:
                - Status: 1
                  Statusdescription: Borrador
                  observation: Actualización de datos personales
                  usermailregistered: usuario@ejemplo.com
                  userroleregistered: Documentador
                  usernameregistered: Nombre Demo
                  dateregistered: '2024-03-12T20:45:43.170Z'
                  companyregistered: Organismo Demo
                - Status: 2
                  Statusdescription: Borrador
                  observation: Actualización de datos personales
                  usermailregistered: usuario@ejemplo.com
                  userroleregistered: Documentador
                  usernameregistered: Nombre Demo
                  dateregistered: '2024-03-12T20:45:43.170Z'
                  companyregistered: Organismo Demo
        '400':
          description: Solicitud incorrecta. El servidor no puede o no procesará la solicitud debido a algo que se percibe
            como un error del cliente (por ejemplo, sintaxis de solicitud mal formada, enrutamiento de solicitud no válido
            o enrutamiento de consulta engañoso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
              example:
                errors:
                - texto
        '404':
          description: No encontrado. El servidor no pudo encontrar el recurso solicitado. Este código se envía con mayor
            frecuencia cuando el servidor web no encuentra una página web u otro recurso solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                message: texto
        '401':
          description: No autorizado. Se requiere autenticación para acceder al recurso solicitado. El cliente debe autenticarse
            para obtener acceso. A diferencia de 403 Forbidden, este código indica que la autenticación es posible, pero ha
            fallado o aún no se ha proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                message: texto
        '500':
          description: Error interno del servidor. El servidor encontró una condición inesperada que le impidió cumplir con
            la solicitud. Es un error genérico que indica que algo salió mal en el servidor, pero el servidor no puede ser
            más específico sobre el problema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                message: texto
      x-flit-hoja-excel: 5 - StatusTransaction
      x-public: true
  /api/v1/health:
    get:
      operationId: HealthCheck
      summary: Verifica el estado de salud del servicio.
      description: |-
        Verifica el estado de salud del servicio.

        Este endpoint se utiliza para comprobar si el servicio está funcionando correctamente.
      tags:
