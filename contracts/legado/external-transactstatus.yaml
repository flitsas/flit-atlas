      security: []
      parameters: []
      responses:
        '200':
          description: Respuesta exitosa.
      x-internal: true
  /api/v1/ping:
    get:
      operationId: Ping
      summary: Realiza una prueba de ping en el servicio.
      description: |-
        Realiza una prueba de ping en el servicio.

        Utiliza este endpoint para realizar una prueba de ping en el servicio y verificar su disponibilidad.
      tags:
      - Health
      security: []
      parameters: []
      responses:
        '200':
          description: Respuesta exitosa.
      x-internal: true
components:
  schemas:
    DefaultErrorResponse:
      properties:
        errors:
          items: {}
          type: array
          examples:
          - - texto
      required:
      - errors
      type: object
      additionalProperties: false
      description: Esquema `DefaultErrorResponse` del código (tsoa).
      examples:
      - errors:
        - texto
    DefaultResponse:
      properties:
        message:
          type: string
          examples:
          - texto
      required:
      - message
      type: object
      additionalProperties: false
      description: Esquema `DefaultResponse` del código (tsoa).
      examples:
      - message: texto
    EstadoTramite:
      type: object
      properties:
        StatusValidation:
          type: integer
          description: Estado de proceso de registro de documento(1-Registrado,  2-En Validacion, 3-Procesado, 4-Con Novedades)
          examples:
          - 1
        MessageValidation:
          type: string
          maxLength: 250
          description: Mensaje asociado a la respuesta del estado del registro
          examples:
          - ' '
        StatusProccess:
          type: array
          items:
            type: object
            properties:
              Status:
                type: integer
                description: Estado del proceso del Tramite (1-Borrador, 2-Preparado, 3-Enviado OT, 4-entregado, 5- aprobado,
                  6 rechazado)
                examples:
                - 1
              Statusdescription:
                type: string
                maxLength: 250
                description: Descripcion asociado al estado del Tramite
                examples:
                - Borrador
              observation:
                type: string
                maxLength: 250
                description: Observacion asociada al estado del Tramite
                examples:
                - Actualización de datos personales
              usermailregistered:
                type: string
                maxLength: 50
                description: Email asociado al usuario o sistema que realizo el cambio de estado del tramite
                examples:
                - usuario@ejemplo.com
              userroleregistered:
                type: string
                maxLength: 50
                description: Rol asociado al usuario o sistema que realizo el cambio de estado del tramite
                examples:
                - Documentador
              usernameregistered:
                type: string
                maxLength: 50
                description: Nombre asociado al usuario o sistema que realizo el cambio de estado del tramite
                examples:
                - Nombre Demo
              dateregistered:
                type: string
                maxLength: 25
                description: Fecha asociada al sistema que realizo el cambio de estado del tramite
                examples:
                - '2024-03-12T20:45:43.170Z'
              companyregistered:
                type: string
                maxLength: 20
                description: Compañia asociada al usuario o sistema que realizo el cambio de estado del tramite
                examples:
                - Organismo Demo
            examples:
            - Status: 1
              Statusdescription: Borrador
              observation: Actualización de datos personales
              usermailregistered: usuario@ejemplo.com
              userroleregistered: Documentador
              usernameregistered: Nombre Demo
              dateregistered: '2024-03-12T20:45:43.170Z'
              companyregistered: Organismo Demo
          examples:
          - - Status: 1
              Statusdescription: Borrador
              observation: Actualización de datos personales
              usermailregistered: usuario@ejemplo.com
              userroleregistered: Documentador
              usernameregistered: Nombre Demo
              dateregistered: '2024-03-12T20:45:43.170Z'
              companyregistered: Organismo Demo
            - Status: 2
              Statusdescription: Borrador
              observation: Actualización de datos personales
              usermailregistered: usuario@ejemplo.com
              userroleregistered: Documentador
              usernameregistered: Nombre Demo
              dateregistered: '2024-03-12T20:45:43.170Z'
              companyregistered: Organismo Demo
      description: Esquema `EstadoTramite` del código (tsoa).
      examples:
      - StatusValidation: 1
        MessageValidation: ' '
        StatusProccess:
        - Status: 1
          Statusdescription: Borrador
          observation: Actualización de datos personales
          usermailregistered: usuario@ejemplo.com
          userroleregistered: Documentador
          usernameregistered: Nombre Demo
          dateregistered: '2024-03-12T20:45:43.170Z'
          companyregistered: Organismo Demo
        - Status: 2
          Statusdescription: Borrador
          observation: Actualización de datos personales
          usermailregistered: usuario@ejemplo.com
          userroleregistered: Documentador
          usernameregistered: Nombre Demo
          dateregistered: '2024-03-12T20:45:43.170Z'
          companyregistered: Organismo Demo
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT que entrega `POST /api/v1/auth/login` de `external-auth`; viaja en la cabecera `Authorization:
        Bearer $TOKEN`. [por verificar] cumplimiento de RFC8725 en el emisor.'
