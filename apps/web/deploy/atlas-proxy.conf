# Reenvío hacia atlas-api. El esquema y el host originales vienen del nginx del host: la API arma con ellos la
# redirect_uri de Entra y compara el Origin (Atlas__Proxy__RedesConfiables debe incluir la red de pods).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $atlas_connection;
proxy_buffer_size 64k;
proxy_buffers 8 64k;
proxy_read_timeout 120s;
