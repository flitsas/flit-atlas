# Cabeceras del visor de contratos con Scalar (/visor/, ATLAS-ADR-0039 y ATLAS-ADR-0048), salvo la CSP, que va en la
# location de nginx.conf.template porque lleva la variable ATLAS_VISOR_CONEXIONES. El visor corre en un iframe con
# sandbox="allow-scripts" (origen opaco): sus módulos y su CSS se piden con CORS y `Origin: null`, por eso el
# Access-Control-Allow-Origin y el Cross-Origin-Resource-Policy cross-origin, que solo valen para estos archivos estáticos
# y públicos (sin cookies). Sin micrófono: el visor no lo usa.
add_header Reporting-Endpoints 'csp="/api/v1/plataforma/csp-reportes"' always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header Access-Control-Allow-Origin "*" always;
add_header Strict-Transport-Security $atlas_hsts always;
