# Cabeceras del visor de contratos con Scalar (/visor/, ATLAS-ADR-0039), salvo la CSP, que va en la location de
# nginx.conf.template porque lleva la variable ATLAS_VISOR_CONEXIONES. El visor corre en un iframe con
# sandbox="allow-scripts" (origen opaco): sus módulos y su CSS se piden con CORS y `Origin: null`, por eso el
# Access-Control-Allow-Origin, que solo vale para estos archivos estáticos y públicos (sin cookies).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Access-Control-Allow-Origin "*" always;
