# Cabeceras de seguridad de la PWA (prompt maestro §12, HU 4.10, ATLAS-ADR-0048). Se incluyen en cada location porque nginx
# no hereda add_header cuando la location define los suyos. La CSP no permite scripts ni estilos en línea; cada violación
# llega a atlas-api (report-uri y report-to), que la registra sin datos personales. Trusted Types va solo en modo informe
# (Content-Security-Policy-Report-Only): mide qué rompería exigirlo antes de hacerlo. HSTS sale de ATLAS_HSTS (vacío en
# local: nginx no envía una cabecera vacía). connect-src suma el origen público del S3 que firma las descargas
# (ATLAS_S3_PUBLICO, el mismo Plataforma__Almacenamiento__EndpointPublico de atlas-api): compartir un archivo exportado
# (HU 4.6) lo baja con fetch sin credenciales. El micrófono queda para el propio origen (dictado del asistente, F7).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' $atlas_s3_publico; manifest-src 'self'; worker-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; report-uri /api/v1/plataforma/csp-reportes; report-to csp" always;
add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types atlas-markdown dompurify; report-uri /api/v1/plataforma/csp-reportes; report-to csp" always;
add_header Reporting-Endpoints 'csp="/api/v1/plataforma/csp-reportes"' always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security $atlas_hsts always;
