# Configuración de pnpm de atlas-web (lo copia también el Dockerfile antes de `pnpm install`).
# vue-demi (dependencia de Scalar) no necesita su script de instalación con Vue 3.
allowBuilds:
  vue-demi: false

# Dependencias transitivas del visor de contratos (Scalar, HU 3.6, ATLAS-ADR-0039) fijadas a su última versión con al
# menos dos semanas de publicada (prompt maestro §5.2); quitarlas cuando las versiones que pide Scalar maduren.
overrides:
  '@codemirror/autocomplete': 6.20.3
  '@codemirror/view': 6.43.14
  '@lezer/common': 1.5.3
  '@scalar/icons>@types/node': 24.19.1
  '@tanstack/vue-virtual': 3.13.39
  '@vue/compiler-core': 3.5.43
  '@vue/compiler-dom': 3.5.43
  '@vue/compiler-sfc': 3.5.43
  '@vue/compiler-ssr': 3.5.43
  '@vue/reactivity': 3.5.43
  '@vue/runtime-core': 3.5.43
  '@vue/runtime-dom': 3.5.43
  '@vue/server-renderer': 3.5.43
  '@vue/shared': 3.5.43
  qs: 6.16.0
  vue: 3.5.43
  vue-component-type-helpers: 3.3.12
  zod: 4.6.5
