[project]
name = "atlas-docs"
version = "0.1.0"
description = "Flit Atlas: exportes (PDF, Word, Excel, HTML, Postman) e importadores (servicio interno)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.4,<0.143",
    "uvicorn>=0.54.0,<0.55",
    "pydantic-settings>=2.15.0,<3",
    "boto3>=1.43.109,<1.44",
    "openpyxl>=3.1.5,<3.2",
    "pyyaml>=6.0.3,<7",
    "weasyprint>=70.0,<71",
    "python-docx>=1.2.0,<1.3",
    "jinja2>=3.1.6,<3.2",
    "markdown-it-py>=4.2.0,<4.3",
    "aio-pika>=10.1.0,<10.1.1",
    "pyjwt[crypto]>=2.15.1,<2.16",
    # Une las partes del PDF (exportes/pdf.py, ATLAS-ADR-0042). 6.19.0 es del 16/09/2026.
    "pypdf>=6.19.0,<6.20",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<2.14",
    "jsonschema>=4.26.0,<4.27",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.10,<0.17",
]

[tool.uv]
# Dependencias transitivas de WeasyPrint cuya última versión tenía menos de dos semanas de publicada al fijarlas
# (24/10/2026): se topan a la estable anterior (prompt maestro §5.2). Se quitan cuando la nueva cumpla el plazo.
constraint-dependencies = [
    "pillow<13",
    "fonttools<4.67",
    "pydyf<0.13",
    "brotli<1.2.1",
    "brotlicffi<1.2.1",
    "pycparser<3.12",
    # aio-pika (cola de exportaciones, HU 4.5 ola 2): aiormq 7.2.3 y 7.2.4 y multidict 7.2.0
    # son del 24/10/2026.
    "aiormq<7.2.3",
    "multidict<7.2",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
