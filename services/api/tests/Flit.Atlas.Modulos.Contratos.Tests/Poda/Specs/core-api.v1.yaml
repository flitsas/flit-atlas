  /api/v1/admin/mandate-signers/represented-associations/retire:
    post:
      tags: [Admin · Mandatarios]
      operationId: adminMandateSignersRepresentedAssociationRetire
      summary: Retira las asociaciones por Representante Legal con aviso previo (HU #13176)
      description: >
        Elimina las filas activas de asociación por Representante Legal; los mandatarios afectados pasan a
        aplicar a toda su compañía en el organismo. Solo se ejecuta con `confirmaAvisoEnviado` verdadero
        (dato del request, no un estado guardado); si falta o es falso responde 409 `aviso_no_confirmado` y no
        modifica nada. Repetirlo responde 200 con `filasRetiradas` 0. Deja auditoría con cantidad, fecha y rol,
        sin nombres personales. Solo SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmaAvisoEnviado: { type: boolean }
      responses:
        "200":
          description: Retiro ejecutado (o sin filas que retirar).
          content:
            application/json:
              schema:
                type: object
                required: [filasRetiradas, fecha]
                properties:
                  filasRetiradas: { type: integer }
                  fecha: { type: string, format: date-time }
        "401":
          description: No autenticado.
        "403":
          description: Autenticado pero sin rol SuperAdmin.
        "409":
          description: El aviso a los clientes no fue confirmado (`aviso_no_confirmado`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: aviso_no_confirmado }
                  error: { type: string }

