        clienteId:
          type: string
          format: uuid
          description: Obligatorio si scope=CLIENTE.
        orden: { type: integer, minimum: 0, maximum: 32767 }
      required: [procedureTypeId, documentTypeId, orden]

    UpdateDocumentOrderOverrideRequest:
      type: object
      description: >
        Payload del reordenamiento por arrastre de un override (HU #10198). Solo el orden
        es mutable; la tupla del override no cambia.
      properties:
        orden: { type: integer, minimum: 0, maximum: 32767 }
      required: [orden]

    DocumentRequirementState:
      type: string
      enum: [REQUIRED, OPTIONAL, NOT_APPLICABLE]
      description: >
        Obligatoriedad de un documento para un OT: REQUIRED (obligatorio), OPTIONAL
        (opcional) o NOT_APPLICABLE (no aplica → se oculta de la matriz de ese OT).

    SetDocumentRequirementOverrideRequest:
      type: object
      description: >
        Upsert por tupla natural (trámite, documento, OT) de la obligatoriedad por OT
        (HU #10198). estado=DEFAULT limpia el override (hereda el default del trámite).
      properties:
        procedureTypeId: { type: string, format: uuid }
        documentTypeId: { type: string, format: uuid }
        transitOfficeId: { type: string, format: uuid }
        estado:
          type: string
          enum: [REQUIRED, OPTIONAL, NOT_APPLICABLE, DEFAULT]
      required: [procedureTypeId, documentTypeId, transitOfficeId, estado]

    DocumentRequirementOverrideResponse:
      type: object
      description: Override de obligatoriedad por OT (HU #10198).
      properties:
        id: { type: string, format: uuid }
        procedureTypeId: { type: string, format: uuid }
        documentTypeId: { type: string, format: uuid }
        transitOfficeId: { type: string, format: uuid }
        estado: { $ref: "#/components/schemas/DocumentRequirementState" }
        documento:
          type: object
          properties:
            codigo: { type: string }
            nombre: { type: string }
          required: [codigo, nombre]
      required: [id, procedureTypeId, documentTypeId, transitOfficeId, estado, documento]

    DocumentRequirementOverrideList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRequirementOverrideResponse"
      required: [data]

    ResolvedDocumentMatrixRow:
      type: object
      description: Fila de la matriz documental resuelta (RF18).
      properties:
        documentTypeId: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        obligatorio: { type: boolean }
        ordenResuelto: { type: integer, minimum: 0, maximum: 32767 }
        nivelAplicado:
          type: string
          enum: [CLIENTE, OT, DEFAULT]
          description: Nivel que ganó la precedencia.
      required: [documentTypeId, codigo, nombre, obligatorio, ordenResuelto, nivelAplicado]

    ResolvedDocumentMatrix:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedDocumentMatrixRow"
      required: [data]

    CreateProcedureInstanceRequest:
      type: object
      properties:
        procedureTypeId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        transitOfficeId:
          type: string
          format: uuid
          nullable: true
          description: Organismo de tránsito (nivel OT) — opcional, afecta la precedencia.
        referenceNumber:
          type: string
          maxLength: 30
          description: Número de referencia del trámite, único por cliente.
        createdByUserId:
          type: string
          format: uuid
          nullable: true
          description: Usuario creador; si se omite, se resuelve del JWT (sub).
      required: [procedureTypeId, tenantId, referenceNumber]

    ProcedureInstanceResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        referenceNumber: { type: string }
        status: { type: string, example: draft }
        snapshotAt: { type: string, format: date-time }
        documentCount: { type: integer, description: Documentos congelados en el snapshot. }
      required: [id, referenceNumber, status, snapshotAt, documentCount]

    NetworkProcedureListResponse:
      type: object
      description: >
        Página del listado consolidado de la red (HU #12358). Misma forma que el listado propio
        (`items` + `total`); cada fila es la MISMA proyección de resumen del listado, y `tenantId` /
        `companiaNombre` identifican al cliente dueño.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlateHistoryItem"
        total:
          type: integer
          description: Total de trámites del universo consolidado que cumplen los filtros (para paginar).
      required: [items, total]

    NetworkProcedureDetailResponse:
      type: object
      description: Detalle consolidado en solo lectura de un trámite de la red (HU #12358).
      properties:
        tenantId:
          type: string
          format: uuid
          description: Cliente dueño del trámite.
        tenantName:
          type: string
          nullable: true
          description: Razón social del cliente dueño.
        instance:
          description: >
            El mismo objeto que devuelve `GET /api/v1/tramites/instances/{id}` al propio cliente
            (id, referenceNumber, status, procedureTypeId, tenantId, createdAt, submittedAt,
            completedAt, fieldValues, statusHistory, actors, draftFinalizedAt, rejectedFrom,
            currentStep, subsanacionActiva, subsanacionCount, prioritario, events,
            consolidadoWizard, consolidadoMaestro).
          allOf:
            - $ref: "#/components/schemas/ProcedureInstanceDetail"
      required: [tenantId, instance]

    TramitesSearchFilter:
      type: object
      description: >
        Filtro del listado de trámites (HU #12106; documentado por HU #13374): el cuerpo de
        `POST /api/v1/tramites/instances/search` SIN paginación. Lo reutilizan `TramitesSearchRequest`,
        `NetworkTramitesSearchRequest` y el lote de descarga masiva (`LoteFiltroTramites`). `sortBy`/`sortDir`
        fijan el orden (en el lote, el orden de proceso).
      properties:
        condiciones:
          type: array
          nullable: true
          description: Condiciones con la gramática de Consultas (campo, operador, valores). Fuera del catálogo ⇒ 400.
          items:
            type: object
            additionalProperties: true
            properties:
              fieldId: { type: string }
              operator: { type: string }
              values:
                type: array
                items: { type: string }
        vin: { type: string, nullable: true }
        placa: { type: string, nullable: true }
        vendedor: { type: string, nullable: true }
        comprador: { type: string, nullable: true }
        gestor: { type: string, nullable: true }
        firmado: { type: boolean, nullable: true }
        estado: { type: string, nullable: true, description: Estados separados por coma }
        modalidad: { type: string, nullable: true }
        organismoTransito: { type: string, nullable: true }
        tipoCodigo: { type: string, nullable: true }
        busqueda: { type: string, nullable: true }
        prioritario: { type: boolean, nullable: true }
        busquedaRapida:
          type: string
          nullable: true
          description: "Atajo de búsqueda rápida: mas_de_5_dias, mas_de_10_dias, sin_firmas, sin_documento, pausados, mis_tramites. Otro valor ⇒ 400."
        createdFrom: { type: string, format: date-time, nullable: true }
        createdTo: { type: string, format: date-time, nullable: true }
        updatedFrom: { type: string, format: date-time, nullable: true }
        updatedTo: { type: string, format: date-time, nullable: true }
        sortBy: { type: string, nullable: true }
        sortDir: { type: string, nullable: true, enum: [asc, desc] }

    TramitesSearchRequest:
      description: Cuerpo de `POST /api/v1/tramites/instances/search` y `/estado-counts`. `TramitesSearchFilter` más la página.
      allOf:
        - $ref: "#/components/schemas/TramitesSearchFilter"
        - type: object
          properties:
            skip: { type: integer, nullable: true, minimum: 0 }
            take:
              type: integer
              nullable: true
              minimum: 1
              maximum: 200
              description: Fuera del rango cae al tope de 200; ausente ⇒ primera página con el tope.

    CrearLoteConsolidadosRequest:
      type: object
      description: >
        Cuerpo de `POST /api/v1/tramites/consolidados/lotes` (HU #13374). No lleva origen ni compañía: los decide
        el servidor por el JWT; un campo `origen`/`origin` en el cuerpo se ignora.
      required: [tipoDocumento, seleccion, confirmaEfectos]
      properties:
        tipoDocumento:
          type: string
          enum: [consolidado, consolidado_maestro]
          description: Origen `tramites` solo `consolidado`; `consolidado_maestro` solo origen `superadmin` (si no ⇒ 400 tipo_no_permitido).
        confirmaEfectos:
          type: boolean
          description: >
            El usuario vio y aceptó el efecto declarado (se descarga el consolidado guardado tal cual; solo se
            genera el de los trámites que no tienen). Debe ser true (si no ⇒ 400 confirmacion_requerida).
        seleccion:
          $ref: "#/components/schemas/LoteSeleccionRequest"
        alcanceRed:
          type: string
          nullable: true
          description: >
            HU #13417 — alcance de la tabla, para los modos `ids` y `filtro`: null = propio; `red` = toda la red de la
            cabeza; un uuid = una compañía hija (el de la propia cabeza = propio). Solo pide: el alcance lo resuelve el
            servidor desde la BD. Un valor que no es `red` ni un uuid, o distinto del `seleccion.filtro.alcanceRed`
            (transición), ⇒ 400 seleccion_invalida.
          example: red

    LoteSeleccionRequest:
      type: object
      description: >
        Selección del listado tal como la arma el frontend: llega SIEMPRE con las cuatro claves. Modo `ids`: se
        usa `ids` y se ignoran `excluidos`/`filtro` (llegan `[]`/`null`). Modo `filtro`: se usan `filtro` y
        `excluidos` y se ignora `ids` (llega `[]`). Modo desconocido o `filtro` nulo en modo filtro ⇒ 400
        seleccion_invalida. Más de 10.000 `ids` o `excluidos` ⇒ 422 seleccion_excede_tope. La selección resuelta
        (exclusiones e intersección de seguridad aplicadas) por encima del tope total `max_items_per_batch` ⇒ 422
        seleccion_excede_tope con `total` y `tope`.
      required: [modo]
      properties:
        modo: { type: string, enum: [ids, filtro] }
        ids:
          type: array
          maxItems: 10000
          items: { type: string, format: uuid }
        excluidos:
          type: array
          maxItems: 10000
          items: { type: string, format: uuid }
        filtro:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LoteFiltroTramites"

    LoteFiltroTramites:
      description: >
        Filtro del lote en modo `filtro`: `TramitesSearchFilter` (mismas validaciones que el listado) más
        `alcanceRed`. `skip`/`take` se aceptan y se ignoran (la selección no tiene página).
      allOf:
        - $ref: "#/components/schemas/TramitesSearchFilter"
        - type: object
          properties:
            skip: { type: integer, nullable: true }
            take: { type: integer, nullable: true }
            alcanceRed:
              type: string
              nullable: true
              deprecated: true
              description: >
                Transición (HU #13417): el alcance va en `CrearLoteConsolidadosRequest.alcanceRed` (raíz del
                cuerpo). Aquí se sigue aceptando con la misma semántica; si llegan los dos y difieren ⇒ 400
                seleccion_invalida.

    CrearLoteConsolidadosOtRequest:
      type: object
      description: >
        Cuerpo de `POST /api/v1/admin/ot/consolidados/lotes` (HU #13391). No lleva origen, tenant ni organismo:
        los decide el servidor.
      required: [seleccion, confirmaEfectos]
      properties:
        tipoDocumento:
          type: string
          enum: [consolidado_maestro]
          default: consolidado_maestro
          description: Solo `consolidado_maestro`; otro valor ⇒ 400 tipo_no_permitido.
        confirmaEfectos:
          type: boolean
          description: Debe ser true (texto de confirmación variante maestro); si no ⇒ 400 confirmacion_requerida.
        seleccion:
          $ref: "#/components/schemas/LoteSeleccionOtRequest"

    LoteSeleccionOtRequest:
      type: object
      description: >
        Selección de la bandeja OT tal como la arma el frontend (#13394): llega SIEMPRE con las cuatro claves.
        Modo `ids`: se usa `ids` y se ignoran `excluidos`/`filtro`. Modo `filtro`: se usan `filtro` y `excluidos`
        y se ignora `ids`. Modo desconocido o `filtro` nulo en modo filtro ⇒ 400 seleccion_invalida. Más de
        10.000 `ids` o `excluidos` ⇒ 422 seleccion_excede_tope. La selección resuelta por encima del tope total
        `max_items_per_batch` ⇒ 422 seleccion_excede_tope con `total` y `tope`.
      required: [modo]
      properties:
        modo: { type: string, enum: [ids, filtro] }
        ids:
          type: array
          maxItems: 10000
          items: { type: string, format: uuid }
        excluidos:
          type: array
          maxItems: 10000
          items: { type: string, format: uuid }
        filtro:
          type: object
          nullable: true
          description: El cuerpo de la búsqueda de la bandeja; `page`/`pageSize` se aceptan y se ignoran.
          allOf:
            - $ref: "#/components/schemas/OtBandejaSearchFilter"

    OtBandejaSearchFilter:
      type: object
      description: >
        Filtro de la bandeja del OT (HU #12217; documentado por HU #13391): el cuerpo de
        `POST /api/v1/admin/ot/client-procedures/search` SIN paginación. Lo reutilizan `OtBandejaSearchRequest`
        y el lote de maestros (`LoteSeleccionOtRequest.filtro`). `sortBy`/`sortDir` fijan el orden.
      properties:
        condiciones:
          type: array
          nullable: true
          description: Condiciones con la gramática de Consultas (campo, operador, valores). Fuera del catálogo ⇒ 400.
          items:
            type: object
            additionalProperties: true
            properties:
              fieldId: { type: string }
              operator: { type: string }
              values:
                type: array
                items: { type: string }
        busqueda: { type: string, nullable: true, description: Texto libre de la barra de búsqueda. }
        status: { type: string, nullable: true, description: Estados separados por coma }
        hasActiveRevocationRequest: { type: boolean, nullable: true }
        procedureTypeId: { type: string, format: uuid, nullable: true }
        familia:
          type: string
          nullable: true
          enum: [MATRICULAS, TRASPASO, OTROS, null]
          description: Otro valor ⇒ 400.
        vin: { type: string, nullable: true }
        placa: { type: string, nullable: true }
        vendedor: { type: string, nullable: true }
        comprador: { type: string, nullable: true }
        gestor: { type: string, nullable: true }
        createdFrom: { type: string, format: date-time, nullable: true }
        createdTo: { type: string, format: date-time, nullable: true }
        updatedFrom: { type: string, format: date-time, nullable: true }
        updatedTo: { type: string, format: date-time, nullable: true }
        sortBy: { type: string, nullable: true }
        sortDir: { type: string, nullable: true, enum: [asc, desc] }

    OtBandejaSearchRequest:
      description: Cuerpo de `POST /api/v1/admin/ot/client-procedures/search` y `/counters`. `OtBandejaSearchFilter` más la página.
      allOf:
        - $ref: "#/components/schemas/OtBandejaSearchFilter"
        - type: object
          properties:
            page: { type: integer, nullable: true, minimum: 1 }
            pageSize: { type: integer, nullable: true, minimum: 1 }

    LoteProblem:
      type: object
      description: ProblemDetails del motor de lotes con el código estable en `error` (raíz del cuerpo).
      required: [error]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: "Texto para el usuario, sin datos personales." }
        error:
          type: string
          enum:
            - confirmacion_requerida
            - tipo_no_permitido
            - seleccion_requerida
            - seleccion_invalida
            - filtro_invalido
            - sin_compania
            - seleccion_excede_tope
            - busqueda_demasiado_amplia
            - motor_inactivo
            - lote_no_creado
            - transit_office_requerido
            - transit_office_invalido
            - sin_organismo
            - lote_no_terminado
            - lote_terminado
            - descarga_expirada
            - auditoria_no_registrada
            - parte_no_disponible
            - network_scope_required
            - network_role_required
            - network_child_out_of_scope
            - network_documents_disabled
        total:
          type: integer
          description: >
            Solo en `seleccion_excede_tope` por tope total (M1): trámites de la selección resuelta, exacto. El
            servidor no carga la selección entera para responder: lee hasta `tope + 1` y cuenta el total en SQL con
            el mismo filtro y sin los excluidos. Ausente en el tope de las listas `ids`/`excluidos`.
        tope:
          type: integer
          description: Solo junto a `total`; `max_items_per_batch` vigente (1–32.766, por defecto 10.000).

    LoteTerminadoConflict:
      type: object
      description: 409 de la cancelación (ProblemDetails, HU #13385) con el estado terminal en que quedó el lote.
      required: [error, estado]
      properties:
        error: { type: string, enum: [lote_terminado] }
        estado:
          type: string
          enum: [completado, completado_con_omitidos, fallido, expirado]
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    LoteActivoConflict:
      type: object
      description: 409 de la creación (ProblemDetails) con el lote activo que lo impidió.
      required: [error, loteActivoId]
      properties:
        error: { type: string, enum: [lote_activo] }
        loteActivoId: { type: string, format: uuid }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    LoteConsolidados:
      type: object
      required: [id, estado, tipoDocumento, total, procesados, incluidos, omitidos, creadoEn, partes]
      properties:
        id: { type: string, format: uuid }
        estado:
          type: string
          enum: [en_cola, en_proceso, empaquetando, completado, completado_con_omitidos, fallido, cancelado, expirado]
          description: >
            `cancelado` (#13385): terminal y neutro («Descarga cancelada»); `partes` vacío; los contadores quedan
            como estaban al cancelar.
        tipoDocumento: { type: string, enum: [consolidado, consolidado_maestro] }
        total: { type: integer, description: Congelado al crear (CF-06) }
        procesados: { type: integer, description: incluidos + omitidos }
        incluidos: { type: integer }
        omitidos: { type: integer }
        generados: { type: integer, description: "De los incluidos, cuántos no tenían consolidado y se generaron" }
        creadoEn: { type: string, format: date-time }
        terminadoEn: { type: string, format: date-time, nullable: true, description: "En `cancelado`, instante de la cancelación." }
        expiraEn: { type: string, format: date-time, nullable: true, description: terminadoEn + 24 h }
        nombreBase: { type: string, example: consolidados_20261006_1430, description: Ausente hasta que el motor lo fija. }
        alcanceRed:
          type: string
          nullable: true
          readOnly: true
          enum: [red, hija]
          description: >
            HU #13417 — lote creado desde la vista de red: `red` (toda la red) o `hija` (acotado a una compañía; sin
            su id). Ausente en el lote propio. Para el aviso global del lote.
        alcanceHijaId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: >
            Ajuste #13419 AC6 — id de la compañía hija (`scope_tenant_id`) cuando `alcanceRed` = `hija`, para que el
            aviso global rotule «Red · nombre de la hija» tras recargar. Ausente (o null) en `red`, en el lote propio,
            en el del Super Admin y en la bandeja OT.
        partes:
          type: array
          description: Vacío hasta que el lote termina (las partes solo se descargan al terminar, CF-09/H4a).
          items:
            type: object
            required: [numero, nombreArchivo, pdfs, omitidos, bytes]
            properties:
              numero: { type: integer }
              nombreArchivo: { type: string }
              pdfs: { type: integer }
              omitidos: { type: integer }
              bytes: { type: integer, format: int64 }

    NetworkDocumentosDisponibilidad:
      type: object
      description: >
        Respuesta de `GET /api/v1/tramites/network/documentos` (ajuste #13419 AC5): si la cabeza de grupo puede leer
        documentos de su red y, por tanto, la vista de red ofrece «Descargar ZIP».
      required: [documentosRed]
      properties:
        documentosRed:
          type: boolean
          description: "`true` en MARCA_BLANCA o CONCESION con `network_documents_concesion` encendido; `false` si no."

    NetworkTramitesSearchRequest:
      description: >
        Cuerpo de `POST /api/v1/tramites/network/instances/search` y `/estado-counts` (HU #12358):
        el mismo de `POST /api/v1/tramites/instances/search` (`TramitesSearchFilter` + página) más
        `childTenantId`. `estado` se ignora en `estado-counts`.
      allOf:
        - $ref: "#/components/schemas/TramitesSearchFilter"
        - type: object
          properties:
            childTenantId:
              type: string
              format: uuid
              nullable: true
              description: Acota a un cliente de la red (puede ser la propia cabeza). Fuera del alcance ⇒ 403.
            skip: { type: integer, nullable: true, minimum: 0 }
            take:
              type: integer
              nullable: true
              minimum: 1
              maximum: 200
              description: Fuera del rango cae al tope de 200; ausente ⇒ primera página con el tope.

    NetworkScope:
      type: object
      description: Alcance efectivo de una consulta de red (HU #12359) — los clientes que sí se consultaron.
      properties:
        tenantIds:
          type: array
          items: { type: string, format: uuid }
      required: [tenantIds]

    NetworkAnalyticsOverviewResponse:
      type: object
      description: >
        Respuesta de `GET /api/v1/tramites/network/stats/overview` (HU #12359): `AnalyticsOverviewResponse`
        más `scope`. `tenantId` es la cabeza o el hijo acotado por `childTenantId`.
      properties:
        tenantId: { type: string, format: uuid }
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryMetrics"
        scope:
          $ref: "#/components/schemas/NetworkScope"
      required: [tenantId, categories, scope]

    NetworkTopProducersResponse:
      type: object
      description: Respuesta de `GET /api/v1/tramites/network/stats/productivity/top` (HU #12359).
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopProducer"
        scope:
          $ref: "#/components/schemas/NetworkScope"
      required: [items, scope]

    NetworkMonthlyTrendPoint:
      type: object
      properties:
        year: { type: integer, example: 2026 }
        month: { type: integer, minimum: 1, maximum: 12, example: 9 }
        category: { type: string, enum: [matriculas, traspasos, otros] }
        total: { type: integer, example: 42 }
      required: [year, month, category, total]

    NetworkMonthlyTrendResponse:
      type: object
      description: Respuesta de `GET /api/v1/tramites/network/stats/monthly-trend` (HU #12359).
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NetworkMonthlyTrendPoint"
        scope:
          $ref: "#/components/schemas/NetworkScope"
      required: [items, scope]

    NetworkDetailedProcedureRow:
      type: object
      description: >
        Fila del reporte detallado de la red (HU #12360): las columnas del trámite de
        `/detailed-report/procedures` más el cliente dueño. Sin documentos ni enlaces (AC6).
      properties:
        tenantId: { type: string, format: uuid, description: Cliente dueño del trámite (cabeza o hijo). }
        tenantName: { type: string, description: Razón social del cliente dueño. }
        id: { type: string, format: uuid }
        referenceNumber: { type: string }
        procedureTypeName: { type: string }
        category: { type: string, enum: [matriculas, traspasos, otros] }
        status: { type: string }
        createdByDisplayName: { type: string }
        submittedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        personDocument: { type: string }
        personFullName: { type: string }
        hasTransformation: { type: boolean }
        transformationDetail: { type: string, nullable: true }
        isLeasing: { type: boolean }
        paymentType: { type: string }
        transferType: { type: string, nullable: true }
      required: [tenantId, tenantName, id, referenceNumber, procedureTypeName, category, status, createdByDisplayName, personDocument, personFullName, hasTransformation, isLeasing, paymentType]

    NetworkTenantCount:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        count: { type: integer }
      required: [tenantId, tenantName, count]

    NetworkDetailedReportSummary:
      type: object
      description: Totales del reporte de red (HU #12360); con `childTenantId`, `byTenant` tiene una sola entrada y los totales son solo de ese cliente (AC2).
      properties:
        totalCount: { type: integer }
        byStatus:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              count: { type: integer }
            required: [status, count]
        byCategory:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
            required: [label, count]
        byProcedureType:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
            required: [label, count]
        byTenant:
          type: array
          items:
            $ref: "#/components/schemas/NetworkTenantCount"
      required: [totalCount, byStatus, byCategory, byProcedureType, byTenant]

    NetworkDetailedProceduresPage:
      type: object
      description: Respuesta de `GET /api/v1/tramites/network/reports/procedures` (HU #12360).
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NetworkDetailedProcedureRow"
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        summary:
          $ref: "#/components/schemas/NetworkDetailedReportSummary"
        scope:
          $ref: "#/components/schemas/NetworkScope"
      required: [items, totalCount, page, pageSize, summary, scope]

    PlateHistoryResponse:
      type: object
      description: >
        Página del historial por placa (HU #12192). Misma forma que el listado de trámites
        (`items` + `total`) para que el cliente reutilice el mismo mapeo de fila.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlateHistoryItem"
        total:
          type: integer
          description: >
            Total de trámites de la placa DENTRO DEL ALCANCE del consultante, no el tamaño de la
            página: es el número con el que se paginan los resultados.
      required: [items, total]

    PlateHistoryItem:
      type: object
      description: >
        Fila del historial. Es la MISMA proyección de resumen que devuelve el listado de trámites
        (`InstanceSummary`), no un DTO propio: el módulo de historial reutiliza la fila del listado
        para no duplicar un contrato que ya consumen el dashboard y DR. FLIT. Aquí se documentan los
        campos que el módulo pinta; la proyección incluye además el resto de campos del resumen del
        listado.
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        referenceNumber: { type: string, description: Radicado del trámite. }
        modalidad: { type: string, description: "Familia: matriculas | traspaso | otros." }
        estado: { type: string, example: entregado }
        tipoNombre: { type: string, nullable: true, description: Nombre del tipo concreto de trámite. }
        tipoCodigo: { type: string, nullable: true }
        placa: { type: string, nullable: true }
        vin: { type: string, nullable: true }
        organismoTransito: { type: string, nullable: true }
        compradorNombre: { type: string, nullable: true }
        vendedorNombre: { type: string, nullable: true, description: Parte saliente; null en matrícula inicial. }
        gestorNombre: { type: string, nullable: true, description: Persona que radicó el trámite. }
        createdAt: { type: string, format: date-time, description: Criterio de orden del historial (descendente). }
        updatedAt: { type: string, format: date-time, nullable: true }
        tenantId:
          type: string
          format: uuid
          description: Compañía dueña del trámite.
        companiaNombre:
          type: string
          nullable: true
          description: >
            Razón social de la compañía dueña. La columna solo tiene sentido para SuperAdmin, que
            es quien puede ver filas de varias compañías en la misma respuesta.
        consolidadoWizard:
          description: >
            HU #12791 — vigencia + sello del consolidado del wizard de la fila. Se deriva en la MISMA
            consulta del listado (sin N+1). Aditivo: ausente en versiones anteriores del backend.
          type: object
          allOf:
            - $ref: "#/components/schemas/ConsolidadoVigencia"
          nullable: true
      required: [id, referenceNumber, modalidad, estado, createdAt, tenantId]

    WizardState:
      type: object
      description: >
        Estado del asistente del trámite (`WizardStateDto`). Contrato PARCIAL: declara las banderas de
        prenda/gravamen; el resto de propiedades viaja sin declarar.
      additionalProperties: true
      properties:
        prendaDocumentRequired:
          type: boolean
          description: El OT exige el certificado de prenda (false si el opt-out `document_optional` estaba vigente al crear el trámite).
        prendaOmitAllowed:
          type: boolean
          description: >
            Feature #13110 — el asistente puede ofrecer «Omitir prenda» (`omitir`). Misma regla que aplica el
            PUT de prenda.
        runtReportaGravamen:
          type: boolean
          description: >
            HU #13776 — el RUNT reporta prenda o gravamen según la señal única: banderas prendas/gravámenes
            afirmativas, garantías mobiliarias (RNGM) con datos, dato prendario afirmativo o al menos una
            limitación a la propiedad («a favor de»), sea cual sea el proveedor (Kyverum, Verifik o Intempo).
            Es el mismo valor con el que se evalúa la exigencia de decisión de prenda.

    ConsolidadoVigencia:
      type: object
      description: >
        HU #12791 (Épica #12760) — estado de vigencia de UN consolidado (wizard `consolidado` o maestro
        `consolidado_maestro`). Misma forma en todas las superficies (detalle y listado del gestor,
        vista de red, bandeja y detalle OT / SuperAdmin). Precedencia: sin adjunto del tipo ⇒
        `inexistente`; estado final ⇒ `definitivo=true` y `estado=vigente` (el PDF definitivo no se
        regenera); `Source=user` ⇒ `origen=user`, `modo=cargado_por_usuario`; resto ⇒ la bandera
        `consolidado_*_vigente` decide `vigente`/`desactualizado`.
      properties:
        estado:
          type: string
          enum: [vigente, desactualizado, inexistente]
          description: "`inexistente` = no hay adjunto del tipo (sin importar la bandera)."
        generadoEn:
          type: string
          format: date-time
          nullable: true
          description: >
            Sello UTC de la generación (columna `consolidado_*_generado_en`, HU #12790). Null si no hay
            PDF o si el trámite es anterior a la columna («fecha no disponible»; no invalida el PDF).
        origen:
          type: string
          nullable: true
          enum: [system, user, null]
          description: "`system` = generado por FLIT; `user` = cargado por el SuperAdmin; null sin PDF."
        definitivo:
          type: boolean
          description: True en estado final (aprobado, anulado, revocado) con PDF — documentación definitiva.
        modo:
          type: string
          nullable: true
          enum: [definitivo_estado_final, migrado_solo_lectura, cargado_por_usuario, null]
          description: >
            Caso especial con los mismos literales de la ruta de entrega (HU #12785,
            `GET …/consolidado/entrega`). Null en el caso normal. `migrado_solo_lectura` aplica al
            migrado V1 en estado final (también sin PDF).
      required: [estado, generadoEn, origen, definitivo, modo]

    ProcedureInstanceDetail:
      type: object
      description: >
        Detalle de `GET /api/v1/tramites/instances/{id}` (gestor y SuperAdmin) y objeto `instance` de
        `GET /api/v1/tramites/network/instances/{id}`. Aquí se documentan solo los campos de vigencia de
        la HU #12791; el resto del objeto (fieldValues, statusHistory, actors, …) no cambia.
      additionalProperties: true
      properties:
        improntaGeneracionHabilitada:
          type: boolean
          description: >
            HU #13402 (Feature #13399) — parámetro «generar improntas» de la compañía congelado al crear
            el trámite. `false` = la generación automática no aplica (el usuario sube la impronta a mano).
            Trámites anteriores a la migración: `true`. Aditivo.
        consolidadoWizard:
          description: HU #12791 — vigencia + sello del consolidado del wizard. Aditivo.
          type: object
          allOf:
            - $ref: "#/components/schemas/ConsolidadoVigencia"
          nullable: true
        consolidadoMaestro:
          description: HU #12791 — vigencia + sello del consolidado maestro del OT. Aditivo.
          type: object
          allOf:
            - $ref: "#/components/schemas/ConsolidadoVigencia"
          nullable: true

    OtClientProcedureResponse:
      type: object
      description: >
        Fila de `GET /api/v1/admin/ot/client-procedures` (bandeja OT y vista SuperAdmin de trámites por
        organismo, `data[]`) y cuerpo de `GET /api/v1/admin/ot/client-procedures/{id}`. Aquí se
        documentan solo los campos de vigencia de la HU #12791, proyectados en la MISMA consulta de la
        fila (sin N+1). Son null en las respuestas de aprobar/rechazar/revocar, que no los recalculan.
      additionalProperties: true
      properties:
        consolidadoWizard:
          description: HU #12791 — vigencia + sello del consolidado del wizard. Aditivo.
          type: object
          allOf:
            - $ref: "#/components/schemas/ConsolidadoVigencia"
          nullable: true
        consolidadoMaestro:
          description: HU #12791 — vigencia + sello del consolidado maestro del OT. Aditivo.
          type: object
          allOf:
            - $ref: "#/components/schemas/ConsolidadoVigencia"
          nullable: true
        quipuxRadicadoEn:
          type: string
          format: date-time
          nullable: true
          description: >
            HU #12791 (para #12787 AC2) — instante UTC de la ÚLTIMA radicación exitosa del trámite ante
            Quipux (`quipux_submissions.registered_at` con valor y estado distinto de `fallido`). Null si
            no se ha radicado. La vista read-only del OT lo usa para rotular la «versión radicada».
        quipuxMaestroAttachmentId:
          type: string
          format: uuid
          nullable: true
          description: >
            HU #12791 — adjunto `consolidado_maestro` enviado en esa radicación
            (`quipux_submissions.attachment_id`). Null si no se ha radicado.

    ProcedureInstanceSummary:
      type: object
      description: Resumen de una instancia de trámite (devuelto por finalize-draft y submit).
      properties:
        id: { type: string, format: uuid }
        referenceNumber: { type: string }
        status:
          type: string
          example: borrador
          description: >
            Estado global (ADR-0059): borrador, preparado, preasignacion, asignado, entregado,
            aprobado, rechazado, revocado, anulado o subsanacion. 'preasignacion' y 'asignado' son la
            Ruta Larga de matrícula inicial (radicada sin placa; el organismo la asigna).
        procedureTypeId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha de radicación (Draft→Submitted). Null mientras es borrador.
        rejectedFrom:
          type: string
          nullable: true
          enum: [preasignacion, entregado]
          description: >
            ADR-0059 (Epic #12549) — estado desde el que el organismo rechazó el trámite. Solo tiene
            valor en 'rechazado'; 'preasignacion' distingue el rechazo previo a la placa (el gestor
            debe corregir y volver a pedirla). Sustituye al sub-estado 'plateFlowStatus' de
            HU #10785: la ruta de placa son ahora los estados globales 'preasignacion' y 'asignado'.
        draftFinalizedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            HU #10349 — fecha en que el borrador se finalizó (datos completos a la espera de la
            validación de identidad async). Null si el borrador no se ha finalizado.
      required: [id, referenceNumber, status, procedureTypeId, tenantId, createdAt]

    ProcedureDocumentRequirementSnapshotRow:
      type: object
      properties:
        documentTypeId: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        obligatorio: { type: boolean }
        ordenResuelto: { type: integer }
        nivelAplicado:
          type: string
          enum: [CLIENTE, OT, DEFAULT]
          description: Nivel que determinó el orden en el momento de creación.
      required: [documentTypeId, codigo, nombre, obligatorio, ordenResuelto, nivelAplicado]

    ProcedureDocumentRequirementSnapshotList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureDocumentRequirementSnapshotRow"
      required: [data]

    # ── Validación de identidad / Kyverum Verify (HU #10233) ──────────────────
    StuckIdentityValidation:
      type: object
      description: >
        Validación de identidad atascada (dead-letter), de cualquiera de las dos colas: el ENVÍO al proveedor
        (kind=envio, validación en error_envio) o el ENCADENAMIENTO async firma/FUR (kind=encadenamiento,
        outbox de completado). Incluye nombre y documento de la persona validada (vista autenticada del
        gestor; la UI enmascara el documento a los últimos 4) para saber de quién es. No expone el payload.
      required: [id, validationId, eventType, attempts, occurredAt, createdAt, kind]
      properties:
        id: { type: string, format: uuid }
        validationId:
          type: string
          format: uuid
          description: Validación biométrica de origen (procedure_instance_biometric_validations.id).
        kind:
          type: string
          enum: [envio, encadenamiento]
          description: >
            Cola en dead-letter: `envio` = el envío al proveedor (Kyverum) agotó reintentos
            (estado error_envio); `encadenamiento` = el encadenamiento async firma/FUR agotó reintentos.
        eventType: { type: string, example: identity_validation.completed }
        attempts:
          type: integer
          description: Intentos de entrega consumidos (>= maxDeliveryAttempts ⇒ dead-letter).
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        name:
          type: string
          nullable: true
          description: Nombre de la persona validada (null si la validación ya no existe).
        documentType:
          type: string
          nullable: true
          description: Tipo de documento (CC, CE…). Null si la validación ya no existe.
        documentNumber:
          type: string
          nullable: true
          description: Documento completo (la UI lo enmascara a los últimos 4). Null si ya no existe.
    StuckIdentityValidationsResponse:
      type: object
      description: Eventos de validación de identidad atascados (dead-letter) del tenant (HU #10349).
      required: [stuck, total, maxDeliveryAttempts]
      properties:
        stuck:
          type: array
          items:
            $ref: "#/components/schemas/StuckIdentityValidation"
        total:
          type: integer
          description: Cantidad de eventos atascados devueltos (acotado a 200 filas).
        maxDeliveryAttempts:
          type: integer
          description: Tope de reintentos a partir del cual un evento se considera dead-letter.
    ActorInput:
      type: object
      description: >
        Un propietario/parte de un lado del trámite (Múltiple Propietario, ADR-0053 Propuesto). El
        array `actors` de `PutActorsRequest` puede traer VARIOS `ActorInput` con el MISMO `rol` (hasta
        4), cada uno con un `ordinal` distinto. Antes de esta versión cada `rol` admitía exactamente un
        actor (`ordinal` implícito 1) — ese caso se sigue comportando IGUAL: un solo `ActorInput` por
        `rol`, sin `ordinal` ni `porcentaje`.
      required: [rol, tipoDocumento, numeroDocumento, nombreCompleto, email]
      properties:
        rol:
          type: string
          enum: [comprador, vendedor, locatario]
        ordinal:
          type: integer
          minimum: 1
          maximum: 4
          default: 1
          description: >
            Posición del actor dentro de su `rol`. `1` = actor PRINCIPAL/solidario: conserva la
            siembra del documento del paso 1 y su consulta RUNT automática; su pestaña no se puede
            eliminar y absorbe el residuo (100 − suma de los demás) mientras el gestor no edite su
            porcentaje explícitamente — esa auto-absorción es UX de frontend, el backend solo exige
            el resultado final (suma 100, ninguno en 0). `2`..`4` = propietarios AGREGADOS: se digitan
            y consultan uno a uno (mismo botón Consultar, RUES y RUNT) y sí se pueden eliminar.
            Omitir el campo equivale a `1` (compatibilidad con el contrato anterior).
        porcentaje:
          type: number
          format: double
          minimum: 0.01
          maximum: 100
          nullable: true
          description: >
            Porcentaje de propiedad, 2 decimales. `null` cuando el `rol` tiene un solo actor en el
            conjunto EFECTIVO (request + actores conservados) — comportamiento sin cambios: sin
            pestañas de reparto, sin bloque de porcentaje. Con 2+ actores del mismo `rol`, TODOS deben
            traer `porcentaje` no nulo y la suma efectiva del lado debe ser EXACTAMENTE 100. NO se
            hereda ni se compara contra el RUNT.
        tipoDocumento: { type: string, enum: [CC, CE, NIT, PAS, TI] }
        numeroDocumento: { type: string }
        nombreCompleto: { type: string }
        email: { type: string }
        telefono: { type: string, nullable: true }
        ciudad: { type: string, nullable: true }
        direccion: { type: string, nullable: true }
        personType: { type: string, enum: [natural, juridical], nullable: true }
        esRepresentanteLegal: { type: boolean, default: false }
        representanteLegal:
          $ref: "#/components/schemas/ActorRepresentanteLegal"
        mandante:
          $ref: "#/components/schemas/ActorMandante"
        autorizaReutilizacionDatos: { type: boolean, default: false }
    ActorDto:
      allOf:
        - $ref: "#/components/schemas/ActorInput"
      description: >
        Actor persistido, devuelto por GET/PUT `.../instances/{id}/actors`. Mismos campos que
        `ActorInput`; `ordinal` y `porcentaje` siempre presentes (porcentaje `null` cuando el lado
        tiene un solo actor).
    ActorRepresentanteLegal:
      type: object
      description: >
        Representante legal / apoderado de un actor persona jurídica. Información de contacto
        embebida en `actor.metadata` — no es un actor de primera clase (no participa en biométrica ni
        en los gates del wizard salvo como sujeto de identidad de SU actor).
      properties:
        tipoDocumento: { type: string, nullable: true }
        numeroDocumento: { type: string, nullable: true }
        nombreCompleto: { type: string, nullable: true }
        email: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        mecanismoFirma: { type: string, enum: [baul, identidad], nullable: true }
    ActorMandante:
      type: object
      description: Mandante/poderdante de un actor. Información de contacto embebida en `actor.metadata`.
      properties:
        tipoDocumento: { type: string, nullable: true }
        numeroDocumento: { type: string, nullable: true }
        nombreCompleto: { type: string, nullable: true }
        email: { type: string, nullable: true }
    PutActorsRequest:
      type: object
      required: [actors]
      properties:
        actors:
          type: array
          items:
            $ref: "#/components/schemas/ActorInput"
    ActorsResponse:
      type: object
      required: [actors]
      properties:
        actors:
          type: array
          items:
            $ref: "#/components/schemas/ActorDto"
    ActorContactLookupResponse:
      type: object
      description: >
        Datos de CONTACTO ya conocidos de una persona (HU #10955). NUNCA incluye nombre ni documento
        — esos siempre vienen del RUNT en vivo. Los cuatro campos van en null si la persona nunca ha
        sido actor de un trámite del tenant (AC3).
      properties:
        ciudad:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
    EnsureIdentityResult:
      type: object
      description: Desenlace de asegurar la identidad vigente de una parte (HU #10350).
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [ya_vigente, en_proceso, reusada, requiere_validacion, sin_actor]
          description: >
            `ya_vigente`/`en_proceso`: el trámite ya tiene una validación utilizable. `reusada`: se clonó
            una validación vigente de la persona. `requiere_validacion`: no hay vigente → enviar a validar.
            `sin_actor`: la parte aún no tiene actor con documento.
        validationId:
          type: string
          format: uuid
          nullable: true
          description: Id de la validación clonada cuando `outcome=reusada`.
    RegistrarPrendaInput:
      type: object
      description: >
        Input de `PUT /instances/{id}/prenda` (HU #10594, ampliado por ADR-0055/HU #12129). Cerrado en
        `contracts/openapi/core-api.v1.yaml` como parte de la HU #12129 (brecha preexistente).
      required: [decision]
      properties:
        decision:
          type: string
          enum: [solicitar, registrar, levantar, omitir, sin_prenda]
        acreedorNombre:
          type: string
          nullable: true
          description: >
            Beneficiario del gravamen de ESTE hecho (constitución o levantamiento, según `decision`).
            Ignorado con `omitir` (Feature #13110).
        acreedorDocumento:
          type: string
          nullable: true
          description: >
            Documento del acreedor de ESTE hecho. `@pii:medium` — con captura dual (ADR-0055) cada
            familia trae el SUYO propio; no se mezcla con el de la familia contraria en ningún shape
            de respuesta (Security, ADR-0055). Ignorado con `omitir` (Feature #13110).
        levantamientoEntidad:
          type: string
          nullable: true
          description: Entidad/oficina ante la que se levantó el gravamen. Solo aplica a `decision=levantar`.
        metadataJson:
          type: string
          nullable: true
    PrendaDto:
      type: object
      description: >
        Contrato congelado de una decisión de prenda (compartido con el front). Desde ADR-0055
        (HU #12129), `GET /instances/{id}/prenda` devuelve un ARRAY de 0-2 de este DTO (uno por
        familia `constitucion`/`levantamiento` vigente), no un objeto nullable.
      required: [id, decision, estado, createdAt]
      properties:
        id: { type: string, format: uuid }
        decision:
          type: string
          enum: [solicitar, registrar, levantar, omitir, sin_prenda]
        estado:
          type: string
          enum: [vigente, reemplazada]
        acreedorNombre: { type: string, nullable: true }
        acreedorDocumento:
          type: string
          nullable: true
          description: '@pii:medium — documento del acreedor de ESTE hecho (no se mezcla con el de la familia contraria).'
        levantamientoEntidad: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    IniciarBiometriaInput:
      type: object
      required: [nombre, tipoDoc, documento, email]
      properties:
        parte:
          type: string
          enum: [comprador, vendedor]
          nullable: true
          description: Parte del trámite (vacío/null en matrícula inicial).
        nombre: { type: string }
        tipoDoc: { type: string, example: CC }
        documento: { type: string }
        email: { type: string, format: email }
    BiometricValidationDto:
      type: object
      required: [id, status, intentos, maxIntentos, expiresAt, expired, provider]
      properties:
        id: { type: string, format: uuid }
        partyRole: { type: string, nullable: true }
        name: { type: string }
        documentType: { type: string }
        documentNumber: { type: string }
        email: { type: string }
        status:
          type: string
          enum: [enviado, en_proceso, aprobado, rechazado, expirado, pendiente_envio, error_envio]
        intentos: { type: integer }
        maxIntentos: { type: integer }
        score: { type: integer, nullable: true }
        expiresAt: { type: string, format: date-time }
        validatedAt: { type: string, format: date-time, nullable: true }
        expired: { type: boolean }
        provider:
          type: string
          enum: [mock, kyverum]
          description: Proveedor de la validación (HU #10233).
        captureUrl:
          type: string
          nullable: true
          description: URL de captura de Kyverum. Solo presente con provider=kyverum y estado=en_proceso (AC9).
        rejectionReason:
          type: string
          nullable: true
          description: >
            Motivo de rechazo SANITIZADO (sin PII), solo presente con status=rechazado (HU #10234 AC4).
            Para mock proviene del scorer; para Kyverum se deriva de las coincidencias del payload.
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: 'Fecha de registro de la validación (historial por persona: más reciente → más antigua).'
        ordinal:
          type: integer
          nullable: true
          description: >
            ADR-0053 (Múltiple Propietario) — posición (1..4) del actor de `partyRole` al que
            pertenece esta validación (1 = principal/solidario). Permite emparejar la fila con la
            pestaña del actor sin comparar documentos. `null` cuando no se pudo atribuir a un actor
            concreto (validación histórica/huérfana). Con 1 solo actor por lado (caso mayoritario)
            siempre trae `1`.
        approvalOrigin:
          type: string
          nullable: true
          enum: [automatica, manual]
          description: >
            HU #13303 (Épica #13202) — cómo se aprobó la validación: `automatica` (Kyverum/mock) o `manual` (revisión del
            Super Admin). Solo con status=aprobado; `null` en cualquier otro estado y en aprobaciones anteriores al campo.
            Nunca trae el nombre del revisor.
        rejectionReasonCode:
          type: string
          nullable: true
          enum: [imagen_borrosa, rostro_no_coincide, documento_ilegible_o_incompleto, documento_no_corresponde, firma_ilegible_o_no_corresponde, captura_fuera_de_encuadre]
          description: >
            Épica #13202 — código homologado del motivo que eligió el Super Admin al rechazar una validación MANUAL. Solo con
            status=rechazado y provider=manual; `null` en cualquier otro caso (las rechazadas de Kyverum/mock siguen con
            `rejectionReason`). Sin texto libre ni PII.
    BiometricValidationsResponse:
      type: object
      required: [validations, provider]
      description: >
        Respuesta de `GET /instances/{id}/biometric`. No estaba documentada hasta ahora (brecha
        preexistente); se documenta junto con ADR-0053 porque `firmaBaulActores` es parte de ese cierre.
      properties:
        validations:
          type: array
          items:
            $ref: "#/components/schemas/BiometricValidationDto"
        provider:
          type: string
          enum: [mock, kyverum]
          description: Proveedor biométrico CONFIGURADO (no por-validación); provider-aware del botón "Validar identidad".
        firmaBaulPartes:
          type: array
          items: { type: string, enum: [comprador, vendedor] }
          nullable: true
          description: >
            HU #11014 (ADR-0025 §4) — roles cuya identidad queda cubierta por la firma del baúl.
            ADR-0053 (Múltiple Propietario): con 2+ actores jurídicos del mismo rol, este campo es
            IMPRECISO A PROPÓSITO (rol presente si AL MENOS un actor de ese rol está cubierto) — se
            conserva sin cambios para no romper a quien ya lo consume a nivel de rol. Usar
            `firmaBaulActores` para la cobertura exacta por actor.
        supersededValidations:
          type: array
          items:
            $ref: "#/components/schemas/BiometricValidationDto"
          nullable: true
          description: >
            Bug #11615 — intentos NO vigentes de una parte que ya tiene identidad aprobada y vigente
            (propia o referenciada). Salen de `validations` para no suplantar el estado vigente, pero
            siguen viajando aquí (histórico completo). Null cuando no hay ninguno.
        motivosNoEnvio:
          type: array
          items:
            $ref: "#/components/schemas/EnvioValidacionMotivoDto"
          nullable: true
          description: >
            HU #11665 — por qué no se envió la validación de identidad a un rol jurídico. Derivado al
            vuelo, nunca persistido. ADR-0053: un motivo representativo por ROL (no por actor) — el
            contrato no distingue actor aquí, a diferencia de `validations`/`firmaBaulActores`. Null
            cuando no hay ninguno.
        firmaBaulActores:
          type: array
          items:
            $ref: "#/components/schemas/FirmaBaulActorCoberturaDto"
          nullable: true
          description: >
            ADR-0053 (Múltiple Propietario) — cobertura del baúl POR ACTOR específico (documento +
            ordinal), aditivo a `firmaBaulPartes`. Permite al frontend no pintar "firmado desde el
            baúl" a un copropietario que en realidad todavía necesita validar su identidad. Null
            cuando ningún actor está cubierto por el baúl.
    FirmaBaulActorCoberturaDto:
      type: object
      required: [parte, documentNumber, ordinal]
      description: >
        ADR-0053 (Múltiple Propietario) — cobertura del baúl de UN actor específico dentro de su rol.
      properties:
        parte: { type: string, enum: [comprador, vendedor] }
        documentNumber:
          type: string
          description: >
            Documento del SUJETO de identidad (el representante legal — el baúl solo aplica a persona
            jurídica, ver `FirmaBaulCobertura.Aplica`).
        ordinal:
          type: integer
          description: Posición (1..4) del actor dentro de su rol.
    EnvioValidacionMotivoDto:
      type: object
      required: [parte, codigo, informativo]
      description: >
        HU #11665 — motivo tipificado de no envío de la validación de identidad, por rol.
        `informativo=true` no es un fallo: explica una ausencia legítima (el rol ya está cubierto) y la
        UI no debe pintarlo como bloqueo.
      properties:
        parte: { type: string, enum: [comprador, vendedor] }
        codigo: { type: string }
        informativo: { type: boolean }
    TenantBiometricValidationDto:
      type: object
      required: [id, name, documentType, documentNumber, status, provider, expired, createdAt, email, attempts, maxAttempts, resendCount, linkedProcedures]
      description: Fila de la vista transversal del submódulo de Validaciones (HU #10234).
      properties:
        id: { type: string, format: uuid }
        instanceId:
          type: string
          format: uuid
          nullable: true
          description: >
            Instancia (trámite) a la que pertenece la validación (para navegar). Null para
            prevalidaciones standalone (HU #10865/#10867).
        referenceNumber:
          type: string
          nullable: true
          description: >
            Referencia del trámite (p.ej. TRM-2026-000007). Null para prevalidaciones standalone.
        modalidad:
          type: string
          nullable: true
          description: >
            Modalidad de entrada del trámite (matricula_inicial | traspaso). Null para prevalidaciones
            standalone.
        partyRole: { type: string, nullable: true }
        name: { type: string }
        documentType: { type: string }
        documentNumber:
          type: string
          description: Documento de la persona (la UI lo enmascara al pintarlo).
        status:
          type: string
          enum: [enviado, en_proceso, aprobado, rechazado, expirado, pendiente_envio, error_envio]
        score: { type: integer, nullable: true }
        provider:
          type: string
          enum: [mock, kyverum]
        expired: { type: boolean }
        rejectionReason:
          type: string
          nullable: true
          description: Motivo de rechazo SANITIZADO (sin PII), solo con status=rechazado.
        createdAt: { type: string, format: date-time }
        validatedAt: { type: string, format: date-time, nullable: true }
        email:
          type: string
          format: email
          description: >
            CF-05 (Feature #11004) — correo de la validación. Vista autenticada del gestor del tenant
            (D3): completo, sin enmascarar. Solo visible en Validaciones y Prevalidaciones — no en
            exports/Dashboard.
        attempts:
          type: integer
          description: Intentos ya realizados (CF-06, Feature #11004).
        maxAttempts:
          type: integer
          description: Tope de intentos permitidos.
        resendCount:
          type: integer
          description: Veces que se reenvió la validación (HU #10943).
        lastResentAt:
          type: string
          format: date-time
          nullable: true
          description: Momento del último reenvío. Null si nunca se ha reenviado.
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: >
            Fin de vigencia de la identidad APROBADA (validatedAt + 30 días, medianoche Colombia). La
            estampa el código al aprobar. Null si no hay aprobación (HU #10350).
        daysRemaining:
          type: integer
          nullable: true
          description: >
            Días calendario restantes de vigencia (0 = vencida). Se calcula al vuelo contra HOY, no se
            persiste. Null si no hay aprobación (HU #10350).
        linkedProcedures:
          type: array
          description: >
            Feature #11066 — otros trámites del tenant con validaciones de la misma identidad (documento).
            El trámite primario sigue en instanceId/referenceNumber.
          items:
            $ref: "#/components/schemas/LinkedProcedureDto"
    LinkedProcedureDto:
      type: object
      required: [instanceId, referenceNumber, status]
      properties:
        instanceId: { type: string, format: uuid }
        referenceNumber: { type: string }
        status: { type: string }
    BiometricValidationStatsDto:
      type: object
      required: [total, aprobadas, enProceso, rechazadas, expiradas]
      description: KPIs agregados del submódulo de Validaciones (exactos, sin el cap de filas).
      properties:
        total: { type: integer }
        aprobadas: { type: integer }
        enProceso:
          type: integer
          description: Validaciones en curso (enviado + en_proceso).
        rechazadas: { type: integer }
        expiradas: { type: integer }
    TenantBiometricValidationsResponse:
      type: object
      required: [validations, stats, page, pageSize, total]
      properties:
        validations:
          type: array
          description: Filas de la PÁGINA pedida (no todo el conjunto).
          items:
            $ref: "#/components/schemas/TenantBiometricValidationDto"
        stats:
          $ref: "#/components/schemas/BiometricValidationStatsDto"
        page:
          type: integer
          description: Página devuelta (1-based).
        pageSize:
          type: integer
          description: Filas por página efectivas (acotadas a [10, 50]).
        total:
          type: integer
          description: Total de filas del conjunto filtrado completo (para calcular el nº de páginas).
    TenantBiometricPersonDto:
      type: object
      required: [documentType, documentNumber, name, status, validationCount, latestValidationId, email, provider, expired, createdAt]
      description: Fila agrupada por persona (HU #11270 / ADR-0040).
      properties:
        documentType: { type: string }
        documentNumber: { type: string }
        name: { type: string }
        status: { type: string }
        validationCount: { type: integer }
        worstAlertKind:
          type: string
          nullable: true
          enum: [atascada, rechazada, expirada, por_vencer]
        latestValidationId: { type: string, format: uuid }
        instanceId: { type: string, format: uuid, nullable: true }
        referenceNumber: { type: string, nullable: true }
        modalidad: { type: string, nullable: true }
        partyRole: { type: string, nullable: true }
        email: { type: string }
        provider: { type: string }
        score: { type: integer, nullable: true }
        captureUrl:
          type: string
          nullable: true
          description: URL de captura de la validación más reciente (null si aún no hay enlace).
        expired: { type: boolean }
        createdAt: { type: string, format: date-time }
        validatedAt: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        daysRemaining: { type: integer, nullable: true }
        linkExpiresAt: { type: string, format: date-time, nullable: true }
    TenantBiometricPersonsResponse:
      type: object
      required: [persons, stats, page, pageSize, total]
      properties:
        persons:
          type: array
          items:
            $ref: "#/components/schemas/TenantBiometricPersonDto"
        stats:
          $ref: "#/components/schemas/BiometricValidationStatsDto"
          description: KPIs de VALIDACIONES (no personas).
        page: { type: integer }
        pageSize: { type: integer }
        total:
          type: integer
          description: Total de personas del conjunto filtrado.
    PersonBiometricValidationsResponse:
      type: object
      required: [documentType, documentNumber, validations, page, pageSize, total, allTerminal]
      description: Historial multi-validación por persona (HU #11272).
      properties:
        documentType: { type: string }
        documentNumber: { type: string }
        name: { type: string, nullable: true }
        validations:
          type: array
          items:
            $ref: "#/components/schemas/BiometricValidationDto"
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        allTerminal:
          type: boolean
          description: True si no hay validaciones no terminales; la UI puede detener el polling.
    IdentityAuditEventDto:
      type: object
      required: [occurredAt, stage, outcome]
      description: Una fila de la bitácora de identidad, expuesta a la API (sin secretos ni PII).
      properties:
        occurredAt: { type: string, format: date-time }
        stage:
          type: string
          description: >
            send|send_response|send_error|webhook_received|webhook_not_verifiable|
            webhook_signature_invalid|webhook_applied|reconcile
        outcome: { type: string }
        httpStatus: { type: integer, nullable: true }
        signaturePresent: { type: boolean, nullable: true }
        secretPresent: { type: boolean, nullable: true }
        decryptOk: { type: boolean, nullable: true }
        providerStatus: { type: string, nullable: true }
        errorType: { type: string, nullable: true }
        message: { type: string, nullable: true }
    IdentityAuditResponse:
      type: object
      required: [validationId, events]
      description: >
        Respuesta de la bitácora (CF-07, Feature #11004). referencedFromOtherProcedure = true cuando la
        identidad está reutilizada de OTRO trámite del mismo cliente (solo aplica al endpoint por-instancia;
        el endpoint por-validationId no tiene ese contexto y siempre reporta false).
      properties:
        validationId: { type: string, format: uuid }
        referencedFromOtherProcedure:
          type: boolean
          default: false
        events:
          type: array
          items:
            $ref: "#/components/schemas/IdentityAuditEventDto"
    IniciarKyverumVerifyResult:
      type: object
      required: [validation, captureUrl]
      properties:
        validation:
          $ref: "#/components/schemas/BiometricValidationDto"
        captureUrl:
          type: string
          description: URL que abre el participante para completar la validación en Kyverum (vacía si `queued`).
        queued:
          type: boolean
          default: false
          description: >
            true = el envío falló transitoriamente y quedó encolado para reintento (estado `pendiente_envio`).

    IniciarPrevalidacionRequest:
      type: object
      required: [documentType, documentNumber, name, email]
      description: >
        Entrada para crear una prevalidación de identidad standalone (sin trámite) — HU #10866, CF-01.
        Para persona jurídica (personType='juridical') se requieren los campos legalRep*.
      properties:
        documentType:
          type: string
          maxLength: 20
          example: "CC"
          description: Tipo de documento de la persona (CC, CE, NIT, PP…)
        documentNumber:
          type: string
          maxLength: 40
          example: "1234567890"
        name:
          type: string
          maxLength: 200
          description: Nombre completo de la persona (o razón social si es jurídica).
        email:
          type: string
          format: email
          maxLength: 320
          description: Correo al que se envía el enlace de captura.
        personType:
          type: string
          enum: [natural, juridical]
          default: natural
          description: >
            'natural' → valida al titular; 'juridical' → valida al representante legal
            (campos legalRep* requeridos si personType='juridical').
        legalRepDocumentType:
          type: string
          maxLength: 20
          nullable: true
          description: Tipo de documento del representante legal.
        legalRepDocumentNumber:
          type: string
          maxLength: 40
          nullable: true
        legalRepName:
          type: string
          maxLength: 200
          nullable: true
        legalRepEmail:
          type: string
          format: email
          maxLength: 320
          nullable: true
          description: Correo del RL. Si vacío se usa el email de la empresa.

    IniciarPrevalidacionResult:
      type: object
      required: [validation, captureUrl]
      description: Resultado de crear una prevalidación standalone — HU #10866, CF-01.
      properties:
        validation:
          $ref: "#/components/schemas/BiometricValidationDto"
        captureUrl:
          type: string
          description: >
            URL de captura. Kyverum → URL real del proveedor. Mock → magic-link público.
            Vacío si queued=true (fallo transitorio).
        queued:
          type: boolean
          default: false
          description: >
            true = el proveedor Kyverum falló de forma transitoria y la validación quedó
            encolada para reintento automático (estado pendiente_envio, HTTP 202).

    EditarPrevalidacionRequest:
      type: object
      description: >
        Edición de una prevalidación standalone — HU #10943, CF-03, D7. Todos los campos son
        opcionales; documentType/documentNumber/legalRepDocumentType/legalRepDocumentNumber solo
        existen para DETECTAR un intento de cambiarlos (→ 422 documento_no_editable), nunca se
        persisten.
      properties:
        name:
          type: string
          maxLength: 200
          nullable: true
          description: Nuevo nombre del titular (persona natural o razón social).
        email:
          type: string
          format: email
          maxLength: 320
          nullable: true
          description: Nuevo correo del titular. Si difiere del actual, dispara el reenvío automático (D8).
        legalRepName:
          type: string
          maxLength: 200
          nullable: true
          description: Nuevo nombre del representante legal (solo persona jurídica).
        legalRepEmail:
          type: string
          format: email
          maxLength: 320
          nullable: true
          description: >
            Nuevo correo del representante legal (solo persona jurídica). Si difiere del actual,
            dispara el reenvío automático dirigido al RL (D8, AC3).
        documentType:
          type: string
          maxLength: 20
          nullable: true
          description: NO editable. Presente solo para detectar el intento (→ 422).
        documentNumber:
          type: string
          maxLength: 40
          nullable: true
          description: NO editable. Presente solo para detectar el intento (→ 422).
        legalRepDocumentType:
          type: string
          maxLength: 20
          nullable: true
          description: NO editable. Presente solo para detectar el intento (→ 422).
        legalRepDocumentNumber:
          type: string
          maxLength: 40
          nullable: true
          description: NO editable. Presente solo para detectar el intento (→ 422).

    EditarPrevalidacionResult:
      type: object
      required: [validation, resent]
      description: Resultado de editar una prevalidación standalone — HU #10943, CF-03.
      properties:
        validation:
          $ref: "#/components/schemas/BiometricValidationDto"
        captureUrl:
          type: string
          nullable: true
          description: >
            Enlace de captura NUEVO, solo si resent=true y el envío no quedó encolado (fallo
            transitorio del proveedor). Null si resent=false (no hubo cambio de correo).
        resent:
          type: boolean
          description: >
            true si el cambio de correo disparó el reenvío automático (D8); false si solo cambió
            el nombre (o ningún dato de contacto).

    ActivarIdentidadManualResult:
      type: object
      description: Estado resultante de activar el flujo manual (HU #13284). No incluye el token del enlace.
      properties:
        validationId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        procedureInstanceId: { type: string, format: uuid, nullable: true }
        provider: { type: string, enum: [manual] }
        status: { type: string, enum: [manual_activo] }
        expiresAt: { type: string, format: date-time, description: Vencimiento del enlace (24 h). }
        activatedAt: { type: string, format: date-time }
        kyverumCancelado: { type: boolean, description: true si había una verificación Kyverum en curso que se canceló. }
        origin:
          type: string
          enum: [tramite, prevalidacion, mandatario, representante_legal]
          description: >
            Origen de la validación (HU #13285). `mandatario` = fila con MandateSignerId (se conserva);
            `representante_legal` = prevalidación standalone de persona jurídica.
        emailEnviado: { type: boolean, description: false si el correo con el enlace no salió (titular sin correo o fallo de envío); el Super Admin puede regenerar el enlace. }
    VencerIdentidadResult:
      type: object
      description: Resultado de vencer una identidad aprobada y vigente (HU #13824).
      properties:
        validationId: { type: string, format: uuid, description: "La validación vencida (se conserva la fila)." }
        tenantId: { type: string, format: uuid }
        procedureInstanceId: { type: string, format: uuid, nullable: true, description: "Trámite dueño de la validación; null si es una prevalidación standalone." }
        vencidaAt: { type: string, format: date-time, description: "Instante del vencimiento (igual al nuevo validUntil)." }
        borradoresAfectados: { type: integer, description: "Trámites en borrador del tenant que usaban esa identidad y quedan sin firmar para esa persona." }
        enlaceEnviado: { type: boolean, description: "true si se abrió una validación nueva y se envió el enlace (también cuando quedó encolada)." }
        nuevaValidacionId: { type: string, format: uuid, nullable: true }
        tramiteBorradorId: { type: string, format: uuid, nullable: true, description: "Trámite en borrador más reciente que usaba la identidad (destino de la validación nueva)." }
        tramiteBorradorReferencia: { type: string, nullable: true, description: "Número de referencia del trámite destino." }
        enlaceCaptura: { type: string, nullable: true, description: "Enlace para copiar (URL de captura del proveedor o ruta /biometric/{token} con el proveedor mock). Null si no se envió o quedó encolada." }
        enCola: { type: boolean, description: "true si el proveedor estaba caído y la validación quedó en pendiente_envio (el worker la enviará)." }
        motivoSinEnlace:
          type: string
          nullable: true
          description: Por qué no se envió enlace. `sin_borradores` (ningún trámite en borrador la usaba), `validacion_en_curso`, `proveedor_error`, `proveedor_no_disponible`, `datos_incompletos`, `actor_requerido`, etc.
    RegenerarEnlaceManualResult:
      type: object
      description: Estado resultante de regenerar el enlace de captura manual (HU #13287). No incluye el token del enlace.
      properties:
        validationId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        procedureInstanceId: { type: string, format: uuid, nullable: true }
        provider: { type: string, enum: [manual] }
        status: { type: string, enum: [manual_activo, rechazado] }
        expiresAt: { type: string, format: date-time, description: Vencimiento del enlace NUEVO (24 h desde ahora). }
        activatedAt: { type: string, format: date-time, nullable: true, description: Cuándo se activó el flujo manual. }
        emailEnviado: { type: boolean, description: false si el correo con el enlace no salió; se puede volver a regenerar. }
    AprobarValidacionManualResult:
      type: object
      description: Estado resultante de aprobar una validación manual (HU #13298).
      properties:
        validationId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        procedureInstanceId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [aprobado] }
        approvalOrigin: { type: string, enum: [manual] }
        validatedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time, description: Fin de vigencia (30 días desde la aprobación). }
        reviewedAt: { type: string, format: date-time }
    ManualRejectionReason:
      type: object
      required: [code, label]
      description: Motivo homologado de rechazo de una validación manual (HU #13299).
      properties:
        code:
          type: string
          enum: [imagen_borrosa, rostro_no_coincide, documento_ilegible_o_incompleto, documento_no_corresponde, firma_ilegible_o_no_corresponde, captura_fuera_de_encuadre]
        label: { type: string, description: Etiqueta en español legible (la del correo al cliente). }
    RechazarValidacionManualRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          description: Código de la lista cerrada (`GET .../manual-rejection-reasons`).
    RechazarValidacionManualResult:
      type: object
      description: >
        Estado resultante de rechazar una validación manual (HU #13299). Tras rechazar la fila queda en `rechazado` con
        `rejectionReasonCode` no nulo y un enlace nuevo vigente hasta `linkExpiresAt`. No incluye el token del enlace.
      properties:
        validationId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        procedureInstanceId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [rechazado] }
        rejectionReasonCode: { type: string }
        reviewedAt: { type: string, format: date-time }
        linkExpiresAt: { type: string, format: date-time, description: Vencimiento del enlace NUEVO (24 h desde ahora). }
        emailEnviado: { type: boolean, description: false si el correo con el motivo y el enlace no salió; el Super Admin puede regenerar el enlace. }
    ManualDetail:
      type: object
      required: [id, fullName, documentNumber, tenantName, origin, status, images]
      description: >
        Detalle de una validación manual (HU #13297): `ManualListItem` + consentimiento del ciclo actual, estado de las 4
        imágenes, revisión y vencimiento del enlace. Sin rutas de storage ni IP.
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        documentNumber: { type: string }
        tenantName: { type: string }
        origin:
          type: string
          enum: [tramite, prevalidacion, mandatario, representante_legal]
        status:
          type: string
          enum: [manual_activo, pendiente_revision_manual, aprobado, rechazado, expirado]
        activatedAt: { type: string, format: date-time, nullable: true }
        waitingMinutes: { type: integer, nullable: true, description: Minutos en revisión; solo con estado pendiente_revision_manual (null en los demás). }
        consentAt: { type: string, format: date-time, nullable: true, description: Solo la constancia del ciclo actual. }
        consentTextVersion: { type: string, nullable: true }
        images:
          type: array
          description: Siempre las 4, en orden rostro, anverso, reverso, firma. `available` solo con captura del ciclo actual.
          items:
            type: object
            required: [kind, available]
            properties:
              kind: { type: string, enum: [rostro, anverso, reverso, firma] }
              available: { type: boolean }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewedBy: { type: string, nullable: true, description: Nombre visible del revisor (su id si ya no se resuelve). }
        rejectionReasonCode:
          type: string
          nullable: true
          description: >
            Código del último rechazo. Tras rechazar (HU #13299) el estado es `rechazado` con este campo no nulo hasta que el
            cliente envíe la captura nueva (que lo limpia).
        linkExpiresAt: { type: string, format: date-time, nullable: true, description: Vencimiento del enlace de captura; solo cuando se espera captura (manual_activo o rechazado con motivo). }
    ManualCaptureView:
      type: object
      required: [fullName, documentType, documentNumber, expiresAt, consentTextVersion]
      description: Datos de la pantalla de captura manual (HU #13289). Sin datos extra del trámite.
      properties:
        fullName: { type: string }
        documentType: { type: string }
        documentNumber: { type: string }
        productName: { type: string, nullable: true, description: Tipo de trámite; null en una prevalidación sin trámite. }
        expiresAt: { type: string, format: date-time, description: Vencimiento del enlace (24 h). }
        consentTextVersion: { type: string, description: Versión vigente del texto de consentimiento (única constante del backend). }
    ManualCaptureError:
      type: object
      required: [code, message]
      description: Error de los endpoints públicos de captura manual.
      properties:
        code: { type: string, description: "not_found, expirada, estado_invalido, consentimiento_requerido, consentimiento_no_aceptado, version_texto_invalida, ..." }
        message: { type: string }
    ReenviarPrevalidacionResult:
      type: object
      required: [validation, captureUrl]
      description: Resultado de reenviar manualmente una prevalidación standalone — HU #10943, CF-03.
      properties:
        validation:
          $ref: "#/components/schemas/BiometricValidationDto"
        captureUrl:
          type: string
          description: >
            URL de captura NUEVA. Kyverum → URL real del proveedor. Mock → magic-link público.
            Vacío si queued=true (fallo transitorio).
        queued:
          type: boolean
          default: false
          description: >
            true = el proveedor Kyverum falló de forma transitoria y la validación quedó encolada
            para reintento automático (estado pendiente_envio, HTTP 202). El reenvío YA consumió
            cupo del tope (D10) aunque el envío no se completó.

    KyverumWebhookPayload:
      type: object
      required: [evento, data]
      properties:
        evento:
          type: string
          enum: [validation.completed, validation.rejected]
        requestId:
          type: string
          format: uuid
        deliveryId:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        data:
          type: object
          required: [aprobado]
          properties:
            aprobado:
              type: boolean
              description: true = identidad aprobada; false = rechazada.
            closedAt:
              type: string
              format: date-time
            subjects:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  rol: { type: string }
                  documento: { type: string }
                  status: { type: string, enum: [aprobado, rechazado] }
                  score: { type: integer }
                  firmaSerie: { type: string }
                  coincidencias:
                    type: object
                    properties:
                      documento: { type: boolean }
                      nombre: { type: boolean }

    StatusCount:
      type: object
      description: Conteo de trámites en un estado dentro de una categoría.
      properties:
        status: { type: string, example: submitted }
        count: { type: integer, example: 40 }
      required: [status, count]

    CategoryMetrics:
      type: object
      description: Métricas de una categoría (matriculas/traspasos/otros).
      properties:
        category: { type: string, enum: [matriculas, traspasos, otros] }
        total: { type: integer, example: 120 }
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
      required: [category, total, byStatus]

    AnalyticsOverviewResponse:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        # BUG #12588 — null cuando la consulta no acotó por fecha (universo completo).
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryMetrics"
      required: [tenantId, categories]

    TopProducer:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string, example: "Ana Pérez" }
        submittedCount: { type: integer, example: 40 }
        approvedCount: { type: integer, example: 12 }
        rejectedCount: { type: integer, example: 3 }
      required: [userId, displayName, submittedCount, approvedCount, rejectedCount]

    TopProducersResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopProducer"
      required: [items]

    ProcedureDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        referenceNumber: { type: string, example: "TRM-2026-000008" }
        procedureTypeName: { type: string, example: "Matrícula nueva de vehículo" }
        category: { type: string, enum: [matriculas, traspasos, otros] }
        status: { type: string, example: submitted }
        createdByDisplayName: { type: string, example: "Ana Pérez" }
        submittedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
      required: [id, referenceNumber, procedureTypeName, category, status, createdByDisplayName]

    ProcedureDetailsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureDetail"
        totalCount: { type: integer, example: 1268 }
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
      required: [items, totalCount, page, pageSize]

    ExecutivePdfRequest:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        tenantId: { type: string, format: uuid, nullable: true, description: "Solo SuperAdmin." }
      required: [from, to]

    GenerarImprontaRequest:
      type: object
      description: >
        Datos del vehículo y de la organización solicitante para generar el Certificado de
        Improntas Digitales (Res. 17145/2023). Placa y documento son obligatorios; Kyverum RUNT
        resuelve motor/chasis/serie internamente vía placa+documento cuando no se envían
        (verificado contra el proveedor real). El certificado siempre imprime los tres bloques,
        marcando "(SIN DATO)" los que no se resuelvan.
      properties:
        placa: { type: string }
        documento:
          type: string
          description: >
            Documento de identidad del propietario del vehículo. Requerido por Kyverum RUNT para
            toda consulta por placa (no documentado originalmente en el contrato del proveedor).
        numMotor: { type: string, nullable: true }
        numChasis: { type: string, nullable: true }
        numSerie: { type: string, nullable: true }
        marca: { type: string, nullable: true }
        linea: { type: string, nullable: true }
        modelo: { type: string, nullable: true }
        orgNombre: { type: string }
        orgNit: { type: string, nullable: true }
        orgCiudad: { type: string, nullable: true }
        operador: { type: string }
      required: [placa, documento, orgNombre, operador]

    # ──────────────────────────────────────────────────────────────────────────
    # Reportes 2.0 — métricas (§4 del contrato docs/contratos-reportes-v2.md)
    # ──────────────────────────────────────────────────────────────────────────

    EstadoTramiteN03:
      type: string
      description: Estado de negocio N03 del ciclo de vida del trámite (ADR-0022, vocabulario en español).
      enum: [borrador, anulado, preparado, entregado, aprobado, rechazado]

    ComparisonInfo:
      type: object
      description: >
        Metadato de la ventana de comparación aplicada (`compareWith`): `previous_period` =
        ventana de la misma duración inmediatamente anterior a `from`; `previous_year` = mismas
        fechas un año atrás. La variación porcentual la calcula el frontend.
      properties:
        mode: { type: string, enum: [previous_period, previous_year] }
        from: { type: string, format: date }
        to: { type: string, format: date }
      required: [mode, from, to]

    OtMetricsSummary:
      type: object
      description: KPIs de cabecera de la pestaña Organismo de Tránsito.
      properties:
        entregados:
          type: integer
          description: Transiciones a `entregado` dentro del rango (por `changed_at`).
        aprobados: { type: integer }
        rechazados: { type: integer }
        rejectionRatePct:
          type: number
          description: rechazados / (aprobados + rechazados) * 100.
        avgApprovalHours:
          type: number
          nullable: true
          description: >
            Horas entre la ÚLTIMA transición a `entregado` y la siguiente decisión
            (aprobado/rechazado) de la misma instancia, decidida dentro del rango. Null sin decididos.
        p50ApprovalHours: { type: number, nullable: true }
        p90ApprovalHours: { type: number, nullable: true }
        reincidencePct:
          type: number
          description: Porcentaje de rechazados que volvieron a borrador.
        stuckCount: { type: integer }
      required: [entregados, aprobados, rechazados, rejectionRatePct, avgApprovalHours, p50ApprovalHours, p90ApprovalHours, reincidencePct, stuckCount]

    RejectionByOfficeItem:
      type: object
      description: Tasa de rechazo por Organismo de Tránsito.
      properties:
        transitOfficeId: { type: string, format: uuid }
        transitOfficeName: { type: string }
        entregados: { type: integer }
        aprobados: { type: integer }
        rechazados: { type: integer }
        rejectionRatePct: { type: number }
      required: [transitOfficeId, transitOfficeName, entregados, aprobados, rechazados, rejectionRatePct]

    RejectionByReasonItem:
      type: object
      description: Distribución de causales de rechazo (texto libre de `reason`).
      properties:
        reason: { type: string, example: Documento ilegible }
        count: { type: integer }
        pct: { type: number }
      required: [reason, count, pct]

    RejectionByTypeItem:
      type: object
      description: Tasa de rechazo por tipo de trámite.
      properties:
        procedureTypeId: { type: string, format: uuid }
        procedureTypeName: { type: string }
        entregados: { type: integer }
        rechazados: { type: integer }
        rejectionRatePct: { type: number }
      required: [procedureTypeId, procedureTypeName, entregados, rechazados, rejectionRatePct]

    ApprovalTimesByOfficeItem:
      type: object
      description: Tiempos entregado→decisión por OT (avg/p50/p90 en horas).
      properties:
        transitOfficeId: { type: string, format: uuid }
        transitOfficeName: { type: string }
        decididos: { type: integer }
        avgHours: { type: number, nullable: true }
        p50Hours: { type: number, nullable: true }
        p90Hours: { type: number, nullable: true }
      required: [transitOfficeId, transitOfficeName, decididos, avgHours, p50Hours, p90Hours]

    OfficeRankingItem:
      type: object
      description: >
        Ranking de agilidad de OTs: orden por p50 de horas de decisión ascendente, desempate por
        tasa de rechazo ascendente; solo OTs con al menos un trámite decidido.
      properties:
        transitOfficeId: { type: string, format: uuid }
        transitOfficeName: { type: string }
        rank: { type: integer, example: 1 }
        p50Hours: { type: number }
        rejectionRatePct: { type: number }
        volumen: { type: integer }
      required: [transitOfficeId, transitOfficeName, rank, p50Hours, rejectionRatePct, volumen]

    ReincidenceInfo:
      type: object
      description: >
        Reincidencia: instancias con transición rechazado→borrador; ciclos = veces que la
        instancia pasó por `rechazado`.
      properties:
        rechazadas: { type: integer }
        reintentadas: { type: integer }
        avgCiclos: { type: number }
        maxCiclos: { type: integer }
      required: [rechazadas, reintentadas, avgCiclos, maxCiclos]

    StuckItem:
      type: object
      description: Trámite atascado (más de `stuckDays` días sin transición en estado no final).
      properties:
        instanceId: { type: string, format: uuid }
        referenceNumber: { type: string, example: "TRM-2026-000007" }
        status:
          $ref: "#/components/schemas/EstadoTramiteN03"
        daysInStatus: { type: number, example: 12.3 }
        transitOfficeName: { type: string, nullable: true }
        procedureTypeName: { type: string }
        createdByDisplayName: { type: string }
      required: [instanceId, referenceNumber, status, daysInStatus, transitOfficeName, procedureTypeName, createdByDisplayName]

    StuckInfo:
      type: object
      description: Atascados del universo filtrado; `items` trae el top 50 por días en el estado.
      properties:
        totalCount: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/StuckItem"
      required: [totalCount, items]

    OtMetricsData:
      type: object
      description: Cuerpo de métricas OT de una ventana (current o previous).
      properties:
        summary:
          $ref: "#/components/schemas/OtMetricsSummary"
        rejectionByOffice:
          type: array
          items:
            $ref: "#/components/schemas/RejectionByOfficeItem"
        rejectionByReason:
          type: array
          items:
            $ref: "#/components/schemas/RejectionByReasonItem"
        rejectionByType:
          type: array
          items:
            $ref: "#/components/schemas/RejectionByTypeItem"
        approvalTimesByOffice:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalTimesByOfficeItem"
        officeRanking:
          type: array
          items:
            $ref: "#/components/schemas/OfficeRankingItem"
        reincidence:
          $ref: "#/components/schemas/ReincidenceInfo"
        stuck:
          $ref: "#/components/schemas/StuckInfo"
      required: [summary, rejectionByOffice, rejectionByReason, rejectionByType, approvalTimesByOffice, officeRanking, reincidence, stuck]

    OtMetricsResponse:
      type: object
      description: >
        Respuesta de `GET /analytics/ot-metrics` (§4.2). `previous` y `comparison` solo vienen
        con `compareWith`; el backend NO manda deltas (los calcula el frontend).
      properties:
        current:
          $ref: "#/components/schemas/OtMetricsData"
        previous:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/OtMetricsData"
          description: Misma forma que `current` sobre la ventana comparada; null sin `compareWith`.
        comparison:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ComparisonInfo"
      required: [current, previous, comparison]

    WizardStepMetric:
      type: object
      description: >
        Métrica agregada de un paso del wizard (telemetría HU-A). abandonmentPct =
        (1 - completions/views) * 100 (0 si views = 0); duraciones desde `duration_ms` de
        `wizard_step_complete`.
      properties:
        stepKey: { type: string, example: comprador }
        views: { type: integer }
        completions: { type: integer }
        abandonmentPct: { type: number }
        avgDurationMs: { type: number, nullable: true }
        medianDurationMs: { type: number, nullable: true }
      required: [stepKey, views, completions, abandonmentPct, avgDurationMs, medianDurationMs]

    FunnelStage:
      type: object
      description: Etapa del funnel (instancias distintas que la alcanzaron dentro del rango).
      properties:
        stage:
          $ref: "#/components/schemas/EstadoTramiteN03"
        count: { type: integer }
        pctOfFirst:
          type: number
          description: Porcentaje sobre la primera etapa (borrador).
        pctOfPrev:
          type: number
          description: Porcentaje sobre la etapa anterior.
      required: [stage, count, pctOfFirst, pctOfPrev]

    FunnelData:
      type: object
      description: Cuerpo del funnel de una ventana (current o previous).
      properties:
        states:
          type: array
          description: Etapas borrador→preparado→entregado→aprobado (por `created_at` de la instancia).
          items:
            $ref: "#/components/schemas/FunnelStage"
        anulados: { type: integer }
        rechazadosVigentes:
          type: integer
          description: Rechazados cuyo estado ACTUAL sigue siendo rechazado.
        wizardSteps:
          type: array
          description: Métricas por paso del wizard; vacío si no hay telemetría.
          items:
            $ref: "#/components/schemas/WizardStepMetric"
      required: [states, anulados, rechazadosVigentes, wizardSteps]

    FunnelResponse:
      type: object
      description: Respuesta de `GET /analytics/funnel` (§4.3), con la misma envoltura comparada que ot-metrics.
      properties:
        current:
          $ref: "#/components/schemas/FunnelData"
        previous:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FunnelData"
        comparison:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ComparisonInfo"
      required: [current, previous, comparison]

    ModuleUsageItem:
      type: object
      description: Uso agregado de un módulo del aplicativo (`module_view` + `api_module_access`).
      properties:
        module: { type: string, example: tramites }
        events: { type: integer }
        uniqueUsers: { type: integer }
      required: [module, events, uniqueUsers]

    PeakHourItem:
      type: object
      description: Celda del heatmap de horas pico (hora America/Bogota), sobre TODOS los eventos.
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = domingo … 6 = sábado.
        hour: { type: integer, minimum: 0, maximum: 23 }
        events: { type: integer }
      required: [dayOfWeek, hour, events]

    DocumentReplacementItem:
      type: object
      description: >
        Reemplazos de documentos por tipo. "Reemplazo" = filas adicionales con el mismo
        (instancia, tipo) en attachments más allá de la primera (orden por `uploaded_at`).
      properties:
        documentTipo: { type: string, example: cedula }
        uploads: { type: integer }
        replacements: { type: integer }
      required: [documentTipo, uploads, replacements]

    ExternalApiMetricItem:
      type: object
      description: >
        Llamadas a integraciones externas desde `admin.ot_api_call_logs`; errores =
        `response_code >= 400` o `error_message` no nulo.
      properties:
        endpoint: { type: string }
        direction: { type: string, example: outbound }
        calls: { type: integer }
        errors: { type: integer }
        errorRatePct: { type: number }
        avgDurationMs: { type: number, nullable: true }
        p90DurationMs: { type: number, nullable: true }
      required: [endpoint, direction, calls, errors, errorRatePct, avgDurationMs, p90DurationMs]

    UsageData:
      type: object
      description: Cuerpo de métricas de uso de una ventana (current o previous).
      properties:
        moduleUsage:
          type: array
          items:
            $ref: "#/components/schemas/ModuleUsageItem"
        wizardSteps:
          type: array
          items:
            $ref: "#/components/schemas/WizardStepMetric"
        peakHours:
          type: array
          items:
            $ref: "#/components/schemas/PeakHourItem"
        documentReplacements:
          type: array
          items:
            $ref: "#/components/schemas/DocumentReplacementItem"
        externalApis:
          type: array
          items:
            $ref: "#/components/schemas/ExternalApiMetricItem"
        avgWizardDurationMs:
          type: number
          nullable: true
          description: Duración media del wizard completo (ms); null sin datos.
        medianWizardDurationMs: { type: number, nullable: true }
      required: [moduleUsage, wizardSteps, peakHours, documentReplacements, externalApis, avgWizardDurationMs, medianWizardDurationMs]

    UsageResponse:
      type: object
      description: Respuesta de `GET /analytics/usage` (§4.4), con la misma envoltura comparada que ot-metrics.
      properties:
        current:
          $ref: "#/components/schemas/UsageData"
        previous:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UsageData"
        comparison:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ComparisonInfo"
      required: [current, previous, comparison]

    LiveStatusCount:
      type: object
      description: Conteo por estado ACTUAL de instancias activas (no finales) del tenant.
      properties:
        status:
          $ref: "#/components/schemas/EstadoTramiteN03"
        count: { type: integer }
      required: [status, count]

    LiveTodayInfo:
      type: object
      description: Actividad de HOY (día calendario America/Bogota).
      properties:
        creados: { type: integer }
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/LiveStatusCount"
        entregados:
          type: integer
          description: Transiciones de hoy a `entregado`.
        aprobados: { type: integer }
        rechazados: { type: integer }
      required: [creados, byStatus, entregados, aprobados, rechazados]

    IntegrationsLastHourInfo:
      type: object
      description: Integraciones externas de la última hora.
      properties:
        calls: { type: integer }
        errors: { type: integer }
        avgDurationMs: { type: number, nullable: true }
      required: [calls, errors, avgDurationMs]

    LiveOverviewResponse:
      type: object
      description: Respuesta de `GET /analytics/live-overview` (§4.5). Sin envoltura comparada.
      properties:
        generatedAt: { type: string, format: date-time }
        today:
          $ref: "#/components/schemas/LiveTodayInfo"
        stuckCount: { type: integer }
        pendingIdentityValidations:
          type: integer
          description: Validaciones biométricas con estado pendiente/en proceso.
        integrationsLastHour:
          $ref: "#/components/schemas/IntegrationsLastHourInfo"
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
          description: Último cambio de estado o evento de telemetría; null si no hay actividad.
      required: [generatedAt, today, stuckCount, pendingIdentityValidations, integrationsLastHour, lastActivityAt]

    # ──────────────────────────────────────────────────────────────────────────
    # Reportes 2.0 — telemetría de uso (§4.6/§7 del contrato)
    # ──────────────────────────────────────────────────────────────────────────

    UsageEventType:
      type: string
      description: >
        Taxonomía CERRADA de eventos de telemetría (§7): los tipos desconocidos se descartan
        silenciosamente en el endpoint batch.
      enum:
        - module_view
        - api_module_access
        - wizard_server_view
        - wizard_step_view
        - wizard_step_complete
        - wizard_step_exit
        - wizard_abandon
        - wizard_complete

    UsageEventInput:
      type: object
      description: >
        Evento individual del lote. Sin tenant ni userId: SIEMPRE salen del JWT. `metadata` es
        un objeto JSON pequeño SIN PII (prohibido: nombres, documentos, emails, placas, VIN).
      properties:
        eventType:
          $ref: "#/components/schemas/UsageEventType"
        module: { type: string, nullable: true, maxLength: 40, example: tramites }
        stepKey: { type: string, nullable: true, maxLength: 40, example: comprador }
        procedureInstanceId: { type: string, format: uuid, nullable: true }
        durationMs:
          type: integer
          nullable: true
          minimum: 0
          description: Duración asociada (ms); negativa se descarta a null.
        occurredAt:
          type: string
          format: date-time
          nullable: true
          description: Instante del evento; ausente = now() del servidor.
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: jsonb libre SIN PII; si no es un objeto (o es demasiado grande) colapsa a {}.
      required: [eventType]

    UsageEventBatchRequest:
      type: object
      description: Lote de eventos de telemetría del frontend (máx. 50; más → 400 en español).
      properties:
        events:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/UsageEventInput"
      required: [events]

    UsageEventBatchAcceptedResponse:
      type: object
      description: Resultado del encolado best-effort del lote de telemetría.
      properties:
        accepted:
          type: integer
          description: Eventos aceptados (los fuera de taxonomía o descartados por saturación no cuentan).
          example: 3
      required: [accepted]

    # ──────────────────────────────────────────────────────────────────────────
    # Reportes 2.0 — informes programados y alertas (§4.7/§8 del contrato)
    # ──────────────────────────────────────────────────────────────────────────

    ReportScheduleDto:
      type: object
      description: Informe programado (tabla `analytics.report_schedules`).
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120, example: Informe semanal OT }
        reportType:
          type: string
          enum: [resumen, operacion, ot, uso, productividad]
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        dayOfWeek:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: Solo weekly; 0 = domingo … 6 = sábado.
        dayOfMonth:
          type: integer
          nullable: true
          minimum: 1
          maximum: 28
          description: Solo monthly (1..28 para existir en todos los meses).
        sendHour:
          type: integer
          minimum: 0
          maximum: 23
          description: Hora de envío (hora America/Bogota).
        format:
          type: string
          enum: [excel, pdf]
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: email }
        isActive: { type: boolean }
        lastSentAt: { type: string, format: date-time, nullable: true }
      required: [id, name, reportType, frequency, dayOfWeek, dayOfMonth, sendHour, format, recipients, isActive, lastSentAt]

    ReportScheduleInput:
      type: object
      description: >
        Alta/edición de un informe programado. Reglas: daily sin día; weekly requiere dayOfWeek
        (0-6) y sin dayOfMonth; monthly requiere dayOfMonth (1-28) y sin dayOfWeek; 1..10
        destinatarios válidos sin duplicados. Violaciones → 400 con detalle en español.
      properties:
        name: { type: string, maxLength: 120 }
        reportType:
          type: string
          enum: [resumen, operacion, ot, uso, productividad]
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        dayOfWeek: { type: integer, nullable: true, minimum: 0, maximum: 6 }
        dayOfMonth: { type: integer, nullable: true, minimum: 1, maximum: 28 }
        sendHour:
          type: integer
          minimum: 0
          maximum: 23
          default: 7
          description: Hora de envío (hora America/Bogota); ausente = 7.
        format:
          type: string
          enum: [excel, pdf]
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: email }
        isActive: { type: boolean, default: true }
      required: [name, reportType, frequency, format, recipients]

    ReportSchedulesListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportScheduleDto"
      required: [items]

    AlertRuleDto:
      type: object
      description: Regla de alerta por umbral (tabla `analytics.alert_rules`).
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120, example: Rechazo OT alto }
        metric:
          type: string
          enum: [rejection_rate_pct, stuck_count, external_api_errors, pending_identity_validations, ict_stuck_in_validation, ict_novelty_rate_pct, ict_webhook_delivery_failures, ict_jobs_out_of_sla]
        operator:
          type: string
          enum: [gt, gte, lt, lte]
        threshold: { type: number, example: 25.0 }
        windowMinutes:
          type: integer
          minimum: 5
          maximum: 43200
          description: Ventana de evaluación de la métrica (minutos).
        cooldownMinutes:
          type: integer
          minimum: 5
          maximum: 10080
          description: No re-disparar dentro del cooldown (minutos).
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: email }
        isActive: { type: boolean }
        lastTriggeredAt: { type: string, format: date-time, nullable: true }
      required: [id, name, metric, operator, threshold, windowMinutes, cooldownMinutes, recipients, isActive, lastTriggeredAt]

    AlertRuleInput:
      type: object
      description: >
        Alta/edición de una regla de alerta. `windowMinutes` ausente = 1440; `cooldownMinutes`
        ausente = 240; 1..10 destinatarios válidos. Violaciones → 400 con detalle en español.
      properties:
        name: { type: string, maxLength: 120 }
        metric:
          type: string
          enum: [rejection_rate_pct, stuck_count, external_api_errors, pending_identity_validations, ict_stuck_in_validation, ict_novelty_rate_pct, ict_webhook_delivery_failures, ict_jobs_out_of_sla]
        operator:
          type: string
          enum: [gt, gte, lt, lte]
        threshold: { type: number }
        windowMinutes: { type: integer, minimum: 5, maximum: 43200, default: 1440 }
        cooldownMinutes: { type: integer, minimum: 5, maximum: 10080, default: 240 }
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: email }
        isActive: { type: boolean, default: true }
      required: [name, metric, operator, threshold, recipients]

    AlertRulesListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertRuleDto"
      required: [items]

    AlertEventDto:
      type: object
      description: Disparo registrado de una alerta (tabla `analytics.alert_events`).
      properties:
        id: { type: string, format: uuid }
        alertRuleId: { type: string, format: uuid }
        ruleName: { type: string }
        triggeredAt: { type: string, format: date-time }
        metricValue: { type: number, example: 31.2 }
        threshold: { type: number, example: 25.0 }
        notified:
          type: boolean
          description: true si el correo a los destinatarios se envió (best-effort).
        message: { type: string, nullable: true }
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
          description: Momento del reconocimiento (null = sin reconocer).
        acknowledgedBy:
          type: string
          format: uuid
          nullable: true
          description: Usuario (claim sub) que reconoció el disparo.
      required: [id, alertRuleId, ruleName, triggeredAt, metricValue, threshold, notified, message, acknowledgedAt, acknowledgedBy]

    AlertEventsPageResponse:
      type: object
      description: Página del historial de disparos (más recientes primero).
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertEventDto"
        totalCount: { type: integer }
      required: [items, totalCount]

    # ── Admin · Plataforma · Jerarquía de clientes (HU #12323) ──────────────────
    HierarchySwitchResponse:
      type: object
      description: Estado de un interruptor global de la jerarquía de clientes (`identity.hierarchy_switches`).
      properties:
        key:
          type: string
          enum: [group_read_scope, inherited_configuration, network_documents_concesion]
        isEnabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
        updatedBy:
          type: string
          format: uuid
          nullable: true
          description: Usuario (claim sub) que conmutó el interruptor por última vez; null = seed de la migración.
      required: [key, isEnabled, updatedAt, updatedBy]

    NetworkAccessAuditRow:
      type: object
      description: >
        HU #12361 — un acceso consolidado (una petición) de una cabeza de red a datos de sus hijos.
        Solo identificadores: nunca placa, documento ni nombre.
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time, description: Instante en que se entregó la respuesta auditada. }
        actorUserId: { type: string, format: uuid, nullable: true, description: Usuario de la cabeza que ejecutó la petición. }
        actorTenantId: { type: string, format: uuid, description: Cliente cabeza de red del actor. }
        reachedTenantIds:
          type: array
          items: { type: string, format: uuid }
          description: Clientes hijos DISTINTOS alcanzados por el resultado (nunca vacío; nunca la cabeza).
        resource:
          type: string
          enum: [network.instances.search, network.instances.detail, network.stats.overview, network.attachments.list, network.attachments.download]
        procedureId: { type: string, format: uuid, nullable: true, description: Trámite consultado o del documento descargado; null en listados. }
        procedureTenantId: { type: string, format: uuid, nullable: true, description: Hijo dueño del trámite; null en listados. }
        attachmentId: { type: string, format: uuid, nullable: true, description: Documento descargado; null salvo en descargas. }
        result:
          type: string
          enum: [ok, forbidden, not_found]
          description: forbidden = intento rechazado por autorización (también queda registrado).
      required: [id, occurredAt, actorUserId, actorTenantId, reachedTenantIds, resource, procedureId, procedureTenantId, attachmentId, result]

    NetworkAccessAuditPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NetworkAccessAuditRow"
        total: { type: integer }
        page: { type: integer }
        take: { type: integer, description: Tamaño efectivo de página (acotado a 200). }
      required: [items, total, page, take]

    HierarchySwitchesListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HierarchySwitchResponse"
      required: [items]

    SetHierarchySwitchRequest:
      type: object
      properties:
        isEnabled:
          type: boolean
          description: true = encendido; false = apagado (degradación segura, sin tocar la jerarquía).
      required: [isEnabled]
