      description: >
        HU #13135 (Feature #13115). Solo lectura: compañías y organismos donde el mandatario es el ÚNICO activo de
        esa compañía, los defaults (de compañía y del organismo) que perdería y el número de trámites radicados
        sin aprobar que hoy lo usan. Solo identificadores y conteos (sin datos personales).
      security:
        - bearerAuth: []
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mandateSignerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Impacto de la baja.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MandateSignerImpact" }
        "403":
          description: "Sin permiso: usuario sin rol de gestión o mandatario configurado por el organismo (`mandatario_configurado_por_organismo`)."
          content:
            application/json:
