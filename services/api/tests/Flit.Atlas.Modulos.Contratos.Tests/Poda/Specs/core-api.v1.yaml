      required: [id, procedureTypeId, documentTypeId, ordenDefault, obligatorio, documento]

    ProcedureDocumentRequirementList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureDocumentRequirementResponse"
      required: [data]

    CreateProcedureDocumentRequirementRequest:
      type: object
      description: Payload de alta de la asociación (AC1).
      properties:
        procedureTypeId: { type: string, format: uuid }
        documentTypeId: { type: string, format: uuid }
        ordenDefault: { type: integer, minimum: 0, maximum: 32767 }
