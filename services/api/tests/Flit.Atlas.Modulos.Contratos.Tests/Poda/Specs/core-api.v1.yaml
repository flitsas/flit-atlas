  /api/v1/tramites/network/instances/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: tramitesNetworkGetInstance
      tags: [Tramites, Red]
      summary: Detalle consolidado (solo lectura) de un trámite de la red
      description: >
        HU #12358 — el cliente dueño (`tenantId`, `tenantName`) y EXACTAMENTE el mismo detalle que ve
        el propio hijo por `GET /api/v1/tramites/instances/{id}` (`instance`: campos, valores, actores,
        historial de estado y eventos administrativos), en solo lectura. Nunca incluye contenido de
        documentos ni direcciones prefirmadas de almacenamiento (AC5): el único canal de contenido es
        la descarga proxeada de la HU #12410. Un id fuera del conjunto de lectura responde 404 escueto
        (no se distingue «ajeno» de «no existe»).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Detalle consolidado del trámite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkProcedureDetailResponse"
        "401":
          description: Sin token válido.
        "403":
          description: "`network_scope_required` (la petición no tiene alcance de grupo) o `network_role_required` (cabeza sin rol AdminCompany, HU #12652)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El trámite no existe o no está en el conjunto de lectura de la cabeza.

  /api/v1/tramites/network/instances/{id}/attachments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: tramitesNetworkListInstanceAttachments
      tags: [Tramites, Red]
      summary: Metadatos de los documentos de un trámite de la red (solo lectura, sin direcciones)
      description: >
        HU #12410 — el MISMO `AttachmentDto` que ve el propio hijo por `GET /api/v1/tramites/instances/{id}/attachments`
        (id, tipo, filename, mimetype, sizeBytes, sha256, source, uploadedAt, provider, digitallySigned), para un
        trámite de un cliente hijo del conjunto de lectura de la cabeza. Nunca incluye `storagePath`, direcciones
        prefirmadas ni previsualización: el único canal de contenido es `…/attachments/{attachmentId}/download`.
        El modelo de anexos no tiene «versión» (no se expone). El tenant del trámite se resuelve en el servidor
        (dueño real del trámite) y jamás se toma de `X-Tenant-Id`. Clase CONCESION: 403 `network_documents_disabled`
        mientras el interruptor `network_documents_concesion` esté apagado (valor por defecto). Un trámite
        inexistente, ajeno o fuera del conjunto de lectura responde 404 escueto `{ "error": "not_found" }`, idéntico
        en los tres casos (anti-enumeración). Cada listado deja UN registro `network.attachments.list` en la
        auditoría de acceso consolidado (HU #12361) con trámite, hijo y resultado (`ok` / `forbidden` / `not_found`).
        Policy explícita: exige el permiso RBAC `tramites.read` en el JWT (SuperAdmin hace bypass del permiso
        pero sigue recibiendo 403 `network_scope_required`); sin el permiso responde 403 sin cuerpo y sin auditar.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documentos del trámite (metadatos). Mismo shape que el listado propio.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: { $ref: "#/components/schemas/AttachmentDto" }
        "401":
          description: Sin token válido.
        "403":
          description: >
            `network_role_required` (cabeza sin rol AdminCompany — HU #12652),
            `network_scope_required` (sin alcance de grupo: cliente sin jerarquía, SuperAdmin o interruptor
            `group_read_scope` apagado) o `network_documents_disabled` (cabeza CONCESION con
            `network_documents_concesion` apagado). Sin permiso `tramites.read`: 403 sin cuerpo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`{ \"error\": \"not_found\" }` — trámite inexistente, ajeno o fuera del conjunto de lectura."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/network/instances/{id}/attachments/{attachmentId}/download:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: tramitesNetworkDownloadInstanceAttachment
      tags: [Tramites, Red]
      summary: Descarga proxeada (por transmisión) de un documento de un trámite de la red
      description: >
        HU #12410 — la API abre el binario con el tenant DUEÑO del trámite (comprobado contra el conjunto de
        lectura de la cabeza) y lo sirve por transmisión con `Content-Disposition: attachment; filename=…` y el
        `Content-Type` del documento; el cliente nunca recibe una dirección de almacenamiento. No existe
        `preview-url` de red (la URL prefirmada de S3 es un portador anónimo). Mismas reglas de clase e
        interruptores que el listado. Trámite inexistente/ajeno, documento inexistente o binario perdido
        responden el MISMO 404 escueto `{ "error": "not_found" }`. Cada descarga (servida o rechazada) deja UN
        registro `network.attachments.download` con `attachmentId` en la auditoría de acceso consolidado.
        La auditoría de la descarga es FAIL-CLOSED: si el registro no puede persistirse, el binario NO se entrega
        y se responde 503 `{ "error": "audit_unavailable" }` (el listado de metadatos y las demás lecturas de red
        siguen best-effort). Policy explícita: exige el permiso RBAC `tramites.read` en el JWT.
        Las rutas propias `GET /api/v1/tramites/instances/{id}/attachments/{attachmentId}/download` y `…/preview-url`
        no cambian.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Binario del documento.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: Sin token válido.
        "403":
          description: "`network_scope_required`, `network_role_required` (cabeza sin rol AdminCompany) o `network_documents_disabled`; sin permiso `tramites.read`: 403 sin cuerpo."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "`{ \"error\": \"not_found\" }` — trámite inexistente/ajeno, documento inexistente o binario perdido."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "`{ \"error\": \"audit_unavailable\" }` — no se pudo registrar el acceso; el documento no se entrega (fail-closed)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/network/documentos:
    get:
      operationId: TramitesNetworkGetDocumentos
      tags: [Tramites, Red]
      summary: "¿La cabeza de grupo puede leer documentos de su red? (habilita «Descargar ZIP» en la vista de red)"
      description: >
        Ajuste #13419 AC5 (HU #13417, épica #13216) — la vista de red decide si ofrece «Descargar ZIP» sin el
        endpoint de interruptores del Super Admin. `documentosRed` es la misma regla que aplica el alta del lote de red
        (`POST /api/v1/tramites/consolidados/lotes` con `alcanceRed`) y los documentos de un trámite de la red: `true`
        si la cabeza no es CONCESION (MARCA_BLANCA) o si es CONCESION con el interruptor
        `network_documents_concesion` encendido; `false` con el interruptor apagado (valor por defecto). Mismas
        puertas que `GET /api/v1/tramites/network/children`: el alcance sale del servidor (BD), nunca de
        `X-Tenant-Id` ni de la query. No deja registro en la auditoría de acceso consolidado (es configuración de la
        propia cabeza, no un acceso a datos de una hija).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Disponibilidad de los documentos de la red para la cabeza.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkDocumentosDisponibilidad"
        "401":
          description: Sin token válido.
        "403":
          description: >
            `network_scope_required` (sin alcance de grupo: hija, cliente sin jerarquía, SuperAdmin o interruptor
            `group_read_scope` apagado) o `network_role_required` (cabeza sin rol AdminCompany — HU #12652).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/network/stats/overview:
    get:
      operationId: tramitesNetworkStatsOverview
      tags: [Tramites, Red]
      summary: Métricas por categoría/estado del universo consolidado de la red (cabeza de grupo)
      description: >
        HU #12359 — la MISMA forma que `GET /api/v1/analytics/overview` (`tenantId`, `from`, `to`,
        `categories`) sobre el conjunto de lectura de la cabeza (padre y sus hijos) resuelto en el servidor,
        más `scope.tenantIds` (los clientes efectivamente consultados). `childTenantId` acota a UN cliente
        de la red (puede ser la propia cabeza); uno fuera del conjunto de lectura responde 403
        `network_child_out_of_scope` SIN ejecutar la consulta (AC5). El conjunto viaja a la base como un
        único parámetro de arreglo (`tenant_id = ANY(@tenants)`, AC3); un conjunto vacío no devuelve
        filas (AC4). Las rutas de `/api/v1/analytics` no cambian (AC6/AC7). Cada petición deja un
        registro en la auditoría de acceso consolidado (`network.stats.overview`, HU #12361).
      security:
        - bearerAuth: []
      parameters:
        # BUG #12588 — no se reutilizan NetworkStatsFrom/NetworkStatsTo: esas siguen siendo
        # obligatorias en el resto de rutas de stats (series y rankings, que sin ventana no
        # significan nada). Solo el overview admite consultar el universo completo.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: >
            Fecha inicial inclusiva (YYYY-MM-DD) — HU #12359. Omitirlo NO acota por ese extremo: sin `from` ni `to` la respuesta cubre el universo completo (BUG #12588). El filtro es por fecha de creación del trámite.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: >
            Fecha final inclusiva (YYYY-MM-DD) — HU #12359. Omitirlo NO acota por ese extremo: sin `from` ni `to` la respuesta cubre el universo completo (BUG #12588). El filtro es por fecha de creación del trámite.
        - $ref: "#/components/parameters/NetworkStatsChildTenantId"
      responses:
        "200":
          description: Métricas agregadas de la red; del periodo indicado o del universo completo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkAnalyticsOverviewResponse"
        "400":
          description: Rango inválido (`from` posterior a `to`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin token válido.
        "403":
          description: "`network_scope_required` (sin alcance de grupo: cliente sin jerarquía, SuperAdmin), `network_role_required` (cabeza sin rol AdminCompany) o `network_child_out_of_scope`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/network/stats/productivity/top:
    get:
      operationId: tramitesNetworkStatsTopProducers
