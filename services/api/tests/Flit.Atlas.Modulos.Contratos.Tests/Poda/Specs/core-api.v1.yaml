        transitOfficeName: { type: string }
        transitOfficeCode: { type: string }
        operationMode:
          type: string
          enum: [dashboard, quipux]
      required:
        [id, legalName, taxId, code, tenantType, estadoActivo, fechaCreacion, rowVersion,
         transitOfficeId, transitOfficeName, transitOfficeCode, operationMode]

    TransitOfficeTenantPagedResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TransitOfficeTenantItem"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    ImprintSignatureItem:
      type: object
      description: >
        Auditoría de impronta manual firmada (tramites.vehicle_signature_imprints).
        Deliberadamente NO incluye private_key (HU #12148).
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        procedureInstanceId: { type: string, format: uuid }
        placa: { type: string }
        moduleCode: { type: string }
        attachmentId: { type: string, format: uuid, nullable: true }
        publicKey: { type: string }
        documentHash: { type: string }
        signature: { type: string }
        signedAt: { type: string, format: date-time }
        wasSignedWithoutOwnerSignature: { type: boolean }
        signedStoragePath: { type: string, nullable: true }
        signedSha256: { type: string, nullable: true }
        signedSizeBytes: { type: integer, format: int64, nullable: true }
        signedFilename: { type: string, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        lastValidation:
          type: object
          allOf:
            - $ref: "#/components/schemas/ImprintSignatureValidationSummary"
          nullable: true
          description: Última fila de bitácora (HU #12176); null si nunca se validó.
        reemplazada:
          type: boolean
          default: false
          description: >
            true cuando la fila corresponde a una impronta reemplazada/borrada por el gestor
            (soft-delete: attachmentId null, conserva signedStoragePath histórico) — Bug #12594.
      required:
        [id, tenantId, procedureInstanceId, placa, moduleCode, publicKey, documentHash,
         signature, signedAt, wasSignedWithoutOwnerSignature]

    ImprintSignatureValidationSummary:
      type: object
      description: Fila de tramites.imprint_signature_validations (HU #12176 / #12177).
      properties:
        id: { type: string, format: uuid }
        result:
          type: string
          enum: [valid, invalid, not_found]
        failureReason: { type: string, nullable: true }
        validatedAt: { type: string, format: date-time }
        validatedBy: { type: string, format: uuid }
        placa: { type: string }
        validatedByEmail: { type: string, nullable: true, description: Correo del validador (resuelto en lectura). }
        validatedByRole: { type: string, nullable: true, description: Nombre/código de rol visible del validador. }
      required: [id, result, validatedAt, validatedBy, placa]

    ImprintSignatureValidationResult:
      type: object
      description: Resultado de POST /admin/ot/imprint-signatures/{id}/validate (HU #12148).
      properties:
        validationId: { type: string, format: uuid }
        vehicleSignatureImprintId: { type: string, format: uuid }
        result:
          type: string
          enum: [valid, invalid, not_found]
        failureReason: { type: string, nullable: true }
        validatedAt: { type: string, format: date-time }
      required: [vehicleSignatureImprintId, result, validatedAt]

    ImprontaGenerationItem:
      type: object
      description: >
        Metadata de una generación de impronta (admin.impronta_generations — ADR-0022).
        Deliberadamente NO incluye el PDF (pdf_content): el listado nunca arrastra el
        binario del certificado, solo pdfSizeBytes como sustituto liviano.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        flitUserId: { type: string, format: uuid }
        radicado: { type: string }
        hashSha256: { type: string }
        fechaImpresa: { type: string, format: date-time }
        placa: { type: string }
        numMotor: { type: string, nullable: true }
        numChasis: { type: string, nullable: true }
        numSerie: { type: string, nullable: true }
        marca: { type: string, nullable: true }
        linea: { type: string, nullable: true }
        modelo: { type: string, nullable: true }
        orgNombre: { type: string }
        orgNit: { type: string }
        orgCiudad: { type: string }
        operador: { type: string }
        pdfSizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
      required:
        [id, tenantId, flitUserId, radicado, hashSha256, fechaImpresa, placa, orgNombre,
         orgNit, orgCiudad, operador, pdfSizeBytes, createdAt]

    ImprontaGenerationPagedResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ImprontaGenerationItem"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    BackfillFirmaImprontaManualResult:
      type: object
      description: >-
        HU #12116 — resultado del backfill de firma automática de impronta manual.
        `noListas` es un mapa motivo→cantidad (claves de ImprontaManualStampReadiness,
        p. ej. "placa_pendiente", "propietarios_sin_identidad").
      properties:
        total: { type: integer }
        firmadas: { type: integer }
        yaFirmadas: { type: integer }
        sinImprontaManual: { type: integer }
        noListas:
          type: object
          additionalProperties: { type: integer }
        fallidas: { type: integer }
        limit: { type: integer }
      required:
        [total, firmadas, yaFirmadas, sinImprontaManual, noListas, fallidas, limit]

    CreateTransitOfficeRequest:
      type: object
      description: >-
        Alta de tenant OT (refactor adminOT). HU #13605: el cliente ya no envía el código; lo asigna el servidor
        (consecutivo COMP-XXXX) y llega en la respuesta. Un "code" enviado se ignora.
      properties:
        transitOfficeId:
          type: string
          format: uuid
          description: >-
            Oficina del catálogo catalogs.transit_offices a vincular. Debe existir,
            estar activa y no tener ya un TransitOfficeProfile asociado.
        legalName:
          type: string
          maxLength: 255
          description: Razón social (legal_name).
        taxId:
          type: string
          maxLength: 20
          description: NIT (tax_id). Solo dígitos, puntos y guiones.
        operationMode:
          type: string
          enum: [dashboard, quipux]
          default: dashboard
      required: [transitOfficeId, legalName, taxId]

    InviteOtUserRequest:
      type: object
      description: Invitación de usuario al tenant OT (self-service).
      properties:
        email: { type: string, format: email }
        fullName: { type: string, nullable: true }
        roleIds:
          type: array
          description: Rol del invitado (exactamente uno, del catálogo TRANSIT_OFFICE).
          minItems: 1
          maxItems: 1
          items: { type: string, format: uuid }
      required: [email, roleIds]

    InviteOtUserResponse:
      type: object
      properties:
        invitationId: { type: string, format: uuid }
        email: { type: string, format: email }
        emailSent: { type: boolean }
      required: [invitationId, email, emailSent]

    ResendInvitationResponse:
      type: object
      description: >
        Resultado de reenviar una invitación pendiente (HU #10625). Mismo shape en
        `/api/v1/security/invitations/{invitationId}/resend` y
        `/api/v1/admin/ot/invitations/{invitationId}/resend`.
      properties:
        invitationId: { type: string, format: uuid }
        email: { type: string, format: email }
        emailSent: { type: boolean }
      required: [invitationId, email, emailSent]

    ResendCooldownErrorResponse:
      type: object
      description: >
        Error 429 del cooldown anti-abuso de reenvío (HU #10625 AC2). El endpoint
        Compañía usa `code`; el endpoint OT usa `error` — ambos incluyen `message` y
        `retryAfterSeconds`.
      properties:
        code: { type: string, example: RESEND_COOLDOWN_ACTIVE }
        error: { type: string, example: RESEND_COOLDOWN_ACTIVE }
        message: { type: string }
        retryAfterSeconds:
          type: integer
          description: Segundos hasta que se pueda reenviar de nuevo.
      required: [message, retryAfterSeconds]

    OtUserItem:
      type: object
      description: >
        Usuario (activo, sin rol o invitación pendiente) del tenant OT, o
        usuario eliminado cuando se lista con `?onlyDeleted=true` (#10624).
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { type: string, nullable: true }
        roleCode: { type: string, nullable: true }
        roleId: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [active, inactive, pending]
        createdAt: { type: string, format: date-time, nullable: true }
        isSuspended: { type: boolean }
        rowVersion:
          type: integer
          format: int64
          description: >
            Versión de fila del usuario (#10621). Requerida para editar (PATCH
            /users/{userId}) con concurrencia optimista; 0 para invitaciones
            pendientes (no aplica edición de perfil).
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Fecha de eliminación (soft-delete, #10623). `null` en el listado
            normal; siempre poblado cuando se listó con `?onlyDeleted=true`
            (#10624).
      required: [id, fullName, email, status, isSuspended, rowVersion]

    UpdateOtUserRequest:
      type: object
      description: Edición de nombre/correo de un usuario del tenant OT (#10621).
      properties:
        displayName:
          type: string
          nullable: true
          description: Nombre nuevo. Omitido o vacío = no se modifica.
        email:
          type: string
          format: email
          nullable: true
          description: Correo nuevo. Omitido o vacío = no se modifica.
        rowVersion:
          type: integer
          format: int64
          description: Versión de fila leída por el cliente (concurrencia optimista, AC4).
      required: [rowVersion]

    OtUserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OtUserItem"
      required: [data]

    SuspendOtUserRequest:
      type: object
      description: >
        HU #10619: `endsAt` es opcional. Con valor, es una suspensión temporal que se
        reactiva sola al vencer (comportamiento previo, sin cambios). Omitido/null,
        es una desactivación indefinida: el usuario queda bloqueado hasta que un
        administrador levante la restricción explícitamente (`DELETE .../suspend`).
      properties:
        reason: { type: string }
        endsAt: { type: string, format: date-time, nullable: true }
      required: [reason]

    DeleteOtUserRequest:
      type: object
      description: >
        HU #10623: elimina (soft-delete reversible) a un usuario del tenant OT.
        `rowVersion` es obligatorio (concurrencia optimista, el valor leído de
        `OtUserItem.rowVersion`).
      properties:
        rowVersion:
          type: integer
          format: int64
          description: Versión de fila leída por el cliente (concurrencia optimista).
      required: [rowVersion]

    DeleteUserRequest:
      type: object
      description: >
        HU #10623: elimina (soft-delete reversible) a un usuario. `rowVersion` es
        obligatorio (concurrencia optimista, el valor leído de
        `TenantUserDto.rowVersion`).
      properties:
        rowVersion:
          type: integer
          format: int64
          description: Versión de fila leída por el cliente (concurrencia optimista).
      required: [rowVersion]

    TenantUserItem:
      type: object
      description: >
        Usuario (activo, sin rol o invitación pendiente) del alcance del
        caller, o usuario eliminado cuando se lista con `?onlyDeleted=true`
        (#10624).
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { type: string, nullable: true }
        roleCode: { type: string, nullable: true }
        roleId: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [active, inactive, pending]
        createdAt: { type: string, format: date-time, nullable: true }
        isSuspended: { type: boolean }
        tenantId: { type: string, format: uuid, nullable: true }
        tenantName: { type: string, nullable: true }
        rowVersion:
          type: integer
          format: int64
          description: >
            Versión de fila del usuario (#10621). Requerida para editar (PATCH
            /users/{userId}) con concurrencia optimista; 0 para invitaciones
            pendientes (no aplica edición de perfil).
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Fecha de eliminación (soft-delete, #10623). `null` en el listado
            normal; siempre poblado cuando se listó con `?onlyDeleted=true`
            (#10624).
      required: [id, fullName, email, status, isSuspended, rowVersion]

    AuditLogEntry:
      type: object
      description: Entrada del historial de auditoría de gobernanza (AC4).
      properties:
        entityName: { type: string }
        fieldName: { type: string }
        oldValue: { type: string, nullable: true }
        newValue: { type: string, nullable: true }
        changedBy: { type: string, format: uuid, nullable: true }
        changedAt: { type: string, format: date-time }
      required: [entityName, fieldName, changedAt]

    AuditLogPageResponse:
      type: object
      description: Página del historial de auditoría (AC4).
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    AdminAuditLogEntry:
      type: object
      description: >
        Entrada del rastro unificado de auditoría administrativa/seguridad
        (HU #10679): config (RNF01/ADR-0024) + operaciones sobre usuarios, roles,
        permisos y autenticación (HU #10678).
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid, nullable: true }
        tenantType:
          type: string
          nullable: true
          enum: [COMPANY, TRANSIT_OFFICE]
        module:
          type: string
          nullable: true
          enum: [users, roles, permissions, authentication, security, config]
        entityName: { type: string }
        operation: { type: string, nullable: true }
        result:
          type: string
          nullable: true
          enum: [success, failure]
        errorCode: { type: string, nullable: true }
        changedBy:
          type: string
          format: uuid
          nullable: true
          description: Usuario actor que ejecutó la operación.
        targetEntityType: { type: string, nullable: true }
        targetEntityId:
          type: string
          format: uuid
          nullable: true
          description: Usuario/rol/permiso afectado por la operación.
        clientIp: { type: string, nullable: true }
        changedAt: { type: string, format: date-time }
      required: [id, entityName, changedAt]

    AdminAuditLogPageResponse:
      type: object
      description: Página del rastro unificado de auditoría administrativa/seguridad (HU #10679).
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditLogEntry"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    DocumentTypeResponse:
      type: object
      description: Tipo de documento del catálogo maestro (HU #10193).
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        estado:
          type: string
          enum: [activo, inactivo]
          description: Estado derivado de is_active (soft-delete).
        fechaCreacion: { type: string, format: date-time }
        esAutogenerado:
          type: boolean
          description: >
            True = documento autogenerado (consolidado / sistema). No se pide ni se exige
            en Requisitos ni en radicación. False = cargue del gestor.
        instruccionCargue:
          type: string
          nullable: true
          maxLength: 500
          description: >
            Instrucción de cargue que lee el GESTOR en la tarjeta del paso Requisitos
            (HU #12065), distinta de `descripcion`, que es la nota interna del
            administrador. Null/omitida ⇒ la tarjeta no muestra instrucción.
      required: [id, codigo, nombre, estado, fechaCreacion, esAutogenerado]

    DocumentTypePagedResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentTypeResponse"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    CreateDocumentTypeRequest:
      type: object
      description: Payload de alta (AC1).
      properties:
        codigo:
          type: string
          maxLength: 50
          pattern: "^(?=.*[A-Za-z0-9])[A-Za-z0-9-]+$"
          description: Ignorado. El código lo genera el sistema a partir del nombre.
        nombre:
          type: string
          maxLength: 150
          pattern: "^(?=.*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9](?:[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9\\s]|[.,&()/'°-](?![.,&()/'°-]))*$"
          description: >-
            Nombre. Solo letras, números, espacios y puntuación básica (. , & ( ) / ' ° -).
        descripcion:
          type: string
          nullable: true
          maxLength: 500
          pattern: "^[^<>]*$"
          description: Opcional. No permite los caracteres < ni >.
        obligatorio:
          type: boolean
          nullable: true
          description: >
            Aceptado por el AC pero NO persistido en el catálogo; la obligatoriedad
            vive por trámite en procedure_document_requirements (HU #10195).
        esAutogenerado:
          type: boolean
          nullable: true
          description: >
            True = autogenerado. False u omitido = cargue. Por defecto cargue.
        instruccionCargue:
          type: string
          nullable: true
          maxLength: 500
          pattern: "^[^<>]*$"
          description: >
            Opcional. Texto que el gestor lee al cargar el documento (HU #12065).
            No permite los caracteres < ni >. Vaciarlo borra la instrucción.
      required: [nombre]

    UpdateDocumentTypeRequest:
      type: object
      description: Payload de actualización (AC3).
      properties:
        codigo:
          type: string
          maxLength: 50
          pattern: "^(?=.*[A-Za-z0-9])[A-Za-z0-9-]+$"
          description: Ignorado. El código de sistema no se puede cambiar.
        nombre:
          type: string
          maxLength: 150
          pattern: "^(?=.*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9](?:[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9\\s]|[.,&()/'°-](?![.,&()/'°-]))*$"
          description: >-
            Nombre. Solo letras, números, espacios y puntuación básica (. , & ( ) / ' ° -).
        descripcion:
          type: string
          nullable: true
          maxLength: 500
          pattern: "^[^<>]*$"
          description: Opcional. No permite los caracteres < ni >.
        esAutogenerado:
          type: boolean
          nullable: true
          description: Null conserva el origen actual. True = autogenerado; false = cargue.
        instruccionCargue:
          type: string
          nullable: true
          maxLength: 500
          pattern: "^[^<>]*$"
          description: >
            Opcional. Texto que el gestor lee al cargar el documento (HU #12065).
            No permite los caracteres < ni >. Vaciarlo borra la instrucción.
      required: [nombre]

    DocumentRef:
      type: object
      description: Datos del tipo de documento asociado (join a document_types).
