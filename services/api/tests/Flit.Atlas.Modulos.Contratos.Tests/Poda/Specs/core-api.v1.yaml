openapi: 3.0.3
info:
  title: FLIT Core API
  version: "1.0.0"
  description: >
    Contrato público de FLIT Core API (services/core-api). Cubre el carril de
    Seguridad/Autenticación (HU #10168 — login email/contraseña y emisión JWT 12h)
    y el módulo Administrador de Compañías (HU #10189 — index paginado y
    seguridad SuperAdmin).

servers:
  - url: https://api.flit.co
    description: Producción (vía Gateway YARP)
  - url: http://localhost:4002
    description: Local (Gateway)

tags:
  - name: Auth
    description: Autenticación y sesión (login, perfil del usuario).
  - name: Security · Invitaciones
    description: >
      Reenvío de invitaciones pendientes (rol SuperAdmin cualquier tenant, o
      AdminCompany/ot_admin solo su propio tenant).
  - name: Admin · Compañías
    description: Gestión multi-tenant de compañías B2B (rol SuperAdmin).
  - name: Admin · Tenants OT
    description: >
      Alta y listado de tenants Organismo de Tránsito (rol SuperAdmin, refactor
      adminOT). El self-service de usuarios OT vive bajo el tag Admin · OT.
  - name: Admin · OT
    description: >
      Perfil OT, módulo operativo y self-service de usuarios del tenant OT (rol
      SuperAdmin u ot_admin).
  - name: Admin · Documentos
    description: Catálogo maestro de tipos de documento por trámite (rol SuperAdmin).
  - name: Admin · Documentos por Trámite
    description: Asociación de tipos de documento a tipos de trámite (rol SuperAdmin).
  - name: Admin · Órdenes documentales
    description: >
      Overrides de orden documental por OT/Cliente y matriz documental resuelta
      con precedencia Cliente > OT > Default (rol SuperAdmin).
  - name: Admin · Improntas
    description: >
      Historial del Certificado de Improntas Digitales vehicular (Res. 17145/2023
      Mintransporte, integración Kyverum RUNT — ADR-0022). Vista global cross-tenant
      sin RLS, rol SuperAdmin.
  - name: Admin · Generación documental
    description: >
      Emisión de documentos SIN abrir un trámite (Feature #12201,
      ADR-0056-generacion-documental-standalone). Autorización POR PERMISO
      (generacion-documental.read / generacion-documental.generate), nunca por policy de grupo.
  - name: Trámites · Documentos
    description: >
      Alta de trámite con snapshot documental inmutable y lectura de los documentos
      requeridos congelados al crear el trámite (cualquier JWT válido).
  - name: Trámites · Traspaso
    description: Radicación de traspasos vehiculares.
  - name: Admin · Improntas
    description: >
      Generación del Certificado de Improntas Digitales vehicular (Res. 17145/2023
      Mintransporte) vía Kyverum RUNT, con persistencia de trazabilidad (rol SuperAdmin).
  - name: Admin · LOG QX
    description: >
      Trazabilidad de punta a punta de la integración Quipux (HU #10793): búsqueda de
      radicaciones por placa/trámite/radicado y línea de tiempo de eventos con detalle
      técnico sanitizado y enmascarado. Solo lectura; permiso logqx.read (HU #10794,
      SuperAdmin bypassa).
  - name: Admin · ICT · Jobs
    description: >
      Cadencia global de jobs ICT (ict.job_settings) y catálogo SuperAdmin de procesos
      periódicos (HU #12512 / #12513). Sin secretos. Solo rol SuperAdmin.
  - name: Admin · Plataforma · IA
    description: >
      SuperAdmin → Plataforma → Configuración de IA (Feature #13508): tools multi-proveedor,
      settings, activate, historial de transitions y alertas de failover (HU #13509 / #13512 / #13513).
      Secretos solo en variables de entorno; responses exponen hasApiKey y apiKeyMask, nunca apiKey.
  - name: Admin · Baúl de Firmas
    description: "Gestión del baúl de firmas precargadas por compañía (HU #10643, ADR-0025). Solo SuperAdmin."
  - name: Admin · Representantes Legales
    description: "Directorio de representantes legales por compañía (HU #10901, ADR-0033). Solo SuperAdmin."
  - name: Admin · Plataforma · Notificaciones
    description: >
      SuperAdmin → Plataforma → Notificaciones (Feature #11349): buzón de pruebas global de
      plataforma (HU #11366), canales con remitente resuelto (HU #11367) y envío de prueba con
      límite de frecuencia (HU #11368). Nunca escribe política de tenant. HU #12430 AC2: el envío
      de prueba acepta `tenantId` para aplicar el tema y el remitente de marca de esa compañía.
  - name: Admin · Plataforma · Notificaciones · Plantillas
    description: >
      Catálogo de plantillas de notificación y muestra compuesta sin datos de personas
      (HU #11366 AC1-AC3, Ley 1581). HU #12428/#12431: la muestra acepta `tenantId` para
      componerse con el tema de correo de esa compañía.
  - name: Preferencias de UI
    description: >
      Base compartida para que el usuario elija qué ve en la UI (p. ej. columnas
      visibles en las tablas de trámites) y esa elección persista entre sesiones,
      por tenant + usuario + scope (lista blanca fija de scopes soportados).

paths:
  /api/v1/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      security: []          # endpoint público: no requiere JWT (satisface la regla security-defined)
      summary: Login con email y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: >
            Cuenta bloqueada temporalmente (código `ACCOUNT_TEMPORARILY_BLOCKED`, HU #10170 AC2),
            todos los roles asignados al usuario están inactivos (código `ALL_ROLES_INACTIVE`,
            HU #10507 AC2), o credencial válida de un usuario de una red MARCA_BLANCA con dominio
            activo presentada por el dominio de FLIT (código `NETWORK_DOMAIN_REQUIRED`, HU #12422
            AC3, ADR-0060 D3) — redirige a su propio dominio.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthErrorResponse'
                  - $ref: '#/components/schemas/NetworkDomainRequiredResponse'
  /api/v1/auth/me:
    get:
      operationId: authGetCurrentUser
      tags: [Auth]
      summary: Perfil del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Claims del token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: No autenticado o sesión expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
  /api/v1/auth/session-policy:
    get:
      operationId: authGetSessionPolicy
      tags: [Auth]
      summary: Vigencia de la sesión (cuándo entra en vigor un cambio de permisos)
      description: >
        HU #13651 (Feature #13102, Épica #12753). El token lleva los permisos efectivos y solo se recalcula al emitir
        uno nuevo; este endpoint dice cuánto puede tardar un cambio de permisos de un usuario en aplicarse.
        Modo `legacy` (sin OIDC): un solo JWT que dura `Jwt:TokenLifetimeHours`; `maxMinutes` = horas × 60.
        Modo `oidc` (`Suite:Oidc:Enabled`): el access token dura `Suite:Oidc:AccessTokenMinutes` y se renueva solo.
        El valor sale de la configuración vigente, nunca de un literal. Vive en /auth (no en /security) para que
        el Gateway lo enrute a core-identity o a core-api igual que el resto del login: llega en ambos modos.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Política de sesión vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPolicyResponse'
        '401':
          description: No autenticado o sesión expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
  /api/v1/auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags: [Auth]
      summary: Solicitar recuperación de contraseña (HU #10169, RF19)
      security: []
      description: >
        Genera un token de un solo uso y envía un correo con el enlace de
        restablecimiento. Responde siempre 202 con un mensaje genérico, sin
        revelar si el email está registrado (anti-enumeración, AC2). HU #12423
        AC3: el enlace apunta al dominio por el que se hizo la solicitud (o al
        de FLIT si no pertenece a una red con dominio activo), nunca a uno
        deducido de la identidad del usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Solicitud aceptada (respuesta genérica).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/v1/auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [Auth]
      summary: Restablecer contraseña con token de recuperación (HU #10169)
      security: []
      description: >
        Valida el token vigente y fija la nueva contraseña. El token se invalida
        tras su uso. HU #12423 AC5: si el dominio sellado de la petición no
        coincide con la red del tenant dueño del token, responde el mismo error
        genérico de token inválido, sin revelar a qué red pertenece.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Token inválido/expirado o contraseña débil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: >
            La contraseña nueva es igual a la vigente (código `PASSWORD_REUSED`, HU #11553).
            El token de recuperación NO se invalida — se puede reintentar con otra contraseña.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
  /api/v1/auth/activate:
    post:
      operationId: authActivateAccount
      tags: [Auth]
      summary: Activar cuenta con token de invitación (HU #10177 AC1/AC2)
      security: []
      description: >
        Onboarding: canjea el token de invitación de un solo uso y fija la primera contraseña.
        El token se invalida tras su uso. Documentado a posteriori (deuda previa a la épica
        #12237); el enlace que llega por correo lo construye el backend con el dominio de la red
        del tenant cuando existe (HU #12423).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAccountRequest'
      responses:
        '200':
          description: Cuenta activada; el usuario ya puede iniciar sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >
            Token inválido o ya utilizado (código `INVITATION_INVALID`) o contraseña que no cumple
            los requisitos mínimos (código `WEAK_PASSWORD`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
  /api/v1/security/invitations/{invitationId}/resend:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Security · Invitaciones]
      operationId: securityResendInvitation
      summary: Reenvía una invitación pendiente (HU #10625)
      description: >
        SIEMPRE regenera el token de activación (solo se persiste su hash — el enlace
        anterior queda invalidado) y reenvía el correo. SuperAdmin puede reenviar
        cualquier invitación del sistema; AdminCompany solo las de su propio tenant
        (mismo alcance que `POST /api/v1/security/invitations`). Rechaza el reenvío si
        la invitación ya no está pendiente (409) o si no ha pasado el cooldown
        anti-abuso (~2 minutos, configurable) desde el último envío (429).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invitación reenviada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendInvitationResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "404":
          description: La invitación no existe o no pertenece al alcance del caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: La invitación ya no está pendiente (fue aceptada o cancelada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "429":
          description: Cooldown anti-abuso activo — debes esperar antes de reenviar de nuevo.
          headers:
            Retry-After:
              description: Segundos hasta que se pueda reenviar de nuevo.
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendCooldownErrorResponse"

  /api/v1/security/invitations/{invitationId}/reactivate:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Security · Invitaciones]
      operationId: securityReactivateInvitation
      summary: Reactiva una invitación cancelada (HU #11552 / ADR-0048)
      description: >
        Es UNA sola acción: vuelve la invitación a `pending`, regenera el token
        SIEMPRE (el enlace anterior queda muerto) y reenvía el correo. NO es
        idempotente — reactivar una invitación que no está `cancelled` es 409
        `INVITATION_NOT_CANCELLED`. Orden de validación: alcance (404) → está
        cancelada (409) → correo libre (409 `EMAIL_ALREADY_IN_USE` — HU #11580: código
        único de cara al cliente, sin distinguir invitación pendiente / cuenta activa
        / cuenta eliminada) → roles vigentes (409 `ROLE_NOT_FOUND`) → cooldown
        anti-abuso compartido con `/resend` (429).
        Mismo alcance y misma policy que `DELETE` — SuperAdmin cualquier tenant,
        AdminCompany solo el propio (AdminCompanyPolicy NO incluye ot_admin: el
        equivalente OT vive en `/api/v1/admin/ot/invitations/{invitationId}/reactivate`).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invitación reactivada — vuelve a estar pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendInvitationResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin o AdminCompany.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La invitación no existe o no pertenece al alcance del caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: >
            La invitación no está cancelada (`INVITATION_NOT_CANCELLED`), el correo
            ya está en uso (409 `EMAIL_ALREADY_IN_USE` — código único, HU #11580),
            o algún rol de la invitación ya no está activo (`ROLE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "429":
          description: Cooldown anti-abuso activo — debes esperar antes de reactivar de nuevo.
          headers:
            Retry-After:
              description: Segundos hasta que se pueda reactivar de nuevo.
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendCooldownErrorResponse"

  /api/v1/admin/companies/index:
    get:
      tags: [Admin · Compañías]
      operationId: adminCompaniesIndex
      summary: Listado paginado de compañías (RF02)
      description: >
        Retorna el listado paginado de compañías registradas, ordenado por
        fecha de creación descendente. Filtros opcionales e independientes.
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      parameters:
        - name: nit
          in: query
          required: false
          schema: { type: string }
          description: Coincidencia parcial sobre el NIT (tax_id).
        - name: razonSocial
          in: query
          required: false
          schema: { type: string }
          description: Coincidencia parcial e insensible a mayúsculas sobre la razón social.
        - name: estadoActivo
          in: query
          required: false
          schema: { type: boolean }
          description: Filtra por estado activo/inactivo.
        - name: fechaDesde
          in: query
          required: false
          schema: { type: string, format: date }
          description: Límite inferior inclusivo de fecha de creación (YYYY-MM-DD).
        - name: fechaHasta
          in: query
          required: false
          schema: { type: string, format: date }
          description: Límite superior inclusivo de fecha de creación (YYYY-MM-DD).
        - name: excludeTransitOffices
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: >
            Si es true (default cuando se omite), excluye tenants con perfil de
            Organismo de Tránsito. Pasar false para incluir OT en el listado.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Listado paginado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyPagedResult"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-offices/{transitOfficeId}/mandate-signers/{mandateSignerId}:
    delete:
      tags: [Admin · Mandatarios]
      operationId: adminMandateSignersDelete
      summary: Elimina (baja lógica) un mandatario del organismo
      description: >
        HU #13135/#13137 (Feature #13115). Baja lógica (`deleted_at`, `deleted_by`): el mandatario desaparece de listas y
        candidatos, se retiran los defaults que apuntaban a él, se reasignan con la prelación del OT (ADR-0066) los
        trámites radicados sin aprobar y se conserva el historial de los ya firmados. Todo en una transacción.
        Con impacto no vacío exige `confirmarImpacto=true` (409 `mandatario_baja_requiere_confirmacion`).
        Los conteos de la reasignación viajan en las cabeceras `X-Mandatario-Reasignados` y
        `X-Mandatario-Pendientes-Decision-OT`. Permisos: un mandatario configurado por el organismo solo lo eliminan
        el Admin OT y el Super Admin (403 `mandatario_configurado_por_organismo` para la compañía).
      security:
        - bearerAuth: []
      parameters:
        - { name: transitOfficeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mandateSignerId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: confirmarImpacto
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Confirmación explícita cuando la baja tiene impacto (único activo, defaults o trámites sin aprobar).
      responses:
        "204":
          description: "Eliminado. Cabeceras con los conteos de la reasignación de trámites."
          headers:
            X-Mandatario-Reasignados: { schema: { type: integer } }
            X-Mandatario-Pendientes-Decision-OT: { schema: { type: integer } }
        "403":
          description: Sin permiso (rol o candado por origen).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o ya estaba eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La baja tiene impacto y falta `confirmarImpacto` (`mandatario_baja_requiere_confirmacion`, con el impacto en `impact`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-offices/{transitOfficeId}/mandate-signers/{mandateSignerId}/impact:
    get:
      tags: [Admin · Mandatarios]
      operationId: adminMandateSignersImpact
      summary: Impacto de dar de baja al mandatario
      description: >
        HU #13135 (Feature #13115). Solo lectura: compañías y organismos donde el mandatario es el ÚNICO activo de
        esa compañía, los defaults (de compañía y del organismo) que perdería y el número de trámites radicados
        sin aprobar que hoy lo usan. Solo identificadores y conteos (sin datos personales).
      security:
        - bearerAuth: []
      parameters:
        - { name: transitOfficeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mandateSignerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Impacto de la baja.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MandateSignerImpact" }
        "403":
          description: "Sin permiso: usuario sin rol de gestión o mandatario configurado por el organismo (`mandatario_configurado_por_organismo`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe, está eliminado o no pertenece al alcance (no se revela más).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-offices/{transitOfficeId}/mandate-signers/{mandateSignerId}/reactivate:
    post:
      tags: [Admin · Mandatarios]
      operationId: adminMandateSignersReactivate
      summary: Reactiva un mandatario restaurando sus vínculos
      description: >
        HU #13136 (Feature #13115). Reactiva un mandatario inactivado y restaura los vínculos con compañías y
        organismos que retiró la baja, sin desplazar al default vigente (solo recupera un default que quedó vacío).
        Un vínculo que chocaría con otro mandatario activo del mismo origen para la compañía y el organismo
        (índice único) se restaura inactivo y se informa en `conflictLinks`; si TODOS chocan no se reactiva nada
        (409 `mandatario_activo_existente`). Un mandatario eliminado no se reactiva (404).
      security:
        - bearerAuth: []
      parameters:
        - { name: transitOfficeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mandateSignerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Reactivado; detalle de lo restaurado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandateSignerReactivation" }
        "403":
          description: Sin permiso (rol o candado por origen).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe, está eliminado o ya estaba activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Todos los vínculos chocan con otro mandatario activo (`mandatario_activo_existente`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/companies/{tenantId}/mandate-signers/{mandateSignerId}:
    delete:
      tags: [Admin · Mandatarios]
      operationId: adminCompanyMandateSignersDelete
      summary: Elimina (baja lógica) un mandatario de la compañía
      description: >
        HU #13135/#13137 (Feature #13115). Baja lógica (`deleted_at`, `deleted_by`): el mandatario desaparece de listas y
        candidatos, se retiran los defaults que apuntaban a él, se reasignan con la prelación del OT (ADR-0066) los
        trámites radicados sin aprobar y se conserva el historial de los ya firmados. Todo en una transacción.
        Con impacto no vacío exige `confirmarImpacto=true` (409 `mandatario_baja_requiere_confirmacion`).
        Los conteos de la reasignación viajan en las cabeceras `X-Mandatario-Reasignados` y
        `X-Mandatario-Pendientes-Decision-OT`. Permisos: un mandatario configurado por el organismo solo lo eliminan
        el Admin OT y el Super Admin (403 `mandatario_configurado_por_organismo` para la compañía).
      security:
        - bearerAuth: []
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mandateSignerId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: confirmarImpacto
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Confirmación explícita cuando la baja tiene impacto (único activo, defaults o trámites sin aprobar).
      responses:
        "204":
          description: "Eliminado. Cabeceras con los conteos de la reasignación de trámites."
          headers:
            X-Mandatario-Reasignados: { schema: { type: integer } }
            X-Mandatario-Pendientes-Decision-OT: { schema: { type: integer } }
        "403":
          description: Sin permiso (rol o candado por origen).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o ya estaba eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La baja tiene impacto y falta `confirmarImpacto` (`mandatario_baja_requiere_confirmacion`, con el impacto en `impact`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

