            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/analytics/active-modules:
    get:
      tags: [Analytics · Dashboard]
      operationId: analyticsActiveModules
      summary: Flags de módulos activos del dashboard (HU #12251, Feature #12249)
      description: >
        Devuelve únicamente los 3 flags de módulos activos del tenant (`tramitesModuleEnabled`,
