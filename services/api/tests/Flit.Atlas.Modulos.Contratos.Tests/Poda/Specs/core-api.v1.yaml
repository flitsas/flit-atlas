                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/companies/{tenantId}/mandate-signers/{mandateSignerId}/reactivate:
    post:
      tags: [Admin · Mandatarios]
      operationId: adminCompanyMandateSignersReactivate
      summary: Reactiva un mandatario de la compañía restaurando sus vínculos
      description: >
        HU #13136 (Feature #13115). Reactiva un mandatario inactivado y restaura los vínculos con compañías y
        organismos que retiró la baja, sin desplazar al default vigente (solo recupera un default que quedó vacío).
        Un vínculo que chocaría con otro mandatario activo del mismo origen para la compañía y el organismo
        (índice único) se restaura inactivo y se informa en `conflictLinks`; si TODOS chocan no se reactiva nada
        (409 `mandatario_activo_existente`). Un mandatario eliminado no se reactiva (404).
      security:
        - bearerAuth: []
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mandateSignerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Reactivado; detalle de lo restaurado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandateSignerReactivation" }
        "403":
          description: Sin permiso (rol o candado por origen).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe, está eliminado o ya estaba activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Todos los vínculos chocan con otro mandatario activo (`mandatario_activo_existente`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/mandate-signers/physical-signature-migration-report:
    get:
      tags: [Admin · Mandatarios]
      operationId: adminMandateSignersPhysicalSignatureMigrationReport
      summary: Reporte de migración de la firma física (HU #13131)
      description: >
        Mandatarios Persona natural activos que dependen SOLO de la firma física (`signs_physically`
        verdadero), sin firma del baúl y sin validación biométrica aprobada (el mandatario no renueva su
        identidad: una aprobación basta). Cada fila trae compañía, organismo, forma de firma actual, forma declarada y el
        dato que le falta. Un mandatario al que se le vincula una firma del baúl o se le aprueba la validación
        sale del reporte en la siguiente consulta. NO incluye documento ni correo (Ley 1581). Solo SuperAdmin.
        Con `format=csv` se exporta como `text/csv`.
      security:
        - bearerAuth: []
      parameters:
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filtra por organismo de tránsito.
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        "200":
          description: Filas del reporte.
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  total: { type: integer }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PhysicalSignatureMigrationRow"
            text/csv:
              schema:
                type: string
        "401":
          description: No autenticado.
        "403":
          description: Autenticado pero sin rol SuperAdmin (no se entregan datos de otros tenants).

  /api/v1/admin/transit-offices/{transitOfficeId}/mandate-signers/{mandateSignerId}/identity-validation/resend:
    post:
      tags: [Admin · Mandatarios]
      operationId: adminMandateSignersIdentityValidationResend
      summary: Reenvía la validación de identidad propia del mandatario (HU #13246)
      description: >
        HU #13246 (Feature #13245, Épica #13090). Desde el hub OT (ot_admin o Super Admin). Lanza una validación de identidad NUEVA para el mandatario
        (party_role `mandatario` + referencia a su ficha), con el mismo flujo del trámite (Kyverum: enlace al correo,
        captura y webhook; mock en local), registrada en el tenant de la COMPAÑÍA del mandatario. La anterior en vuelo se
        cierra y, por contar solo la más reciente, una aprobación anterior deja de contar hasta que la nueva se apruebe.
        Dos reenvíos simultáneos dejan una sola validación activa. Solo aplica a Persona natural con forma de firma
        `biometria`. Las rutas `identity/send`, `identity/resend` e `identity/link` siguen respondiendo 410.
      security:
        - bearerAuth: []
      parameters:
        - { name: transitOfficeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mandateSignerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Validación lanzada. `identity` = `sent` (enlace enviado) o `queued` (proveedor caído; reintento automático).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MandateSignerIdentityResend" }
        "403":
          description: Sin permiso (rol o candado por origen).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe, está eliminado o no es de ese organismo o compañía.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Persona jurídica, Formato en blanco o forma de firma baúl (`code = mandatario_no_requiere_validacion`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: La ficha no tiene correo (obligatorio con biometría); `errors[].field = email`.
        "502":
          description: El proveedor rechazó el envío de forma definitiva (`code = proveedor_error`).

