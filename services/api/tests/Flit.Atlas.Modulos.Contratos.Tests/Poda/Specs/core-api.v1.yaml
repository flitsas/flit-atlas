            - BRANDING_LOGO_FORMAT
            - BRANDING_LOGO_TOO_LARGE
            - BRANDING_LOGO_DIMENSIONS
        field:
          type: string
          nullable: true
          example: "colors.primary"
        details:
          type: object
          nullable: true
          additionalProperties: true

