                required: [url, expiresAt]
        "404": { description: "Trámite o adjunto no encontrado." }
        "503": { description: "No se pudo obtener la URL de previsualización del backend de almacenamiento." }

  /api/v1/tramites/instances/{id}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Trámites · Documentos]
      summary: Borrar un adjunto (solo en borrador o con subsanación activa)
      description: >
        Los consolidados (tipos `consolidado` y `consolidado_maestro`) son documentos del sistema y no se
        borran por esta ruta, igual que cualquier adjunto referenciado por una radicación ante Quipux
        (re-review Épica #12760, M-N1): 409 con `error = adjunto_protegido`. HU #13265: tampoco se borra un
        adjunto cargado por FLITO (`provider = flito`): mismo 409 `adjunto_protegido`; solo FLITO lo corrige reenviando.
      operationId: deleteProcedureInstanceAttachment
      security:
        - bearerAuth: []
      responses:
        "204": { description: "Adjunto borrado." }
        "404": { description: "Trámite o adjunto no encontrado." }
        "409":
          description: >
            El trámite no está en borrador ni con subsanación activa (`not_draft`, solo detail), o el
            adjunto es un documento del sistema o lo cargó FLITO (`adjunto_protegido`).
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title: { type: string, example: Conflict }
                  status: { type: integer, example: 409 }
                  detail: { type: string, example: "Este documento lo genera el sistema y no se puede eliminar." }
                  error:
                    type: string
                    enum: [adjunto_protegido]
                    description: Solo presente cuando el adjunto es un documento del sistema o lo cargó FLITO.

  /api/v1/tramites/instances/{id}/checklist:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Trámites · Documentos]
      summary: Checklist documental computado del trámite
      operationId: getProcedureInstanceChecklist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Checklist con estado de cada ítem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistResponse" }
        "404": { description: "Trámite no encontrado." }
        "422": { description: "La tipología del trámite no está configurada." }

  /api/v1/tramites/instances/{id}/consolidado:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Trámites · Documentos]
      summary: Generar el PDF consolidado del expediente
      operationId: generarProcedureInstanceConsolidado
      security:
        - bearerAuth: []
      description: >
        Fusiona el FUR y los adjuntos del trámite en un PDF único y lo adjunta como
        tipo "consolidado". Requiere FUR generado y documentos obligatorios completos.
      parameters:
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            Feature #11066 — cuando es true, invalida el consolidado vigente y lo regenera desde cero
            en lugar de servir el PDF cacheado.
      responses:
        "201":
          description: Consolidado generado (adjunto tipo "consolidado").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentDto" }
        "404": { description: "Trámite no encontrado." }
        "409": { description: "Modalidad no soportada, FUR faltante, documentos incompletos o adjunto no disponible." }

  /api/v1/tramites/instances/{id}/consolidado/entrega:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Trámites · Documentos]
      summary: Entregar el consolidado vigente (reconstruye solo si está desactualizado)
      operationId: entregarProcedureInstanceConsolidado
      security:
        - bearerAuth: []
      description: >
        HU #12785 — ruta única de obtención del consolidado para gestor y SuperAdmin. Si la bandera de
        vigencia está abajo (o no hay PDF) en un trámite no final, lo reconstruye y responde
        regenerado=true; si está arriba, devuelve el adjunto cacheado sin escribir en storage. En estado
        final (aprobado/anulado/revocado) devuelve el PDF existente sin regenerarlo y marca
        definitivoPorEstadoFinal=true (migrado V1 ⇒ modo "migrado_solo_lectura"). Un PDF cargado por el
        SuperAdmin (Source="user") nunca se pisa, ni con force. Devuelve metadatos: el binario se obtiene
        por la descarga / preview-url del adjunto con document.attachmentId.
        Épica #12760 — un GET no fuerza escrituras: force=true responde 400 force_no_permitido_en_get (la
        reconstrucción forzada queda en el POST de generación). HU #12787 — el consolidado maestro es del
        OT: tipo=consolidado_maestro solo lo pide el SuperAdmin (el resto recibe 403 maestro_solo_ot); si el
        trámite ya se radicó ante Quipux se sirve el maestro radicado tal cual (modo "radicado_fijo").
      parameters:
        - name: tipo
          in: query
          required: false
          schema: { type: string, enum: [consolidado, consolidado_maestro] }
          description: PDF pedido. Default "consolidado".
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            Reservado: en esta ruta GET solo se admite false u omitido. force=true responde 400
            force_no_permitido_en_get (Épica #12760, security M1); para reconstruir use el POST de generación.
        - name: soloLectura
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            Devuelve el adjunto existente tal cual, sin comprobar vigencia ni escribir nada (modo
            "solo_lectura"). Vía de la vista read-only del OT tras la radicación ante Quipux (HU #12787 AC2).
      responses:
        "200":
          description: Consolidado entregado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsolidadoEntregaResponse" }
        "400": { description: "Falta X-Tenant-Id, tipo inválido o force=true (error force_no_permitido_en_get)." }
        "403": { description: "tipo=consolidado_maestro pedido por un usuario que no es SuperAdmin (error maestro_solo_ot, HU #12787)." }
        "404": { description: "Trámite no encontrado, o estado final / soloLectura sin consolidado generado." }
        "409": { description: "Migrado V1 sin consolidado, FUR faltante, sin adjuntos, adjunto no disponible o formato no soportado." }
        "503": { description: "No se pudo guardar el consolidado reconstruido en el almacenamiento." }

  # ── Admin · Trámites · Gestión avanzada del consolidado (Feature #12155, HU #12158) ──────────

  /api/v1/admin/tramites/{id}/consolidado/limpiar:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin · Trámites · Gestión avanzada]
      summary: Limpiar (forzar la regeneración de) el consolidado de un trámite
      operationId: adminTramiteLimpiarConsolidado
      security:
        - bearerAuth: []
      description: >
        Descarta el consolidado vigente y lo regenera desde cero, incluso si el vigente lo cargó el
        admin a mano (Source="user"): es la ÚNICA acción que puede descartarlo. El nuevo consolidado
        queda con Source="system". Requiere el permiso `AdminTramiteLimpiarConsolidado` (SuperAdmin
        bypassa). La acción queda registrada en la bitácora del trámite con usuario, fecha y hora.
      responses:
        "200":
          description: Consolidado regenerado (adjunto tipo "consolidado", Source="system").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentDto" }
        "400": { description: "Falta el header X-Tenant-Id." }
        "401": { description: "No autenticado." }
        "403": { description: "Sin el permiso AdminTramiteLimpiarConsolidado." }
        "404": { description: "Trámite no encontrado." }
        "409": { description: "Trámite migrado (solo lectura), FUR faltante, documentos incompletos o adjunto no disponible." }

  /api/v1/admin/tramites/{id}/consolidado/cargar:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin · Trámites · Gestión avanzada]
      summary: Cargar un PDF externo como el consolidado de un trámite
      operationId: adminTramiteCargarConsolidado
      security:
        - bearerAuth: []
      description: >
        Registra un PDF provisto por el admin (multipart/form-data, campo `file`) como el expediente
        consolidado del trámite, con Source="user". Reemplaza CUALQUIER consolidado vigente sin
        importar su Source actual, y a partir de ahí prevalece sobre cualquier regeneración
        automática futura hasta que se reemplace con "Limpiar consolidado" u otra carga. Requiere el
        permiso `AdminTramiteCargarConsolidado` (SuperAdmin bypassa). La acción queda registrada en
        la bitácora del trámite con usuario, fecha y hora.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo PDF a registrar como consolidado.
              required: [file]
      responses:
        "201":
          description: Consolidado externo registrado (adjunto tipo "consolidado", Source="user").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentDto" }
        "400": { description: "Falta el header X-Tenant-Id, falta el archivo, el mimetype no es PDF o excede el tamaño máximo." }
        "401": { description: "No autenticado." }
        "403": { description: "Sin el permiso AdminTramiteCargarConsolidado." }
        "404": { description: "Trámite no encontrado." }
        "409": { description: "Trámite migrado (solo lectura)." }

  # ── Admin · Trámites · Cambiar estado sin restricción de flujo (Feature #12155, HU #12159) ─────

  /api/v1/admin/tramites/{id}/estado:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin · Trámites · Gestión avanzada]
      summary: Cambia el estado de un trámite sin restricciones de flujo (excluye 'aprobado')
      operationId: adminTramiteCambiarEstado
      security:
        - bearerAuth: []
      description: >
        Cambia `status` directamente a cualquier estado de negocio conocido (borrador, preparado,
        entregado, rechazado o anulado) SIN pasar por las transiciones válidas de la máquina de
        estados normal del gestor/OT ni por sus gates de negocio. Única regla dura: `aprobado` nunca
        participa, ni como origen ni como destino (422) — la aprobación exige el flujo formal del
        organismo de tránsito. No replica los efectos colaterales de una transición normal (no
        libera/asigna placa, no regenera consolidados/FUR, no resuelve mandatario, no encola
        notificaciones): es una corrección puntual del campo `status` para situaciones excepcionales.
        Requiere el permiso `AdminTramiteCambiarEstado` (SuperAdmin bypassa). La acción queda
        registrada en el historial de estados y en la bitácora del trámite con estado anterior, nuevo
        estado, usuario, fecha y hora.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toStatus:
                  type: string
                  description: Estado destino (borrador, preparado, entregado, rechazado o anulado).
                reason:
                  type: string
                  nullable: true
                  description: Motivo de la corrección administrativa (libre, no obligatorio).
              required: [toStatus]
      responses:
        "200":
          description: Estado cambiado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  previousStatus: { type: string }
                  newStatus: { type: string }
                  changedAt: { type: string, format: date-time }
        "400": { description: "Falta el header X-Tenant-Id o el campo toStatus." }
        "401": { description: "No autenticado." }
        "403": { description: "Sin el permiso AdminTramiteCambiarEstado." }
        "404": { description: "Trámite no encontrado." }
        "409": { description: "Conflicto de concurrencia (row_version): recargue e intente de nuevo." }
        "422": { description: "Estado destino desconocido, o 'aprobado' como origen/destino (excluido por regla de negocio)." }

  # ── Admin · Trámites · Anular desde cualquier estado (Feature #12155, HU #12160) ────────────────

  /api/v1/admin/tramites/{id}/anular:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin · Trámites · Gestión avanzada]
      summary: Anula un trámite desde cualquier estado (excluye 'aprobado' y 'revocado')
      operationId: adminTramiteAnular
      security:
        - bearerAuth: []
      description: >
        Cambia `status` directamente a `anulado` desde CUALQUIER estado de origen, sin pasar por las
        transiciones válidas de la máquina de estados normal del gestor/OT ni por sus gates de
        negocio. Dos excepciones duras (422): `aprobado` (`CANNOT_ANNUL_APPROVED`) y `revocado`
        (`CANNOT_ANNUL_REVOKED`, estado que introducirá la Feature #12156/HU #12165) no pueden
        anularse — son autoridad exclusiva del organismo de tránsito. No replica los efectos
        colaterales de una transición normal (no libera/asigna placa, no regenera consolidados/FUR, no
        resuelve mandatario, no encola notificaciones): es una corrección puntual del campo `status`
        para descartar radicaciones inválidas. Requiere el permiso `AdminTramiteAnular` (SuperAdmin
        bypassa). La acción queda registrada en el historial de estados y en la bitácora del trámite
        con estado anterior, usuario, fecha y hora.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
                  description: Motivo de la anulación administrativa (libre, no obligatorio).
      responses:
        "200":
          description: Trámite anulado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  previousStatus: { type: string }
                  newStatus: { type: string }
                  changedAt: { type: string, format: date-time }
        "400": { description: "Falta el header X-Tenant-Id." }
        "401": { description: "No autenticado." }
        "403": { description: "Sin el permiso AdminTramiteAnular." }
        "404": { description: "Trámite no encontrado." }
        "409": { description: "Conflicto de concurrencia (row_version): recargue e intente de nuevo." }
        "422": { description: "'aprobado' o 'revocado' como origen (excluidos por regla de negocio)." }

  # ── Admin · Trámites · Reenviar validación de identidad (Feature #12155, HU #12161) ─────────────

  /api/v1/admin/tramites/{id}/validaciones-identidad/{validationId}/reenviar:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: validationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin · Trámites · Gestión avanzada]
      summary: Reenvía la validación de identidad de un trámite, con correo opcional
      operationId: adminTramiteReenviarValidacionIdentidad
      security:
        - bearerAuth: []
      description: >
        Reenvía la validación de identidad (biométrica) de una parte de un trámite fuera del gate
        `not_draft` del wizard (`POST /instances/{id}/biometric`, solo borrador/subsanación) y sin
        pasar por `POST /biometric-validations/{id}/resend` (exclusivo de la prevalidación standalone,
        que rechaza validaciones ligadas a trámite). Pensado para trámites ya `entregado` con datos de
        contacto incorrectos. Sin `email` en el body, reenvía al correo actual (mismo registro, token/
        enlace nuevo, TTL 24h); con `email`, lo persiste y reenvía al nuevo destinatario. Rechaza (422)
        si el trámite está en `aprobado`, `anulado` o `revocado` (estado que introducirá la Feature
        #12156/HU #12165): en esos tres estados la identidad ya no es accionable. Aplica el mismo tope
        de reenvíos y cooldown que la prevalidación standalone (429). Requiere el permiso
        `AdminTramiteReenviarValidacion` (SuperAdmin bypassa). El reenvío queda registrado en el
        historial del trámite y en la bitácora técnica de identidad (correo siempre enmascarado).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  nullable: true
                  description: Nuevo correo destinatario (opcional). Omitido/vacío ⇒ reenvía al correo actual.
      responses:
        "200":
          description: Reenvío completado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  validation: { $ref: "#/components/schemas/BiometricValidationDto" }
                  captureUrl: { type: string }
                  emailActualizado: { type: boolean }
                  queued: { type: boolean }
        "202":
          description: Envío encolado (falla transitoria del proveedor); el worker reintenta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  validation: { $ref: "#/components/schemas/BiometricValidationDto" }
                  captureUrl: { type: string }
                  emailActualizado: { type: boolean }
                  queued: { type: boolean }
        "400": { description: "Falta el header X-Tenant-Id." }
        "401": { description: "No autenticado." }
        "403": { description: "Sin el permiso AdminTramiteReenviarValidacion." }
        "404": { description: "Trámite o validación de identidad no encontrada." }
        "409": { description: "La identidad ya está aprobada: revalidar exige una validación nueva." }
        "422": { description: "El trámite está en 'aprobado', 'anulado' o 'revocado' (identidad no accionable)." }
        "429": { description: "Tope de reenvíos agotado, o en cooldown entre reenvíos." }
        "502": { description: "El proveedor de validación de identidad rechazó la solicitud." }
        "503": { description: "El proveedor de validación de identidad no está disponible." }

  # ── Admin · Trámites · Reenviar validación por persona (Épica #13817, HU #13821) ────────────────

  /api/v1/admin/tramites/{id}/validaciones-identidad/reenviables:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin · Trámites · Gestión avanzada]
      summary: Personas del trámite a las que se puede reenviar la validación de identidad
      operationId: adminTramiteListValidacionesReenviables
      security:
        - bearerAuth: []
      description: >
        Una entrada por PERSONA (actor que valida identidad según el perfil del tipo de trámite,
        incluidos copropietarios) que todavía no firmó, con su validación PROPIA más reciente sin
        aprobar. No incluye a quien tiene identidad aprobada y vigente (propia o reutilizada de otro
        trámite), a quien está cubierto por la firma del baúl, ni a quien no tiene fila propia (no se
        inventa la persona). `esFlujoManual` marca validaciones en captura manual, que no se reenvían
        al proveedor automático. Requiere el permiso `AdminTramiteReenviarValidacion`.
      responses:
        "200":
          description: Personas reenviables (lista vacía si todas firmaron).
          content:
            application/json:
              schema:
                type: object
                properties:
                  personas:
                    type: array
                    items:
                      type: object
                      properties:
                        validationId: { type: string, format: uuid }
                        partyRole: { type: string, example: vendedor }
                        ordinal: { type: integer, minimum: 1, maximum: 4 }
                        name: { type: string, nullable: true }
                        email: { type: string, nullable: true }
                        status: { type: string }
                        captureUrl: { type: string, nullable: true }
                        captureExpiresAt: { type: string, format: date-time, nullable: true }
                        esFlujoManual: { type: boolean }
        "400": { description: "Falta el header X-Tenant-Id." }
        "401": { description: "No autenticado." }
        "403": { description: "Sin el permiso AdminTramiteReenviarValidacion." }
        "404": { description: "Trámite no encontrado." }

  /api/v1/admin/tramites/{id}/validaciones-identidad/reenviar:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin · Trámites · Gestión avanzada]
      summary: Reenvía la validación de identidad a una o varias personas del trámite
      operationId: adminTramiteReenviarValidacionesIdentidad
      security:
        - bearerAuth: []
      description: >
        Reenvío múltiple (máximo 8 personas). Cada persona sigue las mismas reglas que el reenvío
        individual (tope, cooldown, flujo manual, identidad aprobada) y su fallo no frena a las demás:
        la respuesta trae el resultado POR PERSONA. `email` opcional por persona: si cambia, se guarda en
        la validación y en el actor del trámite (persona jurídica: el correo del representante legal) y
        el historial del trámite registra el correo anterior y el nuevo. Un trámite `aprobado`,
        `anulado` o `revocado` rechaza toda la solicitud (422). Requiere el permiso
        `AdminTramiteReenviarValidacion`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    type: object
                    required: [validationId]
                    properties:
                      validationId: { type: string, format: uuid }
                      email: { type: string, format: email, nullable: true }
      responses:
        "200":
          description: Resultado por persona.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        validationId: { type: string, format: uuid }
                        ok: { type: boolean }
                        queued: { type: boolean }
                        captureUrl: { type: string, nullable: true, description: "Solo si el enlace ya existe (no en cola)." }
                        emailActualizado: { type: boolean }
                        email: { type: string, nullable: true }
                        error: { type: string, nullable: true }
                        mensaje: { type: string, nullable: true, description: "Texto para el usuario cuando ok es false." }
        "400": { description: "Falta el header X-Tenant-Id, solicitud vacía o más de 8 personas." }
        "401": { description: "No autenticado." }
        "403": { description: "Sin el permiso AdminTramiteReenviarValidacion." }
        "404": { description: "Trámite no encontrado (o de otro tenant)." }
        "422": { description: "El trámite está en 'aprobado', 'anulado' o 'revocado' (identidad no accionable)." }

  # ── Admin · Trámites · Reasignar gestor (Feature #12155, HU #12162) ─────────────────────────────

  /api/v1/admin/tramites/{id}/reasignar-gestor:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin · Trámites · Gestión avanzada]
      summary: Reasigna el gestor responsable de un trámite a otro usuario disponible del tenant
      operationId: adminTramiteReasignarGestor
      security:
        - bearerAuth: []
      description: >
        Cambia `AssignedToUserId` (gestor HOY responsable del trámite) a otro usuario DISPONIBLE del
        mismo tenant, SIN tocar `CreatedByUserId` (quién radicó, auditoría inmutable). El destino debe
        existir, pertenecer al tenant, estar activo y sin una suspensión temporal vigente; cualquier
        otra combinación rechaza la operación (422, `gestor_no_disponible`) sin aplicar cambios.
        Requiere el permiso `AdminTramiteReasignarGestor` (SuperAdmin bypassa). Queda registrado en la
        bitácora del trámite (gestor anterior, gestor nuevo, usuario, fecha y hora); no toca
        `CreatedByUserId` ni replica efectos colaterales de una transición normal (no libera/asigna
        placa, no regenera consolidados/FUR).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newAssignedToUserId:
                  type: string
                  format: uuid
                  description: Id del usuario destino (debe estar en el listado de gestores disponibles).
              required: [newAssignedToUserId]
      responses:
        "200":
          description: Gestor reasignado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  previousAssignedToUserId: { type: string, format: uuid, nullable: true }
                  newAssignedToUserId: { type: string, format: uuid }
                  changedAt: { type: string, format: date-time }
        "400": { description: "Falta el header X-Tenant-Id o el campo newAssignedToUserId." }
        "401": { description: "No autenticado." }
        "403": { description: "Sin el permiso AdminTramiteReasignarGestor." }
        "404": { description: "Trámite no encontrado." }
        "409": { description: "Conflicto de concurrencia (row_version): recargue e intente de nuevo." }
        "422": { description: "El usuario destino no existe, no pertenece al tenant, está inactivo o tiene una suspensión vigente (gestor_no_disponible)." }

  /api/v1/admin/tramites/gestores-disponibles:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
    get:
      tags: [Admin · Trámites · Gestión avanzada]
      summary: Lista los gestores disponibles del tenant para el selector de reasignación
      operationId: adminTramiteGestoresDisponibles
      security:
        - bearerAuth: []
      description: >
        Usuarios activos, no eliminados y sin suspensión vigente del tenant del header — alimenta el
        selector de "Reasignar gestor" del dashboard admin (HU #12163). Mismo permiso que la acción de
        reasignar: no reutiliza `GET /api/v1/security/users` (mezcla invitaciones pendientes, no filtra
        por disponibilidad y está gateado por un permiso de administración de usuarios distinto).
      responses:
        "200":
          description: Gestores disponibles del tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    displayName: { type: string }
                    email: { type: string, format: email }
        "400": { description: "Falta el header X-Tenant-Id." }
        "401": { description: "No autenticado." }
        "403": { description: "Sin el permiso AdminTramiteReasignarGestor." }

  # ── Admin · OT · Documentos del trámite de cliente (Feature #10701 / HU #10704 + HU #10706) ──

  /api/v1/admin/ot/client-procedures/{id}/documents:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: ID del trámite del cliente.
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: ID de la OT a la que pertenece el trámite (requerido para superadmin; opcional para OT admin).
    get:
      tags: [Admin · OT · Documentos]
      summary: Listar adjuntos del trámite de cliente OT (sin binarios)
      operationId: adminOtListClientProcedureDocuments
      description: |
        Devuelve la lista de adjuntos del trámite del cliente sin incluir los binarios,
        junto con flags que indican si existe un consolidado y/o un consolidado maestro
        (Feature #10701 / HU #10704).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de adjuntos con flags de consolidado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AttachmentDto" }
                  consolidado:
                    type: boolean
                    description: Indica si existe un adjunto de tipo "consolidado".
                  consolidado_maestro:
                    type: boolean
                    description: Indica si existe un adjunto de tipo "consolidado_maestro".
                required: [data, consolidado, consolidado_maestro]
        "401": { description: "No autenticado." }
        "403": { description: "Sin acceso a este trámite." }
        "404": { description: "Trámite no encontrado." }

  /api/v1/admin/ot/client-procedures/{id}/documents/{attachmentId}/preview-url:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: ID del trámite del cliente.
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: ID del adjunto.
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: ID de la OT a la que pertenece el trámite (requerido para superadmin).
    get:
      tags: [Admin · OT · Documentos]
      summary: Presigned URL inline para previsualizar adjunto de trámite de cliente OT
      operationId: adminOtGetClientProcedureDocumentPreviewUrl
      description: |
        Devuelve una presigned GET URL con `Content-Disposition: inline` para visualizar el adjunto
        del trámite en el navegador sin forzar descarga (Feature #10701 / HU #10704 / ADR-0029).
        TTL ≈ 10 min. Valida grant de acceso de la OT antes de emitir la URL.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: URL de previsualización firmada y su tiempo de expiración.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: URL presigned con Content-Disposition inline.
                  expiresAt:
                    type: string
                    format: date-time
                    description: Momento de expiración de la URL (UTC, ≈ +10 min).
                required: [url, expiresAt]
        "401": { description: "No autenticado." }
        "403": { description: "Sin acceso a este trámite." }
        "404": { description: "Adjunto no encontrado." }
        "503": { description: "No se pudo obtener la URL de previsualización del backend de almacenamiento." }

  /api/v1/admin/ot/client-procedures/{id}/consolidado/entrega:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: ID del trámite del cliente.
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: ID de la OT a la que pertenece el trámite (requerido para superadmin; opcional para OT admin).
    get:
      tags: [Admin · OT · Documentos]
      summary: Entregar el consolidado vigente de un trámite de cliente OT (reconstruye solo si está desactualizado)
      operationId: adminOtDeliverClientProcedureConsolidado
      security:
        - bearerAuth: []
      description: >
        HU #12785 — mismas reglas que GET /api/v1/tramites/instances/{id}/consolidado/entrega, sobre el
        maestro por defecto. Un OT en modo Quipux read-only que no puede generar el tipo pedido recibe el
        adjunto tal cual (modo "solo_lectura") en vez de 403. HU #12787 (AC2) — si el trámite ya se radicó
        ante Quipux, el maestro radicado se sirve tal cual (modo "radicado_fijo") y nunca se regenera, sea
        cual sea soloLectura; si ese adjunto ya no existe se aplica el comportamiento de solo lectura.
        force=true responde 400 force_no_permitido_en_get (Épica #12760, security M1).
      parameters:
        - name: tipo
          in: query
          required: false
          schema: { type: string, enum: [consolidado, consolidado_maestro] }
          description: PDF pedido. Default "consolidado_maestro".
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            Reservado: en esta ruta GET solo se admite false u omitido. force=true responde 400
            force_no_permitido_en_get (Épica #12760, security M1); para reconstruir use el POST de generación.
        - name: soloLectura
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            Devuelve el adjunto existente tal cual, sin comprobar vigencia ni escribir nada (modo
            "solo_lectura"). Vía de la vista read-only del OT tras la radicación ante Quipux (HU #12787 AC2).
      responses:
        "200":
          description: Consolidado entregado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsolidadoEntregaResponse" }
        "400": { description: "tipo inválido o force=true (error force_no_permitido_en_get)." }
        "401": { description: "No autenticado." }
        "403": { description: "Sin acceso a este trámite." }
        "404": { description: "Trámite no encontrado, o estado final / soloLectura sin consolidado generado." }
        "409": { description: "Migrado V1 sin consolidado, FUR faltante, sin adjuntos, adjunto no disponible o formato no soportado." }
        "503": { description: "No se pudo guardar el consolidado reconstruido en el almacenamiento." }

  /api/v1/admin/ot/client-procedures/{id}/consolidado-maestro:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: ID del trámite del cliente.
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: ID de la OT a la que pertenece el trámite (requerido para superadmin).
    post:
      tags: [Admin · OT · Documentos]
      summary: Generar/regenerar el consolidado maestro del trámite de cliente OT
      operationId: adminOtGenerateClientProcedureConsolidadoMaestro
      description: |
        Fusiona todos los adjuntos activos del trámite del cliente (tabla maestra) en un PDF único,
        excluyendo consolidados previos. No requiere gate FUR a diferencia del consolidado del wizard.
        Si ya existe un consolidado_maestro previo, se reemplaza (Feature #10701 / HU #10706).
        HU #12787 (AC2) — si el trámite ya se radicó ante Quipux, NO se regenera (ni con force): se
        devuelve el maestro radicado tal cual (modo "radicado_fijo"); un maestro radicado nunca se retira
        ni se borra. Si ese adjunto ya no existe, se devuelve el maestro existente (modo "solo_lectura") o
        404 consolidado_no_generado.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consolidado maestro generado (adjunto tipo "consolidado_maestro").
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  tipo: { type: string, example: consolidado_maestro }
                  filename: { type: string }
                  sha256: { type: string }
                required: [id, tipo, filename, sha256]
        "401": { description: "No autenticado." }
        "403": { description: "Sin acceso a este trámite o entidad en modo sólo lectura (QUIPUX_READONLY)." }
        "404": { description: "Trámite no encontrado, o radicado ante Quipux sin consolidado maestro disponible (consolidado_no_generado)." }
        "409": { description: "sin_adjuntos — No hay adjuntos disponibles para consolidar; o adjunto_no_disponible / mimetype_no_soportado." }

  # ── Admin · OT · Bandeja y lote de consolidados maestros (Épica #13216, HU #13391) ──

  /api/v1/admin/ot/client-procedures/search:
    post:
      operationId: AdminOtSearchClientProcedures
      tags: [Admin · OT]
      summary: Bandeja del OT filtrada con la gramática de consultas
      description: >
        HU #12217 (documentado por HU #13391, deriva FB-l). La MISMA bandeja que
        `GET /api/v1/admin/ot/client-procedures`, por POST para aceptar condiciones del catálogo y listas
        pegadas. El tenant OT sale del JWT; el SuperAdmin acota con `?transitOfficeId`. Su filtro
        (`OtBandejaSearchFilter`) es el que reutiliza el lote de maestros (`POST /api/v1/admin/ot/consolidados/lotes`).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: transitOfficeId
          required: false
          description: Solo SuperAdmin (organismo cuya bandeja consulta); se ignora para el resto.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtBandejaSearchRequest" }
      responses:
        "200":
          description: Página de la bandeja y el total que cumple el filtro.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount, page, pageSize]
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
                  totalCount: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        "400":
          description: Campo u operador fuera del catálogo de condiciones, familia no válida, o `transitOfficeId` fuera del catálogo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Sin token válido.
        "403":
          description: Sin OtModulePolicy.

  /api/v1/admin/ot/consolidados/lotes:
    post:
      operationId: CrearLoteConsolidadosMaestrosOt
      tags: [Admin · OT]
      summary: Crea un lote de descarga masiva de consolidados maestros desde la bandeja del OT
      description: >
        Feature #13308 / ADR-0070 adenda v4 (HU #13391). Resuelve la selección EN SERVIDOR con el mismo universo,
        filtros y orden de la bandeja (`POST /api/v1/admin/ot/client-procedures/search`) sin paginar y congela el
        total; un id fuera de la bandeja (otro organismo, borrador) no entra (CF-06). Siempre
        `consolidado_maestro`. Exige OtModulePolicy Y el permiso consolidado-masivo.download (AND). El tenant OT
        sale del JWT; el SuperAdmin debe indicar `?transitOfficeId` y el lote queda con el tenant OT dueño de ese
        organismo. Cada ítem queda con la compañía cliente de su trámite. La auditoría `lote_creado` se escribe
        en la misma transacción (`filter_summary` con el organismo, condiciones como {campo, operador, cantidad}
        y la búsqueda libre como {presente, longitud}); si no se puede registrar, el lote no se crea (503). La
        consulta, descarga y cancelación usan `/api/v1/consolidados/lotes/*`. Errores: ProblemDetails con el
        código estable en `error` (raíz). Códigos: 400 `transit_office_requerido` (SuperAdmin sin
        `?transitOfficeId`), `transit_office_invalido` (organismo fuera del catálogo), `confirmacion_requerida`,
        `tipo_no_permitido`, `seleccion_requerida`, `seleccion_invalida`, `filtro_invalido` (condición o familia
        fuera de catálogo, igual que la búsqueda de la bandeja); 403 `sin_organismo` (tenant OT sin organismo
        resoluble); 404 (SuperAdmin: organismo sin tenant OT vinculado); 409 `lote_activo`; 422
        `seleccion_excede_tope` (más de 10.000 ids o excluidos, o la selección resuelta supera el tope total
        `max_items_per_batch`, con `total` y `tope`); 503 `motor_inactivo` y `lote_no_creado`.
      x-required-permission: consolidado-masivo.download
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: transitOfficeId
          required: false
          description: Solo SuperAdmin (obligatorio para él); se ignora para ot_admin.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearLoteConsolidadosOtRequest" }
      responses:
        "202":
          description: Lote creado y en cola (`Location` = `/api/v1/consolidados/lotes/{loteId}`).
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoteConsolidados" }
        "400":
          description: "`transit_office_requerido`, `transit_office_invalido`, `confirmacion_requerida`, `tipo_no_permitido`, `seleccion_requerida`, `seleccion_invalida` o `filtro_invalido`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }
        "401":
          description: Sin token válido.
        "403":
          description: "Sin OtModulePolicy, sin consolidado-masivo.download, o `sin_organismo`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }
        "404":
          description: SuperAdmin con un `transitOfficeId` sin tenant OT vinculado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: "`lote_activo`: ya existe un lote activo del usuario (de cualquier origen)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteActivoConflict" }
        "422":
          description: "`seleccion_excede_tope`: más de 10.000 ids o excluidos, o selección resuelta por encima del tope total `max_items_per_batch` (con `total` y `tope` en la raíz)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }
        "503":
          description: "`motor_inactivo` o `lote_no_creado` (no se pudo registrar la auditoría; el lote no se creó)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }

  # ── Admin · Baúl de Firmas (HU #10643, #11175) ──────────────────────────────

  /api/v1/admin/companies/{tenantId}/signature-vault:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: adminSignatureVaultList
      tags: ["Admin · Baúl de Firmas"]
      security:
        - bearerAuth: []
      summary: "Lista las firmas del baúl de una compañía"
      description: >
        Devuelve las firmas del baúl del tenant (activas y revocadas), sin material de firma.
        Soporta filtrado opcional por documento del representante (AC1, HU #11175) y por
        vigencia (AC2). Solo rol SuperAdmin.
      parameters:
        - name: documentType
          in: query
          required: false
          schema: { type: string, maxLength: 20 }
          description: "Tipo de documento del representante. Requerido junto con documentNumber para filtrar por persona."
        - name: documentNumber
          in: query
          required: false
          schema: { type: string, maxLength: 30 }
          description: "Número de documento del representante (PII). Si se indica, la respuesta incluye solo las firmas de esa persona."
        - name: soloVigentes
          in: query
          required: false
          schema: { type: boolean }
          description: "Si true, excluye las firmas cuya vigencia ya expiró (VigenciaHasta < hoy Colombia)."
      responses:
        "200":
          description: "Lista de firmas (activas primero, luego por creación descendente)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SignatureVaultResponse"
        "401": { description: "No autenticado." }
        "403": { description: "Sin permiso (requiere SuperAdmin)." }
    post:
      operationId: adminSignatureVaultCreate
      tags: ["Admin · Baúl de Firmas"]
      security:
        - bearerAuth: []
      summary: "Registra una firma precargada en el baúl de la compañía"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSignatureVaultRequest"
      responses:
        "201":
          description: "Firma registrada."
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        "401": { description: "No autenticado." }
        "403": { description: "Sin permiso (requiere SuperAdmin)." }
        "422": { description: "Datos inválidos (campo faltante, artefacto inválido, firma activa existente)." }

  /api/v1/admin/companies/{tenantId}/signature-vault/{id}:
    parameters:
