      operationId: companyBrandingEmailSample
      summary: Previsualiza una plantilla de correo con el tema propio de la cabeza (HU #12428, HU #12431 AC1, HU #12414 AC4)
      description: >-
        El tenant sale del JWT (nunca de un parámetro). `source=published` (por defecto) sin marca
        publicada (borrador únicamente, o sin configuración) responde `200` con `theme.kind = "flit"`
        — nunca `404`: la ausencia de marca publicada no es un error de la muestra (HU #12428 AC4,
        el tema nunca hace fallar el envío/la previsualización). `source=draft` construye el tema
        desde el borrador sin persistir nada; si el borrador está incompleto, los campos faltantes se
        completan con FLIT y `theme.kind = "draft-partial"`. `templateId` está limitado a
        `Branding:SampleTemplates` (por defecto `["tramites.aprobado"]`).
      security:
        - bearerAuth: []
      parameters:
        - name: templateId
          in: query
          schema: { type: string, default: "tramites.aprobado" }
        - name: source
          in: query
          schema: { type: string, enum: [draft, published], default: published }
      responses:
        "200":
          description: Muestra compuesta con el tema propio de la cabeza.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplateSampleResponse" }
        "400":
          description: templateId fuera de la lista permitida (BRANDING_SAMPLE_TEMPLATE_NOT_ALLOWED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { description: No autenticado. }
        "403": { description: "No es cabeza de grupo (respuesta uniforme, sin revelar nada)." }

  /api/v1/public/branding:
    get:
      tags: [Público · Identidad de marca]
      operationId: publicBrandingGet
      summary: Identidad de marca del dominio de entrada, antes de sesión (HU #12418 AC1-AC3, AC6-AC9)
      description: >-
        El dominio SIEMPRE sale del sello X-Flit-Domain que fija Flit.Gateway (ADR-0060 D2), nunca de
        un parámetro o cabecera del cliente. SIEMPRE 200: dominio de FLIT, desconocido, pendiente,
        cabeza inactiva, marca sin publicar o cualquier fallo de BD/storage responden la MISMA forma
        (BrandIdentityResponse de respaldo, version 0) — indistinguibles entre sí (AC2/AC3).
      security: []
      responses:
        "200":
          description: Identidad de marca publicada del dominio, o la identidad de FLIT de respaldo.
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
            Vary: { schema: { type: string, example: "X-Flit-Domain" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandIdentityResponse" }
        "429":
          description: Límite de tasa por IP excedido (policy public-branding). Sin cuerpo informativo.

  /api/v1/public/network:
    get:
      tags: [Público · Identidad de marca]
      operationId: publicNetworkGet
      summary: Hub de la red del dominio de entrada (Marca Blanca con la FLIT Suite)
      description: >-
        Lo consulta @flit/auth desde el servidor de cada app antes del authorize: en un dominio de red el
        emisor OIDC es el hub de esa red (su dominio con purpose HUB). Igual que /public/branding, el
        dominio sale solo del sello X-Flit-Domain y la forma es siempre la misma; hubUrl es null en el
        dominio de FLIT, en un host desconocido o en una red sin dominio HUB activo.
      security: []
      responses:
        "200":
          description: URL del hub de la red, o null.
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
            Vary: { schema: { type: string, example: "X-Flit-Domain" } }
          content:
            application/json:
              schema:
                type: object
                required: [hubUrl]
                properties:
                  hubUrl: { type: string, format: uri, nullable: true, example: "https://marcablanca.ejemplo.com" }
        "429":
          description: Límite de tasa por IP excedido (policy public-branding). Sin cuerpo informativo.

  /api/v1/public/branding/logos/{logoId}:
    parameters:
      - name: logoId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Id opaco de la versión del logotipo (admin.tenant_brand_logos.id) — no es un id de compañía.
    get:
      tags: [Público · Identidad de marca]
      operationId: publicBrandLogoGet
      summary: Logotipo de marca por versión, URL inmutable (HU #12418 AC4)
      description: >-
        Se sirve si la fila existe, no está borrada y su tenant sigue MARCA_BLANCA (las versiones
        superseded también: la URL es inmutable). Publicar una versión nueva cambia logoId ⇒ cambia
        la URL, así la caché anterior nunca se reutiliza.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Binario del logotipo.
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=31536000, immutable" } }
            ETag: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, example: "nosniff" } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304": { description: If-None-Match coincide con el ETag actual. }
        "404": { description: "Id inexistente, borrado o de una cabeza que dejó de ser MARCA_BLANCA (indistinguibles)." }
        "429":
          description: Límite de tasa por IP excedido (policy public-branding). Sin cuerpo informativo.

  /api/v1/me/branding:
    get:
      tags: [Sesión · Identidad de marca]
      operationId: meBrandingGet
      summary: Identidad de marca heredada por el usuario autenticado (HU #12418 AC5/AC6)
      description: >-
        Sin parámetros de tenant: sale SIEMPRE de RequestTenantResolver (JWT). Cabeza MARCA_BLANCA
        activa ⇒ su marca; hija de una cabeza MARCA_BLANCA activa (parent_tenant_id, nunca el token)
        ⇒ la marca de su cabeza; Concesión, hija de Concesión, sin red, SuperAdmin o cabeza sin
        publicar ⇒ identidad de FLIT.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identidad de marca heredada, o la identidad de FLIT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandIdentityResponse" }
        "401": { $ref: "#/components/responses/SessionDomainMismatch" }

  /api/v1/admin/companies/{tenantId}/domain:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (cabeza de grupo MARCA_BLANCA).
    get:
      tags: [Admin · Dominio de la red]
      operationId: adminDomainGet
      summary: Dominio registrado de una cabeza MARCA_BLANCA (HU #12416 AC1)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dominio registrado (con instrucciones DNS).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDomainResponse" }
        "401": { description: No autenticado. }
        "403": { description: Autenticado pero sin rol SuperAdmin. }
        "404": { description: El tenant no tiene un dominio registrado. }
    put:
      tags: [Admin · Dominio de la red]
      operationId: adminDomainRegister
      summary: Registra o cambia el dominio de una cabeza MARCA_BLANCA (HU #12416 AC1, AC5)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDomainRequest" }
      responses:
        "200":
          description: Dominio registrado o cambiado (reinicia el ciclo a pending con token nuevo si cambió el host).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDomainResponse" }
        "400":
          description: Formato inválido, IDN mal formado o dominio reservado (HU #12416 AC1/AC3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { description: No autenticado. }
        "403": { description: Autenticado pero sin rol SuperAdmin. }
        "409":
          description: Conflicto de concurrencia, host ya registrado por otra red o tenant no MARCA_BLANCA (HU #12416 AC2).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Admin · Dominio de la red]
      operationId: adminDomainRemove
      summary: Retira el dominio vigente; el dato se conserva (HU #12416 AC5)
      security:
        - bearerAuth: []
      responses:
        "204": { description: Dominio retirado. }
        "401": { description: No autenticado. }
        "403": { description: Autenticado pero sin rol SuperAdmin. }
        "404": { description: El tenant no tiene un dominio registrado. }

  /api/v1/admin/companies/{tenantId}/domain/verify:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (cabeza de grupo MARCA_BLANCA).
    post:
      tags: [Admin · Dominio de la red]
      operationId: adminDomainVerify
      summary: Comprueba a demanda el registro TXT de titularidad (HU #12425 AC2)
      description: >
        Consulta _flit-verify.<host> y aplica la misma máquina de estados que el trabajo
        programado (pending/failed → verified con TXT coincidente; → failed con motivo si no
        coincide o no existe; en active, ausencia del TXT entra en gracia — AC4). Sujeto a
        enfriamiento (Domains:Verification:ManualCooldownSeconds).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resultado de la comprobación (verified o failed con statusReason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDomainResponse" }
        "401": { description: No autenticado. }
        "403": { description: Autenticado pero sin rol SuperAdmin. }
        "404": { description: El tenant no tiene un dominio registrado. }
        "429":
          description: Se pidió la comprobación antes de que venciera el enfriamiento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/company/domain:
    get:
      tags: [Compañía · Dominio de la red]
      operationId: companyDomainGet
      summary: Dominio registrado de la propia cabeza de grupo, solo lectura (HU #12416, #12427 AC1/AC2)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dominio registrado de la propia cabeza.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDomainResponse" }
        "401": { description: No autenticado. }
        "403": { description: "No es cabeza de grupo (respuesta uniforme, sin revelar nada)." }
        "404": { description: La red no tiene un dominio registrado. }

  /api/v1/company/domain/verify:
    post:
      tags: [Compañía · Dominio de la red]
      operationId: companyDomainVerify
      summary: Comprueba a demanda el registro TXT de titularidad de la propia red (HU #12427 AC2)
      description: Mismo comportamiento que el endpoint SuperAdmin (HU #12425 AC2); el tenant sale del JWT.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resultado de la comprobación (verified o failed con statusReason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDomainResponse" }
        "401": { description: No autenticado. }
        "403": { description: No es cabeza de grupo. }
        "404": { description: La red no tiene un dominio registrado. }
        "429":
          description: Se pidió la comprobación antes de que venciera el enfriamiento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/internal/jwks.json:
    get:
      tags: [Internal]
      operationId: internalJwks
      summary: >-
        USO INTERNO — JWKS con la llave PÚBLICA (kid Jwt:SigningKeyId, p. ej. flit-api-v1) con que core-api firma el
        token de usuario. Lo lee core-ict (Jwt:JwksUri) por la red interna; YARP no publica /api/v1/internal/*.
      security: []
      responses:
        "200":
          description: Conjunto de llaves públicas (solo n y e; sin parámetros privados).
          content:
            application/json:
              schema: { type: object }

  /api/v1/internal/domains/active:
    get:
      tags: [Internal]
      operationId: internalActiveDomains
      summary: >-
        USO INTERNO (HU #12417) — dominios activos de cabezas MARCA_BLANCA, consumido por
        Flit.Gateway para derivar CORS dinámico (ADR-0060 D2). YARP NO publica esta ruta;
        el Gateway la llama directo (mismo proceso interno), nunca a través del proxy.
      description: >
        No forma parte de la superficie pública ni del contrato del frontend. Autenticado con la
        cabecera X-Internal-Key (clave compartida Internal:ApiKey), no con JWT. Sin la clave
        configurada o con una clave incorrecta responde 401 de forma uniforme.
      security: []
      parameters:
        - name: X-Internal-Key
          in: header
          required: true
          schema: { type: string }
          description: Clave compartida servicio a servicio (Gateway → API).
      responses:
        "200":
          description: Hosts activos (status=active) de cabezas MARCA_BLANCA.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts:
                    type: array
                    items: { type: string }
                required: [hosts]
        "401": { description: Clave interna ausente o incorrecta. }

  /api/v1/internal/domains/pending-certificate:
    get:
      tags: [Internal]
      operationId: internalPendingCertificateDomains
      summary: >-
        USO INTERNO (HU #12425, consumido por el poller ACME de #12426) — dominios que necesitan
        certificado: verified sin certificate_issued_at (primera emisión), o active con
        certificate_expires_at dentro de 30 días (renovación).
      description: >
        No forma parte de la superficie pública. Autenticado con X-Internal-Key. Solo cabezas
        MARCA_BLANCA activas y vigentes (deleted_at IS NULL).
      security: []
      parameters:
        - name: X-Internal-Key
          in: header
          required: true
          schema: { type: string }
          description: Clave compartida servicio a servicio.
      responses:
        "200":
          description: Hosts pendientes de emisión o renovación de certificado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts:
                    type: array
                    items: { type: string }
                required: [hosts]
        "401": { description: Clave interna ausente o incorrecta. }

  /api/v1/internal/domains/{host}/certificate:
    parameters:
      - name: host
        in: path
        required: true
        schema: { type: string }
        description: Host del dominio (ya normalizado).
    put:
      tags: [Internal]
      operationId: internalDomainCertificate
      summary: >-
        USO INTERNO (HU #12425 AC3, señal de #12426) — certificado emitido en el borde: verified
        pasa a active (activated_at = now()); active solo actualiza las fechas del certificado.
      security: []
      parameters:
        - name: X-Internal-Key
          in: header
          required: true
          schema: { type: string }
          description: Clave compartida servicio a servicio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issuedAt: { type: string, format: date-time }
                expiresAt: { type: string, format: date-time, nullable: true }
              required: [issuedAt]
      responses:
        "200": { description: Certificado aplicado (y activado si estaba verified). }
        "401": { description: Clave interna ausente o incorrecta. }
        "404": { description: El host no tiene dominio registrado. }
        "409":
          description: El dominio no está verified/active (DOMAIN_NOT_VERIFIED) — no puede recibir certificado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/companies/{tenantId}/whitelist:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    get:
      tags: [Admin · Compañías]
      operationId: adminCompanyGetWhitelist
      summary: Lista blanca de correos exentos de la regla de propiedad vehicular (RF05, AC6)
      description: >
        Retorna los correos activos exentos de la regla only_own_vehicles del tenant.
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de correos exentos (puede ser vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhitelistEntry"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Admin · Compañías]
      operationId: adminCompanyAddWhitelist
      summary: Alta masiva de correos en la lista blanca + audit log (RF05, AC4/AC5)
      description: >
        Da de alta de forma atómica uno o más correos en la lista blanca del tenant y
        genera una entrada de auditoría por cada correo insertado. Los duplicados ya
        existentes se omiten sin error (idempotente, 201 parcial). Si algún correo es
        inválido retorna 422 con la lista de inválidos sin persistir ninguno (atómico).
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhitelistAddRequest"
      responses:
        "201":
          description: Correos procesados. Devuelve insertados y omitidos (duplicados).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhitelistAddResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Uno o más correos inválidos. No se persiste ninguno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhitelistValidationErrorResponse"

  /api/v1/internal/transfers/start:
    post:
      tags: [Trámites · Traspaso]
      operationId: internalTransfersStart
      summary: Stub de radicación de traspaso con interceptor de propiedad vehicular (RF04, AC1/AC2)
      description: >
        Endpoint mínimo que cablea el interceptor de propiedad vehicular: valida la
        regla only_own_vehicles efectiva del trámite (snapshot si está in-flight, AC3)
        contemplando la exención por lista blanca (AC2). Si el vehículo no es del
        tenant y el usuario no está exento, retorna 422 con el mensaje de bloqueo
        (AC1). Exige usuario autenticado (rol operador), no SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferStartRequest"
      responses:
        "200":
          description: El traspaso puede iniciarse.
        "401":
          description: No autenticado (sin token JWT).
        "422":
          description: El interceptor bloquea el traspaso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-offices:
    get:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesSearch
      summary: Catálogo de organismos de tránsito con búsqueda (RF13, AC1)
      description: >
        Retorna el catálogo de organismos de tránsito desde `catalogs.transit_offices`.
        El parámetro opcional `search` filtra por nombre o código (case-insensitive e
        insensible a tildes). Requiere JWT con rol SuperAdmin u ot_admin (OtModulePolicy).
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Término opcional de búsqueda (nombre o código).
      responses:
        "200":
          description: Catálogo de organismos (filtrado si se informó `search`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransitOffice"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin u ot_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-offices/operational-status:
    get:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesOperationalStatus
      summary: Estado operativo y parametrización Quipux de los organismos de tránsito (RF01)
      description: >
        Una fila por oficina activa del catálogo (`catalogs.transit_offices` LEFT JOIN
        `admin.transit_office_profiles` + `identity.tenants`), ordenada por nombre. Incluye
        tanto el estado del tenant OT —si la oficina es cliente de FLIT— como la
        parametrización Quipux del catálogo (`divipoCode` + banderas, HU #10710), que existe
        para las 317 oficinas sean o no clientes. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado operativo por oficina del catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransitOfficeOperationalStatus"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin (ot_admin incluido).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-offices/{id}/quipux-settings:
    put:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesUpdateQuipuxSettings
      summary: Parametriza la radicación Quipux de una secretaría (HU #10710)
      description: >
        Reemplaza (PUT completo) el código DIVIPO y las tres banderas por familia de trámite
        de `catalogs.transit_offices`. Describe a la secretaría **DESTINO** a la que FLIT
        radica trámites vía Quipux, que normalmente **no** es cliente de FLIT.


        No confundir con `admin.transit_office_profiles.operation_mode = 'quipux'`
        (HU #10215): aquello describe al OT-**cliente** cuya consola queda en solo lectura
        porque aprueba dentro de Quipux. Son conceptos distintos que comparten el nombre.


        Reglas: `divipoCode` nulo o vacío significa «aún no se conoce» — **no es un error**
        mientras no haya banderas activas —, es el estado normal de las secretarías todavía no
        integradas (hoy 311 de 317), y se normaliza a `null` dejando la secretaría NO elegible.
        En cambio, activar una bandera sin DIVIPO se **rechaza** (`422 DIVIPO_REQUIRED_FOR_FLAGS`):
        el DIVIPO es obligatorio en cuanto se enciende una familia, para que no exista el estado
        inconsistente «declara pero no radica». Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id de la oficina en `catalogs.transit_offices`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitOfficeQuipuxSettingsRequest"
      responses:
        "200":
          description: Parametrización persistida (estado ya normalizado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitOfficeQuipuxSettings"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin (ot_admin incluido).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La oficina no existe o está descatalogada (`TRANSIT_OFFICE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"
        "422":
          description: >
            `DIVIPO_CODE_INVALID` (el DIVIPO no es numérico o excede 20 dígitos),
            `QUIPUX_FLAGS_REQUIRED` (falta alguna bandera en el PUT) o
            `DIVIPO_REQUIRED_FOR_FLAGS` (se activó una bandera sin cargar el DIVIPO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"

  /api/v1/admin/transit-offices/{id}/quipux-submissions:
    get:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesListQuipuxCola
      summary: Cola de radicaciones Quipux de una secretaría (HU #10774)
      description: >
        Lista `tramites.quipux_submissions` de los trámites cuyo `transit_office_id` es esta
        secretaría **destino**, enriquecidas con el número de referencia, el tipo de trámite y
        la razón social del cliente. Incluye todos los estados (activa + histórico:
        `pendiente`, `registrado`, `aprobado`, `rechazado`, `fallido`), ordenados del más nuevo
        al más viejo. Requiere SuperAdmin u ot_admin (OtModulePolicy); el ot_admin solo puede
        consultar su propia secretaría: el `{id}` de la ruta debe coincidir con el
        `transit_office_id` que su perfil OT resuelve desde su `tenant_id` (recuerda que
        `tenant_id` ≠ `transit_office_id`), de lo contrario 403 `TRANSIT_OFFICE_FORBIDDEN`.
        El SuperAdmin es cross-tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id de la secretaría destino en `catalogs.transit_offices`.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de la cola.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuipuxColaPage"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: >
            Sin rol SuperAdmin u ot_admin, o un ot_admin consultando una secretaría
            que no es la de su perfil OT (`TRANSIT_OFFICE_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-offices/{id}/quipux-submissions/{submissionId}/retry:
    post:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesRetryQuipuxSubmission
      summary: Re-encola una radicación Quipux fallida (HU #10774)
      description: >
        Lleva una submission `fallido` de vuelta a `pendiente` con presupuesto de intentos
        fresco, de modo que el registrador la vuelva a reclamar. Requiere SuperAdmin u ot_admin;
        el ot_admin solo opera la secretaría de su perfil OT (403 `TRANSIT_OFFICE_FORBIDDEN` si el
        `{id}` no coincide con su `transit_office_id`).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id de la secretaría destino (scope de la submission).
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Re-encolada (código OK)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeResponse"
        "401":
          description: No autenticado.
        "403":
          description: >
            Sin rol SuperAdmin u ot_admin, o un ot_admin operando una secretaría ajena
            (`TRANSIT_OFFICE_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            No hay submission con ese id en esta secretaría
            (`QUIPUX_SUBMISSION_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"
        "409":
          description: >
            `QUIPUX_SUBMISSION_INVALID_STATE` (no está en `fallido`) o
            `QUIPUX_SUBMISSION_CONFLICT` (el trámite ya tiene otra radicación viva).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"

  /api/v1/admin/transit-offices/{id}/quipux-submissions/{submissionId}/cancel:
    post:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesCancelQuipuxSubmission
      summary: Cancela una radicación Quipux pendiente (HU #10774)
      description: >
        Lleva una submission `pendiente` a `fallido` terminal antes de que se radique.
        La transición está guardada por estado: si un worker la registró entre la carga de la
        pantalla y el clic, responde 409. Requiere SuperAdmin u ot_admin; el ot_admin solo opera
        la secretaría de su perfil OT (403 `TRANSIT_OFFICE_FORBIDDEN` si el `{id}` no coincide con
        su `transit_office_id`).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id de la secretaría destino (scope de la submission).
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Cancelada (código OK)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeResponse"
        "401":
          description: No autenticado.
        "403":
          description: >
            Sin rol SuperAdmin u ot_admin, o un ot_admin operando una secretaría ajena
            (`TRANSIT_OFFICE_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No hay submission con ese id en esta secretaría (`QUIPUX_SUBMISSION_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"
        "409":
          description: >
            `QUIPUX_SUBMISSION_INVALID_STATE`: ya no está en `pendiente`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"

  /api/v1/admin/log-qx:
    get:
      tags: [Admin · LOG QX]
      operationId: adminLogQxSearch
      summary: Consulta el LOG QX de una radicación (HU #10793)
      description: >
        Trazabilidad de la integración Quipux para soporte/administración. Dado una placa, un id de
        trámite (`instanceId`) o un radicado, devuelve la(s) radicación(es) que corresponden —el
        estado final y los códigos QX de `tramites.quipux_submissions`— cada una con su línea de
        tiempo completa reconstruida de `tramites.quipux_submission_events` (etapa, resultado, detalle
        sanitizado, `occurred_at`), incluidos los eventos de error y de reintento. Cada evento expone,
        cuando el detalle instrumentado lo trae, el código de respuesta, la duración de la llamada HTTP
        (`durationMs`) y el origen (worker `quipux_register` / `quipux_status_poll`); los eventos
        históricos sin detalle se devuelven con `detail: null` ("sin payload disponible") sin romper la
        respuesta. La respuesta NUNCA incluye request/response crudos ni PII: solo el `detail` ya
        sanitizado en captura, sobre el que además se enmascaran los datos sensibles (HU #10794).
        Paginado (`page`/`pageSize`). Requiere el permiso `logqx.read` (SuperAdmin bypassa). Sin
        ningún filtro, lista todas las radicaciones paginadas.
      security:
        - bearerAuth: []
      parameters:
        - name: placa
          in: query
          required: false
          schema: { type: string }
          description: Placa del vehículo; casa por valor normalizado (mayúsculas, sin espacios).
        - name: instanceId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Id del trámite (`procedure_instance_id`). Se espera un UUID; si el valor no tiene formato
            de UUID, la respuesta es una página vacía (no un error), igual que `radicado` no numérico.
        - name: radicado
          in: query
          required: false
          schema: { type: string }
          description: >
            Número de radicación ≈ código QX (registro o trámite). Si no es numérico, la respuesta es
            una página vacía.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de radicaciones con su línea de tiempo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogQxPage"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin el permiso logqx.read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/profile:
    get:
      tags: [Admin · OT]
      operationId: adminOtGetProfile
      summary: Perfil OT del tenant autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >
            Perfil OT (operationMode, quipuxReadOnly, transitOfficeId, featureFlags,
            revocationWindowBusinessDays). `revocationWindowBusinessDays` es la ventana de
            revocatoria en días hábiles (HU #12568); `null` = sin configurar = sin límite.
        "401":
          description: No autenticado.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
    patch:
      tags: [Admin · OT]
      operationId: adminOtPatchProfile
      summary: Actualizar modo Dashboard/QX y ventana de revocatoria (HU #12854/#12855 — solo SuperAdmin)
      description: >
        Exclusivo de SuperAdmin (HU #12855, Feature #12847, Épica #12751); `ot_admin` recibe 403.
        SuperAdmin debe indicar `transitOfficeId` (HU #12854) para resolver el tenant OT objetivo,
        mismo patrón que `PUT /requirements`.
      security:
        - bearerAuth: []
      parameters:
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Obligatorio para SuperAdmin (400 si falta, 404 si el OT no tiene tenant vinculado).
            ot_admin ignora el parámetro y usa su propio tenant del JWT.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                operationMode:
                  type: string
                  enum: [dashboard, quipux]
                quipuxReadOnly:
                  type: boolean
                revocationWindowBusinessDays:
                  type: integer
                  nullable: true
                  minimum: 1
                  description: >
                    Ventana de revocatoria en días hábiles (HU #12568). Enviar `null` (o
                    borrar el valor) la deja sin límite — no se sustituye por ningún default
                    numérico. Un valor ≤ 0 o no numérico responde 422 con el campo señalado.
      responses:
        "200":
          description: Perfil actualizado.
        "400":
          description: SuperAdmin no indicó transitOfficeId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin rol SuperAdmin (ot_admin y otros roles OT reciben 403).
        "404":
          description: El organismo indicado no tiene tenant OT vinculado.
        "422":
          description: >
            Payload inválido — p. ej. operationMode fuera de catálogo o
            revocationWindowBusinessDays ≤ 0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/imprint-signatures:
    get:
      tags: [Admin · OT]
      operationId: adminOtListImprintSignatures
      summary: Lista improntas firmadas por placa (HU #12148)
      description: >
        Consulta auditorías de firma digital de impronta manual asociadas a la placa
        (sin filtrar por tenant: la firma es del documento). No expone private_key.
        Requiere rol SuperAdmin u ot_admin.
      security:
        - bearerAuth: []
      parameters:
        - name: placa
          in: query
          required: true
          schema: { type: string }
          description: Placa del vehículo (normalización Trim+Upper en servidor).
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Obligatorio para SuperAdmin — resuelve el tenant OT dueño del organismo
            (mismo patrón que /admin/ot/requirements). ot_admin ignora el parámetro.
      responses:
        "200":
          description: Improntas firmadas encontradas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImprintSignatureItem"
        "400":
          description: Falta query placa.
        "401":
          description: No autenticado.
        "403":
          description: Sin rol SuperAdmin u ot_admin.

  /api/v1/admin/ot/imprint-signatures/{id}/validate:
    post:
      tags: [Admin · OT]
      operationId: adminOtValidateImprintSignature
      summary: Valida firma digital de impronta manual (HU #12148)
      description: >
        Verifica la firma digital pegada (Base64 del PDF) contra public_key + document_hash
        de la impronta y persiste el resultado en tramites.imprint_signature_validations.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id de tramites.vehicle_signature_imprints.
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Obligatorio para SuperAdmin — tenant OT del hub. ot_admin ignora el parámetro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature]
              properties:
                signature:
                  type: string
                  description: Firma digital Base64 pegada desde el PDF (se normalizan espacios/saltos).
      responses:
        "200":
          description: Validación ejecutada (valid o invalid).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImprintSignatureValidationResult"
        "401":
          description: No autenticado.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
        "404":
          description: Impronta firmada no encontrada (not_found).

  /api/v1/admin/ot/imprint-signatures/{id}/preview-url:
    get:
      tags: [Admin · OT]
      operationId: adminOtGetImprintSignaturePreviewUrl
      summary: URL de previsualización del PDF firmado de impronta (HU #12173)
      description: >
        Emite una URL presignada (Content-Disposition inline) del PDF firmado.
        Prefiere signed_storage_path; si falta, usa el adjunto vigente (attachmentId).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id de tramites.vehicle_signature_imprints.
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Obligatorio para SuperAdmin — tenant OT del hub. ot_admin ignora el parámetro.
      responses:
        "200":
          description: URL de previsualización.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "401":
          description: No autenticado.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
        "404":
          description: Impronta no encontrada o PDF no disponible.
        "503":
          description: Storage no disponible.

  /api/v1/admin/ot/imprint-signatures/{id}/validations:
    get:
      tags: [Admin · OT]
      operationId: adminOtListImprintSignatureValidations
      summary: Historial de validaciones de firma de impronta (HU #12176)
      description: >
        Lista la bitácora append-only de tramites.imprint_signature_validations
        para la impronta, ordenada por validatedAt DESC.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Historial (puede ser vacío).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImprintSignatureValidationSummary"
        "401":
          description: No autenticado.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
        "404":
          description: Impronta no encontrada.

  /api/v1/admin/transit-office-tenants/index:
    get:
      tags: [Admin · Tenants OT]
      operationId: adminTransitOfficeTenantsIndex
      summary: Listado paginado de tenants OT (refactor adminOT)
      description: >
        Retorna el listado paginado de tenants Organismo de Tránsito (join
        identity.tenants + admin.transit_office_profiles), ordenado por fecha de
        creación descendente. Requiere JWT con rol SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: legalName
          in: query
          required: false
          schema: { type: string }
          description: Coincidencia parcial e insensible a mayúsculas sobre la razón social.
        - name: estadoActivo
          in: query
          required: false
          schema: { type: boolean }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Listado paginado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitOfficeTenantPagedResult"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-office-tenants:
    post:
      tags: [Admin · Tenants OT]
      operationId: adminTransitOfficeTenantCreate
      summary: Alta de tenant OT (refactor adminOT)
      description: >
        Da de alta un tenant Organismo de Tránsito: tenant (tenant_type=RENTING,
        decisión intencional — ver RestrictTenantTypeCatalog), rol de sistema
        ot_admin SIN permisos (el SuperAdmin los cura después vía RBAC Admin,
        `PUT /api/v1/superadmin/roles/{id}/permissions`) y perfil OT vinculado a la
        oficina del catálogo. La oficina no debe tener ya un tenant OT asociado.
        Requiere JWT con rol SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransitOfficeRequest"
      responses:
        "201":
          description: Tenant OT creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitOfficeTenantItem"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Datos inválidos (campos requeridos, longitudes, código duplicado,
            oficina inexistente/inactiva u oficina ya asignada a otro tenant OT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/v1/admin/transit-office-tenants/{tenantId}/status:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant OT.
    put:
      tags: [Admin · Tenants OT]
      operationId: adminTransitOfficeTenantSetStatus
      summary: Activa o desactiva un tenant OT (refactor adminOT)
      description: >
        Cambia el estado activo/inactivo del tenant OT (identity.tenants.is_active).
        Reutiliza el mismo caso de uso genérico del alta de compañías. Idempotente.
        Requiere JWT con rol SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCompanyStatusRequest"
      responses:
        "200":
          description: Estado actualizado; devuelve el tenant con su nuevo estado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListItem"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El tenant no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/improntas:
    get:
      tags: [Admin · Improntas]
      operationId: adminImprontasIndex
      summary: Listado paginado del historial de improntas (HU #10468)
      description: >
        Retorna el listado paginado y filtrable (placa, radicado, rango de fecha de
        creación) del historial de improntas generadas (admin.impronta_generations —
        ADR-0022), ordenado por fecha de creación descendente. Vista global
        cross-tenant (sin RLS): no expone el PDF, solo metadata. Requiere JWT con
        rol SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: placa
          in: query
          required: false
          schema: { type: string }
          description: Coincidencia parcial e insensible a mayúsculas sobre la placa.
        - name: radicado
          in: query
          required: false
          schema: { type: string }
          description: Coincidencia parcial e insensible a mayúsculas sobre el radicado.
        - name: createdFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Límite inferior (inclusive) del rango de fecha de creación.
        - name: createdTo
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Límite superior (inclusive) del rango de fecha de creación.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Listado paginado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImprontaGenerationPagedResult"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/users/invite:
    post:
      tags: [Admin · OT]
      operationId: adminOtInviteUser
      summary: Invita un usuario al tenant OT (self-service, refactor adminOT)
      description: >
        Crea una invitación por email con el rol elegido del catálogo TRANSIT_OFFICE.
        ot_admin invita colaboradores de su propio tenant (JWT); SuperAdmin debe
        indicar `?transitOfficeId=` (oficina del catálogo) para invitar al primer
        adminOT de un tenant recién creado. HU #13655: el rol es obligatorio para
        todos (sin rol responde 400 ROLE_REQUIRED; ya no se asigna ot_admin por
        defecto). Requiere JWT con rol SuperAdmin u ot_admin (OtModulePolicy).
      security:
        - bearerAuth: []
      parameters:
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Oficina del catálogo cuyo tenant OT es el destino. Obligatorio para
            SuperAdmin; ignorado para ot_admin (siempre usa su propio tenant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteOtUserRequest"
      responses:
        "201":
          description: Invitación creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteOtUserResponse"
        "400":
          description: SuperAdmin no indicó transitOfficeId, falta el rol (ROLE_REQUIRED) o llegó más de uno (SINGLE_ROLE_ONLY).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe un tenant OT vinculado al transitOfficeId indicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invitación pendiente duplicada o el correo ya tiene cuenta activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/users:
    get:
      tags: [Admin · OT]
      operationId: adminOtListUsers
      summary: Lista los usuarios del tenant OT (self-service, refactor adminOT)
      description: >
        Usuarios activos, sin rol e invitaciones pendientes del tenant resuelto
        (propio para ot_admin, o el indicado por `?transitOfficeId=` para
        SuperAdmin). Requiere JWT con rol SuperAdmin u ot_admin (OtModulePolicy).
        Con `?onlyDeleted=true` (#10624) lista en su lugar los usuarios
        eliminados (soft-delete, `deletedAt != null`) de ese mismo tenant OT
        resuelto — EXCLUSIVO de SuperAdmin (403 para ot_admin). Sin este
        parámetro el comportamiento es exactamente el de antes.
      security:
        - bearerAuth: []
      parameters:
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: onlyDeleted
          in: query
          required: false
          description: >
            HU #10624. `true` lista solo los usuarios eliminados del tenant OT
            resuelto (EXCLUSIVO de SuperAdmin, 403 en otro caso). Omitido o
            `false`: comportamiento normal, sin cambios.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Usuarios (o usuarios eliminados, con onlyDeleted=true) del tenant OT resuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtUserListResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: >
            Sin rol SuperAdmin u ot_admin, o `onlyDeleted=true` solicitado por
            un caller distinto de SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe un tenant OT vinculado al transitOfficeId indicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
    patch:
      tags: [Admin · OT]
      operationId: adminOtUpdateUser
      summary: Edita nombre y/o correo de un usuario del tenant OT (#10621)
      description: >
        Edita displayName y/o email de un usuario dentro del alcance del caller
        (propio tenant para ot_admin, o el indicado por `?transitOfficeId=` para
        SuperAdmin). `rowVersion` es obligatorio (concurrencia optimista: el valor
        leído de `OtUserItem.rowVersion`). No invalida sesiones activas — el cambio
        de correo solo aplica en el próximo login. Requiere JWT con rol SuperAdmin
        u ot_admin (OtModulePolicy).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOtUserRequest"
      responses:
        "200":
          description: Usuario actualizado.
        "400":
          description: Datos inválidos (longitud de nombre/correo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin u ot_admin, o el usuario no pertenece al tenant OT resuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El usuario no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            El correo ya está en uso, ya sea porque tiene una cuenta activa o
            porque pertenece a una cuenta eliminada (409 `EMAIL_ALREADY_IN_USE` —
            código único, HU #11580), o `rowVersion` quedó desactualizado
            (`CONCURRENCY_CONFLICT` — otro admin ya modificó al usuario). No se
            persiste nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Admin · OT]
      operationId: adminOtDeleteUser
      summary: Elimina (soft-delete reversible) a un usuario del tenant OT (#10623)
      description: >
        Marca `deletedAt`/`deletedBy` en el usuario dentro del alcance del caller
        (propio tenant para ot_admin, o el indicado por `?transitOfficeId=` para
        SuperAdmin) — HU #10623. `rowVersion` es obligatorio (concurrencia optimista,
        el valor leído de `OtUserItem.rowVersion`). NO toca roles ni suspensiones: al
        restaurar (`POST /api/v1/superadmin/users/{userId}/restore`, SOLO SuperAdmin)
        el usuario recupera exactamente el mismo estado. Se rechaza la
        auto-eliminación y la eliminación del último administrador activo del
        tenant/sistema. Requiere JWT con rol SuperAdmin u ot_admin (OtModulePolicy).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOtUserRequest"
      responses:
        "204":
          description: Usuario eliminado (soft-delete).
        "400":
          description: Auto-eliminación no permitida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin u ot_admin, o el usuario no pertenece al tenant OT resuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El usuario no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            La acción dejaría al tenant o al sistema sin ningún administrador activo
            (`LAST_ACTIVE_ADMIN`), o `rowVersion` quedó desactualizado
            (`CONCURRENCY_CONFLICT`). No se persiste nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/users/{userId}/suspend:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
    post:
      tags: [Admin · OT]
      operationId: adminOtSuspendUser
      summary: Suspende o desactiva indefinidamente a un usuario del tenant OT (self-service, refactor adminOT)
      description: >
        Suspende temporalmente (con `endsAt`) o desactiva indefinidamente (sin
        `endsAt`) a un usuario del tenant OT resuelto (propio para ot_admin, o el
        indicado por `?transitOfficeId=` para SuperAdmin) — HU #10619. SuperAdmin
        aplica la acción sobre el tenant REAL del usuario objetivo. Se rechaza si
        el usuario intenta auto-suspenderse o si dejaría al tenant/sistema sin
        ningún administrador activo (último SuperAdmin/AdminCompany/ot_admin).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendOtUserRequest"
      responses:
        "201":
          description: Suspensión/desactivación creada.
        "400":
          description: Auto-suspensión no permitida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin u ot_admin, o sin ámbito sobre el usuario objetivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El usuario no existe en el tenant OT resuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            La acción dejaría al tenant o al sistema sin ningún administrador activo
            (último SuperAdmin/AdminCompany/ot_admin disponible).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Admin · OT]
      operationId: adminOtUnsuspendUser
      summary: Levanta la suspensión/desactivación activa de un usuario del tenant OT (self-service, refactor adminOT)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Suspensión/desactivación levantada.
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin u ot_admin, o sin ámbito sobre el usuario objetivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El usuario no existe en el tenant OT resuelto, o no tiene una suspensión activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/security/permission-overrides/grantable:
    get:
      tags: [Security]
      operationId: securityListGrantablePermissionOverrides
      summary: Catalogo de permisos que el caller puede otorgar a un usuario (HU #13644)
      description: >
        Super Admin recibe todos los permisos con `enforced = 'true'`; los demas administradores
        (AdminCompany, ot_admin, admin_tramites) solo su tope: la union de los permisos de sus roles en el
        tenant, menos los que tengan denegados. Sus `allow` individuales no amplian el tope.
        Se excluyen los permisos cuyo flag de enforcement esta apagado (`Security:OtPermissionEnforcement`,
        `Security:ModulePermissionEnforcement`, fuentes de familia): la API aun no los exige, asi que
        otorgarlos o denegarlos no tendria efecto.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: false
          description: Solo Super Admin; para los demas se usa el tenant del JWT.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Permisos otorgables.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    slug: { type: string }
                    name: { type: string }
                    moduleCode: { type: string }
                    productCode: { type: string }
                    superAdminOnly:
                      type: boolean
                      description: >
                        HU #13653 (aditivo). `true` si NINGUN administrador del tenant destino (AdminCompany, ot_admin,
                        admin_tramites) tiene el permiso en su tope (roles menos sus deny): un administrador no puede otorgarlo.
                        Solo se calcula cuando el Super Admin envia `?tenantId=`; en cualquier otro caso es `false`.
        "401": { description: No autenticado. }
        "403": { description: "El caller no es administrador, o rechazo de ambito (HU #13645): `OUT_OF_SCOPE`." }
        "404": { description: "`USER_NOT_FOUND`." }

  /api/v1/security/users/{userId}/permission-overrides:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: tenantId
        in: query
        required: false
        description: Solo Super Admin; para los demas se usa el tenant del JWT.
        schema: { type: string, format: uuid }
    get:
      tags: [Security]
      operationId: securityListUserPermissionOverrides
      summary: Permisos individuales activos de un usuario (HU #13644)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Overrides activos (allow o deny).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPermissionOverrideItem"
        "401": { description: No autenticado. }
        "403": { description: "El caller no es administrador, o rechazo de ambito (HU #13645): `OUT_OF_SCOPE`." }
        "404": { description: "`USER_NOT_FOUND`." }

  /api/v1/security/users/{userId}/permission-overrides/count:
    get:
      tags: [Security]
      operationId: securityCountUserPermissionOverrides
      summary: Cuantos permisos individuales tiene el usuario (HU #13646)
      description: >-
        Consulta previa al cambio de rol: al cambiar el rol del usuario se eliminan sus permisos individuales del producto
        del rol nuevo (auditoria ROLE_CHANGE_PURGE). Mismas reglas de lectura que el listado (existencia y ambito).
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: productCode
          in: query
          required: false
          description: Producto a contar (p. ej. `tramites`); sin valor cuenta todos los productos.
          schema: { type: string }
        - name: tenantId
          in: query
          required: false
          description: Solo Super Admin; para los demas se usa el tenant del JWT.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cantidad de permisos individuales activos.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, minimum: 0 }
        "401": { description: No autenticado. }
        "403": { description: "El caller no es administrador, o rechazo de ambito (HU #13645): `OUT_OF_SCOPE`." }
        "404": { description: "`USER_NOT_FOUND`." }

  /api/v1/security/permission-audit:
    get:
      tags: [Security]
      operationId: securityListPermissionAudit
      summary: Auditoria de permisos individuales segun el ambito (HU #13647)
      description: >-
        Super Admin ve todo (tenantId opcional). Los demas administradores solo su tenant del JWT;
        pedir otro tenant responde 403 `OUT_OF_SCOPE`. Orden created_at DESC.
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: tenantId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: actorId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Pagina de registros.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionAuditPage"
        "401": { description: No autenticado. }
        "403": { description: "No es administrador o tenant fuera del ambito: `OUT_OF_SCOPE`." }

  /api/v1/security/users/{userId}/permission-overrides/{permissionId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: permissionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: tenantId
        in: query
        required: false
        description: Solo Super Admin; para los demas se usa el tenant del JWT.
        schema: { type: string, format: uuid }
    put:
      tags: [Security]
      operationId: securitySetUserPermissionOverride
      summary: Otorga (allow) o deniega (deny) un permiso puntual dentro del tope del admin (HU #13644)
      description: >
        `allow` exige que el permiso tenga `enforced = 'true'` y este dentro del tope del administrador
        (403 `NOT_ENFORCED` / `OUT_OF_CAP`). Tanto `allow` como `deny` sobre un permiso cuyo flag de enforcement
        esta apagado responden 403 `NOT_ENFORCED` (falsa revocacion); quitar el override siempre se puede. Cada intento, aceptado o rechazado,
        queda en la bitacora `security.user_permission_audit`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effect]
              properties:
                effect: { type: string, enum: [allow, deny] }
                piiConfirmed:
                  type: boolean
                  description: >
                    HU #13653 (aditivo, FB-17). Confirmacion Ley 1581 de 2012. Obligatorio en `true` para `allow` sobre
                    `ict.pii.reveal` (sin el: 400 `PII_CONFIRMATION_REQUIRED`, nada cambia). Al aplicarse escribe, en la misma
                    operacion que el GRANT, una fila `PII_REVEAL_CONFIRMED` en `security.user_permission_audit`.
                    El modulo completo NO otorga `ict.pii.reveal` (cuenta en `excluded`).
      responses:
        "200":
          description: Aplicado (`changed = false` si el usuario ya tenia ese efecto).
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissionId: { type: string, format: uuid }
                  effect: { type: string, enum: [allow, deny] }
                  changed: { type: boolean }
        "400":
          description: "`INVALID_EFFECT`, `PII_CONFIRMATION_REQUIRED` (HU #13653: `allow` de `ict.pii.reveal` sin `piiConfirmed: true`; nada cambia) o `FAMILY_CREATE_REQUIRES_READ` (HU #13666): `allow` de `<familia>.create` (`matriculas`, `traspasos`, `otros-tramites`) cuando el permiso efectivo del usuario (rol + individuales) no incluye `<familia>.read`. Queda auditado como REJECTED. `deny` de `<familia>.read` apaga tambien `<familia>.create`: retira su allow individual y, si el rol lo da, lo deniega."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionOverrideError"
        "401": { description: No autenticado. }
        "403":
          description: "Fuera del tope o no otorgable (`OUT_OF_CAP`, `NOT_ENFORCED`) o regla de HU #13645: `SELF`, `TARGET_SUPERADMIN`, `TARGET_IS_ADMIN`, `OUT_OF_SCOPE`, `EXCLUDED`. Todo rechazo queda auditado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionOverrideError"
        "404": { description: "`PERMISSION_NOT_FOUND` o `USER_NOT_FOUND`." }
        "409": { description: "`INVITATION_PENDING`: el usuario aun no acepto su invitacion (HU #13645)." }
    delete:
      tags: [Security]
      operationId: securityRemoveUserPermissionOverride
      summary: Quita el permiso individual (vuelve a lo que dicta el rol) (HU #13644)
      description: >
        Un admin siempre puede quitar un `allow`. Quitar un `deny` devuelve lo que dicta el rol: 403
        `OUT_OF_CAP` si el rol del usuario lo da y queda fuera del tope del admin. Quitar el `allow` de `<familia>.read` arrastra el `allow` individual de `<familia>.create` si el rol no da `.read` (HU #13666).
      security:
        - bearerAuth: []
      responses:
        "204": { description: Quitado (baja logica; queda en la bitacora como REVOKE). }
        "401": { description: No autenticado. }
        "403":
          description: Volver al rol dejaria un permiso fuera del tope (`OUT_OF_CAP`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionOverrideError"
        "404": { description: "`OVERRIDE_NOT_FOUND` o `PERMISSION_NOT_FOUND`." }

  /api/v1/security/users/{userId}/permission-overrides/modules/{moduleCode}:
    post:
      tags: [Security]
      operationId: securityGrantModulePermissionOverrides
      summary: Otorga (o deniega) un modulo completo como foto, limitado al tope (HU #13644)
      description: >
        Crea un override por cada accion activa del modulo hoy. Con `allow` solo se otorgan las acciones
        con `enforced = 'true'` dentro del tope (`outOfCap` cuenta el resto); si no se otorga ninguna, 403.
        Las acciones cuyo flag de enforcement esta apagado no se otorgan ni se deniegan (`notEnforced`); si todo
        lo que tocaria esta apagado, 403 `NOT_ENFORCED` auditado.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: moduleCode
          in: path
          required: true
          schema: { type: string }
        - name: tenantId
          in: query
          required: false
          description: Solo Super Admin; para los demas se usa el tenant del JWT.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effect]
              properties:
                effect: { type: string, enum: [allow, deny] }
      responses:
        "200":
          description: Foto aplicada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  productCode: { type: string }
                  batchId: { type: string, format: uuid }
                  created: { type: integer }
                  skipped: { type: integer }
                  outOfCap: { type: integer }
                  notEnforced: { type: integer }
        "400": { description: "`INVALID_EFFECT`." }
        "403":
          description: Ninguna accion cabe en el tope (`OUT_OF_CAP`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionOverrideError"
        "404": { description: "`MODULE_NOT_FOUND`." }

  /api/v1/security/users:
    get:
      tags: [Security]
      operationId: securityListUsers
      summary: Lista usuarios activos e invitaciones pendientes del alcance del caller
      description: >
        AdminCompany ve solo su propio tenant; SuperAdmin ve los usuarios de
        todas las compañías (excepto su propio tenant interno). Con
        `?onlyDeleted=true` (#10624) lista en su lugar los usuarios eliminados
        (soft-delete, `deletedAt != null`) de CUALQUIER tenant — EXCLUSIVO de
        SuperAdmin (403 en otro caso, incluido AdminCompany), ya que solo
        SuperAdmin puede restaurar (`POST /api/v1/superadmin/users/{userId}/restore`).
        Sin este parámetro el comportamiento es exactamente el de antes.
      security:
        - bearerAuth: []
      parameters:
        - name: onlyDeleted
          in: query
          required: false
          description: >
            HU #10624. `true` lista solo los usuarios eliminados de cualquier
            tenant (EXCLUSIVO de SuperAdmin, 403 en otro caso). Omitido o
            `false`: comportamiento normal, sin cambios.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Usuarios (o usuarios eliminados, con onlyDeleted=true) del alcance del caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantUserItem"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: "`onlyDeleted=true` solicitado por un caller distinto de SuperAdmin."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/security/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Security]
      operationId: securityDeleteUser
      summary: Elimina (soft-delete reversible) a un usuario del alcance del caller (#10623)
      description: >
        Marca `deletedAt`/`deletedBy` en el usuario — operación EXCLUSIVA de SuperAdmin
        (AdminCompany puede suspender/desactivar pero NO eliminar) — ocultar-eliminar-admin-company.
        `rowVersion` es obligatorio (concurrencia optimista, el valor leído de
        `TenantUserDto.rowVersion`). NO toca roles ni suspensiones: al restaurar
        (`POST /api/v1/superadmin/users/{userId}/restore`, SOLO SuperAdmin) el
        usuario recupera exactamente el mismo estado. Se rechaza la
        auto-eliminación y la eliminación del último administrador activo del
        tenant/sistema. Requiere JWT con rol SuperAdmin (SuperAdminPolicy).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUserRequest"
      responses:
        "204":
          description: Usuario eliminado (soft-delete).
        "400":
          description: Auto-eliminación no permitida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin o sin ámbito sobre el usuario objetivo. AdminCompany no puede eliminar usuarios (solo suspender/bloquear).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El usuario no existe en este tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            La acción dejaría al tenant o al sistema sin ningún administrador activo
            (`LAST_ACTIVE_ADMIN`), o `rowVersion` quedó desactualizado
            (`CONCURRENCY_CONFLICT`). No se persiste nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/superadmin/users/{userId}/restore:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Super Admin]
      operationId: restoreUser
      summary: Restaura (deshace el soft-delete) a un usuario eliminado (#10623)
      description: >
        SOLO SuperAdmin. NO toca `UserRoleAssignment` ni `UserTempSuspension` —
        como `DELETE` nunca los modificó, el usuario recupera exactamente los
        mismos roles y el mismo estado de suspensión que tenía al momento de
        eliminarse (AC3). Restaurar un usuario que NO está eliminado se rechaza
        explícitamente (AC5, no es un no-op silencioso). Requiere JWT con rol
        SuperAdmin (SuperAdminPolicy).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario restaurado.
        "401":
          description: No autenticado.
        "403":
          description: Sin rol SuperAdmin.
        "404":
          description: El usuario no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            El usuario no está eliminado (`USER_NOT_DELETED`) — no hay nada que restaurar —,
            o su correo ya lo usa otra cuenta activa (`USER_EMAIL_IN_USE`, Bug #13194:
            "Ya existe una cuenta activa con ese correo").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/procedure-types:
    get:
      tags: [Tramites - Catálogo]
      operationId: listPublishedProcedureTypesForOperator
      summary: Lista tipos de trámite publicados para operadores (FEATURE-08 / CFD-12)
      description: >
        Devuelve los tipos con `publication_status = 'published'` para el selector del
        botón único de creación de trámite. No requiere rol SuperAdmin; sí JWT de
        operador y header `X-Tenant-Id`. Catálogo global: no se filtra por tenant.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lista de tipos publicados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcedureTypeSummaryF08"
        "400":
          description: Falta el header X-Tenant-Id.
        "401":
          description: No autenticado.

  /api/v1/superadmin/procedure-types/{id}/conformation-profile:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Super Admin]
      operationId: getConformationProfile
      summary: Perfil de conformación del tipo de trámite (FEATURE-08 / CFD-01)
      description: >
        Retorna el perfil de conformación completo del tipo: `gateProfile`
        (flags dinámicos del motor), `conformationRules` (actores + su
        `validationProfile`), `sources` (fuentes externas, HU-BE-03) y
        `documentRequirements` (documentos, HU-BE-04). En HU-BE-01 `sources` y
        `documentRequirements` llegan vacíos; la clave siempre está presente.
        Requiere JWT con rol SuperAdmin (SuperAdminPolicy).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil de conformación del tipo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureConformationProfile"
        "401":
          description: No autenticado.
        "403":
          description: Sin rol SuperAdmin.
        "404":
          description: El tipo de trámite no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Super Admin]
      operationId: updateConformationProfile
      summary: Actualiza el perfil de conformación del tipo (solo en estado draft)
      description: >
        Actualiza el `gateProfile` del tipo. Solo editable en estado `draft`:
        un tipo `published`/`archived` se rechaza con 422 para no alterar tipos
        vivos ni los trámites en curso que dependen de ellos. HU-BE-01 persiste
        `gateProfile`; las HUs siguientes (BE-02..05) amplían el cuerpo con
        entryMode, validaciones, fuentes, actores, documentos y flag de placa.
        Requiere JWT con rol SuperAdmin (SuperAdminPolicy).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcedureConformationProfileInput"
      responses:
        "200":
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureConformationProfile"
        "400":
          description: entryMode inválido (debe ser PLATE, VIN o BOTH).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Sin rol SuperAdmin.
        "404":
          description: El tipo de trámite no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Tipo en estado published/archived — no editable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/superadmin/audit:
    get:
      tags: [Super Admin]
      operationId: getAdminAuditLog
      summary: Consulta global del rastro de auditoría administrativa/seguridad (HU #10679)
      description: >
        Retorna el rastro unificado de auditoría (`admin.tenant_config_audit_logs`,
        HU #10678) — config + operaciones administrativas/seguridad sobre usuarios,
        roles, permisos y autenticación — ordenado por `changedAt` descendente,
        paginado. Alcance GLOBAL (cross-tenant): la RLS de la tabla admite bypass
        SuperAdmin. `userId` matchea el actor (`changedBy`) O el afectado
        (`targetEntityId`). Requiere JWT con rol SuperAdmin (SuperAdminPolicy).
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Usuario actor o afectado.
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Compañía gestora u organismo de tránsito.
        - name: tenantType
          in: query
          required: false
          schema: { type: string, enum: [COMPANY, TRANSIT_OFFICE] }
        - name: module
          in: query
          required: false
          schema:
            type: string
            enum: [users, roles, permissions, authentication, security, config]
        - name: operation
          in: query
          required: false
          schema: { type: string }
          description: >
            Verbo de la operación auditada (p. ej. `create`, `update`, `delete`,
            `assign_role`, `revoke_role`, `suspend`, `unsuspend`, `invite`,
            `login`, `login_failed`, `logout`, `reset_password`, …).
        - name: result
          in: query
          required: false
          schema: { type: string, enum: [success, failure] }
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Límite inferior (inclusive) del rango de `changedAt`.
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Límite superior (inclusive) del rango de `changedAt`.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página del rastro unificado de auditoría.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogPageResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/invitations/{invitationId}/resend:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
    post:
      tags: [Admin · OT]
      operationId: adminOtResendInvitation
      summary: Reenvía una invitación pendiente del tenant OT (HU #10625)
      description: >
        SIEMPRE regenera el token de activación (solo se persiste su hash — el enlace
        anterior queda invalidado) y reenvía el correo, para la invitación del tenant
        OT resuelto (propio para ot_admin, o el indicado por `?transitOfficeId=` para
        SuperAdmin). Rechaza el reenvío si la invitación ya no está pendiente (409) o
        si no ha pasado el cooldown anti-abuso (~2 minutos, configurable) desde el
        último envío (429). Requiere JWT con rol SuperAdmin u ot_admin (OtModulePolicy).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invitación reenviada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendInvitationResponse"
        "400":
          description: SuperAdmin no indicó transitOfficeId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            La invitación no existe o no pertenece al tenant OT resuelto (o no existe
            un tenant OT vinculado al transitOfficeId indicado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La invitación ya no está pendiente (fue aceptada o cancelada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Cooldown anti-abuso activo — debes esperar antes de reenviar de nuevo.
          headers:
            Retry-After:
              description: Segundos hasta que se pueda reenviar de nuevo.
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendCooldownErrorResponse"

  /api/v1/admin/ot/invitations/{invitationId}/reactivate:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
    post:
      tags: [Admin · OT]
      operationId: adminOtReactivateInvitation
      summary: Reactiva una invitación cancelada del tenant OT (HU #11552 / ADR-0048)
      description: >
        Es UNA sola acción: vuelve la invitación a `pending`, regenera el token
        SIEMPRE (el enlace anterior queda muerto) y reenvía el correo, para la
        invitación del tenant OT resuelto (propio para ot_admin, o el indicado por
        `?transitOfficeId=` para SuperAdmin). NO es idempotente — reactivar una
        invitación que no está `cancelled` es 409 `INVITATION_NOT_CANCELLED`.
        Necesaria además de la ruta de Security porque `AdminCompanyPolicy` NO
        incluye `ot_admin`. Requiere JWT con rol SuperAdmin u ot_admin (OtModulePolicy).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invitación reactivada — vuelve a estar pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendInvitationResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            La invitación no existe o no pertenece al tenant OT resuelto (o no existe
            un tenant OT vinculado al transitOfficeId indicado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            La invitación no está cancelada (`INVITATION_NOT_CANCELLED`), el correo
            ya está en uso, o algún rol de la invitación ya no está activo
            (`ROLE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Cooldown anti-abuso activo — debes esperar antes de reactivar de nuevo.
          headers:
            Retry-After:
              description: Segundos hasta que se pueda reactivar de nuevo.
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendCooldownErrorResponse"

  /api/v1/security/invitations/{invitationId}:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Security]
      operationId: securityCancelInvitation
      summary: Cancela una invitación pendiente (HU #10627)
      description: >
        Anula una invitación pendiente (distinto de reenviarla, HU #10625): el enlace de
        activación anterior deja de funcionar y el email queda disponible de nuevo para una
        nueva invitación. Mismo alcance que POST /security/invitations — SuperAdmin puede
        cancelar la invitación de cualquier empresa; AdminCompany solo las de su propio tenant.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Invitación cancelada.
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin o AdminCompany.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La invitación no existe o no pertenece al alcance del caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La invitación ya no está pendiente (fue aceptada o cancelada previamente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/invitations/{invitationId}:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
    delete:
      tags: [Admin · OT]
      operationId: adminOtCancelInvitation
      summary: Cancela una invitación pendiente del tenant OT (HU #10627)
      description: >
        Anula una invitación pendiente del tenant OT resuelto (propio para ot_admin, o el
        indicado por `?transitOfficeId=` para SuperAdmin). El enlace de activación anterior
        deja de funcionar y el email queda disponible para una nueva invitación. Requiere JWT
        con rol SuperAdmin u ot_admin (OtModulePolicy).
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Invitación cancelada.
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La invitación no existe en el tenant OT resuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La invitación ya no está pendiente (fue aceptada o cancelada previamente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/integrations/ot/webhooks/{subscriptionId}/callback:
    post:
      tags: [OT Integrations]
      operationId: otWebhookInboundCallback
      summary: Callback inbound Quipux → FLIT
      security: []          # endpoint público: autenticación vía HMAC en cabecera
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Callback procesado.
        "401":
          description: Firma HMAC inválida.
        "404":
          description: Suscripción no encontrada.

  /api/v1/admin/companies/{tenantId}/transit-grants:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    get:
      tags: [Admin · Compañías]
      operationId: adminCompanyGetTransitGrants
      summary: Organismos de tránsito habilitados del tenant (RF13, AC5)
      description: >
        Retorna los ids de organismos de tránsito habilitados para el tenant.
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de organismos habilitados (puede ser vacía).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitGrantListResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Admin · Compañías]
      operationId: adminCompanyAddTransitGrant
      summary: Habilita un organismo de tránsito para el tenant + audit log (RF13, AC2)
      description: >
        Habilita un organismo de tránsito (que debe existir en el catálogo estático)
        para el tenant y genera una entrada de auditoría. Idempotente: si el grant ya
        existe retorna 201 sin duplicar fila ni auditoría. Si el organismo no existe en
        el catálogo retorna 422 sin persistir. Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitGrantRequest"
      responses:
        "201":
          description: Grant habilitado (alta nueva o idempotente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitGrantCreatedResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: El organismo no existe en el catálogo. No se persiste nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitGrantValidationErrorResponse"

  /api/v1/admin/companies/{tenantId}/transit-grants/{transitOfficeId}:
    delete:
      tags: [Admin · Compañías]
      operationId: adminCompanyRemoveTransitGrant
      summary: Deshabilita un organismo de tránsito del tenant + audit log (RF13, AC3)
      description: >
        Elimina el grant del organismo para el tenant y genera una entrada de auditoría.
        Retorna 404 si el grant no existía. Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador del tenant (compañía).
        - name: transitOfficeId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador del organismo de tránsito.
      responses:
        "204":
          description: Grant eliminado.
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe el grant para el tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/companies/{tenantId}/audit-log:
    get:
      tags: [Admin · Compañías]
      operationId: adminCompanyGetAuditLog
      summary: Historial de auditoría de gobernanza paginado (AC4)
      description: >
        Retorna el historial de cambios de configuración del tenant ordenado por
        `changedAt` descendente, paginado. Cada registro incluye el campo modificado,
        el valor anterior/nuevo, el operador y el timestamp. Requiere JWT con rol
        SuperAdmin (RF01).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador del tenant (compañía).
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página del historial de auditoría.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPageResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/companies/{tenantId}/ot-consultation-restrictions:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    get:
      tags: [Admin · Compañías]
      operationId: adminCompanyGetOtConsultationRestrictions
      summary: Restricciones de consulta por OT del tenant (HU #10759, AC1/AC5)
      description: >
        Retorna las filas de restricción de consulta (RNMC, comparendos) configuradas
        explícitamente para el tenant. Tabla dispersa: solo existen filas para los
        pares (organismo, tipo de consulta) que el admin tocó; la ausencia de fila
        equivale a consulta permitida. Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de restricciones configuradas (puede ser vacía).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtConsultationRestrictionListResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/companies/{tenantId}/ot-consultation-restrictions/{transitOfficeId}/{consultationKind}:
    put:
      tags: [Admin · Compañías]
      operationId: adminCompanySetOtConsultationRestriction
      summary: Fija el estado de una restricción de consulta por OT (HU #10759, AC1–AC4)
      description: >
        Habilita o inhabilita una consulta (`rnmc` | `fines`) para un Organismo de
        Tránsito puntual de la compañía. El cuerpo transporta el ESTADO DESEADO (no
        un verbo): idempotente en ambos sentidos, sin 404. Valida en orden: (1) el
        organismo debe existir en el catálogo, (2) el organismo debe estar habilitado
        (grant activo) para la compañía — restringir un OT sin grant no significa
        nada, se exige habilitarlo primero, (3) el tipo de consulta debe ser uno de
        los restringibles. `vehicle` queda deliberadamente fuera: restringirlo
        rompería la hidratación de field_values y la generación del FUR. Requiere
        JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador del tenant (compañía).
        - name: transitOfficeId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador del organismo de tránsito.
        - name: consultationKind
          in: path
          required: true
          schema: { type: string, enum: [rnmc, fines] }
          description: Tipo de consulta a restringir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOtConsultationRestrictionRequest"
      responses:
        "204":
          description: Estado fijado (alta nueva o no-op idempotente).
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            El organismo no existe en el catálogo, no está habilitado para la
            compañía, o el tipo de consulta no es restringible. No se persiste nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtConsultationRestrictionValidationErrorResponse"

  /api/v1/admin/companies/{tenantId}/ot-blocking-policies:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    get:
      tags: [Admin · Compañías]
      operationId: adminCompanyGetOtBlockingPolicies
      summary: Políticas de bloqueo de preflight por OT del tenant (FEATURE 05)
      description: >
        Retorna las filas de política de bloqueo configuradas explícitamente para el
        tenant. Por cada criterio (`soat` | `rtm` | `estado_vehiculo` | `fines` |
        `rnmc`) y organismo, indica si un hallazgo negativo BLOQUEA (rojo, subsanable)
        o solo ADVIERTE (amarillo). Tabla dispersa: la ausencia de fila equivale al
        default del criterio. Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de políticas configuradas (puede ser vacía).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtBlockingPolicyListResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/companies/{tenantId}/ot-blocking-policies/{transitOfficeId}/{criterion}:
    put:
      tags: [Admin · Compañías]
      operationId: adminCompanySetOtBlockingPolicy
      summary: Fija el carácter bloqueante de un criterio del preflight por OT (FEATURE 05)
      description: >
        Marca un criterio (`soat` | `rtm` | `estado_vehiculo` | `fines` | `rnmc`) como
        bloqueante o informativo para un Organismo de Tránsito puntual de la compañía.
        El cuerpo transporta el ESTADO DESEADO (no un verbo): idempotente en ambos
        sentidos, sin 404. Valida en orden: (1) el organismo debe existir en el
        catálogo, (2) el organismo debe estar habilitado (grant activo) para la
        compañía, (3) el criterio debe ser configurable. Requiere JWT con rol
        SuperAdmin (RF01).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador del tenant (compañía).
        - name: transitOfficeId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador del organismo de tránsito.
        - name: criterion
          in: path
          required: true
          schema: { type: string, enum: [soat, rtm, estado_vehiculo, fines, rnmc] }
          description: Criterio del preflight a configurar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOtBlockingPolicyRequest"
      responses:
        "204":
          description: Estado fijado (alta nueva o no-op idempotente).
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            El organismo no existe en el catálogo, no está habilitado para la
            compañía, o el criterio no es configurable. No se persiste nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtBlockingPolicyValidationErrorResponse"

  /api/v1/admin/document-types:
    post:
      tags: [Admin · Documentos]
      operationId: adminDocumentTypeCreate
      summary: Crea un tipo de documento (RF01)
      description: >
        Da de alta un tipo de documento en el catálogo maestro
        (tramites.document_types) con estado activo. El código lo genera el sistema
        a partir del nombre (único global); `codigo` en el body se ignora.
        El campo `obligatorio` se acepta pero no se persiste (la obligatoriedad
        vive por trámite en procedure_document_requirements). Requiere SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentTypeRequest"
      responses:
        "201":
          description: Tipo de documento creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTypeResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Payload inválido (nombre/descripcion).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Admin · Documentos]
      operationId: adminDocumentTypeList
      summary: Listado paginado de tipos de documento (RF02)
      description: >
        Retorna el catálogo paginado ordenado por nombre ascendente. Por defecto
        solo incluye activos. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Si es true incluye también los inactivos (soft-deleted).
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Filtro por código o nombre.
        - name: origen
          in: query
          required: false
          schema: { type: string, enum: [cargue, autogenerado] }
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [activo, inactivo] }
      responses:
        "200":
          description: Listado paginado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTypePagedResult"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/document-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tipo de documento.
    put:
      tags: [Admin · Documentos]
      operationId: adminDocumentTypeUpdate
      summary: Actualiza un tipo de documento (RF03)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentTypeRequest"
      responses:
        "200":
          description: Tipo de documento actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTypeResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El tipo de documento no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Payload inválido (nombre/descripcion).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Admin · Documentos]
      operationId: adminDocumentTypeDelete
      summary: Baja lógica de un tipo de documento (RF04)
      description: >
        Soft-delete: marca is_active=false sin borrado físico. Si el tipo de
        documento está referenciado en procedure_document_requirements retorna
        409 y no se desactiva. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Tipo de documento desactivado.
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El tipo de documento no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Tiene asociaciones activas y no puede desactivarse. El cuerpo incluye los
            tipos de trámite que usan el documento (mensaje accionable en la consola).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTypeAssociationsError"

  /api/v1/admin/document-types/{id}/permanent:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Admin · Documentos]
      operationId: adminDocumentTypePurge
      summary: Elimina permanentemente un tipo de documento
      description: >
        Quita el tipo del catálogo y de requisitos, overrides y precedencia OT.
        Requiere SuperAdmin.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Tipo de documento eliminado.
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
        "404":
          description: El tipo de documento no existe.

  /api/v1/admin/document-types/{id}/reactivate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tipo de documento.
    post:
      tags: [Admin · Documentos]
      operationId: adminDocumentTypeReactivate
      summary: Reactiva un tipo de documento desactivado
      description: >
        Contraparte del soft-delete: marca is_active=true para que el documento
        vuelva al catálogo y pueda asociarse a trámites. Idempotente (reactivar uno
        ya activo retorna 204). Requiere SuperAdmin.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Tipo de documento reactivado.
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El tipo de documento no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/procedure-document-requirements:
    post:
      tags: [Admin · Documentos por Trámite]
      operationId: adminProcedureDocumentRequirementCreate
      summary: Asocia un documento a un tipo de trámite (RF05)
      description: >
        Crea la asociación (trámite, documento) con su orden default y
        obligatoriedad. El tipo de trámite debe existir (404 si no), el tipo de
        documento debe existir (404) y estar activo (422 si está inactivo), y el
        par debe ser único (422 si duplicado). Requiere SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProcedureDocumentRequirementRequest"
      responses:
        "201":
          description: Asociación creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureDocumentRequirementResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El tipo de trámite o el tipo de documento no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Payload inválido, documento inactivo o par duplicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Admin · Documentos por Trámite]
      operationId: adminProcedureDocumentRequirementList
      summary: Lista los documentos de un tipo de trámite (RF06)
      description: >
        Retorna las asociaciones del trámite ordenadas por orden default
        ascendente, enriquecidas con los datos del documento. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: procedureTypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Tipo de trámite cuyo catálogo de documentos se consulta.
      responses:
        "200":
          description: Listado de asociaciones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureDocumentRequirementList"
        "400":
          description: Falta el parámetro procedureTypeId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/procedure-document-requirements/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador de la asociación.
    put:
      tags: [Admin · Documentos por Trámite]
      operationId: adminProcedureDocumentRequirementUpdate
      summary: Actualiza la configuración de una asociación (RF07)
      description: >
        Modifica únicamente el orden default y la obligatoriedad. El par
        (trámite, documento) es inmutable. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProcedureDocumentRequirementRequest"
      responses:
        "200":
          description: Asociación actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureDocumentRequirementResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La asociación no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Payload inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Admin · Documentos por Trámite]
      operationId: adminProcedureDocumentRequirementDelete
      summary: Elimina una asociación (RF08)
      description: >
        Borrado físico de la asociación. Si está en uso en trámites activos
        retorna 409 y no se elimina. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Asociación eliminada.
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La asociación no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La asociación está en uso y no puede eliminarse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/document-order-overrides:
    post:
      tags: [Admin · Órdenes documentales]
      operationId: adminDocumentOrderOverrideCreate
      summary: Crea un override de orden por OT o Cliente (RF09–RF16)
      description: >
        Registra un orden personalizado de un documento para un trámite a nivel de
        Organismo de Tránsito (scope=OT, usa transitOfficeId) o de Cliente
        (scope=CLIENTE, usa clienteId). El trámite debe existir (404), el documento
        debe existir (404) y estar asociado al trámite (422), la referencia del scope
        debe existir (404) y la tupla debe ser única (422). Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [OT, CLIENTE] }
          description: Ámbito del override.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentOrderOverrideRequest"
      responses:
        "201":
          description: Override creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOrderOverrideResponse"
        "400":
          description: Falta o es inválido el parámetro scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El trámite, el documento o la referencia del scope no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Orden inválido, documento no asociado, referencia faltante o duplicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Admin · Órdenes documentales]
      operationId: adminDocumentOrderOverrideList
      summary: Lista los overrides de una combinación trámite/scope (RF09–RF16)
      description: >
        Retorna los overrides de la combinación (trámite, scope, referencia) ordenados
        por orden ascendente. Requiere transitOfficeId si scope=OT o clienteId si
        scope=CLIENTE. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: procedureTypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Tipo de trámite.
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [OT, CLIENTE] }
          description: Ámbito del override.
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Organismo de tránsito (obligatorio si scope=OT).
        - name: clienteId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Cliente/tenant (obligatorio si scope=CLIENTE).
      responses:
        "200":
          description: Listado de overrides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOrderOverrideList"
        "400":
          description: Faltan parámetros obligatorios (procedureTypeId, scope o la referencia).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/document-order-overrides/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del override.
    put:
      tags: [Admin · Órdenes documentales]
      operationId: adminDocumentOrderOverrideUpdate
      summary: Reordena un override (arrastre en la lista)
      description: >
        Actualiza únicamente el orden (sort_order) de un override existente. Lo usa el
        reordenamiento por arrastre de la lista de overrides; la tupla (trámite, documento,
        scope, referencia) no cambia, por lo que no hay conflicto de unicidad. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentOrderOverrideRequest"
      responses:
        "200":
          description: Override actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOrderOverrideResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El override no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Orden inválido (negativo o fuera de rango).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Admin · Órdenes documentales]
      operationId: adminDocumentOrderOverrideDelete
      summary: Elimina un override de orden (RF11-12, RF15-16)
      description: >
        Borrado físico del override. Tras eliminarlo, la matriz resuelta vuelve al
        nivel inmediatamente inferior (OT o Default). Requiere SuperAdmin.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Override eliminado.
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El override no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/document-requirement-overrides:
    get:
      tags: [Admin · Órdenes documentales]
      operationId: adminDocumentRequirementOverrideList
      summary: Lista la obligatoriedad por OT de un trámite (HU #10198)
      description: >
        Retorna los overrides de obligatoriedad (REQUIRED / OPTIONAL / NOT_APPLICABLE) de un
        trámite para un Organismo de Tránsito. Solo devuelve los documentos con override; los
        no listados heredan el default del trámite. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: procedureTypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Tipo de trámite.
        - name: transitOfficeId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Organismo de tránsito.
      responses:
        "200":
          description: Listado de overrides de obligatoriedad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequirementOverrideList"
        "400":
          description: Faltan parámetros obligatorios (procedureTypeId o transitOfficeId).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Admin · Órdenes documentales]
      operationId: adminDocumentRequirementOverrideSet
      summary: Fija (o limpia) la obligatoriedad por OT de un documento (HU #10198)
      description: >
        Upsert por tupla natural (trámite, documento, OT). El documento debe existir (404) y
        estar asociado al trámite (422); el OT debe existir (404). estado=REQUIRED|OPTIONAL|
        NOT_APPLICABLE crea/actualiza el override (200); estado=DEFAULT limpia el override y
        el documento vuelve a heredar el default del trámite (204). Granular solo para OT.
        Requiere SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDocumentRequirementOverrideRequest"
      responses:
        "200":
          description: Override creado o actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequirementOverrideResponse"
        "204":
          description: Override limpiado (estado=DEFAULT).
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El trámite, el documento o el OT no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Estado inválido o documento no asociado al trámite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/resolved-document-matrix:
    get:
      tags: [Admin · Órdenes documentales]
      operationId: adminResolvedDocumentMatrixGet
      summary: Resuelve la matriz documental de un trámite (RF18)
      description: >
        Devuelve el orden final de cada documento del trámite aplicando la precedencia
        Cliente > OT > Default. transitOfficeId y clienteId son opcionales: si no vienen,
        ese nivel se omite. Un trámite existente sin documentos retorna 200 con data
        vacío. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: procedureTypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Tipo de trámite a resolver.
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Organismo de tránsito (nivel OT) — opcional.
        - name: clienteId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Cliente/tenant (nivel CLIENTE) — opcional.
      responses:
        "200":
          description: Matriz documental resuelta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedDocumentMatrix"
        "400":
          description: Falta el parámetro procedureTypeId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El tipo de trámite no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites:
    post:
      tags: [Trámites · Documentos]
      operationId: tramitesCreate
      summary: Crea un trámite y congela su snapshot documental (RF19)
      description: >
        Crea un trámite en estado draft y captura, en la misma transacción, un snapshot
        inmutable de la matriz documental resuelta vigente (precedencia Cliente > OT >
        Default). Si la generación del snapshot falla, toda la operación se revierte y no
        queda trámite creado (500). Requiere JWT autenticado (no SuperAdmin).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProcedureInstanceRequest"
      responses:
        "201":
          description: Trámite creado con su snapshot documental.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureInstanceResponse"
        "401":
          description: No autenticado (sin token JWT).
        "404":
          description: El tipo de trámite o el cliente (tenant) no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Datos inválidos o número de referencia duplicado para el cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Falló la persistencia del trámite o del snapshot; operación revertida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/{tramiteId}/document-requirements:
    get:
      tags: [Trámites · Documentos]
      operationId: tramitesGetDocumentRequirements
      summary: Documentos requeridos del snapshot de un trámite (RF19)
      description: >
        Devuelve los documentos congelados en el snapshot del trámite, ordenados por el
        orden capturado al crearlo (ordenResuelto asc). Los cambios posteriores en el
        catálogo o los overrides no afectan la respuesta (inmutabilidad). Requiere JWT
        autenticado (no SuperAdmin).
      security:
        - bearerAuth: []
      parameters:
        - name: tramiteId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador del trámite (procedure_instance_id).
      responses:
        "200":
          description: Documentos del snapshot del trámite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureDocumentRequirementSnapshotList"
        "401":
          description: No autenticado (sin token JWT).
        "404":
          description: El trámite no existe o no tiene snapshot documental.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/plate-history:
    get:
      operationId: tramitesListPlateHistory
      tags: [Tramites]
      summary: Historial de trámites de una placa, del más reciente al más antiguo
      description: >
        Feature #12189 / HU #12192 — historial operativo de una placa. Devuelve los trámites
        asociados a esa placa ordenados por fecha de creación DESCENDENTE (el orden lo fija el
        servidor: no hay parámetro de ordenamiento) junto con el `total` del universo para paginar.


        El ALCANCE lo decide el rol de quien consulta, no un parámetro: `SuperAdmin` ve la placa en
        TODAS las compañías —cada fila trae `tenantId` y `companiaNombre` para identificar de quién
        es— y cualquier otro rol la ve únicamente dentro de su propia compañía. Un usuario
        autenticado cuya compañía no se pueda resolver recibe 403; nunca el alcance global.


        Los trámites con borrado lógico quedan excluidos. La placa se normaliza en el SERVIDOR
        (se recortan espacios y se pasa a mayúsculas), así que `abc123`, ` ABC123 ` y `ABC123`
        devuelven lo mismo. Una placa sin trámites responde 200 con `items` vacío y `total` 0,
        NUNCA 404: la ausencia de historial es un resultado, no un error.


        Requiere el permiso `historial-placa.read` (SuperAdmin bypassa por rol).
      security:
        - bearerAuth: []
      parameters:
        - name: placa
          in: query
          required: true
          description: Placa a consultar. Se normaliza en el servidor (trim + mayúsculas).
          schema: { type: string }
          example: ABC123
        - name: skip
          in: query
          required: false
          description: Filas a omitir. Un valor negativo se trata como 0.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: take
          in: query
          required: false
          description: >
            Tamaño de página. Fuera del rango 1..200 cae al tope de 200 (nunca devuelve
            cero filas por un `take` inválido).
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        "200":
          description: Historial de la placa dentro del alcance del consultante (puede ser vacío).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlateHistoryResponse"
        "400":
          description: Falta el parámetro `placa` o viene vacío.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin token válido.
        "403":
          description: >
            Sin el permiso `historial-placa.read`, o usuario autenticado sin compañía resoluble
            (no se puede acotar el historial a su empresa).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/network/instances:
    get:
      operationId: tramitesNetworkListInstances
      tags: [Tramites, Red]
      summary: Listado consolidado de trámites de la red (cabeza de grupo)
      description: >
        Feature #12257 / HU #12358 — vista consolidada de la red de una cabeza de grupo (Concesión o
        Marca Blanca). Ruta NUEVA y separada del listado propio: `/api/v1/tramites/instances` no
        cambia ni recibe parámetros para ampliar el alcance.


        El alcance lo calcula el servidor desde la base de datos (`TenantScope`): la cabeza obtiene
        sus trámites y los de sus clientes hijos vigentes, cada fila con `tenantId` y `companiaNombre`
        del cliente dueño. Un cliente ajeno a la red nunca aparece. Desvincular a un hijo surte efecto
        en la siguiente petición, sin renovar el token.


        Solo una cabeza de grupo con hijos puede llamarla: un cliente sin jerarquía o un SuperAdmin
        reciben 403 `network_scope_required` (el SuperAdmin ya tiene el listado global por sus rutas).
        HU #12652 — y solo con el rol AdminCompany de la cabeza: cualquier otro rol de la cabeza
        (Radicador, Operador, …) recibe 403 `network_role_required` sin ejecutar la consulta; multi-rol
        con AdminCompany pasa. Aplica a TODAS las rutas `/api/v1/tramites/network/**`.
        `childTenantId` fuera del conjunto de lectura responde 403 `network_child_out_of_scope` sin
        ejecutar la consulta.


        SIEMPRE paginada: sin `skip`/`take` responde la primera página con el tope del servidor (200);
        un `take` mayor cae al tope. Mismos filtros, orden y fila que el listado propio. Nunca entrega
        contenido de documentos ni direcciones prefirmadas.
      security:
        - bearerAuth: []
      parameters:
        - name: childTenantId
          in: query
          required: false
          description: Acota a un cliente de la red (puede ser la propia cabeza). Fuera del alcance ⇒ 403.
          schema: { type: string, format: uuid }
        - name: estado
          in: query
          required: false
          description: Estados separados por coma (OR). Valores fuera del vocabulario se descartan.
          schema: { type: string }
        - name: modalidad
          in: query
          required: false
          schema: { type: string }
        - name: organismoTransito
          in: query
          required: false
          description: Nombre del organismo de tránsito, por subcadena.
          schema: { type: string }
        - name: tipoCodigo
          in: query
          required: false
          schema: { type: string }
        - name: busqueda
          in: query
          required: false
          schema: { type: string }
        - name: prioritario
          in: query
          required: false
          schema: { type: boolean }
        - name: createdFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: updatedFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: updatedTo
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: sortBy
          in: query
          required: false
          description: Misma lista blanca que el listado propio; un valor no reconocido cae al orden por defecto.
          schema: { type: string }
        - name: sortDir
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: skip
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: take
          in: query
          required: false
          description: Tamaño de página. Fuera del rango 1..200 cae al tope de 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        "200":
          description: Página del listado consolidado dentro del alcance de la cabeza (puede ser vacía).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkProcedureListResponse"
        "401":
          description: Sin token válido.
        "403":
          description: >
            `network_scope_required` (sin alcance de grupo: cliente sin jerarquía, SuperAdmin),
            `network_role_required` (cabeza sin rol AdminCompany — HU #12652) o
            `network_child_out_of_scope` (`childTenantId` fuera del conjunto de lectura).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/search:
    post:
      operationId: SearchProcedureInstances
      tags: [Tramites]
      summary: Listado de trámites filtrado con la gramática de consultas
      description: >
        HU #12106 (documentado por HU #13374, épica #13216). El MISMO listado que `GET /api/v1/tramites/instances`
        pero por POST, para aceptar condiciones del catálogo y listas largas (placa, VIN o radicado pegados desde
        Excel). El tenant sale del JWT (TenantEnforcementMiddleware); el SuperAdmin acota con X-Tenant-Id o lista
        todas las compañías sin él. Su filtro (`TramitesSearchFilter`) es el que reutiliza el lote de descarga
        masiva (`POST /api/v1/tramites/consolidados/lotes`, modo `filtro`).
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: false
          description: Solo SuperAdmin; para el resto lo impone el JWT.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TramitesSearchRequest"
      responses:
        "200":
          description: Página del listado (máximo 200 ítems) y el total que cumple el filtro.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
                  total: { type: integer }
        "400":
          description: Campo u operador fuera del catálogo de condiciones, o atajo de búsqueda rápida desconocido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin token válido.
        "403":
          description: Usuario de compañía sin compañía asignada.
        "422":
          description: La búsqueda rápida abarca más borradores de los que se evalúan; hay que acotarla.

  /api/v1/tramites/consolidados/lotes:
    post:
      operationId: CrearLoteConsolidados
      tags: [Tramites, Consolidados]
      summary: Crea un lote de descarga masiva de consolidados (Gestor/Radicador; Super Admin en FA2)
      description: >
        Feature #13306 / #13307, ADR-0070 (HU #13374, #13383). Resuelve la selección EN SERVIDOR con la misma
        visibilidad y filtros del listado (sin el tope de 200) y congela el total. Exige `confirmaEfectos=true`
        (CF-08). El origen lo decide el servidor por el rol del JWT (TenantEnforcementMiddleware), NUNCA el
        cuerpo: usuario de compañía → origen `tramites`, tenant del JWT; SuperAdmin → origen `superadmin`,
        lote SIN compañía (Q8). El Super Admin puede acotar con X-Tenant-Id (queda en `scope_tenant_id`) o,
        como hace /tramites, con la condición `compania` del filtro; un trámite fuera del scope no entra ni
        cuenta en el total. Cada trámite conserva su compañía y se procesa en ella (CF-05).
        `consolidado_maestro` solo se admite en origen `superadmin` (los demás → 400 `tipo_no_permitido`).
        La auditoría `lote_creado` se escribe en la misma transacción y registra las compañías alcanzadas
        (`reached_tenant_ids`, DISTINCT de los trámites congelados; `actor_tenant_id` nulo para el Super
        Admin); la condición `compania` queda en `filter_summary` solo como conteo. Si la auditoría no se
        puede registrar, el lote no se crea (503). Un solo lote activo por usuario. Los errores son ProblemDetails con el código estable en `error` (raíz del cuerpo).
        Códigos estables: 400 `confirmacion_requerida`, `tipo_no_permitido`, `seleccion_requerida`,
        `seleccion_invalida`, `filtro_invalido` (campo, operador o atajo fuera de catálogo: 400, igual que
        `POST /api/v1/tramites/instances/search`); 403 `sin_compania`; 409 `lote_activo`; 422
        `seleccion_excede_tope` (más de 10.000 ids o excluidos, o la selección resuelta supera el tope total
        `max_items_per_batch` de los parámetros del motor, por defecto 10.000: entonces el cuerpo trae `total` y
        `tope` y no se crea nada) y `busqueda_demasiado_amplia` (el atajo de
        búsqueda rápida abarca demasiados borradores, igual que el listado); 503 `motor_inactivo` (motor
        apagado u origen sin resolver) y `lote_no_creado` (la transacción o la
        auditoría falló).
        Vista de red (HU #13417, ADR-0070 adenda v7): `alcanceRed` en la raíz del cuerpo pide el lote con el alcance
        de la tabla de red (`red` = cabeza + hijas, uuid = una hija; el de la propia cabeza = lote propio). El
        alcance NO sale del cuerpo: es el TenantScope que el middleware resuelve desde la BD, con las mismas puertas
        y en el mismo orden que `/api/v1/tramites/network/**`. 403 `network_scope_required` (Super Admin, compañía
        hija o cliente sin red), `network_role_required` (la red es solo del rol AdminCompany de la cabeza),
        `network_child_out_of_scope` (la compañía pedida no es de la red; no se consulta nada) y
        `network_documents_disabled` (cabeza CONCESIÓN con `network_documents_concesion` apagado). Ninguno crea
        lote, ítems ni auditoría. El lote de red es de la cabeza (`tenant_id`), cada ítem conserva la compañía de
        su trámite y el total coincide con el de `POST /api/v1/tramites/network/instances/search` con el mismo
        filtro; el tope `max_items_per_batch` aplica a la selección de red. La traza es `consolidado_export_audit`
        (`reached_tenant_ids` y `filter_summary.alcanceRed` = `red` | `hija`, sin el id ni el nombre de la hija);
        no se escribe en `network_access_audit`.
      x-required-permission: consolidado-masivo.download
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: false
          description: >
            Solo SuperAdmin; acota la selección a una compañía (`scope_tenant_id`); sin él, todas. Para el resto
            lo impone el JWT: el middleware reemplaza el valor del cliente por el tenant del token.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearLoteConsolidadosRequest" }
      responses:
        "202":
          description: Lote creado y en cola (`Location` = `/api/v1/consolidados/lotes/{loteId}`).
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoteConsolidados" }
        "400":
          description: "Selección inválida (`seleccion_requerida`, `seleccion_invalida`; también un `alcanceRed` que no es `red` ni un uuid, o distinto en la raíz y en el filtro), condición fuera de catálogo (`filtro_invalido`), `confirmacion_requerida` o `tipo_no_permitido` (consolidado_maestro fuera de origen superadmin)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }
        "401":
          description: Sin token válido.
        "403":
          description: "Sin permiso consolidado-masivo.download (el SuperAdmin pasa por bypass aunque su token no traiga el claim), `sin_compania` (usuario sin compañía que no es SuperAdmin) o, con `alcanceRed` (HU #13417), `network_scope_required`, `network_role_required`, `network_child_out_of_scope` o `network_documents_disabled`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }
        "409":
          description: "`lote_activo`: ya existe un lote activo del usuario."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteActivoConflict" }
        "422":
          description: "`seleccion_excede_tope` (más de 10.000 ids o excluidos, o selección resuelta por encima del tope total `max_items_per_batch`, con `total` y `tope` en la raíz) o `busqueda_demasiado_amplia`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }
        "503":
          description: "`motor_inactivo` o `lote_no_creado` (no se pudo registrar la auditoría; el lote no se creó)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }

  /api/v1/consolidados/lotes/actual:
    get:
      operationId: ObtenerLoteConsolidadosActual
      tags: [Consolidados]
      summary: Lote activo del usuario o el último terminal aún retenido (polling del seguimiento global)
      description: >
        Feature #13306 / ADR-0070, HU #13379. Ruta neutra: el dueño es el `sub` del token (`requested_by_user_id`);
        `X-Tenant-Id` se ignora y la ruta no exige compañía (el `ot_admin` consulta su lote OT). Devuelve el lote
        activo o, si no hay, el último lote terminal todavía retenido (no purgado, aunque ya haya vencido), con
        `expiraEn`. `partes` va vacío hasta que el lote es descargable (completado/completado_con_omitidos, no vencido).
        HU #13386: si el último lote del usuario está `cancelado` se devuelve aunque ya esté purgado, con `terminadoEn` =
        instante de la cancelación, los contadores congelados y `partes` vacío, hasta que el usuario crea otro lote (el
        activo siempre gana a un retenido o cancelado). Un lote purgado por la retención de 24 h no se devuelve.
      x-required-permission: consolidado-masivo.download
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lote activo o retenido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoteConsolidados" }
        "204": { description: "El usuario no tiene lote activo, retenido ni cancelado como último lote (o el último se purgó por retención)" }
        "401": { description: "Sin token válido" }
        "403": { description: "Sin permiso consolidado-masivo.download" }

  /api/v1/consolidados/lotes/{loteId}:
    get:
      operationId: ObtenerLoteConsolidados
      tags: [Consolidados]
      summary: Lote por id (solo del dueño)
      description: >
        Feature #13306 / ADR-0070, HU #13379. Solo el dueño (`sub`); `X-Tenant-Id` se ignora. Cualquier otro usuario,
        incluido el Super Admin, recibe 404.
      x-required-permission: consolidado-masivo.download
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: loteId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: El lote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoteConsolidados" }
        "401": { description: "Sin token válido" }
        "403": { description: "Sin permiso consolidado-masivo.download" }
        "404": { description: "No existe o no es del usuario (incluido Super Admin)" }

  /api/v1/consolidados/lotes/{loteId}/partes/{numero}:
    get:
      operationId: DescargarParteLoteConsolidados
      tags: [Consolidados]
      summary: Descarga una parte del lote (descifrado en streaming; nunca genera PDF)
      description: >
        Feature #13306 / ADR-0070, HU #13379. Solo el dueño (`sub`; otro usuario o el Super Admin ⇒ 404). Descargable
        si el lote está `completado` o `completado_con_omitidos`, no purgado, con `expiraEn` futuro y la parte
        `cerrada`; un lote `fallido` no tiene partes (404) y uno `cancelado` ya está purgado (410 `descarga_expirada`,
        HU #13386) para cualquier número de parte. La fila de auditoría `parte_descargada` se
        registra antes del primer byte: si no se puede, 503 sin bytes. El cuerpo se descifra en streaming
        (almacenamiento → descifrado → respuesta) con `Content-Length` fijado antes del primer byte; si la parte resulta
        corrupta antes de enviar nada, 500 `parte_no_disponible` sin bytes, y si falla a mitad del cuerpo el servidor
        aborta la conexión (el cliente recibe menos bytes que `Content-Length`, nunca un ZIP truncado como válido).
      x-required-permission: consolidado-masivo.download
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: loteId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: numero, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: ZIP de la parte.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="consolidados_20261006_1430_parte-01-de-04.zip"' }
            Content-Length:
              description: Tamaño en claro de la parte (`plain_size_bytes`), fijado antes del primer byte.
              schema: { type: integer, format: int64 }
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { description: "Sin token válido" }
        "403": { description: "Sin permiso consolidado-masivo.download" }
        "404": { description: "No existe, no es del usuario (incluido Super Admin), no tiene partes (fallido) o la parte no existe" }
        "409":
          description: "El lote todavía no terminó (`lote_no_terminado`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }
        "410":
          description: "Descarga expirada (`descarga_expirada`: lote purgado, vencido o cancelado)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }
        "500":
          description: "La parte no se pudo leer o descifrar antes de enviar bytes (`parte_no_disponible`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }
        "503":
          description: "No se pudo registrar la auditoría de la descarga (`auditoria_no_registrada`); no se entregan bytes"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }

  /api/v1/consolidados/lotes/{loteId}/cancelacion:
    post:
      operationId: CancelarLoteConsolidados
      tags: [Consolidados]
      summary: Cancela el lote en curso del usuario (cualquier origen)
      description: >
        HU #13385 (Feature #13307, ADR-0070). Un clic, sin cuerpo ni confirmación. Solo el solicitante (dueño = `sub`;
        se ignora `X-Tenant-Id`): sirve a los orígenes `tramites`, `superadmin` y `ot_bandeja` (el `ot_admin`, con tenant
        OT, cancela su lote OT). Pasa el lote a `cancelado` desde en_cola|en_proceso|empaquetando en una sola transacción:
        los trámites pendientes o en proceso quedan `cancelado` y no se procesan más; las partes cerradas se purgan y las
        que no llegaron a cerrarse se descartan (borrado criptográfico de la clave del lote); `terminadoEn`, `expiraEn` y
        la purga quedan en el instante de la cancelación; se libera el cupo de lote activo y se audita `lote_cancelado`
        (si la auditoría falla, 503 y el lote sigue activo). Los consolidados que el lote ya generó en los trámites quedan
        como oficiales y no se revierten; un trámite que se estaba generando al cancelar termina su generación, pero no
        entra a ninguna parte. Idempotente: un lote ya cancelado responde 202 tal cual, sin nueva auditoría. Tras la
        cancelación el lote ya está purgado: `GET …/actual` (HU #13386) y `GET …/{loteId}` lo devuelven `cancelado` con
        `partes` vacío, y la descarga de cualquiera de sus partes responde 410 `descarga_expirada`. Los procesos en curso
        se detienen en checkpoints (HU #13386): ningún trámite se entrega después del checkpoint previo al generador y
        ninguna parte se sube; si la finalización tomó el lote primero, la cancelación responde 409 `lote_terminado`.
      x-required-permission: consolidado-masivo.download
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: loteId, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Lote cancelado (o ya lo estaba); contadores congelados; `partes` vacío.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoteConsolidados" }
        "401": { description: "Sin token válido" }
        "403": { description: "Sin permiso consolidado-masivo.download; el lote no cambia" }
        "404": { description: "No existe o no es del usuario (incluido un Super Admin con un lote ajeno)" }
        "409":
          description: El lote ya terminó (`lote_terminado`) en completado, completado_con_omitidos, fallido o expirado; no cambia.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteTerminadoConflict" }
        "503":
          description: No se pudo registrar la auditoría de la cancelación (`auditoria_no_registrada`); el lote no se canceló.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LoteProblem" }

  /api/v1/tramites/network/instances/search:
