        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [matriculas, traspasos, otros] }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
