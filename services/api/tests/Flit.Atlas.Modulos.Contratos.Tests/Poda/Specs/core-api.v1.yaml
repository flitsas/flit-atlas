        mode:
          type: string
          enum: [legacy, oidc]
          description: >
            legacy = JWT único de `Jwt:TokenLifetimeHours` (sin renovación); oidc = access token de
            `Suite:Oidc:AccessTokenMinutes` con renovación.
        maxMinutes:
          type: integer
          minimum: 1
          description: Máximo de minutos hasta que el usuario recibe un token con los permisos recalculados.
          example: 720
    CurrentUserResponse:
