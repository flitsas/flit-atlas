            type: string
        companyName:
          description: Nombre de la empresa u organismo de tránsito asociado al tenant (HU #10616 AC1/AC2).
          type: string
        companyNit:
          description: NIT de la empresa/organismo de tránsito. Vacío si no está registrado (HU #10616 AC4).
          type: string
        entityType:
          description: Tipo de entidad del tenant (HU #10616 AC1/AC2).
          type: string
          enum: [COMPANY, TRANSIT_OFFICE]
    CurrentUserRole:
      type: object
