        - bearerAuth: []
      summary: "Tipos de trámite asignables (activos y publicados)"
      responses:
        "200": { description: "Lista de tipos de trámite." }
        "401": { description: "No autenticado." }
        "403": { description: "Sin permiso (requiere SuperAdmin)." }

  # ── Admin · Identidad de Representantes (HU #11758, ADR-0050) ────────────────
  # Retirado: el módulo Identidad es la única fuente que puede originar una validación de
  # identidad. Esta ruta (antes HU #11176) y las otras nueve de disparo/vinculación admin
  # (representante legal send/resend; mandatario por OT send/resend/link/mock; mandatario por
  # compañía send/resend/link) responden 410 Gone con `code: endpoint_deprecado` — nunca 404
  # (decisión DA-1: el recurso existió y se retiró a propósito).
  /api/v1/admin/companies/{tenantId}/legal-representatives/{id}/identity/link:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía gestora).
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del representante legal.
    post:
      operationId: adminLegalRepIdentityLink
      tags: ["Admin · Identidad de Representantes"]
      security:
        - bearerAuth: []
      summary: "Retirado (410) — la identidad se origina en el módulo Identidad, ADR-0050"
      description: |
        HU #11758 (ADR-0050) — ruta RETIRADA. El módulo Identidad
        (`tramites.procedure_instance_biometric_validations`) es la única fuente que puede
        originar una validación de identidad; el área admin deja de disparar y de vincular.
        Responde siempre 410 Gone con `code: endpoint_deprecado`.
      responses:
        "410":
          description: "Retirado: el módulo Identidad es la única fuente de verdad (ADR-0050)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string, nullable: true }
                        code: { type: string, example: endpoint_deprecado }
                        message: { type: string }

  /api/v1/admin/companies/{tenantId}/identity-validations/by-document:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía gestora).
    get:
      operationId: adminIdentityVigenciaByDocument
      tags: ["Admin · Identidad"]
      security:
        - bearerAuth: []
      summary: "Vigencia de identidad de una persona por documento (fuente única, ADR-0050)"
      description: |
        HU #11751 (ADR-0050) — resuelve el estado de identidad de una persona por tipo+número de
        documento, leyendo EXCLUSIVAMENTE del módulo Identidad
        (`tramites.procedure_instance_biometric_validations`). Devuelve UN único registro, no una
        grilla. El tenant se deriva de la ruta (`tenantId`); no exige `X-Tenant-Id`. Normaliza el
        documento con Trim + mayúsculas invariantes (ADR-0039). Reemplaza, para esta consulta, a las
        rutas de `admin.admin_identity_validations`.
      parameters:
        - name: documentType
          in: query
          required: true
          schema: { type: string }
        - name: documentNumber
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Vigencia resuelta (posiblemente sin_validacion si no hay ninguna)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIdentityVigenciaByDocumentResponse"
        "400":
          description: "Falta documentType o documentNumber."
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string }
                        code: { type: string, example: documento_requerido }
                        message: { type: string }
        "401": { description: "No autenticado." }
        "403": { description: "Sin permiso (requiere AdminCompany del propio tenant o SuperAdmin)." }

  /api/v1/tramites/instances/{id}/deferred-signature:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/TenantIdHeader"
    get:
      operationId: getProcedureInstanceDeferredSignature
      tags: ["Trámites · Traspaso"]
      security:
        - bearerAuth: []
      summary: "¿Aplica la firma a posteriori para esta parte y ya está marcada?"
      description: >
        HU #11197 (AC1/AC2/AC4). `aplica` es true solo cuando el firmante de esa parte tiene la identidad
        Y la firma del baúl vencidas: con cualquiera de las dos vigente el trámite puede firmarse ya y la
        opción no se ofrece. En persona natural o sin representante responde
        `{aplica:false, marcado:false}`, no un error. HU #13157: la parte `mandatario` se retiró y responde
        400 `parte_invalida` (use comprador|vendedor).
      parameters:
        - name: parte
          in: query
          required: true
          schema: { type: string, enum: [comprador, vendedor] }
        - name: documento
          in: query
          required: false
          schema: { type: string, nullable: true }
          description: >
            ADR-0053 (Múltiple Propietario) — documento del representante legal al que se refiere la
            consulta, cuando `parte` tiene 2..4 actores jurídicos. Opcional/aditivo: con 1 solo actor
            en el rol (caso mayoritario, contrato anterior a este ADR) se ignora.
      responses:
        "200":
          description: "Estado de la firma a posteriori para esa parte."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferredSignatureStateResponse"
        "400": { description: "Falta el header X-Tenant-Id, o parte inválida." }
        "401": { description: "No autenticado." }
        "404": { description: "Trámite no encontrado." }
    post:
      operationId: markProcedureInstanceDeferredSignature
      tags: ["Trámites · Traspaso"]
      security:
        - bearerAuth: []
      summary: "Marca el trámite para firmarse cuando el representante valide su identidad"
      description: >
        HU #11196 (AC1). Idempotente: volver a marcar no crea una segunda marca ni mueve la fecha
        original. Para comprador/vendedor, cuando esa persona apruebe su validación TODOS sus trámites
        marcados del tenant que sigan en borrador o subsanación se firman de una (el estado se revalida al
        aplicar, no al marcar). HU #13157: la parte `mandatario` ya no se acepta (400 `parte_invalida`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parte: { type: string, enum: [comprador, vendedor] }
                documento:
                  type: string
                  nullable: true
                  description: >
                    ADR-0053 (Múltiple Propietario) — documento del representante legal al que se
                    refiere la marca, cuando `parte` tiene 2..4 actores jurídicos. Opcional/aditivo:
                    con 1 solo actor en el rol (caso mayoritario, contrato anterior a este ADR) se
                    ignora.
              required: [parte]
      responses:
        "200":
          description: "Trámite marcado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferredSignatureStateResponse"
        "400": { description: "Falta el header X-Tenant-Id, o parte inválida." }
        "401": { description: "No autenticado." }
        "404": { description: "Trámite no encontrado." }
        "409": { description: "not_draft — solo en borrador o subsanación; o la parte aún no tiene actor." }
        "422":
          description: >
            no_aplica (la parte no es persona jurídica), sin_representante (el representante declarado no
            tiene documento con el que validar) o firma_disponible (ya puede firmarse ahora).

  /api/v1/tramites/instances/{id}/mandate-signer:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/TenantIdHeader"
    get:
      operationId: getProcedureInstanceMandateSigner
      tags: ["Trámites · Traspaso"]
      security:
        - bearerAuth: []
      summary: "Firmante previsto del mandato (solo lectura)"
      description: >
        HU #13145 (ADR-0066). Quién firmará el mandato del trámite según la prelación del mandatario
        (Explícita, OT para la compañía, propio de la compañía, asociado, default del OT), calculado por el
        MISMO evaluador que usa el gate de radicación: la pantalla y la radicación nunca discrepan.


        `estado`: `valido` (con `nombre` y `formaFirma`), `sin_mandatario` o `firma_invalida` (con `motivo`),
        `no_aplica` (mandato Persona jurídica, Mandato abierto o mandato personalizado de la compañía),
        `pendiente_organismo` (sin organismo elegido) o `pendiente_eleccion_ot` (varios válidos: el OT
        elige al aprobar). `modo` es el modo vigente de la validación (`block` | `warn` | `off`).


        Solo `nombre` y `formaFirma`: nunca el documento de identidad ni la ruta de la firma (Ley 1581). El
        trámite se busca en el tenant de la petición; uno de otro tenant responde 404.
      responses:
        "200":
          description: "Firmante previsto."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateSignerPrevistoResponse"
        "400": { description: "Falta el header X-Tenant-Id." }
        "401": { description: "No autenticado." }
        "404": { description: "Trámite no encontrado (o de otro tenant)." }

  /api/v1/me/ui-preferences/{scope}:
    parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
          enum: [tramites.columns, ot.procedures.columns, tramites.scope]
        description: >
          Lista blanca fija de scopes soportados. Cualquier otro valor responde 400.
      - in: header
        name: X-Tenant-Id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Preferencias de UI]
      operationId: getUserUiPreference
      summary: Obtiene la preferencia de UI del usuario autenticado para un scope
      description: >
        El `user_id` sale exclusivamente del claim JWT (`sub`), nunca de la URL ni del
        body. Si el usuario nunca guardó una preferencia para ese scope, responde 200
        con `value: {}` — NUNCA 404 (no guardado y preferencia vacía son el mismo estado
        para la UI: usar las columnas por defecto).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferencia guardada (o `{}` si nunca se guardó).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserUiPreferenceResponse"
        "400":
          description: Falta el header X-Tenant-Id, o scope fuera de la lista blanca.
        "401":
          description: No autenticado.
    put:
      tags: [Preferencias de UI]
      operationId: upsertUserUiPreference
      summary: Guarda (crea o reemplaza) la preferencia de UI del usuario autenticado para un scope
      description: >
        Upsert idempotente por tenant + usuario + scope: la primera llamada crea la
        fila, las siguientes la sobrescriben. `user_id` sale del claim JWT, nunca del body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: object
                  description: Valor de UI arbitrario (p. ej. lista de columnas visibles), opaco para el backend.
              required: [value]
      responses:
        "200":
          description: Preferencia guardada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserUiPreferenceResponse"
        "400":
          description: Falta el header X-Tenant-Id, o scope fuera de la lista blanca.
        "401":
          description: No autenticado.

  # ── Admin · Plataforma · Jerarquía de clientes (HU #12323, Feature #12254, ADR-0057) ──
  /api/v1/admin/platform/network-access-audit:
    get:
      operationId: adminNetworkAccessAuditSearch
      tags: ["Admin · Plataforma · Jerarquía de clientes"]
      security:
        - bearerAuth: []
      summary: "Auditoría de accesos consolidados de una cabeza de red a los datos de un cliente"
      description: >
        HU #12361 — para responder el reclamo de un cliente hijo: qué usuarios de la Concesión accedieron
        a sus datos (listados, estadísticas, detalle, listado y descarga de documentos), con el recurso,
        el instante y el resultado de cada acceso (los intentos rechazados también quedan). `tenantId`
        acota al cliente alcanzado (dueño del trámite o presente en `reachedTenantIds`); sin él se lista
        toda la plataforma. Un registro por petición, nunca por trámite; solo identificadores. Solo rol
        SuperAdmin. Paginación acotada en servidor (`take` máximo 200).
      parameters:
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Cliente hijo cuyos datos fueron alcanzados. Vacío = toda la plataforma.
        - $ref: "#/components/parameters/NetworkAccessAuditFrom"
        - $ref: "#/components/parameters/NetworkAccessAuditTo"
        - $ref: "#/components/parameters/NetworkAccessAuditResource"
        - $ref: "#/components/parameters/NetworkAccessAuditPage"
        - $ref: "#/components/parameters/NetworkAccessAuditTake"
      responses:
        "200":
          description: "Página de accesos consolidados, más reciente primero."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkAccessAuditPage"
        "401": { description: "No autenticado." }
        "403": { description: "Sin permiso (requiere SuperAdmin)." }

  /api/v1/admin/platform/hierarchy-switches:
    get:
      operationId: adminHierarchySwitchesList
      tags: ["Admin · Plataforma · Jerarquía de clientes"]
      security:
        - bearerAuth: []
      summary: "Lista los interruptores globales de la jerarquía de clientes"
      description: >
        Devuelve el estado de `group_read_scope` (cabeza de grupo lee a sus hijos), `inherited_configuration`
        (hijos heredan configuración del padre) y `network_documents_concesion` (HU #12410: una cabeza de
        clase CONCESION puede listar y descargar documentos de la red; nace APAGADO). Se leen por petición y
        sin caché: conmutar uno surte efecto en la siguiente petición sin despliegue ni nuevo token.
        Ninguno reutiliza `is_group_parent`. Solo rol SuperAdmin.
      responses:
        "200":
          description: "Interruptores ordenados por clave."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HierarchySwitchesListResponse"
        "401": { description: "No autenticado." }
        "403": { description: "Sin permiso (requiere SuperAdmin)." }

  /api/v1/admin/platform/hierarchy-switches/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          enum: [group_read_scope, inherited_configuration, network_documents_concesion]
        description: "Clave del interruptor. Cualquier otra clave responde 404."
    put:
      operationId: adminHierarchySwitchesSet
      tags: ["Admin · Plataforma · Jerarquía de clientes"]
      security:
        - bearerAuth: []
      summary: "Enciende o apaga un interruptor de la jerarquía sin despliegue"
      description: >
        Apagar `group_read_scope` hace que toda cabeza de grupo resuelva alcance propio (`Single`) en la
        siguiente petición, dejando intactos `is_group_parent` y `parent_tenant_id`; reencenderlo devuelve
        `Group` sin nuevo token. Encender `network_documents_concesion` (HU #12410, apagado por defecto) abre
        `GET /api/v1/tramites/network/instances/{id}/attachments[/{attachmentId}/download]` a las cabezas de
        clase CONCESION (MARCA_BLANCA no lo necesita). Los interruptores son independientes entre sí. La
        operación queda en el rastro de auditoría administrativo (`module=config`, `operation=update`,
        `entity=hierarchy_switch`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetHierarchySwitchRequest"
      responses:
        "200":
          description: "Estado resultante del interruptor."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HierarchySwitchResponse"
        "400": { description: "Body inválido (falta `isEnabled` o no es booleano)." }
        "401": { description: "No autenticado." }
        "403": { description: "Sin permiso (requiere SuperAdmin)." }
        "404":
          description: "Clave de interruptor desconocida (`HIERARCHY_SWITCH_NOT_FOUND`)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: HIERARCHY_SWITCH_NOT_FOUND }

  # ── Admin · Plataforma · Notificaciones (Feature #11349; ampliado por #12428/#12430/#12431) ──
  /api/v1/admin/plataforma/notificaciones/buzon-pruebas:
    get:
      tags: [Admin · Plataforma · Notificaciones]
      operationId: adminPlataformaNotificacionesGetBuzonPruebas
      summary: Buzón de pruebas de la plataforma (HU #11366 AC2)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado del buzón (configurado o no, destinatario, último envío, rowVersion).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTestMailboxResponse" }
        "401": { description: No autenticado. }
        "403": { description: Sin permiso (requiere SuperAdmin). }
    put:
      tags: [Admin · Plataforma · Notificaciones]
      operationId: adminPlataformaNotificacionesUpdateBuzonPruebas
      summary: Fijar el destinatario del buzón de pruebas (HU #11366 AC3)
      description: >
        Concurrencia optimista: `rowVersion` debe coincidir con el vigente; si no, `409`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNotificationTestMailboxRequest" }
      responses:
        "200":
          description: Buzón actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTestMailboxResponse" }
        "400":
          description: Correo inválido (`correo_invalido`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsAdminError" }
        "401": { description: No autenticado. }
        "403": { description: Sin permiso (requiere SuperAdmin). }
        "409":
          description: rowVersion desactualizado (`row_version_conflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsAdminError" }

  /api/v1/admin/plataforma/notificaciones/canales:
    get:
      tags: [Admin · Plataforma · Notificaciones]
      operationId: adminPlataformaNotificacionesGetCanales
      summary: Canales de notificación con su remitente resuelto por configuración (HU #11367)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de canales (`FLIT_SMTP`, `TENANT_API`) con etiqueta, si es el canal por defecto, si está configurado y su remitente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannelsResponse" }
        "401": { description: No autenticado. }
        "403": { description: Sin permiso (requiere SuperAdmin). }

  /api/v1/admin/plataforma/notificaciones/buzon-pruebas/envios:
    post:
      tags: [Admin · Plataforma · Notificaciones]
      operationId: adminPlataformaNotificacionesEnviarPrueba
      summary: Enviar una plantilla de prueba al buzón de pruebas (HU #11368; HU #12430 AC2)
      description: >-
        Sub-recurso del buzón: el destinatario SIEMPRE es el buzón configurado, nunca viaja en el
        cuerpo. Límite de frecuencia persistido (AC2 → `429` con `retryAfterSeconds`). Un fallo de
        TRANSPORTE (SMTP real que rechazó el mensaje) se reporta como `200` con
        `outcome = TransportFailed` y `success = false` — la solicitud fue válida (AC8).
        HU #12430 AC2 — `tenantId` es opcional y ADITIVO: con él (y canal `FLIT_SMTP`) la muestra
        sale con el tema de correo y el remitente de marca de esa compañía y la respuesta incluye
        `applied`; sin él, comportamiento y respuesta idénticos a antes de esa historia.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendNotificationTestRequest" }
      responses:
        "200":
          description: Resultado del intento (`Sent` o `TransportFailed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTestSendResponse" }
        "400":
          description: >-
            `canal_invalido` | `buzon_no_configurado` | `configuracion_incompleta` |
            `plantilla_sin_enrutamiento_por_canal` (plantilla de cuenta + canal `TENANT_API`, HU #11371) |
            `procedure_type_id_invalido` | `tipo_tramite_no_encontrado` | `tipo_tramite_inactivo`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsAdminError" }
        "401": { description: No autenticado. }
        "403": { description: Sin permiso (requiere SuperAdmin). }
        "404":
          description: Plantilla inexistente (`plantilla_no_encontrada`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsAdminError" }
        "429":
          description: Límite de frecuencia (`limite_frecuencia`), con `retryAfterSeconds`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsAdminError" }
        "500":
          description: Fallo al componer la plantilla (`fallo_render`) o error desconocido (`error_desconocido`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsAdminError" }

  /api/v1/admin/plataforma/notificaciones/plantillas:
    get:
      tags: [Admin · Plataforma · Notificaciones · Plantillas]
      operationId: adminPlataformaNotificacionesPlantillasList
      summary: Catálogo íntegro de plantillas de notificación (HU #11366 AC1)
      description: Listado estático del catálogo, sin filtrar por módulo ni por lo ya implementado.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plantillas con id estable, nombre, módulo y disparadores.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplateListResponse" }
        "401": { description: No autenticado. }
        "403": { description: Sin permiso (requiere SuperAdmin). }

  /api/v1/admin/plataforma/notificaciones/plantillas/{templateId}/muestra:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string }
        description: Id estable de la plantilla (p. ej. `tramites.aprobado`).
    get:
      tags: [Admin · Plataforma · Notificaciones · Plantillas]
      operationId: adminPlataformaNotificacionesPlantillasGetMuestra
      summary: Muestra compuesta de una plantilla, sin datos de personas (HU #11366 AC2/AC3; HU #12428 AC1/AC8)
      description: >-
        Compone asunto y HTML con los MISMOS composers de producción pero con marcadores — nunca
        con datos reales (Ley 1581). AC3: `tramiteId` y `usuarioId` existen solo para ser
        rechazados: si cualquiera llega con valor la respuesta es `400 solicitud_invalida` ANTES de
        resolver el catálogo, exista o no `templateId` (sin canal lateral). Las plantillas de
        cambio de estado de trámite exigen `procedureTypeId` activo. HU #12428/#12431 —
        `tenantId` es opcional y ADITIVO: con él la muestra se compone con el tema de correo de esa
        compañía y la respuesta trae `theme`; sin él, salida idéntica a antes de esa historia.
      security:
        - bearerAuth: []
      parameters:
        - name: channel
          in: query
          required: false
          schema: { type: string, enum: [FLIT_SMTP, TENANT_API], default: FLIT_SMTP }
        - name: procedureTypeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Obligatorio para las plantillas de cambio de estado de trámite.
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: HU #12428 — compañía cuyo tema de correo se aplica a la muestra.
        - name: tramiteId
          in: query
          required: false
          schema: { type: string }
          description: NO admitido — cualquier valor produce `400 solicitud_invalida` (AC3).
        - name: usuarioId
          in: query
          required: false
          schema: { type: string }
          description: NO admitido — cualquier valor produce `400 solicitud_invalida` (AC3).
      responses:
        "200":
          description: Asunto y cuerpo HTML de la muestra.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplateSampleResponse" }
        "400":
          description: >-
            `solicitud_invalida` (identificador real colado) | `canal_invalido` (con `allowed`) |
            `procedure_type_id_invalido` | `tipo_tramite_no_encontrado` | `tipo_tramite_inactivo`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationsAdminError" }
        "401": { description: No autenticado. }
        "403": { description: Sin permiso (requiere SuperAdmin). }
        "404": { description: Plantilla inexistente. Sin cuerpo. }

  /api/v1/admin/plataforma/consolidados/lotes/parametros:
    get:
      tags: [Admin · Plataforma · Descarga masiva]
      operationId: AdminPlataformaConsolidadoLotesGetParametros
      summary: Parámetros vigentes del motor de descarga masiva de consolidados (HU #13420 AC1)
      description: >
        Solo SuperAdmin (rol activo en el token; cualquier otro rol recibe 403). Devuelve todos los campos de
        `tramites.consolidado_export_settings` (fila única global de plataforma), quién y cuándo los cambió por última
        vez (`updatedBy` + `updatedByName`, el nombre visible del usuario; ambos null si nunca se editó) y el
        `rowVersion` que el PUT debe devolver. `limites` publica los rangos de los CHECK del DDL 133 para que la
        pantalla no repita los literales. Sin la fila (la siembra la migración) responde 404
        `parametros_no_encontrados`: no se inventan valores, y sin fila el alta de lotes ya responde 503
        `motor_inactivo`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Parámetros vigentes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParametrosMotorLote" }
        "401": { description: No autenticado. }
        "403": { description: Sin el rol SuperAdmin activo. }
        "404":
          description: No existe la fila de parámetros (`parametros_no_encontrados`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ParametrosMotorLoteProblem" }
    put:
      tags: [Admin · Plataforma · Descarga masiva]
      operationId: AdminPlataformaConsolidadoLotesPutParametros
      summary: Actualiza los parámetros del motor de descarga masiva (HU #13420 AC2-AC6)
      description: >
        Solo SuperAdmin. Todos los campos son obligatorios (un nulo o ausente es 400 en su campo). Rangos idénticos a
        los CHECK del DDL 133 (ver `ParametrosMotorLote.limites`); además `itemLeaseSeconds > itemTimeoutSeconds` y
        `partLeaseSeconds > partTimeoutSeconds`. Todos los tiempos tienen tope (Security L1): `itemTimeoutSeconds` y
        `retryDelaySeconds` ≤ 3600, `partTimeoutSeconds` ≤ 7200, `itemLeaseSeconds` ≤ 7200 y `partLeaseSeconds` ≤ 14400. Concurrencia optimista: `rowVersion` es el leído en el GET; si otro
        Super Admin guardó después, 409 `row_version_conflict` y no se escribe nada. Guarda `updated_by`/`updated_at`
        y el trigger `trg_audit_log` deja en `audit.audit_logs` los valores anterior y nuevo. El alta de lotes y el
        motor leen la fila en cada uso: el cambio aplica sin reiniciar y no altera los lotes ya creados. Con
        `isActive = false` el alta responde 503 `motor_inactivo` y los lotes en curso quedan en pausa.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActualizarParametrosMotorLoteRequest" }
      responses:
        "200":
          description: Parámetros guardados (fila releída, con el nuevo `rowVersion`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParametrosMotorLote" }
        "400":
          description: >
            `parametros_invalidos`: ValidationProblem con `errors` por campo (camelCase, el mismo nombre del cuerpo);
            p. ej. `{"errors": {"maxItemsPerBatch": ["Debe estar entre 1 y 32766."]}}`. Un cuerpo vacío lleva
            `errors.body`; un JSON mal formado o un tipo incorrecto es 400 sin `errors` por campo.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ParametrosMotorLoteValidationProblem" }
        "401":
          description: >
            Sin token o token inválido (sin cuerpo). Si el token es válido pero no identifica al usuario (sin `sub` ni
            `NameIdentifier`), ProblemDetails `usuario_no_identificado` y no se escribe nada (nunca `updated_by` nulo).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ParametrosMotorLoteProblem" }
        "403": { description: Sin el rol SuperAdmin activo. }
        "404":
          description: No existe la fila de parámetros (`parametros_no_encontrados`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ParametrosMotorLoteProblem" }
        "409":
          description: rowVersion desactualizado (`row_version_conflict`); la pantalla pide recargar.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ParametrosMotorLoteProblem" }

  /api/v1/dr-flit/chat:
    post:
      tags: [DR. FLIT]
      operationId: drFlitChat
      summary: Clasifica la intención del mensaje libre y responde dudas citando el manual
      description: >
        Épica #12718, HU #12922 (ADR-0060 §5.1). Cualquier usuario autenticado. El tope diario
        (`Anthropic:DrFlitDailyMessageLimit`) se cuenta por tenant y usuario; para un usuario de
        compañía el tenant sale del token (el header se exige pero no cambia el cupo), para
        SuperAdmin sale del header. LLM caído, salida fuera de contrato o manual no disponible
        responden 200 con `status: degraded`, `intent: no_claro` y `reply` vacío; el tope
        alcanzado responde 200 con `status: rate_limited`, sin llamar al LLM. Nunca 5xx por esas
        causas. El texto del mensaje y de la respuesta no se loguea.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                history:
                  type: array
                  maxItems: 12
                  description: Últimos turnos de la conversación (sessionStorage del cliente), del más viejo al más nuevo.
                  items:
                    type: object
                    required: [role, text]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      text: { type: string, minLength: 1, maxLength: 2000 }
                routeScope:
                  type: string
                  nullable: true
                  description: Módulo o ruta actual. Aceptado por contrato; hoy no se usa.
      responses:
        "200":
          description: Respuesta del chat (ok, degraded o rate_limited).
          content:
            application/json:
              schema:
                type: object
                required: [status, intent, reply, citations, usage]
                properties:
                  status: { type: string, enum: [ok, degraded, rate_limited] }
                  intent: { type: string, enum: [duda, soporte, gestion, no_claro] }
                  reply: { type: string }
                  citations:
                    type: array
                    description: Solo con intent duda. Cada slug fue verificado contra el catálogo del manual.
                    items:
                      type: object
                      required: [slug, title, href, primarySource]
                      properties:
                        slug: { type: string }
                        title: { type: string }
                        href: { type: string, example: /manual/1-gestor/2-crear-tramite }
                        sourceHref: { type: string, nullable: true }
                        primarySource: { type: boolean }
                  suggestGestionIntent:
                    type: string
                    nullable: true
                    enum: [placa, vin, tramite, cliente, null]
                  usage:
                    type: object
                    required: [messagesUsedToday, dailyLimit]
                    properties:
                      messagesUsedToday: { type: integer }
                      dailyLimit: { type: integer }
        "400":
          description: Falta X-Tenant-Id, mensaje vacío o > 2000, historial > 12 turnos o turno inválido. No consume tope ni llama al LLM.
        "401": { description: No autenticado. }
        "403": { description: Usuario de compañía sin tenant en el token. }
        "428": { description: "Falta aceptar la versión vigente del tratamiento de datos (code consent_required, HU #12931). No se llama al LLM ni a Azure DevOps." }

  /api/v1/dr-flit/support-cases:
    post:
      tags: [DR. FLIT]
      operationId: drFlitCreateSupportCase
      summary: Crea un caso de soporte (Bug en FLIT - SOPORTE) a partir del formulario confirmado
      description: >
        Épica #12718, HU #12925 (ADR-0060 §5.2 y §7.2). Nunca recibe nada del chat: solo el formulario
        estructurado que el usuario confirmó. Persiste el intento en dr_flit.support_cases (pending) antes
        de llamar a Azure DevOps y lo marca created o failed. Los campos de clasificación del Bug salen de
        DrFlit:SupportCase:FieldMapping y el ambiente de DR_FLIT_DEPLOY_ENVIRONMENT (default DEV). El Bug se
        crea sin asignar. Tenant: el del token para usuarios de compañía; el del header para SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, compania, detalle, resultadoEsperado, frecuencia, titulo, prioridad]
              properties:
                nombre: { type: string, maxLength: 200 }
                email: { type: string, format: email }
                telefono: { type: string, nullable: true, maxLength: 30 }
                compania: { type: string, maxLength: 200 }
                detalle: { type: string, maxLength: 4000 }
                resultadoEsperado: { type: string, maxLength: 2000 }
                frecuencia: { type: string, enum: [una_vez, a_veces, siempre] }
                titulo: { type: string, maxLength: 200 }
                prioridad: { type: string, enum: [Alta, Media, Baja] }
                affectedModule:
                  type: string
                  nullable: true
                  description: Mejor esfuerzo del cliente; el backend lo valida contra el allow-list y aplica el default configurado.
                attachmentIds:
                  type: array
                  description: Ids de POST /support-cases/attachments. Deben ser del mismo usuario, estar vigentes y no superar DrFlit:SupportCase:MaxAttachments (default 5).
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Caso radicado.
          content:
            application/json:
              schema:
                type: object
                required: [caseId, attachmentsFailed]
                properties:
                  caseId: { type: integer, description: "Id del work item en FLIT - SOPORTE (número de caso)." }
                  caseUrl: { type: string, nullable: true, description: Solo si el caller es SuperAdmin. }
                  attachmentsFailed: { type: integer, description: "Adjuntos que no se pudieron subir a ADO (el caso se crea igual)." }
        "400": { description: "Campo faltante o inválido, más adjuntos que el tope, o un adjunto ajeno o vencido." }
        "401": { description: No autenticado. }
        "403": { description: Usuario de compañía sin tenant en el token. }
        "428": { description: "Falta aceptar la versión vigente del tratamiento de datos (code consent_required, HU #12931). No se llama al LLM ni a Azure DevOps." }
        "502":
          description: Azure DevOps no respondió tras el reintento. La fila queda failed; los adjuntos siguen disponibles para reintentar.
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  code: { type: string, enum: [support_unavailable] }
                  detail: { type: string }
  /api/v1/dr-flit/support-cases/attachments:
    post:
      tags: [DR. FLIT]
      operationId: drFlitUploadSupportAttachment
      summary: Sube un adjunto temporal para un caso de soporte aún no creado
      description: >
        Épica #12718, HU #12924 (ADR-0060 §5.3). Valida extensión, tipo declarado, firma de los primeros
        bytes y tamaño contra DrFlit:SupportCase (defaults 20 MB; png, jpeg, webp, pdf, txt). Queda en el
        almacenamiento de adjuntos sin caso y vence a las 24 h si no se confirma. La cantidad por caso se
        valida al confirmar, no aquí.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Adjunto guardado.
          content:
            application/json:
              schema:
                type: object
                required: [id, filename, sizeBytes]
                properties:
                  id: { type: string, format: uuid }
                  filename: { type: string }
                  sizeBytes: { type: integer }
        "400": { description: "Archivo ausente, tipo no permitido o que excede el tamaño máximo." }
        "401": { description: No autenticado. }
        "403": { description: Usuario de compañía sin tenant en el token. }
        "428": { description: "Falta aceptar la versión vigente del tratamiento de datos (code consent_required, HU #12931). No se llama al LLM ni a Azure DevOps." }

  /api/v1/dr-flit/consent:
    get:
      tags: [DR. FLIT]
      operationId: drFlitGetConsent
      summary: Versión vigente del tratamiento de datos de DR. FLIT y si el usuario ya la aceptó
      description: HU #12931. Se acepta una vez por usuario y versión (DrFlit:Consent:Version).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado del consentimiento.
          content:
            application/json:
              schema:
                type: object
                required: [version, accepted]
                properties:
                  version: { type: string }
                  accepted: { type: boolean }
        "401": { description: No autenticado. }
    post:
      tags: [DR. FLIT]
      operationId: drFlitAcceptConsent
      summary: Registra la aceptación de la versión vigente del tratamiento de datos
      description: >
        HU #12931 (Ley 1581 de 2012). Guarda usuario, tenant, versión, fecha, IP y user agent en
        dr_flit.consent_acceptances. Idempotente por usuario y versión. Exigida por /chat,
        /support-cases y /support-cases/attachments (428 consent_required sin ella).
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, description: Versión del texto que el usuario leyó. }
      responses:
        "201":
          description: Aceptación registrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  accepted: { type: boolean }
        "400": { description: Falta la versión o X-Tenant-Id. }
        "401": { description: No autenticado. }
        "409": { description: "La versión enviada no es la vigente (code consent_version_mismatch, version vigente en el cuerpo)." }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    SessionDomainMismatch:
      description: >-
        No autenticado (sin cuerpo), o — HU #12422 AC5 (ADR-0060 D3), error COMÚN de toda ruta
        autenticada, referenciado aquí desde `/me/branding` a modo de ejemplo — el JWT lleva un claim
        `dom` (dominio de emisión de la sesión) distinto del dominio sellado de la petición actual
        (`Flit.Api.Authorization.DomainBindingMiddleware`). No aplica a rutas anónimas ni a
        `/internal/*`. Un token sin claim `dom` (emitido antes de esta HU) se trata como `flit`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: SESSION_DOMAIN_MISMATCH

  parameters:
    AiToolCodePath:
      name: toolCode
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AiToolCode"
      description: Código de herramienta IA (ocr | dr_flit).
    NetworkStatsFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
      description: Fecha inicial inclusiva (YYYY-MM-DD) — HU #12359.
    NetworkStatsTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
      description: Fecha final inclusiva (YYYY-MM-DD) — HU #12359.
    NetworkStatsChildTenantId:
      name: childTenantId
      in: query
      required: false
      schema: { type: string, format: uuid }
      description: >
        Cliente de la red al que acotar (puede ser la propia cabeza). Siempre subconjunto del alcance
        resuelto en el servidor; uno fuera del conjunto de lectura responde 403 `network_child_out_of_scope`
        sin ejecutar la consulta (HU #12359, AC5).
    NetworkReportTransitOfficeId:
      name: transitOfficeId
      in: query
      required: false
      schema: { type: string, format: uuid }
      description: Organismo de tránsito del trámite (HU #12360; mismo filtro que `/detailed-report/procedures`).
    NetworkReportProcedureTypeId:
      name: procedureTypeId
      in: query
      required: false
      schema: { type: string, format: uuid }
      description: Tipo de trámite.
    NetworkReportCategory:
      name: category
      in: query
      required: false
      schema: { type: string, enum: [matriculas, traspasos, otros] }
      description: Categoría (se normaliza a minúsculas).
    NetworkReportStatus:
      name: status
      in: query
      required: false
      schema: { type: string }
      description: Estado del trámite.
    NetworkReportReferenceNumber:
      name: referenceNumber
      in: query
      required: false
      schema: { type: string }
      description: Radicado (contiene). Se audita solo por nombre, nunca su valor.
    NetworkReportPersonDocument:
      name: personDocument
      in: query
      required: false
      schema: { type: string }
      description: Documento de la persona (contiene). Se audita solo por nombre, nunca su valor.
    NetworkReportPersonName:
      name: personName
      in: query
      required: false
      schema: { type: string }
      description: Nombre de la persona (contiene). Se audita solo por nombre, nunca su valor.
    NetworkReportHasTransformation:
      name: hasTransformation
      in: query
      required: false
      schema: { type: boolean }
    NetworkReportIsLeasing:
      name: isLeasing
      in: query
      required: false
      schema: { type: boolean }
    NetworkAccessAuditFrom:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: Instante mínimo (inclusive) del acceso.
    NetworkAccessAuditTo:
      name: to
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: Instante máximo (inclusive) del acceso.
    NetworkAccessAuditResource:
      name: resource
      in: query
      required: false
      schema:
        type: string
        enum: [network.instances.search, network.instances.detail, network.stats.overview, network.attachments.list, network.attachments.download]
      description: Acota a un recurso de la vista consolidada.
    NetworkAccessAuditPage:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    NetworkAccessAuditTake:
      name: take
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: Tamaño de página; se acota a 200 en servidor.
    # HU #10520 (RNF01) — header de tenant reutilizable por los endpoints operativos de documentos.
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Identificador del tenant (compañía) dueño del trámite.

  schemas:
    # ── Admin · Identidad de marca (HU #12412, Feature #12366, ADR-0060 D1) ────
    BrandColors:
      type: object
      required: [primary, secondary, onPrimary]
      properties:
        primary: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        secondary: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        onPrimary: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
    BrandingSnapshot:
      type: object
      properties:
        platformName: { type: string, nullable: true }
        colors:
          type: object
          allOf: [{ $ref: "#/components/schemas/BrandColors" }]
          nullable: true
        logoId: { type: string, format: uuid, nullable: true }
    UpsertBrandingDraftRequest:
      type: object
      properties:
        platformName: { type: string, nullable: true, minLength: 2, maxLength: 40 }
        colors:
          type: object
          allOf: [{ $ref: "#/components/schemas/BrandColors" }]
          nullable: true
        logoId: { type: string, format: uuid, nullable: true }
        rowVersion: { type: integer, format: int64, nullable: true }
    TenantBrandingResponse:
      type: object
      required: [tenantId, draft, publishedVersion, hasUnpublishedChanges, completeness, rowVersion]
      properties:
        tenantId: { type: string, format: uuid }
        draft: { $ref: "#/components/schemas/BrandingSnapshot" }
        published:
          type: object
          allOf: [{ $ref: "#/components/schemas/BrandingSnapshot" }]
          nullable: true
        publishedVersion: { type: integer }
        publishedAt: { type: string, format: date-time, nullable: true }
        publishedBy:
          type: object
          nullable: true
          properties:
            userId: { type: string, format: uuid }
        hasUnpublishedChanges: { type: boolean }
        logoUrl: { type: string, nullable: true }
        completeness:
          type: object
          required: [isComplete, missing]
          properties:
            isComplete: { type: boolean }
            missing: { type: array, items: { type: string } }
        rowVersion: { type: integer, format: int64 }
    BrandLogoResponse:
      type: object
      required: [logoId, version, contentType, width, height, sizeBytes, sha256, logoUrl]
      properties:
        logoId: { type: string, format: uuid }
        version: { type: integer }
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp] }
        width: { type: integer }
        height: { type: integer }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string }
        logoUrl: { type: string }

    # ── Tema de correo (HU #12428/#12430/#12431, Feature #12405, ADR-0060) ────────────────────
    EmailThemeInfo:
      type: object
      required: [kind, platformName]
      description: >-
        Tema aplicado a una muestra de correo. `kind=flit`: respaldo FLIT (version null/0).
        `kind=brand`: marca publicada. `kind=draft-partial`: solo en `source=draft` con un
        borrador incompleto — los campos faltantes se completaron con FLIT.
      properties:
        kind: { type: string, enum: [flit, brand, draft-partial] }
        platformName: { type: string }
        version: { type: integer, nullable: true }
        senderName:
          type: string
          nullable: true
          description: HU #12430 — nombre visible del remitente aplicado. Null hasta que #12430 lo puebla.
    NotificationTemplateSampleResponse:
      type: object
      required: [templateId, subject, html]
      properties:
        templateId: { type: string }
        subject: { type: string }
        html: { type: string }
        theme:
          type: object
          allOf: [{ $ref: "#/components/schemas/EmailThemeInfo" }]
          nullable: true
          description: >-
            Aditivo (HU #12428/#12431). Ausente en `GET .../plantillas/{templateId}/muestra` sin
            `?tenantId=` (salida idéntica a antes de esta historia); siempre presente en
            `GET /company/branding/email-sample`.

    # ── Admin · Plataforma · Notificaciones (Feature #11349; HU #12428/#12430/#12431) ──────────
    NotificationsAdminError:
      type: object
      required: [error]
      description: >-
        Error de las rutas de Plataforma → Notificaciones. `error` es un código estable en
        snake_case (ver cada respuesta); `message`, `retryAfterSeconds` (solo `limite_frecuencia`)
        y `allowed` (solo `canal_invalido` en la muestra) son opcionales.
      properties:
        error: { type: string, example: limite_frecuencia }
        message: { type: string, nullable: true }
        retryAfterSeconds: { type: integer, nullable: true }
        allowed: { type: string, nullable: true, example: "FLIT_SMTP, TENANT_API" }
    ParametrosMotorLote:
      type: object
      description: >
        HU #13420 — parámetros del motor de descarga masiva (`tramites.consolidado_export_settings`). Rangos = CHECK
        del DDL 133 (`minimum`/`maximum` inclusivos; sin `maximum` = sin tope propio, máximo del entero de 32 bits).
      required: [maxItemsPerBatch, maxPdfsPerPart, maxMbPerPart, itemSlots, itemTimeoutSeconds, itemLeaseSeconds, maxItemAttempts, retryDelaySeconds, partTimeoutSeconds, partLeaseSeconds, maxPartAttempts, retentionHours, isActive, rowVersion, limites]
      properties:
        maxItemsPerBatch:
          type: integer
          minimum: 1
          maximum: 32766
          description: "Tope total de trámites por lote (M1); superarlo en el alta es 422 `seleccion_excede_tope`."
        maxPdfsPerPart:
          type: integer
          minimum: 1
          maximum: 5000
          description: "N: PDF por parte ZIP."
        maxMbPerPart:
          type: integer
          minimum: 10
          maximum: 2048
          description: "M: MB de PDF en claro por parte."
        itemSlots:
          type: integer
          minimum: 1
          maximum: 6
          description: "K: carriles (ítems concurrentes del motor por instancia)."
        itemTimeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
          description: "Tiempo máximo por trámite, en segundos."
        itemLeaseSeconds:
          type: integer
          maximum: 7200
          description: "Lease del reclamo de un trámite, en segundos; mayor que `itemTimeoutSeconds` y como mucho 7200."
        maxItemAttempts:
          type: integer
          minimum: 1
          maximum: 10
          description: "Reintentos por trámite."
        retryDelaySeconds:
          type: integer
          minimum: 5
          maximum: 3600
          description: "Espera entre reintentos de un trámite, en segundos."
        partTimeoutSeconds:
          type: integer
          minimum: 1
          maximum: 7200
          description: "Tiempo máximo por parte, en segundos."
        partLeaseSeconds:
          type: integer
          maximum: 14400
          description: "Lease del empaquetado de una parte, en segundos; mayor que `partTimeoutSeconds` y como mucho 14400."
        maxPartAttempts:
          type: integer
          minimum: 1
          maximum: 10
          description: "Reintentos por parte."
        retentionHours:
          type: integer
          minimum: 1
          maximum: 168
          description: "Horas de retención de las partes tras terminar el lote."
        isActive: { type: boolean, description: "Motor encendido. false = no se crean lotes (503 `motor_inactivo`) y los lotes en curso quedan en pausa." }
        updatedAt: { type: string, format: date-time, nullable: true, description: Última modificación. }
        updatedBy: { type: string, format: uuid, nullable: true, description: Usuario de la última modificación. }
        updatedByName: { type: string, nullable: true, description: "Nombre visible de `updatedBy` (null si nunca se editó o el usuario ya no existe)." }
        rowVersion: { type: integer, format: int64, description: Token de concurrencia optimista; se devuelve en el PUT. }
        limites:
          type: array
          description: Rangos de cada campo según el DDL 133 (fuente única; la pantalla no debe repetir los literales).
          items: { $ref: "#/components/schemas/ParametroMotorLoteLimite" }
    ParametroMotorLoteLimite:
      type: object
      required: [campo]
      properties:
        campo: { type: string, example: maxItemsPerBatch }
        minimo: { type: integer, nullable: true, description: Mínimo inclusivo; null si el campo no tiene rango propio. }
        maximo: { type: integer, nullable: true, description: Máximo inclusivo; null si el CHECK solo pone mínimo. }
        mayorQue: { type: string, nullable: true, description: "Campo cuyo valor debe superar (solo en los leases), p. ej. `itemTimeoutSeconds`." }
    ActualizarParametrosMotorLoteRequest:
      type: object
      description: HU #13420 — cuerpo del PUT. Todos obligatorios; mismos rangos que `ParametrosMotorLote`.
      required: [maxItemsPerBatch, maxPdfsPerPart, maxMbPerPart, itemSlots, itemTimeoutSeconds, itemLeaseSeconds, maxItemAttempts, retryDelaySeconds, partTimeoutSeconds, partLeaseSeconds, maxPartAttempts, retentionHours, isActive, rowVersion]
      properties:
        maxItemsPerBatch:
          type: integer
          minimum: 1
          maximum: 32766
          description: "Tope total de trámites por lote (M1); superarlo en el alta es 422 `seleccion_excede_tope`."
        maxPdfsPerPart:
          type: integer
          minimum: 1
          maximum: 5000
          description: "N: PDF por parte ZIP."
        maxMbPerPart:
          type: integer
          minimum: 10
          maximum: 2048
          description: "M: MB de PDF en claro por parte."
        itemSlots:
          type: integer
          minimum: 1
          maximum: 6
          description: "K: carriles (ítems concurrentes del motor por instancia)."
        itemTimeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
          description: "Tiempo máximo por trámite, en segundos."
        itemLeaseSeconds:
          type: integer
          maximum: 7200
          description: "Lease del reclamo de un trámite, en segundos; mayor que `itemTimeoutSeconds` y como mucho 7200."
        maxItemAttempts:
          type: integer
          minimum: 1
          maximum: 10
          description: "Reintentos por trámite."
        retryDelaySeconds:
          type: integer
          minimum: 5
          maximum: 3600
          description: "Espera entre reintentos de un trámite, en segundos."
        partTimeoutSeconds:
          type: integer
          minimum: 1
          maximum: 7200
          description: "Tiempo máximo por parte, en segundos."
        partLeaseSeconds:
          type: integer
          maximum: 14400
          description: "Lease del empaquetado de una parte, en segundos; mayor que `partTimeoutSeconds` y como mucho 14400."
        maxPartAttempts:
          type: integer
          minimum: 1
          maximum: 10
          description: "Reintentos por parte."
        retentionHours:
          type: integer
          minimum: 1
          maximum: 168
          description: "Horas de retención de las partes tras terminar el lote."
        isActive: { type: boolean }
        rowVersion: { type: integer, format: int64, description: El leído en el GET. }
    ParametrosMotorLoteProblem:
      type: object
      description: ProblemDetails de los parámetros del motor con el código estable en `error`.
      required: [error]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        error: { type: string, enum: [parametros_no_encontrados, row_version_conflict, usuario_no_identificado] }
    ParametrosMotorLoteValidationProblem:
      type: object
      description: ValidationProblem (400) con `errors` por campo del cuerpo.
      required: [error, errors]
      properties:
        type: { type: string }
        title: { type: string, example: parametros_invalidos }
        status: { type: integer, example: 400 }
        detail: { type: string }
        error: { type: string, enum: [parametros_invalidos] }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    NotificationTestMailboxResponse:
      type: object
      required: [isConfigured, rowVersion]
      properties:
        isConfigured: { type: boolean }
        testRecipientEmail: { type: string, format: email, nullable: true }
        lastTestSentAt: { type: string, format: date-time, nullable: true }
        rowVersion: { type: integer, format: int64 }
    UpdateNotificationTestMailboxRequest:
      type: object
      required: [email, rowVersion]
      properties:
        email: { type: string, format: email }
        rowVersion:
          type: integer
          format: int64
          description: Valor leído en el último GET (concurrencia optimista).
    NotificationChannelsResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: "#/components/schemas/NotificationChannelItem" }
    NotificationChannelItem:
      type: object
      required: [channel, label, isDefault, isConfigured]
      properties:
        channel: { type: string, enum: [FLIT_SMTP, TENANT_API] }
        label: { type: string }
        isDefault: { type: boolean }
        isConfigured: { type: boolean }
        senderEmail: { type: string, nullable: true }
        senderName: { type: string, nullable: true }
    SendNotificationTestRequest:
      type: object
      required: [templateId, channel]
      properties:
        templateId: { type: string, example: tramites.aprobado }
        channel:
          type: string
          enum: [FLIT_SMTP, TENANT_API]
          description: Obligatorio; ausente o fuera del catálogo ⇒ `400 canal_invalido` (sin consumir enfriamiento).
        procedureTypeId:
          type: string
          format: uuid
          nullable: true
          description: Obligatorio para las plantillas de cambio de estado de trámite.
        tenantId:
          type: string
          format: uuid
          nullable: true
          description: >-
            HU #12430 AC2 — compañía cuyo tema de correo y remitente de marca se aplican al envío
            (solo con canal `FLIT_SMTP`). Ausente ⇒ comportamiento idéntico a antes de esa historia.
    NotificationTestSendResponse:
      type: object
      required: [success, outcome, message, isConsoleTransport, recipientDiverted]
      properties:
        success: { type: boolean }
        outcome:
          type: string
          enum: [Sent, TransportFailed]
          description: Solo estos dos valores llegan con `200`; el resto del enum se mapea a 4xx/5xx.
        message: { type: string }
        templateId: { type: string, nullable: true }
        channel: { type: string, nullable: true }
        senderEmail: { type: string, nullable: true }
        senderName: { type: string, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        isConsoleTransport:
          type: boolean
          description: true cuando el transporte configurado es consola (no salió un correo real).
        recipientDiverted:
          type: boolean
          description: true cuando el destinatario fue desviado al buzón de pruebas por configuración.
        applied:
          type: object
          allOf: [{ $ref: "#/components/schemas/NotificationTestSendApplied" }]
          nullable: true
          description: >-
            Aditivo (HU #12430 AC2). Solo presente cuando la solicitud trajo `tenantId` y el canal
            fue `FLIT_SMTP`; ausente en cualquier otro caso.
    NotificationTestSendApplied:
      type: object
      required: [themeKind]
      description: Tema y remitente REALMENTE aplicados a un envío de prueba con `tenantId` (HU #12430 AC2).
      properties:
        themeKind: { type: string, enum: [flit, brand] }
        themeVersion: { type: integer, nullable: true, description: Versión de la marca publicada; null con `flit`. }
        senderName: { type: string, nullable: true }
        senderEmail: { type: string, nullable: true }
    NotificationTemplateListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationTemplateListItem" }
    NotificationTemplateListItem:
      type: object
      required: [id, name, module, triggers]
      properties:
        id: { type: string, example: tramites.aprobado }
        name: { type: string }
        module: { type: string, enum: [Security, Analytics, Tramites] }
        triggers:
          type: array
          items:
            type: string
            enum:
              - CreateInvitation
              - ResendInvitation
              - ForgotPassword
              - AdminResetPassword
              - WelcomeRegistration
              - ScheduledReport
              - Alert
              - ProcedureStatusChanged
              - PlateAssigned

    # ── Público/sesión · Identidad de marca (HU #12418, Feature #12366, ADR-0060 D2) ───────────
    # PROHIBIDO agregar tenantId, NIT, correo, razón social, lista de hijos o isDefault/isNetwork
    # (AC3): un dominio desconocido y uno configurado deben ser indistinguibles en este contrato.
    BrandIdentityResponse:
      type: object
      required: [platformName, colors, version]
      properties:
        platformName: { type: string }
        logoUrl:
          type: string
          nullable: true
          description: Ruta pública por versión (/api/v1/public/branding/logos/{logoId}), o null (identidad FLIT).
        colors: { $ref: "#/components/schemas/BrandColors" }
        version: { type: integer, description: "0 = identidad FLIT de respaldo." }

    # ── Admin · Dominio dedicado de la red (HU #12416, Feature #12368, ADR-0060) ───────────────
    RegisterDomainRequest:
      type: object
      required: [host]
      properties:
        host:
          type: string
          description: Sin esquema, puerto ni ruta. Se normaliza a minúsculas y punycode (IDN) antes de persistir.
        rowVersion: { type: integer, format: int64, nullable: true, description: Ausente en el primer registro. }
    TenantDomainResponse:
      type: object
      required: [host, status, statusChangedAt, verification, certificate, rowVersion]
      properties:
        host: { type: string }
        status: { type: string, enum: [pending, verified, active, failed] }
        statusReason:
          type: string
          nullable: true
          enum: [TXT_NOT_FOUND, TXT_MISMATCH, DNS_ERROR]
          description: Solo presente cuando status=failed (HU #12425 AC2).
        statusChangedAt: { type: string, format: date-time }
        verification:
          type: object
          required: [txtName, txtValue, cnameName, cnameTarget]
          properties:
            txtName: { type: string, description: "_flit-verify.<host>" }
            txtValue: { type: string, description: "Token de comprobación (HU #12425)." }
            cnameName: { type: string }
            cnameTarget: { type: string, description: "Destino del borde (Domains:EdgeTarget, HU #12421)." }
        verifiedAt: { type: string, format: date-time, nullable: true }
        activatedAt: { type: string, format: date-time, nullable: true }
        certificate:
          type: object
          properties:
            issuedAt: { type: string, format: date-time, nullable: true }
            expiresAt: { type: string, format: date-time, nullable: true }
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        nextCheckAt: { type: string, format: date-time, nullable: true }
        graceUntil: { type: string, format: date-time, nullable: true }
        rowVersion: { type: integer, format: int64 }

    # ── Admin · Generación documental (Feature #12201, ADR-0056) ───────────────
    StandaloneRuesRequest:
      type: object
      required: [nit]
      properties:
        nit:
          type: string
          minLength: 5
          maxLength: 20
          description: NIT de la persona jurídica, con o sin separadores.
    StandaloneDocumentGenerateResult:
      type: object
      description: >
        Contrato de respuesta de la generación individual. NUNCA transporta el PDF (decisión del
        PO): el binario se descarga después por GET /{id}/download.
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [generated, error]
          description: >
            Solo generated o error (CF-21). Los estados pending y processing son de tránsito de la
            fila y no se responden en la generación individual.
    StandaloneRuesPreviewField:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Clave del campo mercantil (por ejemplo rues_razon_social).
        value:
          type: string
          nullable: true
    StandaloneRuesPreviewResult:
      type: object
      description: Campos mercantiles para revisión previa. No se persiste nada.
      required: [found, nit, campos]
      properties:
        found:
          type: boolean
          description: false cuando el NIT no tiene coincidencia en RUES.
        nit: { type: string }
        campos:
          type: array
          items:
            $ref: "#/components/schemas/StandaloneRuesPreviewField"
        error:
          type: string
          nullable: true
          enum: [invalid_request, provider_unavailable, provider_not_found]
    StandaloneTransferParte:
      type: object
      description: >
        Una parte compareciente (anexo §5.2 y §5.3). El dígito de verificación se admite pero el
        servidor lo RECALCULA cuando el documento es un NIT: un NIT y su DV no pueden discrepar
        dentro del mismo PDF.
      required: [nombreRazonSocial, tipoDoc, numeroDoc]
      properties:
        tipoPersona:
          type: string
          nullable: true
          enum: [PN, PJ]
        nombreRazonSocial: { type: string }
        tipoDoc:
          type: string
          description: CC / CE / NIT / Pasaporte, según el catálogo RUNT.
        numeroDoc: { type: string }
        digitoVerificacion:
          type: string
          nullable: true
          description: Se ignora y se recalcula cuando tipoDoc es NIT.
        domicilio: { type: string, nullable: true }
        representanteLegal: { type: string, nullable: true }
        ccRepresentanteLegal: { type: string, nullable: true }
    StandaloneTransferVehiculo:
      type: object
      description: Las 13 variables de vehículo del anexo §5.1.
      required: [placa]
      properties:
        placa:
          type: string
          description: 5 a 7 caracteres alfanuméricos tras quitar guiones y espacios (VB-02).
        marca: { type: string, nullable: true }
        linea: { type: string, nullable: true }
        modeloAnio: { type: string, nullable: true }
        claseVehiculo:
          type: string
          nullable: true
          description: >
            Si contiene REMOLQUE (o SEMIRREMOLQUE) no se pide quién asume el impuesto sobre
            vehículos: están exentos (Ley 488/1998, art. 5.3.2.1 num. 5.º inciso final).
        tipoCarroceria: { type: string, nullable: true }
        color: { type: string, nullable: true }
        noMotor: { type: string, nullable: true }
        noChasis: { type: string, nullable: true }
        noSerie: { type: string, nullable: true }
        servicio: { type: string, nullable: true }
        noLicenciaTransito: { type: string, nullable: true }
        organismoTransito: { type: string, nullable: true }
    StandaloneTransferNegocio:
      type: object
      description: >
        Variables del negocio (anexo §5.4), incluidas las tres fiscales que imprime la cláusula
        SEXTA. El modo de firma no se captura: es MANUSCRITA fijo (§9.0).
      required: [tituloJuridico, asumeRetencionFuente, asumeDerechosTramite, ciudadFirma]
      properties:
        tituloJuridico:
          type: string
          enum: [COMPRAVENTA, DACION_EN_PAGO, PERMUTA, DONACION, OTRO]
          description: >
            VB-A-07. El precio NO es requisito universal: lo exige la compraventa (VB-A-06), no
            todos los títulos traslaticios del art. 5.3.2.1 num. 1.º.
        descripcionTitulo:
          type: string
          nullable: true
          description: Obligatorio cuando tituloJuridico es OTRO; si falta, 422 con VB-A-07.
        precioLetras: { type: string, nullable: true }
        precioNumeros: { type: string, nullable: true }
        contraprestacionDescripcion: { type: string, nullable: true }
        formaPago: { type: string, nullable: true }
        asumeRetencionFuente:
          type: string
          enum: [TRANSFERENTE, ADQUIRENTE, SEGUN_LEY]
        asumeDerechosTramite:
          type: string
          enum: [TRANSFERENTE, ADQUIRENTE, COMPARTIDOS]
        asumeImpuestoVehiculo:
          type: string
          nullable: true
          enum: [TRANSFERENTE, ADQUIRENTE, SEGUN_LEY]
          description: No aplica a remolques ni semirremolques (exentos).
        ciudadFirma: { type: string }
        fechaFirma:
          type: string
          format: date
          nullable: true
          description: Sin valor, el día de hoy en Colombia (UTC-05:00).
    StandaloneTransferGravamen:
      type: object
      description: >
        Declaración del usuario sobre el gravamen (VB-A-04). FLIT no consulta el Registro de
        Garantías Mobiliarias; el OT verifica.
      properties:
        gravamenActivo: { type: boolean, default: false }
        tieneLevantamientoOAutorizacion: { type: boolean, default: false }
    StandaloneTransferRegimen:
      type: object
      description: >
        Declaración de régimen aplicable (anexo §4.0, CF-24). Es el GATE previo a elegir escenario y
        lo evalúa VB-07: se rechaza tanto declarar una de las once condiciones de los
        arts. 5.3.2.3 a 5.3.2.13 como NO responder —el silencio no es un «ninguna aplica»—. La
        declaración y su fecha se conservan en input_summary, sin PII.
      properties:
        ningunaAplica:
          type: boolean
          nullable: true
          description: >
            true = ninguna de las once condiciones aplica y puede generarse. null = sin responder,
            que bloquea con VB-07.
        condicionesDeclaradas:
          type: array
          description: >
            Códigos de las once condiciones especiales. Declarar al menos una bloquea con VB-07 y el
            mensaje cita su artículo. El art. 5.3.2.14 no pertenece a esta lista.
          items:
            type: string
            enum:
              - SERVICIO_PUBLICO_PASAJEROS_O_MIXTO
              - ASEGURADORA_POR_HURTO
              - ASEGURADORA_POR_PERDIDA_PARCIAL
              - VEHICULO_BLINDADO
              - DECISION_JUDICIAL_O_ADMINISTRATIVA
              - SUCESION
              - IMPORTACION_TEMPORAL_SUSTITUCION_IMPORTADOR
              - DECOMISO_DIAN_O_ADJUDICACION_NACION
              - COMISO_FISCALIA
              - DECLARATORIA_DE_ABANDONO
              - CARGA_PBV_SUPERIOR_10500_KG
        declaredAt: { type: string, format: date-time, nullable: true }
    StandaloneTransferLeasing:
      type: object
      description: >
        Antecedente de leasing (anexo §5.5). OBLIGATORIO en el escenario B; en el C es opcional y
        solo alimenta VB-C-01 —comparar al adquirente con el locatario histórico—. No tiene campo
        de precio: el acto del art. 5.3.2.2 es unilateral y no declara precio entre las partes del
        instrumento (VB-B-05). Los datos del locatario alimentan las cláusulas declarativas del PDF
        y NUNCA su bloque de firmas (§9.2).
      properties:
        transferenteEsEntidadFinanciera:
          type: boolean
          description: >
            Declaración de que el transferente es establecimiento bancario, compañía de
            financiamiento o de leasing. false bloquea con VB-B-01.
        noContratoLeasing: { type: string, nullable: true }
        tipoOpcionCompra:
          type: string
          nullable: true
          enum: [EJERCIDA, AUTOMATICA, TERMINACION_CONTRATO]
          description: >
            Causal de la transferencia. Con AUTOMATICA basta la copia del contrato (art. 5.3.2.2,
            Parágrafo 1.º); con las otras dos se aporta además la declaración. Fuera del catálogo,
            422 con VB-B-03.
        fechaTerminacion: { type: string, format: date, nullable: true }
        locatarioNombre: { type: string, nullable: true }
        locatarioTipoDoc: { type: string, nullable: true }
        locatarioNoDoc: { type: string, nullable: true }
    StandaloneTransferenciaRequest:
      type: object
      description: >
        Cuerpo de la generación de transferencia. escenarios es una LISTA para que VB-05 sea
        comprobable: con un escalar, «más de un escenario» sería irrepresentable. escenario se
        admite como atajo de un solo valor; si llegan los dos, se suman.
        En el ESCENARIO A y en el C viajan adquirente y negocio completo. En el ESCENARIO B viaja
        leasing, NO viaja adquirente —el locatario no es parte del instrumento— y negocio solo
        aporta ciudad y fecha de firma: cualquier campo de precio o contraprestación responde 422
        con VB-B-05.
        regimenAplicable debe venir respondido en los tres escenarios (VB-07).
      required: [vehiculo, transferente, negocio]
      properties:
        escenarios:
          type: array
          items:
            type: string
            enum: [A, B, C]
        escenario:
          type: string
          nullable: true
          enum: [A, B, C]
        vehiculo:
          $ref: "#/components/schemas/StandaloneTransferVehiculo"
        transferente:
          $ref: "#/components/schemas/StandaloneTransferParte"
        adquirente:
          $ref: "#/components/schemas/StandaloneTransferParte"
        negocio:
          $ref: "#/components/schemas/StandaloneTransferNegocio"
        gravamen:
          $ref: "#/components/schemas/StandaloneTransferGravamen"
        regimenAplicable:
          $ref: "#/components/schemas/StandaloneTransferRegimen"
        leasing:
          $ref: "#/components/schemas/StandaloneTransferLeasing"
    StandaloneTransferIssue:
      type: object
      description: >
        Código del anexo §6, campo del formulario y mensaje. El mensaje NUNCA repite el valor
        capturado: un 422 termina en logs de acceso y capturas de pantalla de soporte.
      required: [code, field, message]
      properties:
        code:
          type: string
          description: >
            VB-01 a VB-07, VB-A-01 a VB-A-10, VB-B-01 a VB-B-06 y VB-C-01 a VB-C-10 del anexo
            normativo. VB-C-07 se verifica sobre la plantilla del escenario C, no sobre el
            formulario, y por eso no viaja en esta lista.
        field: { type: string }
        message: { type: string }
    StandaloneTransferGenerateResult:
      type: object
      description: >
        Respuesta de la generación. NUNCA transporta el PDF: el binario se descarga después por
        GET /{id}/download.
      required: [id, status, advisories]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [generated, error]
        advisories:
          type: array
          description: >
            Prevalidaciones VA que la interfaz muestra como AVISO, nunca como error bloqueante.
          items:
            $ref: "#/components/schemas/StandaloneTransferIssue"
    StandaloneTransferValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [validation_failed, scenario_not_implemented]
        field:
          type: string
          nullable: true
        errors:
          type: array
          description: Todas las VB bloqueantes que fallaron, no solo la primera.
          items:
            $ref: "#/components/schemas/StandaloneTransferIssue"
    StandalonePrefillVehiculoRequest:
      type: object
      required: [placa]
      properties:
        placa:
          type: string
          minLength: 5
          maxLength: 10
          description: Placa del vehículo. Se normaliza a mayúsculas antes de consultar.
        ownerDocumentType:
          type: string
          nullable: true
          description: >
            Documento del propietario inscrito. OPCIONAL aquí, a diferencia del wizard: para
            prellenar un documento el usuario puede tener solo la placa.
        ownerDocumentNumber:
          type: string
          nullable: true
    StandalonePrefillPersonaNaturalRequest:
      type: object
      required: [documentType, documentNumber]
      properties:
        documentType:
          type: string
          enum: [CC, CE, PAS, TI]
          description: NIT no se admite aquí; una persona jurídica va por /prefill/persona-juridica.
        documentNumber:
          type: string
          minLength: 3
          maxLength: 20
    StandalonePrefillField:
      type: object
      description: >
        Un campo prellenado con su FUENTE EFECTIVA. La fuente es por campo y no por respuesta: una
        misma parte puede hidratarse de dos sitios a la vez (el nombre del RUNT y el domicilio del
        histórico de actores).
      required: [key, source]
      properties:
        key:
          type: string
          description: >
            Variable del anexo normativo (docs/plantilla-transferencia-dominio.md secciones 5.1 a
            5.3): placa, marca, linea, modelo_anio, clase_vehiculo, tipo_carroceria, color,
            no_motor, no_chasis, no_serie, servicio, organismo_transito; razon_social, tipo_doc,
            no_doc, digito_verificacion, domicilio, representante_legal, cc_rl;
            nombre_razon_social.
        value:
          type: string
          nullable: true
        source:
          type: string
          enum: [RUNT, DIRECTORIO, RUES, CONTACT_LOOKUP, CALCULADO]
    StandalonePrefillAttempt:
      type: object
      description: >
        Intento contra una fuente, en orden de precedencia. Permite ver que una fuente se cayó sin
        que eso invalide el resto de la respuesta.
      required: [source, outcome]
      properties:
        source:
          type: string
          enum: [RUNT, DIRECTORIO, RUES, CONTACT_LOOKUP, CALCULADO]
        outcome:
          type: string
          enum: [found, not_found, error]
        errorCode:
          type: string
          nullable: true
    StandalonePrefillResult:
      type: object
      description: >
        Respuesta común de los tres prellenados. NUNCA trae id de documento porque no se crea
        ninguno: el prellenado no persiste (cero filas en admin.standalone_documents) y los valores
        viajan solo hacia el formulario.
      required: [found, fields, attempts]
      properties:
        found:
          type: boolean
          description: false cuando ninguna fuente tuvo coincidencia. Sigue siendo 200.
        source:
          type: string
          nullable: true
          enum: [RUNT, DIRECTORIO, RUES, CONTACT_LOOKUP]
          description: Fuente que resolvió la identidad. null cuando no hubo coincidencia.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/StandalonePrefillField"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/StandalonePrefillAttempt"
    StandaloneDocumentListItem:
      type: object
      description: >
        Fila del historial (CF-17). Pobre en PII a propósito: no declara document_snapshot,
        rues_snapshot, storage_path ni storage_sha256, así que el listado no puede filtrarlos por
        descuido.
      required: [id, documentType, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        documentType:
          type: string
          enum: [certificado_rues, transferencia_dominio_generada]
        scenario:
          type: string
          nullable: true
          enum: [A, B, C]
          description: Escenario normativo de la transferencia; null en el Certificado RUES.
        status:
          type: string
          enum: [pending, processing, generated, error]
          description: Estado INTERNO. La interfaz colapsa pending y processing en «En proceso» (CF-21).
        errorCode:
          type: string
          nullable: true
        filename:
          type: string
          nullable: true
        companyName:
          type: string
          nullable: true
          description: Razón social de la compañía dueña del documento.
        createdByUserId: { type: string, format: uuid }
        createdByUserName:
          type: string
          nullable: true
        createdAt: { type: string, format: date-time }
    StandaloneDocumentsPagedResult:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StandaloneDocumentListItem"
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    StandaloneDocumentBatchStatus:
      type: object
      description: >
        Avance de un lote para el seguimiento in-app (CF-14). Sin nombre de archivo fuente, sin ruta
        de storage y sin nada del contenido del XLSX.
      required: [batchId, status, total, generated, errors, processed, isTerminal, createdAt]
      properties:
        batchId: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, processing, completed, partial_failure, failed]
          description: >
            La interfaz colapsa queued y processing en «En proceso» (CF-21); partial_failure es un
            RESULTADO visible del lote —con su conteo de generados y de errores—, no un fallo.
        total:
          type: integer
          minimum: 0
          maximum: 100
          description: Filas de datos declaradas por el XLSX, sin contar el encabezado.
        generated:
          type: integer
          minimum: 0
          description: Filas que llegaron a generated. Se cuentan, no se leen de la cabecera.
        errors:
          type: integer
          minimum: 0
          description: Filas que quedaron en error.
        processed:
          type: integer
          minimum: 0
          description: Filas ya materializadas (generadas + en error + en curso).
        isTerminal:
          type: boolean
          description: >
            true en completed, partial_failure y failed. Es la señal con la que el cliente DETIENE
            el polling; viaja explícita para que un estado terminal nuevo no exija una versión nueva
            del frontend.
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    StandaloneDocumentBatchItemError:
      type: object
      description: >
        Error de una fila del XLSX (CF-13): código, campo y mensaje. El mensaje NUNCA refleja el
        valor capturado que produjo el error — se nombra el campo, no su contenido.
      properties:
        code: { type: string, nullable: true }
        field: { type: string, nullable: true }
        message: { type: string, nullable: true }
    StandaloneDocumentBatchItem:
      type: object
      description: >
        Una fila del lote en el seguimiento. Proyección pobre en PII: sin snapshots y sin ruta de
        storage.
      required: [id, documentType, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        rowNumber:
          type: integer
          nullable: true
          description: Número de la fila en el XLSX (1 = primera fila de datos).
        documentType:
          type: string
          enum: [certificado_rues, transferencia_dominio_generada]
          description: >
            ATENCIÓN: en una fila cuyo tipo el usuario tecleó mal, este valor dice certificado_rues
            aunque no lo sea — los CHECK de la tabla solo admiten dos literales y no hay dónde
            guardar el tipo real. En esas filas el error verdadero está en validationErrors, y es
            eso lo que la interfaz debe mostrar.
        scenario:
          type: string
          nullable: true
          enum: [A, B, C]
        status:
          type: string
          enum: [pending, processing, generated, error]
          description: Estado INTERNO. La interfaz colapsa pending y processing en «En proceso» (CF-21).
        errorCode: { type: string, nullable: true }
        errorField: { type: string, nullable: true }
        validationErrors:
          type: array
          items:
            $ref: "#/components/schemas/StandaloneDocumentBatchItemError"
        filename: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    StandaloneDocumentBatchItemsPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StandaloneDocumentBatchItem"
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    StandaloneDocumentBatchCreated:
      type: object
      description: >
        Cabecera del lote recién encolado (o del existente, en un replay de idempotencia).
        Deliberadamente SIN nombre de archivo ni ruta de storage: el XLSX fuente contiene los datos
        completos de las partes y no se refleja en el contrato.
      required: [batchId, status, total]
      properties:
        batchId: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, processing, completed, partial_failure, failed]
          description: >
            Cuatro estados internos del lote. La interfaz colapsa queued y processing en
            «En proceso» (CF-21); partial_failure es un resultado visible, no un fallo del lote.
        total:
          type: integer
          minimum: 0
          maximum: 100
          description: Filas de datos del XLSX, sin contar el encabezado.

    StandaloneDocumentDownloadLink:
      type: object
      description: >
        Enlace presignado de vida corta. Contiene una firma HMAC: no se loguea, no se persiste y no
        se reenvía a terceros.
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    # ── Trámites · Firma a posteriori (HU #11196 / #11197) ─────────────────────
    DeferredSignatureStateResponse:
      type: object
      required: [aplica, marcado]
      properties:
        aplica:
          type: boolean
          description: "La opción debe ofrecerse: el representante no tiene firma ni identidad vigentes."
        marcado:
          type: boolean
          description: "El trámite ya está esperando la validación de identidad del representante."
        representanteNombre:
          type: string
          nullable: true
          description: "Nombre del representante declarado en el trámite, para informar a quién se espera."
        marcadoAt:
          type: string
          format: date-time
          nullable: true
    MandateSignerImpact:
      type: object
      description: >
        HU #13135 — impacto de dar de baja a un mandatario. Solo identificadores y conteos; sin datos personales.
      required: [hasImpact, onlyActiveFor, defaults, pendingProcedures]
      properties:
        hasImpact: { type: boolean }
        onlyActiveFor:
          type: array
          description: Compañías y organismos donde el mandatario es el único activo.
          items:
            type: object
            required: [transitOfficeId, companyTenantId]
            properties:
              transitOfficeId: { type: string, format: uuid }
              companyTenantId: { type: string, format: uuid }
        defaults:
          type: array
          description: Defaults que quedarían en nulo.
          items:
            type: object
            required: [kind, transitOfficeId]
            properties:
              kind: { type: string, enum: [company_rule, office] }
              transitOfficeId: { type: string, format: uuid }
              companyTenantId: { type: string, format: uuid, nullable: true }
        pendingProcedures:
          type: integer
          description: Trámites radicados sin aprobar (preasignación, asignado, entregado) que usan al mandatario.

    MandateSignerReactivation:
      type: object
      description: HU #13136 — vínculos restaurados por la reactivación y los que quedaron inactivos por conflicto.
      required: [restoredLinks, conflictLinks, restoredDefaults]
      properties:
        restoredLinks:
          type: array
          items: { $ref: "#/components/schemas/MandateSignerLink" }
        conflictLinks:
          type: array
          items: { $ref: "#/components/schemas/MandateSignerLink" }
        restoredDefaults: { type: integer }

    MandateSignerLink:
      type: object
      required: [transitOfficeId, companyTenantId]
      properties:
        transitOfficeId: { type: string, format: uuid }
        companyTenantId: { type: string, format: uuid }

    PhysicalSignatureMigrationRow:
      type: object
      description: >
        Mandatario que depende solo de la firma física ante un organismo (HU #13131). Sin documento ni correo.
      required: [mandateSignerId, fullName, transitOfficeId, transitOfficeCode, transitOfficeName, currentSignatureForm, missingData]
      properties:
        mandateSignerId: { type: string, format: uuid }
        fullName: { type: string }
        companyTenantId: { type: string, format: uuid, nullable: true }
        companyName: { type: string, nullable: true }
        transitOfficeId: { type: string, format: uuid }
        transitOfficeCode: { type: string }
        transitOfficeName: { type: string }
        currentSignatureForm:
          type: string
          enum: [firma_fisica]
        declaredSignatureMethod:
          type: string
          nullable: true
          enum: [baul, biometria]
          description: "Forma de firma declarada en la ficha; null si no la declaró."
        missingData:
          type: string
          enum: [firma_baul_o_validacion_biometrica, firma_baul, validacion_biometrica, validacion_biometrica_vigente]
    RepresentedAssociationImpactRow:
      type: object
      description: >
        Mandatario que depende de una asociación por Representante Legal (HU #13176). Sin documento de identidad
        ni ruta de firma.
      required: [companyTenantId, companyName, transitOfficeId, transitOfficeName, mandateSignerId, mandateSignerName, associatedCount, associatedNits]
      properties:
        companyTenantId: { type: string, format: uuid }
        companyName: { type: string }
        transitOfficeId: { type: string, format: uuid }
        transitOfficeName: { type: string }
        mandateSignerId: { type: string, format: uuid }
        mandateSignerName: { type: string }
        associatedCount: { type: integer }
        associatedNits:
          type: array
          items: { type: string }
    AssociableCompaniesPage:
      type: object
      description: Compañías a las que se puede asociar un mandatario (HU #13178). Solo id, nombre y NIT por elemento.
      required: [items, total, page, pageSize, aplicaSoloASuCompania]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, nit]
            properties:
              id: { type: string, format: uuid, description: "Tenant de la compañía." }
              name: { type: string }
              nit: { type: string }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        aplicaSoloASuCompania:
          type: boolean
          description: "Verdadero si la compañía que consulta no tiene red: no hay lista y el mandatario aplica solo a ella."
    MandateSignerOfficeCompanies:
      type: object
      description: >
        HU #13179 — compañías de FLIT (por tenant) a las que se asocia un mandatario en un organismo
        (`officeCompanies` del alta y la edición de mandatarios; reemplaza a `representedCompanyIds`). Lista vacía
        o ausente ⇒ el mandatario aplica solo a su propia compañía. En la edición, `officeCompanies` ausente no
        toca nada y cada organismo presente reemplaza su conjunto. Errores: 403 `compania_asociada_fuera_de_alcance`
        (el Admin de Compañía envía una que no es su hija; no se guarda nada) y 422 por elemento (propia, inactiva,
        inexistente o, para el OT, que no opera en el organismo).
      required: [transitOfficeId, associatedCompanyTenantIds]
      properties:
        transitOfficeId: { type: string, format: uuid }
        associatedCompanyTenantIds:
          type: array
          items: { type: string, format: uuid }
        associatedCompanies:
          type: array
          nullable: true
          description: >
            HU #13179b. Solo en LECTURA (se ignora al guardar): id, nombre y NIT de cada compañía asociada, para
            que el formulario del OT, del Super Admin y de la compañía las muestre sin pedirlas una a una. Solo
            esos tres datos (Ley 1581). Un id que ya no es compañía gestora queda únicamente en
            `associatedCompanyTenantIds`.
          items:
            type: object
            required: [id, name, nit]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              nit: { type: string }
    MandateSignerPrevistoResponse:
      type: object
      description: >
        HU #13145 (ADR-0066). Firmante previsto del mandato. Nunca incluye documento de identidad ni ruta de
        firma del mandatario.
      required: [estado, modo]
      properties:
        estado:
          type: string
          enum: [valido, sin_mandatario, firma_invalida, no_aplica, pendiente_organismo, pendiente_eleccion_ot]
        nombre:
          type: string
          nullable: true
          description: "Solo con `estado = valido`."
        formaFirma:
          type: string
          nullable: true
          enum: [baul, biometria]
          description: "Solo con `estado = valido`; nula en Persona jurídica y Formato en blanco."
        motivo:
          type: string
          nullable: true
          description: >
            Vocabulario estable de ADR-0066: sin_mandatario_configurado, mandatario_fuera_de_vigencia,
            mandatario_inactivo, mandatario_eliminado, sin_validacion_aprobada,
            baul_sin_firma_vigente, firma_fisica_sin_migrar (y, con `no_aplica`, mandato_sin_firmante_persona o
            mandato_personalizado_de_compania).
        modo:
          type: string
          enum: [block, warn, off]
          description: "Modo vigente de `TramiteValidations:MandatarioRequerido`."
        nivel:
          type: string
          nullable: true
          enum: [explicita, ot_para_compania, propio_de_compania, asociado_de_otra_compania, default_del_ot]
          description: >
            HU #13180. Nivel de la prelación en el que se resolvió el firmante; solo con `estado = valido`. El
            indicador «Firmará» lo usa para mostrar si viene del OT, de la compañía, de otra compañía asociada o
            del default del OT. Prelación: explícita, OT para la compañía, propio de la compañía, asociado de otra
            compañía, default del OT, bloqueo.
    MandateSignerIdentityResend:
      type: object
      description: HU #13246. Respuesta de «Reenviar validación» del mandatario.
      required: [identity]
      properties:
        identity:
          type: string
          enum: [sent, queued]
          description: "`sent` = enlace enviado al correo; `queued` = proveedor caído, la validación quedó encolada para reintento."
        validationId:
          type: string
          format: uuid
          nullable: true
    MandateIdentityAffectedRow:
      type: object
      description: HU #13247. Mandatario con biometría sin validación propia aprobada (incluye correo, PII).
      required: [mandateSignerId, fullName, transitOfficeId, transitOfficeCode, transitOfficeName, identityStatus]
      properties:
        mandateSignerId: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, nullable: true }
        companyTenantId: { type: string, format: uuid, nullable: true }
        companyName: { type: string, nullable: true }
        transitOfficeId: { type: string, format: uuid }
        transitOfficeCode: { type: string }
        transitOfficeName: { type: string }
        identityStatus: { type: string, enum: [none, pending, expired] }
    # ── Preferencias de UI ─────────────────────────────────────────────────────
    UserUiPreferenceResponse:
      type: object
      description: Shape exacto devuelto por GET y PUT /api/v1/me/ui-preferences/{scope}.
      required: [scope, value]
      properties:
        scope:
          type: string
          enum: [tramites.columns, ot.procedures.columns, tramites.scope]
        value:
          type: object
          additionalProperties: true
          description: "{} si el usuario nunca guardó una preferencia para ese scope."
    # AdminIdentityLinkResponse (HU #11176) se retiró: la ruta que lo usaba responde 410 Gone
    # desde la HU #11758 (ADR-0050).

    AdminIdentityVigenciaByDocumentResponse:
      type: object
      description: >
        HU #11751 (ADR-0050) — vigencia de identidad de UNA persona por documento, resuelta desde el
        módulo Identidad. `documentType`/`documentNumber` son los normalizados (Trim + mayúsculas
        invariantes), no necesariamente lo que se envió en la query.
      properties:
        documentType: { type: string }
        documentNumber: { type: string, description: "PII (Ley 1581)." }
        status:
          type: string
          enum: [sin_validacion, en_curso, aprobada_vigente, vencida]
        validatedAt: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
      required: [documentType, documentNumber, status]

    # ── Admin · Baúl de Firmas (HU #10643, #11175) ───────────────────────────
    SignatureVaultResponse:
      type: object
      description: "Metadatos de una firma del baúl (sin material criptográfico, ADR-0025 §3)."
      properties:
        id: { type: string, format: uuid }
        documentType: { type: string }
        documentNumber: { type: string, description: "PII (Ley 1581)." }
        nitEmpresa: { type: string, nullable: true, description: "Deprecado (HU #10930)." }
        fullName: { type: string }
        signatureHash: { type: string }
        storagePath: { type: string }
        storageSha256: { type: string }
        estado: { type: string, enum: [activa, revocada] }
        vigenciaDesde: { type: string, format: date }
        vigenciaHasta: { type: string, format: date }
        mandateSignerId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
        codigoHash: { type: string, nullable: true }
      required: [id, documentType, documentNumber, fullName, signatureHash, storagePath, storageSha256, estado, vigenciaDesde, vigenciaHasta, createdAt]

    UpdateSignatureVaultRequest:
      type: object
      description: >
        Corrección de los datos capturados de una firma ACTIVA. NO admite cambiar el documento (identifica
        a la persona dueña de la firma) ni el artefacto (lo ya emitido se estampó con esa imagen, así que
        sustituirla en sitio invalidaría en silencio documentos ya firmados): para eso se registra una
        firma nueva de la persona, que revoca la anterior y la conserva como histórico.
      properties:
        fullName: { type: string }
        codigoHash: { type: string, nullable: true, maxLength: 100 }
        vigenciaDesde: { type: string, format: date }
        vigenciaHasta: { type: string, format: date }
      required: [fullName, vigenciaDesde, vigenciaHasta]

    CreateSignatureVaultRequest:
      type: object
      properties:
        documentType: { type: string, maxLength: 20 }
        documentNumber: { type: string, maxLength: 30, description: "PII (Ley 1581)." }
        nitEmpresa: { type: string, maxLength: 50, nullable: true, description: "Deprecado (HU #10930): ya no es obligatorio." }
        fullName: { type: string, maxLength: 200 }
        vigenciaDesde: { type: string, format: date }
        vigenciaHasta: { type: string, format: date }
        artefactoFirmaBase64: { type: string, description: "PNG de la firma en base64." }
        codigoHash: { type: string, nullable: true, maxLength: 100 }
        mandateSignerId: { type: string, format: uuid, nullable: true }
      required: [documentType, documentNumber, fullName, vigenciaDesde, vigenciaHasta, artefactoFirmaBase64]

    # ── Admin · Representantes Legales (HU #10901, #11175, #11177) ──────────
    LegalRepresentativeCompanySummaryResponse:
      type: object
      description: >
        Resumen de una compañía representada en la respuesta de listado/detalle de un representante
        legal (HU #10932, #11177). El campo `isPrimary` identifica explícitamente la compañía
        principal; exactamente una compañía en la lista viene con `isPrimary: true`. La lista se
        devuelve siempre con la principal primero, seguida del resto ordenadas por fecha de
        asociación ascendente (orden estable entre consultas). No inferir la principal de campos
        denormalizados deprecados.
      properties:
        id: { type: string, format: uuid }
        nit: { type: string, description: "NIT de la compañía representada (PII)." }
        name: { type: string }
        isPrimary:
          type: boolean
          description: >
            HU #11177 — true si esta es la compañía principal del representante. Exactamente una
            compañía por representante viene con isPrimary: true.
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        deeds:
          type: array
          description: "Historial de escrituras (solo en el detalle; vacío en el listado)."
          items: { type: object }
      required: [id, nit, name, isPrimary]

    LegalRepresentativeCompanyInput:
      type: object
      properties:
        nit: { type: string, maxLength: 20, description: "NIT de la compañía representada (PII)." }
        name: { type: string, maxLength: 200 }
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        phone: { type: string, nullable: true }
      required: [nit, name]

    LegalRepresentativeWriteRequest:
      type: object
      description: >
        Cuerpo de alta/edición de un representante legal. Si se indica signatureVaultId, el
        sistema valida la firma contra la tenencia, el documento del representante, el estado
        activo y la vigencia antes de persistirla (HU #11175, AC3/AC4). Si no se indica, el
        sistema resuelve la firma automáticamente (AC5).
      properties:
        companyNit: { type: string, nullable: true, description: "NIT de la compañía (compatibilidad). Alternativa a companies[]." }
        companyName: { type: string, nullable: true }
        companyEmail: { type: string, nullable: true }
        companyAddress: { type: string, nullable: true }
        companyCity: { type: string, nullable: true }
        companyPhone: { type: string, nullable: true }
        documentType: { type: string }
        documentNumber: { type: string, description: "PII (Ley 1581)." }
        firstLastName: { type: string }
        secondLastName: { type: string, nullable: true }
        name: { type: string }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        procedureTypeIds:
          type: array
          items: { type: string, format: uuid }
          nullable: true
        companies:
          type: array
          items:
            $ref: "#/components/schemas/LegalRepresentativeCompanyInput"
          nullable: true
          description: "Lista de compañías del representante (HU #10932). Si viene, reemplaza companyNit/companyName."
        signatureVaultId:
          type: string
          format: uuid
          nullable: true
          description: >
            Id de la firma del baúl elegida explícitamente (HU #11175, AC3). Opcional.
            Si se omite, el sistema resuelve la firma automáticamente (AC5).
      required: [documentType, documentNumber, firstLastName, name]

    # ── Trámites · Configurador dinámico (FEATURE-08 / CFD-01) ────────────────
    ProcedureTypeSummaryF08:
      type: object
      description: Resumen de tipo publicado para el selector de operador (CFD-12, §6.1).
      required: [id, code, name, family, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: TRASPASO_SIMPLE }
        name: { type: string, example: Traspaso Simple }
        family: { type: string, example: traspaso }
        description:
          type: string
          nullable: true
          description: >
            Copy configurado en el tipo de trámite para mostrarse en el WIZARD (HU #12124).
            `null` si el tipo no tiene descripción configurada.
          example: Traspaso simple entre personas naturales sin gravámenes.
        version: { type: integer, example: 1 }
    ProcedureConformationProfile:
      type: object
      description: >
        Perfil de conformación completo del tipo de trámite (§6.3 plan F08).
        `gateProfile` y `conformationRules` se materializan en HU-BE-01;
        `sources` (HU-BE-03) y `documentRequirements` (HU-BE-04) llegan como
        listas vacías hasta esas HUs — la clave siempre está presente.
      required: [procedureTypeId, code, publicationStatus, version, gateProfile, conformationRules, sources, documentRequirements]
      properties:
        procedureTypeId: { type: string, format: uuid }
        code: { type: string, example: MATRICULA_NUEVA }
        publicationStatus: { type: string, enum: [draft, published, archived] }
        version: { type: integer, example: 1 }
        gateProfile:
          type: object
          additionalProperties: true
          description: >
            Flags de conformación del tipo (ver DDL comment de
            `tramites.procedure_types.gate_profile`): entryMode, requiresBuyer,
            biometricActors, simitMode, y las capacidades declaradas de ADR-0051
            (sellerCapturedViaForm, signatureActors, generatesSaleDocument,
            hasAppraisalBlock). Objeto JSON abierto.
        conformationRules:
          type: array
          items:
            type: object
            required: [entityCode, validationProfile]
            properties:
              entityCode: { type: string, example: BUYER }
              validationProfile:
                type: object
                additionalProperties: true
        sources:
          type: array
          items:
            type: object
            required: [sourceCode, executionOrder, config]
            properties:
              sourceCode: { type: string, example: RUNT }
              executionOrder: { type: integer, example: 1 }
              config:
                type: object
                additionalProperties: true
        documentRequirements:
          type: array
          items:
            type: object
            required: [documentTypeCode, isRequired, isDummy]
            properties:
              documentTypeCode: { type: string, example: CEDULA }
              isRequired: { type: boolean }
              isDummy: { type: boolean }
              conditionGroup: { type: string, nullable: true }
    ProcedureConformationProfileInput:
      type: object
      description: >
        Cuerpo del PUT de perfil de conformación. HU-BE-01 persiste `gateProfile`;
        HU-BE-02 valida `entryMode` (PLATE/VIN/BOTH → 400 si es inválido) y las
        banderas de validación inicial. HUs BE-04/05 amplían el objeto.
      properties:
        gateProfile:
          type: object
          additionalProperties: true
          description: >
            Flags de conformación del tipo (objeto JSON abierto). Campos de HU-BE-02:
            `entryMode` (PLATE|VIN|BOTH), `validateCompanyRule`, `validateOtOperability`,
            `validateDuplicateProcedure` (bool). Ver el comentario DDL de
            `tramites.procedure_types.gate_profile` para el esquema completo.
          properties:
            entryMode:
              type: string
              enum: [PLATE, VIN, BOTH]
            validateCompanyRule: { type: boolean }
            validateOtOperability: { type: boolean }
            validateDuplicateProcedure: { type: boolean }
            requiresPlateRequest:
              type: boolean
              description: >
                HU-BE-05 / CFD-08. Si es true, el wizard incluye el paso `plate_request`
                (activación condicional en HU-BE-06).
            improntaSource:
              type: string
              enum: [AUTO, MANUAL, OPERATOR_CHOICE]
              nullable: true
              description: >
                Cómo se obtiene la impronta en este tipo. Independiente de si el documento
                es obligatorio en la matriz. Ausente o AUTO/OPERATOR_CHOICE: se puede generar.
                MANUAL: solo carga de archivo.
            sellerCapturedViaForm:
              type: boolean
              description: >
                ADR-0051. Separa "hay parte vendedora en el FUR" (`requiresSeller`) de "esa parte
                se captura tecleando datos en el wizard". Ausente equivale a true (todo tipo que
                exige vendedor lo captura por formulario), que es el comportamiento previo a la
                llave. En TRASPASO_UNILATERAL es false: el propietario existe y firma, pero no
                pasa por el wizard — se sincroniza desde RUES/RUNT con el documento del paso 1.
            signatureActors:
              type: array
              description: >
                ADR-0051. Roles que firman el FUR, en el vocabulario de catálogo de
                `biometricActors`. Ausente o vacío equivale al comportamiento previo:
                [OWNER, BUYER] si el tipo exige vendedor, [BUYER] si no.
              items:
                type: string
                enum: [OWNER, BUYER, LESSEE]
            generatesSaleDocument:
              type: boolean
              nullable: true
              description: >
                ADR-0051. El expediente autogenera compraventa (ADR-0035). `null`/ausente NO es
                false: significa "lo que diga `requiresSeller` + familia TRASPASO", el
                comportamiento previo. TRASPASO_UNILATERAL lo declara false — el locatario ya
                tenía el vehículo por el contrato de leasing.
            hasAppraisalBlock:
              type: boolean
              nullable: true
              description: >
                ADR-0051. El FUR imprime bloque de avalúo comercial. Misma semántica de `null`
                que `generatesSaleDocument`.
        sources:
          type: array
          description: >
            Fuentes externas por tipo (HU-BE-03 / CFD-04). Se resuelven por `sourceCode`
            (RUNT, SIMIT, …); código inexistente → 422. `config` lleva p. ej. `simitMode`.
          items:
            type: object
            required: [sourceCode, executionOrder]
            properties:
              sourceCode: { type: string, example: RUNT }
              executionOrder: { type: integer, example: 1 }
              config:
                type: object
                additionalProperties: true
        conformationRules:
          type: array
          description: >
            Actores del tipo con su `validationProfile` (HU-BE-03 / CFD-05, incluye LESSEE).
            Se resuelven por `entityCode`; código inexistente → 422.
          items:
            type: object
            required: [entityCode]
            properties:
              entityCode: { type: string, example: LESSEE }
              validationProfile:
                type: object
                additionalProperties: true
              isActive: { type: boolean }
              sortOrder: { type: integer }
        documentRequirements:
          type: array
          description: >
            Documentos requeridos por tipo (HU-BE-04 / CFD-06). Se resuelven por
            `documentTypeCode`; código inexistente → 422. `isDummy` no bloquea el paso.
            Los flags `requiresCommercialValue`/`commercialValueSource`/`requiresBiometrics`/
            `biometricActors`/`requiresSignature` viajan dentro de `gateProfile`.
          items:
            type: object
            required: [documentTypeCode]
            properties:
              documentTypeCode: { type: string, example: CEDULA }
              isRequired: { type: boolean }
              isDummy: { type: boolean }
              conditionGroup: { type: string, nullable: true }
              sortOrder: { type: integer }
    # ── Trámites · Documentos (HU #10520, RNF01) ──────────────────────────────
    ConsolidadoEntregaResponse:
      type: object
      description: >
        HU #12785 — resultado de la ruta de entrega del consolidado. Misma forma que el resultado de
        generación (GenerarConsolidadoResult) más dos campos opcionales nuevos.
      required: [document, regenerado]
      properties:
        document:
          type: object
          required: [attachmentId, tipo, filename, sha256]
          properties:
            attachmentId: { type: string, format: uuid }
            tipo: { type: string, enum: [consolidado, consolidado_maestro] }
            filename: { type: string }
            sha256: { type: string }
        regenerado:
          type: boolean
          description: true si el PDF se reconstruyó en esta petición.
        incompleto: { type: boolean }
        documentosFaltantes:
          type: array
          nullable: true
          items: { type: string }
        avisosCascada:
          type: array
          nullable: true
          items: { type: string }
        definitivoPorEstadoFinal:
          type: boolean
          default: false
          description: >
            true si el trámite está en estado final (aprobado/anulado/revocado): el PDF es la
            documentación definitiva y no se regenera. Las rutas POST de generación lo devuelven en false.
        modo:
          type: string
          nullable: true
          enum: [vigente, regenerado, definitivo_estado_final, migrado_solo_lectura, cargado_por_usuario, solo_lectura, radicado_fijo]
          description: >
            Cómo se resolvió la entrega. Las rutas POST de generación lo devuelven en null, salvo el POST
            OT de consolidado maestro cuando el maestro ya se radicó ante Quipux: ahí devuelve
            radicado_fijo (el adjunto radicado, sin regenerar) o solo_lectura (el adjunto radicado ya no
            existe y se sirve el maestro existente). radicado_fijo (HU #12787, aditivo): radicación vigente
            (registrado/aprobado); un rechazo de Quipux deja de fijar el maestro.
    AdjuntoBloqueadoFlitoProblem:
      type: object
      description: >
        HU #13265 — 409 cuando el gestor intenta subir, pedir presign o registrar un adjunto de un tipo que FLITO ya
        cargó (`provider = flito`). Mismo formato de error que `adjunto_protegido`.
      properties:
        title: { type: string, example: Conflict }
        status: { type: integer, example: 409 }
        detail: { type: string, example: "Este documento ya fue cargado y no se puede reemplazar." }
        error:
          type: string
          enum: [adjunto_bloqueado_flito]
          description: Solo presente cuando el bloqueo es por el adjunto de FLITO (con `not_draft` solo viene detail).

    AttachmentDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, example: factura }
        filename: { type: string }
        mimetype: { type: string, example: application/pdf }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string }
        source: { type: string, example: user }
        uploadedAt: { type: string, format: date-time }
    PresignAttachmentRequest:
      type: object
      required: [tipo, filename, mimetype, sizeBytes]
      properties:
        tipo: { type: string, example: factura }
        filename: { type: string }
        mimetype: { type: string, example: application/pdf }
        sizeBytes: { type: integer, format: int64 }
    RegisterAttachmentRequest:
      type: object
      required: [tipo, filename, mimetype, sizeBytes, sha256, storagePath]
      properties:
        tipo: { type: string, example: factura }
        filename: { type: string }
        mimetype: { type: string, example: application/pdf }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string }
        storagePath: { type: string }
    ChecklistItemDto:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        obligatorio: { type: boolean }
        satisfied: { type: boolean }
        docTipo: { type: string, nullable: true }
        maxSizeBytes:
          type: integer
          format: int64
          nullable: true
          description: Tamaño máximo por tipo (RF09). null ⇒ usar el límite global.
        mimeTypesAllowed:
          type: array
          nullable: true
          items: { type: string }
          description: Formatos MIME permitidos por tipo (RF08). null/vacío ⇒ formatos globales.
        instruccionCargue:
          type: string
          nullable: true
          description: >
            Instrucción de cargue del catálogo (HU #12066): qué debe subir el gestor en esta
            casilla. Sale de `document_types.upload_instructions`, que administra el módulo
            documental. null ⇒ el tipo no tiene texto configurado y la tarjeta no lo muestra.
    ChecklistResponse:
