        password:
          type: string
          format: password
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    CompanyListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        nit: { type: string }
        razonSocial: { type: string }
        code: { type: string, description: "Código único del tenant (inmutable). Consecutivo COMP-XXXX asignado por el servidor (HU #13605)." }
        tenantType:
          type: string
          enum: [RENTING, CONCESIONARIO, FLIT, CONCESION, MARCA_BLANCA]
          description: >-
            Tipo de compañía del catálogo B2B. La migración RestrictTenantTypeCatalog
            normalizó los tipos heredados (p.ej. standard, transit_office) a RENTING y
            agregó el CHECK ck_tenants_tenant_type. HU #12406 amplía el catálogo con los
            dos tipos de CABEZA de grupo (CONCESION | MARCA_BLANCA): la clase de la cabeza
            es su tipo de compañía y la BD acopla is_group_parent a él.
        parentTenantId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Cabeza de red (Concesión o Marca Blanca) de la que cuelga; null si no es cliente
            hijo. El tipo de una hija de red no se puede cambiar mientras esté vinculada (422
            en tenantType).
        isTransitOffice:
          type: boolean
          description: >-
            true si el tenant es Organismo de Tránsito (existe en
            admin.transit_office_profiles). Fuente de verdad OT; tenantType solo no basta
            porque los OT también usan RENTING.
        estadoActivo: { type: boolean }
        fechaCreacion: { type: string, format: date-time }
        rowVersion:
          type: integer
          format: int64
          description: >-
            Token de concurrencia optimista (identity.tenants.row_version). Se reenvía en
            UpdateCompanyRequest para detectar ediciones concurrentes (409).
      required: [id, nit, razonSocial, code, tenantType, isTransitOffice, estadoActivo, fechaCreacion, rowVersion]

    CompanyPagedResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CompanyListItem"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    CreateCompanyRequest:
      type: object
      properties:
        razonSocial:
          type: string
          maxLength: 255
          pattern: "^(?=.*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9](?:[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9\\s]|[.,&()/'°-](?![.,&()/'°-]))*$"
          description: >-
            Razón social (legal_name). Solo letras, números, espacios y puntuación básica
            de nombres (. , & ( ) / ' ° -).
        nit:
          type: string
          maxLength: 20
          pattern: "^(?=.*[0-9])[0-9.\\-]+$"
          description: NIT (tax_id). Solo dígitos, puntos y guiones.
        tenantType:
          type: string
          enum: [RENTING, CONCESIONARIO, FLIT, CONCESION, MARCA_BLANCA]
          description: >-
            CONCESION y MARCA_BLANCA (HU #12406) crean una cabeza de grupo: la fila nace con
            is_group_parent = true en la misma operación.
        estadoActivo: { type: boolean, default: true, description: Estado activo inicial. }
      required: [razonSocial, nit, tenantType]
      description: >-
        Alta de compañía (también de compañía hija). HU #13605: el cliente ya no envía el código; lo asigna el
        servidor (consecutivo COMP-XXXX) y llega en la respuesta. Un "code" enviado se ignora.

    UpdateCompanyRequest:
      type: object
      description: Edición de compañía. El código es inmutable, por lo que no se incluye.
      properties:
        razonSocial:
          type: string
          maxLength: 255
          pattern: "^(?=.*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9](?:[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9\\s]|[.,&()/'°-](?![.,&()/'°-]))*$"
          description: >-
            Razón social (legal_name). Solo letras, números, espacios y puntuación básica
            de nombres (. , & ( ) / ' ° -).
        nit:
          type: string
          maxLength: 20
          pattern: "^(?=.*[0-9])[0-9.\\-]+$"
          description: NIT (tax_id). Solo dígitos, puntos y guiones.
        tenantType:
          type: string
          description: >-
            Tipo de compañía. Para cambiarlo debe ser del catálogo B2B (RENTING,
            CONCESIONARIO, FLIT, CONCESION, MARCA_BLANCA). Si coincide (ignorando mayúsculas)
            con el tipo actual del tenant se preserva tal cual, lo que permite editar tenants
            con tipos heredados (p.ej. standard, transit_office) sin alterar su tipo.
            HU #12406: entrar en CONCESION | MARCA_BLANCA marca la cabeza (is_group_parent)
            y salir de ellos la desmarca, en la misma operación; el cambio de tipo queda
            auditado (admin.tenant_config_audit_logs, valor anterior y nuevo). Si la cabeza
            tiene compañías hijas vinculadas, cambiar su tipo devuelve 422 con error en
            tenantType (la clase es inmutable mientras tenga hijos).
        estadoActivo: { type: boolean, default: true, description: Estado activo. }
        rowVersion:
          type: integer
          format: int64
          description: >-
            Versión de fila leída al abrir la edición. Opcional: si se envía y no coincide
            con la actual del tenant, la edición se rechaza con 409 (lost update).
      required: [razonSocial, nit, tenantType]

    SetCompanyStatusRequest:
      type: object
      properties:
        estadoActivo:
          type: boolean
          description: "true activa la compañía; false la desactiva (identity.tenants.is_active)."
      required: [estadoActivo]

