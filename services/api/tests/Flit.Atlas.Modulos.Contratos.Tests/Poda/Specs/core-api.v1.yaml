              schema:
                type: string
                format: binary
        "400":
          description: Rango inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin token válido.
        "403":
          description: "`network_scope_required`, `network_role_required` (cabeza sin rol AdminCompany, HU #12652) o `network_child_out_of_scope`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/network-access-audit/mine:
    get:
      operationId: tramitesNetworkAccessAuditMine
      tags: [Tramites, Red]
      summary: Quién de la cabeza de red accedió a los datos de mi cliente (cliente hijo)
      description: >
        HU #12361 — el cliente HIJO consulta la auditoría del acceso consolidado sobre SUS datos
        (`tramites.network_access_audit`): cada listado, estadística, detalle o descarga de una cabeza de
        red que alcanzó alguno de sus trámites, con el usuario, la cabeza, el recurso, el instante y el
        resultado (incluidos los intentos rechazados). El tenant sale del token (ruta runtime tenant-scoped),
        nunca del header. Solo identificadores: ninguna respuesta lleva placa, documento ni nombre.
        Paginación acotada en servidor (`take` máximo 200). Un SuperAdmin sin `X-Tenant-Id` responde 403
        `tenant_required` (usa `/api/v1/admin/platform/network-access-audit`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NetworkAccessAuditFrom"
        - $ref: "#/components/parameters/NetworkAccessAuditTo"
        - $ref: "#/components/parameters/NetworkAccessAuditResource"
        - $ref: "#/components/parameters/NetworkAccessAuditPage"
        - $ref: "#/components/parameters/NetworkAccessAuditTake"
      responses:
        "200":
          description: Página de accesos consolidados sobre los datos del cliente autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkAccessAuditPage"
        "401":
          description: Sin token válido.
        "403":
          description: "`tenant_required`: la petición no tiene un cliente resuelto."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/actors:
    get:
      operationId: tramitesGetActors
      tags: [Tramites, Actores]
      summary: Actores guardados de un trámite, incluidos los propietarios agregados (Múltiple Propietario)
      description: >
        Devuelve TODOS los actores persistidos por lado (vendedor/comprador/locatario), ordenados por
        `ordinal` ascendente dentro de cada `rol` (ADR-0053, Propuesto). `ordinal=1` es el actor
        PRINCIPAL/solidario: el que existía antes de Múltiple Propietario (siembra del paso 1, consulta
        RUNT automática, no se elimina). `ordinal` 2..4 son propietarios AGREGADOS. `porcentaje` es
        `null` cuando el lado tiene un solo actor (sin cambios respecto al contrato anterior); desde el
        segundo actor de un lado, TODOS los actores de ese lado traen `porcentaje` no nulo y la suma de
        ese lado es exactamente 100.00.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Actores del trámite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorsResponse"
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El trámite no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: tramitesPutActors
      tags: [Tramites, Actores]
      summary: Guarda los actores de uno o varios roles del trámite (upsert por rol; Múltiple Propietario)
      description: >
        Upsert INCREMENTAL por `rol` (comprador/vendedor/locatario): reemplaza TODOS los actores del/de
        los `rol(es)` presentes en el body por el conjunto enviado para ese rol; los roles ausentes del
        body se conservan intactos (sin cambios respecto al contrato anterior). Dentro de un mismo
        `rol`, `ordinal` identifica a cada propietario (1 = principal/solidario, 2..4 = agregados) y NO
        se reasigna entre PUTs: reenviar un `ordinal` ya guardado lo ACTUALIZA, omitirlo lo ELIMINA (y
        redistribuye su porcentaje según reglas de UI, no de contrato), y un `ordinal` nuevo lo CREA.
        `ordinal=1` no puede faltar en un PUT que incluya su `rol` (el actor principal no se elimina).
        Cada actor del conjunto —principal y agregados por igual— pasa por la MISMA validación de forma
        y el MISMO disparo de identidad/RUES/RUNT que antes solo corría para el actor único de cada rol
        (ver ADR-0053, notas operativas). Reglas de porcentaje (autoritativas en backend, independientes
        de cualquier cálculo del frontend):
          - 1 actor en el rol → `porcentaje` debe venir `null` (si viene con valor, se ignora).
          - ≥2 actores en el rol → la suma de `porcentaje` EFECTIVA del lado (actores del request +
            actores conservados de ese rol que no vinieron en el request) debe ser EXACTAMENTE 100.00 y
            ningún actor puede traer `porcentaje <= 0`.
          - Documento duplicado dentro del MISMO lado se rechaza SIEMPRE (`actor_duplicado_mismo_lado`).
          - La regla `vendedor ≠ comprador` (`partes_duplicadas`) solo se evalúa cuando el conjunto
            efectivo deja EXACTAMENTE 1 actor en cada lado (comportamiento idéntico al contrato
            anterior). Con 2+ actores en cualquiera de los dos lados, esa comprobación cruzada se omite
            a propósito: un mismo documento puede aparecer como vendedor y como comprador (copropietario
            que concurre a la venta y a la vez compra una cuota adicional). Ver ADR-0053.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutActorsRequest"
      responses:
        "200":
          description: Actores guardados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorsResponse"
        "400":
          description: Datos inválidos (documento, email, rol, tipo de documento, header ausente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El trámite no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            `not_draft` | `rol_not_allowed` | `partes_duplicadas` | `actor_duplicado_mismo_lado` |
            `porcentajes_no_suman_100` | `porcentaje_en_cero` | `ordinal_fuera_de_rango` |
            `ordinal_principal_ausente` | `locatario_igual_al_propietario`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: entity_catalog_missing — el catálogo de procedure_entities no está seedeado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/actors/contact-lookup:
    get:
      operationId: actorContactLookup
      tags: [Tramites, Actores]
      summary: Lookup de datos de CONTACTO ya conocidos de una persona (HU #10955, AC2/AC3/AC4/AC5)
      description: >
        Precarga ciudad, correo, dirección y teléfono del registro MÁS RECIENTE (por fecha de
        creación) de esa persona (`tipoDocumento` + `numeroDocumento`) entre los actores de CUALQUIER
        trámite del tenant. NUNCA devuelve nombre ni documento — esos siempre se obtienen del RUNT en
        vivo (AC1, `POST /instances/{id}/runt-person`), que dejó de reutilizar consultas previas
        aunque exista `PersonDataConsent` registrado (revierte parcialmente la HU #10878/ADR-0031,
        ver ADR-0031 actualizado). Sin gate de consentimiento (AC4): el contacto no es una consulta a
        un tercero, es un dato que la propia compañía ya capturó de esa persona. Sin antecedentes
        (persona nunca ha sido actor de un trámite del tenant) responde 200 con los cuatro campos en
        `null`, NUNCA 404 (AC3). Aislado por tenant: el tenant se resuelve del JWT vía
        `TenantEnforcementMiddleware`, no del `X-Tenant-Id` crudo del cliente (AC5).
      security:
        - bearerAuth: []
      parameters:
        - name: tipoDocumento
          in: query
          required: true
          schema: { type: string, enum: [CC, CE, NIT, PAS, TI] }
          description: Tipo de documento de la persona a consultar.
        - name: numeroDocumento
          in: query
          required: true
          schema: { type: string }
          description: Número de documento de la persona a consultar.
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
          description: >
            Compañía a consultar. Para un usuario de compañía, el middleware lo sobrescribe con el
            tenant del JWT (no puede leer el contacto de otra compañía cambiando este header).
      responses:
        "200":
          description: Datos de contacto conocidos (o los cuatro campos en null si no hay antecedentes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorContactLookupResponse"
        "400":
          description: Falta el header X-Tenant-Id, o tipoDocumento/numeroDocumento inválidos o ausentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).

  /api/v1/tramites/biometric-validations:
    post:
      operationId: iniciarPrevalidacionIdentidad
      tags: [Tramites, Identidad, Prevalidacion]
      summary: Crear prevalidación de identidad standalone (sin trámite) — HU #10866, CF-01
      description: >
        Crea una validación biométrica de identidad sin trámite asociado (prevalidación standalone).
        Hace upsert de la entidad persona en el tenant por (documentType, documentNumber) y luego
        inicia la validación con el proveedor activo (Kyverum → captureUrl real; mock → magic-link).
        Para persona jurídica (personType='juridical'), el sujeto que valida biométricamente es el
        representante legal (legalRep*). Requiere X-Tenant-Id.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IniciarPrevalidacionRequest"
      responses:
        "201":
          description: Prevalidación creada. captureUrl listo para compartir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IniciarPrevalidacionResult"
        "202":
          description: Encolado (fallo transitorio del proveedor). Worker reintentará el envío.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IniciarPrevalidacionResult"
        "400":
          description: Datos inválidos o incompletos.
        "409":
          description: Ya existe una prevalidación activa o en proceso para este documento.
        "422":
          description: >
            prevalidacion_solo_natural (CF-01/D1, Feature #11004, ADR-0036) — la prevalidación standalone
            solo admite persona natural; la validación de personas jurídicas se realiza dentro de un
            trámite. Se rechaza server-side aunque el body envíe personType=juridical directo a la API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: El proveedor rechazó la solicitud (error definitivo).
        "503":
          description: El proveedor no está disponible (error transitorio).
    get:
      operationId: listTenantBiometricValidations
      tags: [Tramites, Identidad]
      summary: Listar las validaciones de identidad del tenant (HU #10234, filtros HU #10347)
      description: >
        Vista transversal del submódulo "Validaciones de Identidad": lista TODAS las validaciones
        biométricas/de identidad del tenant (a través de todas sus instancias no eliminadas), las más
        recientes primero, junto con KPIs agregados por estado. No es por-instancia. La tabla se acota a
        un máximo de filas (vista de monitoreo); los KPIs se calculan aparte y son exactos. Con filtros
        activos, filas y KPIs reflejan el mismo subconjunto filtrado (antes del cap de 500 filas). El
        motivo de rechazo viaja SANITIZADO (sin PII), igual que en la vista por-instancia. Filtrar por
        estado=expirado incluye validaciones con estado persistido expirado y las que tienen el flag
        expired calculado (no aprobada y ExpiresAt &lt; now).
      security:
        - bearerAuth: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: referenceNumber
          in: query
          required: false
          description: Coincidencia parcial (case-insensitive) sobre el número de referencia del trámite.
          schema: { type: string, maxLength: 100 }
        - name: modalidad
          in: query
          required: false
          description: Coincidencia parcial (case-insensitive) sobre la modalidad del trámite.
          schema: { type: string }
        - name: name
          in: query
          required: false
          description: Coincidencia parcial (case-insensitive) sobre el nombre de la persona validada.
          schema: { type: string, maxLength: 100 }
        - name: partyRole
          in: query
          required: false
          description: Filtro exacto por parte (comprador | vendedor). Los VALORES siguen en español.
          schema: { type: string, enum: [comprador, vendedor] }
        - name: documentType
          in: query
          required: false
          description: Filtro exacto por tipo de documento (p.ej. CC, CE).
          schema: { type: string, maxLength: 100 }
        - name: documentNumber
          in: query
          required: false
          description: Coincidencia parcial por número de documento (sin exponer PII en errores).
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          required: false
          description: >
            Filtro por estado. Valores (en español): enviado, en_proceso, aprobado, rechazado, expirado. El
            valor expirado incluye estado persistido y validaciones vencidas no aprobadas (flag expired).
          schema:
            type: string
            enum: [enviado, en_proceso, aprobado, rechazado, expirado, pendiente_envio, error_envio]
        - name: provider
          in: query
          required: false
          description: Filtro exacto por proveedor (mock | kyverum).
          schema: { type: string, enum: [mock, kyverum] }
        - name: scoreMin
          in: query
          required: false
          description: Score mínimo inclusive (solo filas con score informado).
          schema: { type: integer, minimum: 0 }
        - name: scoreMax
          in: query
          required: false
          description: Score máximo inclusive (solo filas con score informado).
          schema: { type: integer, minimum: 0 }
        - name: createdFrom
          in: query
          required: false
          description: Fecha/hora mínima inclusive de creación (ISO-8601).
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          required: false
          description: Fecha/hora máxima inclusive de creación (ISO-8601).
          schema: { type: string, format: date-time }
        - name: motivoRechazo
          in: query
          required: false
          description: >
            Coincidencia parcial case-insensitive en el motivo de rechazo sanitizado (solo filas
            rechazadas; busca en Detalle y ProviderPayload).
          schema: { type: string, maxLength: 100 }
        - name: vigenciaEstado
          in: query
          required: false
          description: >
            Filtro por estado de vigencia de la identidad APROBADA: vigente | por_vencer (≤ 7 días) | vencida.
          schema: { type: string, enum: [vigente, por_vencer, vencida] }
        - name: expiraDesde
          in: query
          required: false
          description: Fin de vigencia (validUntil) mínimo inclusive, ISO-8601 (HU #10350).
          schema: { type: string, format: date-time }
        - name: expiraHasta
          in: query
          required: false
          description: Fin de vigencia (validUntil) máximo inclusive, ISO-8601 (HU #10350).
          schema: { type: string, format: date-time }
        - name: venceEnDias
          in: query
          required: false
          description: >
            "Vence en ≤ N días": identidades vigentes cuya vigencia se agota dentro de N días calendario.
          schema: { type: integer, minimum: 0 }
        - name: page
          in: query
          required: false
          description: Página (1-based). Por defecto 1; valores < 1 se normalizan a 1.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          description: Filas por página. El cliente elige de 10 en 10 hasta 50; fuera de rango se acota.
          schema: { type: integer, minimum: 10, maximum: 50, default: 20 }
        - name: standalone
          in: query
          required: false
          description: >
            HU #10867 / CF-02 (Feature #11004): true = solo prevalidaciones standalone (sin trámite,
            instanceId=null); false = solo validaciones ligadas a un trámite; omitido = todas (comportamiento
            actual del submódulo Validaciones — CF-03, no cambia).
          schema: { type: boolean }
      responses:
        "200":
          description: Validaciones del tenant + KPIs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantBiometricValidationsResponse"
        "400":
          description: >
            Falta el header X-Tenant-Id, parámetros de filtro inválidos (estado/provider/parte fuera de
            catálogo, scoreMin &gt; scoreMax, createdFrom &gt; createdTo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/biometric-validations/by-person:
    get:
      operationId: listTenantBiometricPersons
      tags: [Tramites, Identidad]
      summary: Listar identidades agrupadas por persona (HU #11270, ADR-0040)
      description: >
        Endpoint PROPIO de la vista agrupada: una fila por (tenant, documento Trim+Upper) con el estado
        de la validación más reciente, contador y peor alerta. No altera GET /biometric-validations
        (Dashboard y Prevalidaciones). Los KPI (`stats`) siguen contando VALIDACIONES. Filtros de
        semántica de validación (referenceNumber, modalidad, partyRole, provider, score, motivoRechazo)
        no aplican.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: name
          in: query
          schema: { type: string }
        - name: documentType
          in: query
          schema: { type: string }
        - name: documentNumber
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: createdFrom
          in: query
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          schema: { type: string, format: date-time }
        - name: vigenciaEstado
          in: query
          schema: { type: string, enum: [vigente, por_vencer, vencida] }
        - name: expiraDesde
          in: query
          schema: { type: string, format: date-time }
        - name: expiraHasta
          in: query
          schema: { type: string, format: date-time }
        - name: venceEnDias
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 10, maximum: 50, default: 20 }
        - name: standalone
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Personas del tenant + KPIs de validaciones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantBiometricPersonsResponse"
        "400":
          description: Falta X-Tenant-Id o parámetros inválidos.

  /api/v1/tramites/biometric-validations/by-person/detail:
    get:
      operationId: listPersonBiometricValidations
      tags: [Tramites, Identidad]
      summary: Historial multi-validación de una persona (HU #11272, CF-06, ADR-0040)
      description: >
        Devuelve hasta 50 validaciones del documento normalizado (más reciente primero) con trámites
        vinculados. `allTerminal` indica si el polling del detalle puede detenerse.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: documentType
          in: query
          required: true
          schema: { type: string }
        - name: documentNumber
          in: query
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Historial de la persona.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonBiometricValidationsResponse"
        "400":
          description: Falta X-Tenant-Id o documentType/documentNumber.
        "404":
          description: Sin validaciones para ese documento.

  /api/v1/tramites/biometric-validations/manual:
    get:
      operationId: listManualIdentityValidations
      tags: [Tramites, Identidad]
      summary: Validaciones de identidad manuales de todas las compañías (HU #13296, Épica #13202)
      description: >
        Solo Super Admin (403 al resto, 401 anónimo). Lista las validaciones con proveedor `manual`
        (estados manual_activo, pendiente_revision_manual, aprobado con origen manual, rechazado, expirado)
        de todas las compañías. Orden: pendientes de revisión primero, los más antiguos arriba.
        `waitingMinutes` mide SOLO la revisión (desde que el cliente envió la captura) y es null en cualquier
        otro estado. `origin`: tramite, prevalidacion, mandatario o
        representante_legal (este último aún no lo produce ninguna fila).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 10, maximum: 100, default: 20 }
        - name: status
          in: query
          schema:
            type: string
            enum: [manual_activo, pendiente_revision_manual, aprobado, rechazado, expirado]
        - name: origin
          in: query
          schema:
            type: string
            enum: [tramite, prevalidacion, mandatario, representante_legal]
        - name: q
          in: query
          description: Texto en nombre o número de documento (máx. 100 caracteres).
          schema: { type: string }
      responses:
        "200":
          description: Página de validaciones manuales.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, fullName, documentNumber, tenantName, origin, status]
                      properties:
                        id: { type: string, format: uuid }
                        fullName: { type: string }
                        documentNumber: { type: string }
                        tenantName: { type: string }
                        origin:
                          type: string
                          enum: [tramite, prevalidacion, mandatario, representante_legal]
                        status:
                          type: string
                          enum: [manual_activo, pendiente_revision_manual, aprobado, rechazado, expirado]
                        activatedAt: { type: string, format: date-time, nullable: true }
                        waitingMinutes: { type: integer, nullable: true, description: Minutos en revisión; solo con estado pendiente_revision_manual (null en los demás). }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        "400":
          description: Estado u origen inválido.
        "401":
          description: Sin autenticación.
        "403":
          description: El usuario no es Super Admin (code super_admin_required).

  /api/v1/tramites/biometric-validations/{id}:
    get:
      operationId: getPrevalidacionDetail
      tags: [Tramites, Identidad, Prevalidacion]
      summary: Detalle de una validación de identidad por id (tenant-scoped) — CF-06, Feature #11004
      description: >
        Devuelve el estado actual de UNA validación (standalone o de trámite) para poll de detalle.
        Mismo DTO que usa el listado por-instancia (BiometricValidationDto): estado, intentos, enlace de
        captura vigente, vigencia. Reemplaza la necesidad de un instanceId para prevalidaciones standalone.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Detalle de la validación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricValidationDto"
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o pertenece a otro tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: editarPrevalidacionIdentidad
      tags: [Tramites, Identidad, Prevalidacion]
      summary: Editar los datos de contacto de una prevalidación standalone — HU #10943, CF-03
      description: >
        Edita nombre/correo (titular) y nombre/correo del representante legal (persona jurídica) de una
        prevalidación STANDALONE (procedureInstanceId=null y personId≠null). El tipo/número de documento
        (titular o RL) NUNCA es editable (D7). Un cambio de correo (case-insensitive/trim) dispara el
        reenvío automático en la misma transacción, con nuevo enlace y TTL de 24 h (D8); editar solo el
        nombre no reenvía. El cambio de correo consume cupo de reenvíos igual que el reenvío manual (D10).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditarPrevalidacionRequest"
      responses:
        "200":
          description: Prevalidación actualizada (y reenviada si cambió el correo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditarPrevalidacionResult"
        "400":
          description: Falta el header X-Tenant-Id o el cuerpo de la solicitud.
        "403":
          description: no_editable — la validación pertenece a un trámite (solo lectura en este módulo).
        "404":
          description: Prevalidación no encontrada.
        "409":
          description: >
            identidad_aprobada (la identidad ya está aprobada, vigente o vencida) o
            referenciada_por_tramite (defensa en profundidad, D11).
        "422":
          description: documento_no_editable — el tipo/número de documento no es editable (D7).
        "429":
          description: reenvio_en_cooldown o tope_reenvios (D10).
        "502":
          description: proveedor_error — el proveedor rechazó el reenvío (error definitivo).
        "503":
          description: proveedor_no_disponible — el proveedor no está disponible (error transitorio).

  /api/v1/tramites/biometric-validations/{id}/resend:
    post:
      operationId: reenviarPrevalidacionIdentidad
      tags: [Tramites, Identidad, Prevalidacion]
      summary: Reenviar manualmente la validación de identidad de una prevalidación standalone — HU #10943, CF-03
      description: >
        Reenvía la validación de identidad sobre el MISMO registro (sin crear otro): nuevo token/enlace,
        TTL de 24 h, intentos y sondeos de reconciliación reiniciados a 0 (D8). Solo aplica a prevalidaciones
        STANDALONE; bloqueado si el estado es `aprobado` (D9) o si se agotó el tope de 3 reenvíos / no ha
        pasado el cooldown de 5 minutos (D10).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reenvío completado (enviado/en_proceso).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReenviarPrevalidacionResult"
        "202":
          description: Encolado (fallo transitorio del proveedor). El reenvío ya consumió cupo del tope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReenviarPrevalidacionResult"
        "400":
          description: Falta el header X-Tenant-Id.
        "403":
          description: no_editable — la validación pertenece a un trámite (solo lectura en este módulo).
        "404":
          description: Prevalidación no encontrada.
        "409":
          description: >
            identidad_aprobada (la identidad ya está aprobada, vigente o vencida) o
            referenciada_por_tramite (defensa en profundidad, D11).
        "429":
          description: reenvio_en_cooldown o tope_reenvios (D10).
        "502":
          description: proveedor_error — el proveedor rechazó el reenvío (error definitivo).
        "503":
          description: proveedor_no_disponible — el proveedor no está disponible (error transitorio).

  /api/v1/tramites/biometric-validations/{id}/activate-manual:
    post:
      operationId: activarIdentidadManual
      tags: [Tramites, Identidad]
      summary: Activar el flujo manual de identidad (solo Super Admin) — HU #13284, Épica #13202
      description: >
        Activa el flujo manual sobre una validación de trámite, de prevalidación standalone, de mandatario o de
        representante legal (HU #13285: mismo endpoint por id; no hay rutas propias, las de admin están retiradas) que NO esté
        aprobada y vigente (rechazada, expirada, vencida o en curso sí). La misma fila pasa a proveedor
        `manual` y estado `manual_activo`, con un enlace de captura de 24 h cuyo token se guarda solo como
        hash. Si había una verificación Kyverum en curso queda cancelada para FLIT (se audita; el id de
        Kyverum se conserva solo en la bitácora). Solo Super Admin; opera sobre cualquier compañía (el
        tenant sale de la fila, NO se usa X-Tenant-Id). El token en claro NO viaja en la respuesta: el
        backend lo entrega por correo al titular (HU #13287); si el correo no sale (titular sin correo o fallo
        del proveedor) la activación NO se revierte y la respuesta trae `emailEnviado: false`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Flujo manual activado; estado resultante (sin token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivarIdentidadManualResult"
        "401":
          description: Sin sesión.
        "403":
          description: El usuario no es Super Admin.
        "404":
          description: Validación de identidad no encontrada.
        "409":
          description: >
            identidad_aprobada_vigente (la identidad ya vale) o tramite_inactivo (trámite anulado o
            revocado: la validación se conserva).

  /api/v1/tramites/biometric-validations/{id}/regenerate-manual-link:
    post:
      operationId: regenerarEnlaceManual
      tags: [Tramites, Identidad]
      summary: Regenerar el enlace de captura manual (solo Super Admin) — HU #13287, Épica #13202
      description: >
        Emite un enlace de captura NUEVO de 24 h (token guardado solo como hash SHA-256) para una validación que espera
        captura: `manual_activo`, o `rechazado` tras una revisión manual (HU #13299; sigue `rechazado`); el enlace anterior deja de funcionar (la búsqueda por hash ya no lo encuentra, así que el
        público recibe 404; no se distingue «reemplazado» de «inválido» y el front lo cubre con «enlace inválido o
        reemplazado»). Envía el correo al titular y audita `manual_enlace_regenerado`. Si el correo no sale la
        regeneración NO se revierte: `emailEnviado` es false y se audita `manual_correo_fallido`. Solo Super Admin;
        el tenant sale de la fila (NO se usa X-Tenant-Id). El token en claro NO viaja en la respuesta.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Enlace regenerado; estado resultante (sin token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenerarEnlaceManualResult"
        "401":
          description: Sin sesión.
        "403":
          description: El usuario no es Super Admin.
        "404":
          description: Validación de identidad no encontrada.
        "409":
          description: "flujo_manual_no_activo (la validación no espera captura: ni manual_activo ni rechazado con motivo)."
  /api/v1/tramites/biometric-validations/{id}/vencer:
    post:
      operationId: vencerIdentidad
      tags: [Tramites, Identidad]
      summary: Vencer una identidad aprobada y vigente (solo Super Admin) — HU #13824, Épica #13817
      description: >
        Termina AHORA la vigencia de una validación de identidad aprobada y vigente (trámite o prevalidación standalone):
        `validUntil` pasa a ser el instante del vencimiento; la fila, el certificado y el estado `aprobado` se conservan.
        Los trámites EN BORRADOR que usaban esa identidad quedan sin firmar para esa persona (deben revalidar para radicar);
        los trámites que ya NO están en borrador conservan su firma hasta el fin de vigencia que la identidad tenía antes.
        En el mismo paso abre una validación NUEVA en el trámite en borrador más reciente que usaba la identidad (se identifica
        por el documento del sujeto: el actor, o su representante legal) y la envía con el mismo inicio de validación del
        trámite (Kyverum o mock); `enlaceCaptura` trae el enlace para copiar. Sin borradores que la usen, vence igual y no
        envía nada (`enlaceEnviado` false, `motivoSinEnlace` = `sin_borradores`). Si el inicio de la validación nueva falla
        (`validacion_en_curso`, `proveedor_error`, `proveedor_no_disponible`, `datos_incompletos`, `actor_requerido`…) la
        identidad queda vencida de todos modos y el motivo viaja en `motivoSinEnlace`. Si el proveedor estaba caído y la
        validación quedó encolada, `enCola` es true y aún no hay enlace. Queda en el tracking del trámite
        (`vencimiento_identidad_admin`) y en la bitácora técnica de identidad (`vencida_admin`, correo y documento
        enmascarados). Solo Super Admin (rol + permiso `identidad.validaciones.vencer`, que ningún rol de compañía trae); el
        tenant sale de la fila (NO se usa X-Tenant-Id).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Identidad vencida; trae el resultado del envío de la validación nueva (si la hubo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VencerIdentidadResult"
        "401":
          description: Sin sesión.
        "403":
          description: El usuario no es Super Admin (rol de compañía, aunque tenga el permiso asignado).
        "404":
          description: Validación de identidad no encontrada.
        "409":
          description: "no_aprobada_vigente — «Esta validación no está aprobada y vigente. No hay nada que vencer.»"
        "422":
          description: "fuera_de_alcance — la identidad de un mandatario no se vence desde este módulo."
  /api/v1/tramites/biometric-validations/{id}/manual-detail:
    get:
      operationId: getManualIdentityValidationDetail
      tags: [Tramites, Identidad]
      summary: Detalle de una validación manual (solo Super Admin) — HU #13297, Épica #13202
      description: >
        Detalle de una validación del flujo manual de CUALQUIER compañía (el tenant sale de la fila). Solo Super Admin
        (403 al resto, 401 anónimo). Trae el `ManualListItem` más la constancia de consentimiento (solo la del ciclo actual),
        el estado de las 4 imágenes (`images[].available`, solo con captura del ciclo ACTUAL: pendiente de revisión o
        aprobada manualmente), la revisión (`reviewedAt`, `reviewedBy` con el nombre visible del revisor,
        `rejectionReasonCode`) y `linkExpiresAt` (solo cuando se espera captura: `manual_activo` o `rechazado` con motivo). Tras un rechazo (HU #13299)
        el estado es `rechazado` con `rejectionReasonCode`, las imágenes rechazadas siguen disponibles hasta que llegue la
        captura nueva y `linkExpiresAt` es el vencimiento del enlace nuevo; con `manual_activo` (activación del Super Admin)
        las imágenes de un ciclo anterior no se muestran (todas `available: false`). Sin captura aún tampoco hay imágenes. Nunca expone rutas de storage ni la
        IP del consentimiento. Cada consulta queda auditada (`manual_imagenes_consultadas`, `recurso=detalle`).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Detalle de la validación manual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualDetail"
        "401":
          description: Sin sesión.
        "403":
          description: El usuario no es Super Admin (code super_admin_required).
        "404":
          description: Validación inexistente o que no es del flujo manual (code not_found).

  /api/v1/tramites/biometric-validations/{id}/manual-images/{kind}:
    get:
      operationId: getManualIdentityValidationImage
      tags: [Tramites, Identidad]
      summary: Imagen de la captura manual (solo Super Admin) — HU #13297, Épica #13202
      description: >
        Entrega los bytes de una imagen del ciclo ACTUAL desde el almacenamiento, con su Content-Type real (detectado por
        el contenido) y `Cache-Control: no-store`. Es el único acceso: no hay URL pública ni firmada ni ruta de storage.
        Solo Super Admin (403 al resto, 401 anónimo); el JWT viaja en la cabecera Authorization. `kind` ∈ `rostro`,
        `anverso`, `reverso`, `firma`; 404 si el kind es otro, la validación no existe o no es manual, o esa imagen no
        existe en el ciclo actual (p. ej. `manual_activo` tras una reactivación del Super Admin). Cada entrega queda auditada
        (`manual_imagenes_consultadas`, `recurso=imagen:<kind>`, sin rutas ni PII).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [rostro, anverso, reverso, firma]
      responses:
        "200":
          description: Contenido de la imagen.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "401":
          description: Sin sesión.
        "403":
          description: El usuario no es Super Admin (code super_admin_required).
        "404":
          description: Kind inválido, validación inexistente o sin esa imagen en el ciclo actual (code not_found).

  /api/v1/tramites/biometric-validations/{id}/manual-approve:
    post:
      operationId: approveManualIdentityValidation
      tags: [Tramites, Identidad]
      summary: Aprobar una validación manual (solo Super Admin) — HU #13298, Épica #13202
      description: >
        Aprueba una validación en `pendiente_revision_manual` por el MISMO camino que una aprobación de Kyverum: llama a
        `Approve` (validatedAt = ahora, validUntil = +30 días, siempre) y encola el evento de completado de identidad, que
        encadena firma/FUR/sello de los trámites pendientes de esa persona. El gate de radicación y el reuso por
        tenant+documento no cambian: leen la validación aprobada y vigente. Deja `approval_origin = manual`, `reviewed_by` y
        `reviewed_at`, y audita `manual_aprobado` (sin PII ni rutas). Solo Super Admin (401 anónimo, 403 al resto); el tenant sale
        de la fila (NO se usa X-Tenant-Id).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Validación aprobada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AprobarValidacionManualResult"
        "401":
          description: Sin sesión.
        "403":
          description: El usuario no es Super Admin (code super_admin_required).
        "404":
          description: Validación inexistente (code not_found).
        "409":
          description: "`estado_invalido` (no está en pendiente_revision_manual) o `tramite_inactivo` (trámite anulado o revocado)."
  /api/v1/tramites/biometric-validations/manual-rejection-reasons:
    get:
      operationId: listManualRejectionReasons
      tags: [Tramites, Identidad]
      summary: Catálogo de motivos de rechazo manual (solo Super Admin) — HU #13299, Épica #13202
      description: >
        Lista cerrada de motivos homologados con su etiqueta en español (la misma que lleva el correo al cliente). Una sola
        constante en código; el front la usa para el selector del rechazo. Solo Super Admin (401 anónimo, 403 al resto).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Motivos de rechazo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualRejectionReason"
        "401":
          description: Sin sesión.
        "403":
          description: El usuario no es Super Admin (code super_admin_required).
  /api/v1/tramites/biometric-validations/{id}/manual-reject:
    post:
      operationId: rejectManualIdentityValidation
      tags: [Tramites, Identidad]
      summary: Rechazar una validación manual con motivo homologado (solo Super Admin) — HU #13299, Épica #13202
      description: >
        Rechaza una validación en `pendiente_revision_manual` con un `reasonCode` de la lista cerrada: registra
        `rejection_reason_code`, `reviewed_by` y `reviewed_at`, y en la misma operación emite un enlace nuevo de 24 h (solo su hash
        SHA-256 se guarda) y envía al cliente un correo con el motivo en texto legible y el enlace nuevo (sin datos sensibles).
        **Tras rechazar la fila queda en `rechazado`** (visible como Rechazada; NO vuelve a `manual_activo`) con
        `rejectionReasonCode` no nulo; con el enlace nuevo el cliente repite la captura estando `rechazado` y la captura nueva pasa
        a `pendiente_revision_manual` limpiando el motivo y la revisión (que se conservan hasta entonces). Sin tope de intentos. Audita `manual_rechazado` (usuario y código, sin texto libre). Si
        el correo no sale el rechazo NO se revierte: `emailEnviado` es false y se audita `manual_correo_fallido`. Un motivo ausente o
        fuera de la lista responde 400 `motivo_invalido` y no cambia nada (el contrato de la Épica fija 400; la HU decía 422).
        Solo Super Admin (401 anónimo, 403 al resto).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RechazarValidacionManualRequest"
      responses:
        "200":
          description: Rechazo registrado; la captura queda reactivada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechazarValidacionManualResult"
        "400":
          description: "`motivo_invalido` — motivo ausente o fuera de la lista."
        "401":
          description: Sin sesión.
        "403":
          description: El usuario no es Super Admin (code super_admin_required).
        "404":
          description: Validación inexistente (code not_found).
        "409":
          description: "`estado_invalido` (no está en pendiente_revision_manual) o `tramite_inactivo` (trámite anulado o revocado)."

  /api/v1/public/manual-capture/{token}:
    get:
      operationId: getPublicManualCapture
      tags: [Público · Identidad manual]
      summary: Sesión de captura manual por token — HU #13289, Épica #13202
      description: >
        Datos para la pantalla de captura del cliente. Público: el token (256 bits; en BD solo su hash SHA-256) es
        la credencial; sin Authorization ni X-Tenant-Id. Solo si la validación es del proveedor `manual` y está en
        `manual_activo` o `rechazado` con motivo (repetición tras un rechazo, HU #13299). Un token vacío, desconocido, regenerado o de otro proveedor responde 404 sin revelar si
        existió. Solo lectura. Límite de tasa por IP (policy manual-capture, 429 sin cuerpo). Errores `{ code, message }`.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sesión vigente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureView" }
        "404":
          description: "`not_found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "409":
          description: "`estado_invalido` — ya enviada, aprobada o fuera de espera de captura; una rechazada con enlace vigente SÍ admite captura (o trámite anulado/revocado)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "410":
          description: "`expirada` — el enlace superó sus 24 h."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "429":
          description: Límite de tasa por IP excedido (policy manual-capture). Sin cuerpo.

  /api/v1/public/manual-capture/{token}/consent:
    post:
      operationId: acceptPublicManualCaptureConsent
      tags: [Público · Identidad manual]
      summary: Constancia del consentimiento biométrico de la captura manual — HU #13289, Épica #13202
      description: >
        Guarda fecha y hora del servidor, IP del cliente (la resuelve el servidor: primer hop de X-Forwarded-For o la
        conexión; nunca el cuerpo) y la versión del texto aceptado, SOBRESCRIBIENDO la constancia de un ciclo manual
        previo. Audita `manual_consentimiento` sin PII ni IP en el mensaje. La versión vigente sale de
        `consentTextVersion` de la vista.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepted, textVersion]
              properties:
                accepted: { type: boolean, description: Debe ser true. }
                textVersion: { type: string, description: Versión del texto aceptado (la de `consentTextVersion`). }
      responses:
        "204":
          description: Consentimiento registrado.
        "400":
          description: "`consentimiento_no_aceptado` (accepted distinto de true) o `version_texto_invalida`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "404":
          description: "`not_found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "409":
          description: "`estado_invalido`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "410":
          description: "`expirada`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "429":
          description: Límite de tasa por IP excedido (policy manual-capture). Sin cuerpo.

  /api/v1/public/manual-capture/{token}/submit:
    post:
      operationId: submitPublicManualCapture
      tags: [Público · Identidad manual]
      summary: Envía rostro, anverso, reverso y firma de la captura manual — HU #13290, Épica #13202
      description: >
        Un solo POST final `multipart/form-data` con 4 archivos: `rostro`, `anverso`, `reverso` (JPEG, PNG o WebP) y
        `firma` (PNG). El tipo se valida por CONTENIDO (magic bytes), no por Content-Type ni extensión. Máximo 5 MiB por
        foto y 2 MiB la firma (413 `archivo_demasiado_grande`). Exige la sesión vigente y el consentimiento del ciclo
        actual (`consent_at >= manual_activated_at`; 409 `consentimiento_requerido`). Las imágenes se guardan con el
        storage de adjuntos bajo la clave del id de la validación y un nombre con sufijo UTC del intento; las de un
        intento previo NO se sobrescriben ni se borran (sus rutas quedan en la auditoría). Si algo falla no se guarda nada.
        Pasa a `pendiente_revision_manual` y el enlace queda consumido (un segundo envío responde 409 `estado_invalido`).
        Audita `manual_captura_recibida` (SHA-256 de cada imagen, sin contenido ni PII).
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [rostro, anverso, reverso, firma]
              properties:
                rostro: { type: string, format: binary, description: "Selfie (JPEG, PNG o WebP; máx. 5 MiB)." }
                anverso: { type: string, format: binary, description: "Anverso del documento (JPEG, PNG o WebP; máx. 5 MiB)." }
                reverso: { type: string, format: binary, description: "Reverso del documento (JPEG, PNG o WebP; máx. 5 MiB)." }
                firma: { type: string, format: binary, description: "Firma trazada (PNG; máx. 2 MiB)." }
      responses:
        "200":
          description: Captura recibida; la validación queda pendiente de revisión.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [pendiente_revision_manual] }
        "404":
          description: "`not_found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "409":
          description: "`estado_invalido` (ya enviada, aprobada o fuera de espera de captura; una rechazada con enlace vigente SÍ admite captura) o `consentimiento_requerido`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "410":
          description: "`expirada`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "413":
          description: "`archivo_demasiado_grande` — una imagen supera su máximo."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "415":
          description: "`tipo_no_soportado` — el contenido no es JPEG/PNG/WebP (la firma, PNG)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "422":
          description: "`firma_requerida` (la firma es obligatoria) o `archivo_requerido` (falta rostro, anverso o reverso)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualCaptureError" }
        "429":
          description: Límite de tasa por IP excedido (policy manual-capture). Sin cuerpo.

  /api/v1/tramites/biometric-validations/{validationId}/audit:
    get:
      operationId: getIdentityAuditByValidation
      tags: [Tramites, Identidad]
      summary: Bitácora de una validación de identidad, sin depender de instancia — CF-07, Feature #11004
      description: >
        Equivalente a GET /instances/{id}/biometric/{validationId}/audit pero SIN instanceId: sirve tanto
        para prevalidaciones standalone como de trámite. Autorización: cualquier usuario autenticado del
        tenant (D2, ADR-0036 — no restringido a SuperAdmin). Respuesta saneada, sin secretos ni PII cruda
        (mismo criterio que el endpoint por-instancia).
      security:
        - bearerAuth: []
      parameters:
        - name: validationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Bitácora de la validación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAuditResponse"
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o pertenece a otro tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/identity-validation/stuck:
    get:
      operationId: listStuckIdentityValidations
      tags: [Tramites, Identidad]
      summary: Eventos de validación de identidad atascados (dead-letter) (HU #10349 fase 2)
      description: >
        Observabilidad operativa del encadenamiento async de identidad (patrón outbox). Lista los eventos
        `completed` del tenant que quedaron ATASCADOS: pendientes (no despachados) que agotaron los
        reintentos del worker (`attempts >= maxDeliveryAttempts`) y, por lo tanto, NO se reintentan más.
        Útil para detectar trámites cuyo auto-flujo (firma/FUR) quedó trabado. Recuperación operativa:
        reencolar poniendo `attempts = 0` en la fila (el worker la retomará). Sin PII (no expone el payload).
      security:
        - bearerAuth: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Eventos atascados + total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StuckIdentityValidationsResponse"
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/identity-validation/stuck/{id}/requeue:
    post:
      operationId: requeueStuckIdentityValidation
      tags: [Tramites, Identidad]
      summary: Reencolar ("desatascar") un evento de identidad atascado (HU #10349 fase 2)
      description: >
        Reinicia los intentos de un evento ATASCADO (dead-letter) para que el worker lo vuelva a procesar
        en el próximo ciclo. Idempotente. 404 si no hay un evento atascado con ese id para el tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id del evento en la outbox (identity_validation_outbox.id).
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Evento reencolado; el worker lo retomará en el próximo ciclo.
          content:
            application/json:
              schema:
                type: object
                required: [requeued]
                properties:
                  requeued: { type: boolean, example: true }
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No hay un evento atascado con ese id para el tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/identity-validation/stuck/requeue-all:
    post:
      operationId: requeueAllStuckIdentityValidations
      tags: [Tramites, Identidad]
      summary: Reencolar TODOS los eventos de identidad atascados del tenant (HU #10349 fase 2)
      description: >
        Reinicia los intentos de todos los eventos ATASCADOS (dead-letter) del tenant de una vez para que
        el worker los vuelva a procesar. Idempotente. Devuelve cuántos se reencolaron.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cantidad de eventos reencolados.
          content:
            application/json:
              schema:
                type: object
                required: [requeued]
                properties:
                  requeued: { type: integer, example: 3 }
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/wizard:
    get:
      operationId: getProcedureInstanceWizardState
      tags: [Tramites]
      summary: Estado del asistente (wizard) del trámite
      description: >
        Pasos, capacidades y banderas con las que el asistente pinta el trámite. Este contrato documenta
        de forma PARCIAL el objeto `WizardStateDto` (camelCase): solo las banderas de prenda/gravamen que
        consume el aviso del paso de prenda (HU #13776, Feature #13110). El resto de propiedades existe y se
        acepta sin declarar (`additionalProperties`).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador de la instancia (procedure_instance_id).
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Estado del asistente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardState"
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La instancia no existe para el tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/finalize-draft:
    post:
      operationId: finalizeDraftProcedureInstance
      tags: [Tramites]
      summary: Finalizar borrador del trámite (HU #10349)
      description: >
        Marca un borrador como "finalizado": valida que la captura de datos esté completa (actores de la
        modalidad, documentos obligatorios y organismo de tránsito) PERO **no** exige validación de
        identidad ni FUR. La instancia permanece en estado `draft` y se sella `draftFinalizedAt`, quedando
        a la espera de la validación de identidad asíncrona del cliente (fase 2). Idempotente: si el
        borrador ya estaba finalizado, devuelve el resumen actual sin re-sellar. La radicación real
        (`submit`, Draft→Submitted) sigue exigiendo identidad + FUR + reglas OT.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador de la instancia (procedure_instance_id).
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Borrador finalizado; `draftFinalizedAt` sellado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureInstanceSummary"
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La instancia no existe para el tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            La instancia no está en `draft` (`not_draft`) o faltan datos para finalizar
            (`actores_incompletos`, `documentos_incompletos`, `organismo_requerido`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/prenda:
    put:
      operationId: registrarProcedureInstancePrenda
      tags: [Tramites]
      summary: Registrar/versionar la decisión de prenda del trámite (R4/R10/R17, ADR-0055)
      description: >
        No estaba documentado hasta ahora (brecha preexistente, cerrada en HU #12129/ADR-0055).
        Registra la decisión de prenda (gravamen) vigente del trámite: `solicitar`/`registrar`
        (constituye), `levantar` (levanta), `omitir` (Omitir prenda: el gravamen sigue vigente en el
        RUNT; no se inscribe ni se levanta) o `sin_prenda` (declara ausencia de gravamen). `omitir` se
        admite en todo tipo con dimensión de prenda, sin depender de la familia ni de la política del
        organismo sobre el certificado de prenda (HU #13777).
        Cancelación de matrícula no tiene dimensión de gravamen (`prenda_no_admitida_en_tipo`). Con `omitir`, `acreedorNombre`,
        `acreedorDocumento` y `levantamientoEntidad` se ignoran y se devuelven null. Versionado por reemplazo: si ya hay una decisión
        vigente de la MISMA familia (`constitucion`=solicitar/registrar, `levantamiento`=levantar), se
        marca `reemplazada` y esta queda como la nueva vigente (R17, HU #10599).

        **Captura dual (ADR-0055, HU #12129).** En `PRENDA_INSCRIPCION`/`LEVANTAMIENTO_PRENDA` este
        endpoint admite hasta DOS llamadas idempotentes, una por familia: si ya hay vigente una
        decisión de la familia CONTRARIA (p. ej. una constitución vigente y esta llamada registra un
        levantamiento), esa otra familia NO se toca — ambas quedan vigentes a la vez, cada una con su
        propio acreedor/documento. En cualquier otro tipo (Matrícula, Traspaso) la decisión sigue
        siendo EXCLUYENTE: a lo sumo una vigente por instancia, sin importar la familia — un segundo
        hecho vigente para estos tipos se rechaza explícitamente
        (`prenda_segunda_decision_no_admitida`), no solo por el índice de BD.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador de la instancia (procedure_instance_id).
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarPrendaInput"
      responses:
        "200":
          description: Decisión de prenda registrada/versionada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrendaDto"
        "400":
          description: Falta X-Tenant-Id o `decision` no es una de `solicitar|registrar|levantar|omitir|sin_prenda`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La instancia no existe para el tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            `prenda_no_admitida_en_tipo` (el tipo no tiene dimensión de gravamen, ADR-0050),
            `estado_final` (trámite en estado final, R17) o `prenda_segunda_decision_no_admitida`
            (Matrícula/Traspaso: ya hay una vigente y el tipo no admite la acción complementaria,
            ADR-0055).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getProcedureInstancePrenda
      tags: [Tramites]
      summary: Listar las decisiones de prenda VIGENTES del trámite (ADR-0055)
      description: >
        No estaba documentado hasta ahora (brecha preexistente, cerrada en HU #12129/ADR-0055).
        Devuelve un ARRAY de 0 a 2 elementos (una por familia `constitucion`/`levantamiento`) — antes
        de HU #12128/#12129 el modelo solo admitía una fila vigente por instancia y este endpoint
        devolvía un objeto nullable; con la captura dual el shape pasa a array. Matrícula/Traspaso
        siguen devolviendo, en la práctica, 0 o 1 elemento (no admiten la acción complementaria).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador de la instancia (procedure_instance_id).
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 0, 1 o 2 decisiones vigentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrendaDto"
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/identity/ensure:
    post:
      operationId: ensureProcedureInstanceIdentity
      tags: [Tramites, Identidad]
      summary: Asegurar la identidad vigente de una parte (HU #10350)
      description: >
        Al guardar una parte (comprador/vendedor) el sistema asegura su validación de identidad sin
        esperar un clic manual: si la persona (tipoDoc+documento) tiene una validación APROBADA y VIGENTE
        (≤30 días calendario desde la aprobación; el día de aprobación es el día 1 y vence el día 31) en
        cualquier trámite del tenant, la reutiliza clonándola a este trámite (hereda la fecha de
        aprobación → conserva el mismo vencimiento). Si no hay vigente, responde `requiere_validacion`
        para que el cliente sea enviado a validar automáticamente. Idempotente.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parte]
              properties:
                parte:
                  type: string
                  enum: [comprador, vendedor]
                documento:
                  type: string
                  nullable: true
                  description: >
                    ADR-0053 (Múltiple Propietario) — documento del SUJETO de identidad (persona
                    natural: el propio actor; persona jurídica: su representante legal) al que se
                    refiere el aseguramiento, cuando `parte` tiene 2..4 actores. Opcional/aditivo: con
                    1 solo actor en el rol (caso mayoritario, contrato anterior a este ADR) se ignora.
      responses:
        "200":
          description: Desenlace de la verificación de identidad de la parte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnsureIdentityResult"
        "400":
          description: parte inválida o falta X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Instancia no encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/biometric:
    post:
      operationId: iniciarProcedureInstanceBiometric
      tags: [Tramites, Identidad]
      summary: Iniciar validación de identidad de una parte (HU #10233)
      description: >
        Inicia la validación biométrica/de identidad de una parte del trámite. El proveedor depende del
        flag de configuración `Biometrics:Provider`: con `mock` devuelve un magic-link (flujo de 3 fotos);
        con `kyverum` delega la captura a Kyverum Verify y devuelve la `captureUrl` (la validación queda
        `en_proceso` hasta que Kyverum notifique vía webhook). Requiere instancia en estado `draft`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IniciarBiometriaInput"
      responses:
        "201":
          description: >
            Validación creada. El cuerpo varía según el proveedor: `IniciarKyverumVerifyResult`
            (kyverum) o el resultado del magic-link (mock).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IniciarKyverumVerifyResult"
        "202":
          description: >
            El envío al proveedor falló de forma transitoria y quedó ENCOLADO para reintento automático
            (la validación está en `pendiente_envio`, `queued=true`, aún sin `captureUrl`). Un worker
            provider-agnostic reintenta el envío y la pasa a `en_proceso`, o a `error_envio` si agota intentos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IniciarKyverumVerifyResult"
        "400":
          description: Datos incompletos o parte inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La instancia no está en draft o ya existe una validación activa para la parte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: El proveedor de identidad rechazó la solicitud (error definitivo, AC7).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: El proveedor de identidad no está disponible (transitorio, AC7).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listProcedureInstanceBiometric
      tags: [Tramites, Identidad]
      summary: Lista las validaciones de identidad de un trámite (vista del gestor)
      description: >
        Devuelve todas las validaciones biométricas del trámite (propias + identidad REFERENCIADA de
        otro trámite del tenant, HU #10350), con la prevalencia de Bug #11615 ya aplicada. No estaba
        documentado en el contrato hasta ahora (brecha preexistente, no introducida por ADR-0053); se
        añade junto con la ampliación de Múltiple Propietario porque `firmaBaulActores` (nuevo) y
        `ordinal` de `BiometricValidationDto` son parte directa de ese cierre.

        ADR-0053 (Múltiple Propietario) — con 2..4 actores por rol, `validations` trae una fila por
        cada actor con identidad en curso (no solo el principal), cada una con su `ordinal`. Con 1 solo
        actor por lado (caso mayoritario) el comportamiento es idéntico al anterior a este ADR.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Validaciones del trámite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricValidationsResponse"
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El trámite no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/ocr/{tipo}:
    post:
      operationId: analyzeTramiteDocumentOcr
      tags: [Tramites]
      summary: OCR semántico de un documento de trámite
      description: >
        Analiza un documento (factura, aduana, impronta o soat) con un modelo de visión ANTES de subirlo
        al expediente. Es stateless: no asocia el documento a ninguna instancia ni persiste el resultado.
        Con `Ocr:Provider = mock` devuelve datos de ejemplo; con `anthropic` llama a la Anthropic Messages
        API. Si el documento ocupa sólo un subconjunto de páginas de un PDF multi-documento, la respuesta
        incluye `extractedPdfBase64` con el PDF recortado para subir al expediente sólo lo relevante.
      security:
        - bearerAuth: []
      parameters:
        - name: tipo
          in: path
          required: true
          description: Tipo de documento a analizar.
          schema:
            type: string
            enum: [factura, aduana, impronta, soat]
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Documento a analizar (PDF, JPG o PNG). Máximo 10 MB.
      responses:
        "200":
          description: Análisis correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOcrResponse"
        "400":
          description: >
            Tipo no soportado, archivo ausente o vacío, archivo mayor a 10 MB, o formato no PDF/JPG/PNG.
            También si falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: No se pudo extraer datos del documento (respuesta del modelo no interpretable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >
            El servicio de lectura automática no está disponible (proveedor caído, timeout o sin API key).
            El operador puede adjuntar el documento manualmente y continuar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/biometric/simulate:
    post:
      operationId: simulateProcedureInstanceBiometric
      tags: [Tramites, Identidad]
      summary: Simular la validación biométrica de una parte (mock de esta iteración)
      description: >
        Endpoint SOLO del proveedor `mock` (`Biometrics:Provider=mock`): simula una validación
        biométrica aprobada (score 95) sin pasar por un proveedor externo — es lo que el botón
        "Simular validación de identidad" dispara en desarrollo/pruebas, equivalente al desenlace
        que produciría Kyverum tras una captura exitosa. No estaba documentado en el contrato
        (brecha preexistente, endpoint de mock); se añade junto con la ampliación de Múltiple
        Propietario porque `documento` (ADR-0053) es parte directa de ese cierre.

        ADR-0053 (Múltiple Propietario) — `documento` es opcional/aditivo: identifica a CUÁL de los
        1..4 actores del rol se refiere la simulación (persona natural: su propio documento; persona
        jurídica: el de su representante legal — mismo criterio que `identity/ensure`). Sin él (o con
        1 solo actor en el rol, caso mayoritario), simula sobre el actor principal/único, como
        siempre.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parte]
              properties:
                parte:
                  type: string
                  enum: [comprador, vendedor]
                  nullable: true
                  description: Parte del trámite (vacío/null en matrícula inicial).
                documento:
                  type: string
                  nullable: true
                  description: >
                    ADR-0053 (Múltiple Propietario) — documento del sujeto de identidad al que se
                    refiere la simulación, cuando `parte` tiene 2..4 actores.
      responses:
        "200":
          description: >
            Validación simulada, ya en estado `aprobado`. Código de estado documentado por
            convención del wrapper `request<T>` del cliente (acepta cualquier 2xx); no verificado
            línea a línea contra el atributo HTTP del controlador — si difiere, es un detalle de
            documentación, no de comportamiento (el body/schema sí está confirmado contra
            `BiometricaEndpoints.cs`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricValidationDto"
        "400":
          description: Datos incompletos, parte inválida, o el proveedor configurado no es `mock`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Instancia no encontrada, o no se encontró un actor para `parte`/`documento`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La instancia no está en draft o ya existe una validación activa para la parte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/biometric/{validationId}/certificado:
    get:
      operationId: descargarCertificadoIdentidad
      tags: [Tramites, Identidad]
      summary: Descargar el certificado (PDF) de una validación de identidad (Kyverum)
      description: >
        Descarga el certificado oficial en PDF de una validación de identidad desde la API pública de
        Kyverum (`GET /v1/validations/{kyverumVerificationId}/certificado`), con el mismo Bearer API key del
        create. Solo aplica a validaciones del proveedor `kyverum` con id de verificación. Keyed por
        `validationId`, sirve para cualquier parte (comprador/vendedor).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: validationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: PDF del certificado.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La validación no existe (para el tenant/instancia) o no tiene certificado disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: El proveedor rechazó la descarga del certificado (error definitivo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: El proveedor de identidad no está disponible (transitorio).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/biometric/{validationId}/audit:
    get:
      operationId: getIdentidadAudit
      tags: [Tramites, Identidad]
      summary: Bitácora del ciclo de una validación de identidad
      description: >
        Devuelve, en orden cronológico, la bitácora del ciclo de una validación: envío al proveedor, llegada
        del webhook, si el secreto se pudo descifrar o no (diagnóstico del keyring), verificación de firma,
        resultado aplicado y reconciliaciones. Para depurar "qué pasó" desde la API sin entrar a la BD ni a los
        logs del pod. No incluye secretos ni PII.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: validationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: >
            Bitácora de la validación. Si la identidad está reutilizada de otro trámite del mismo cliente
            (HU #10350), referencedFromOtherProcedure = true y events es la bitácora real de esa validación.
          content:
            application/json:
              schema:
                type: object
                required: [validationId, events]
                properties:
                  validationId:
                    type: string
                    format: uuid
                  referencedFromOtherProcedure:
                    type: boolean
                    default: false
                    description: >
                      true cuando la validación es del mismo tenant/cliente pero se realizó en otro trámite
                      (identidad reutilizada). No es un error: la bitácora corresponde a ese trámite de origen.
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        occurredAt: { type: string, format: date-time }
                        stage: { type: string, description: "send|send_response|send_error|webhook_received|webhook_not_verifiable|webhook_signature_invalid|webhook_applied|reconcile" }
                        outcome: { type: string }
                        httpStatus: { type: integer, nullable: true }
                        signaturePresent: { type: boolean, nullable: true }
                        secretPresent: { type: boolean, nullable: true }
                        decryptOk: { type: boolean, nullable: true }
                        providerStatus: { type: string, nullable: true }
                        errorType: { type: string, nullable: true }
                        message: { type: string, nullable: true }
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La validación no existe o es de otro tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/biometric/{validationId}/reconcile:
    post:
      operationId: reconciliarIdentidad
      tags: [Tramites, Identidad]
      summary: Reconciliar una validación con Kyverum (fallback de webhook)
      description: >
        Consulta el estado real de una validación en Kyverum (`GET /v1/validations/{kyverumVerificationId}`)
        y lo aplica si ya es terminal (aprobado/rechazado). Sirve como respaldo cuando el webhook no llegó
        (p.ej. callback mal ruteado entre ambientes). Idempotente: si ya está terminal no hace nada. El
        frontend puede invocarlo en la pantalla "Esperando validación" para desatascar en vivo.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: validationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Estado (posiblemente actualizado) de la validación.
          content:
            application/json:
              schema:
                type: object
                required: [status, updated]
                properties:
                  status:
                    type: string
                    description: Estado FLIT tras reconciliar (en_proceso|aprobado|rechazado|expirado).
                  updated:
                    type: boolean
                    description: true si la consulta cambió el estado local.
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La validación no existe para el tenant/instancia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La validación no es del proveedor Kyverum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: El proveedor rechazó la consulta de estado (definitivo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: El proveedor de identidad no está disponible (transitorio).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/webhooks/kyverum-verify/{validationId}:
    post:
      operationId: kyverumVerifyWebhook
      tags: [Identidad]
      summary: Webhook de resultado de Kyverum Verify (HU #10233)
      security: []          # público: la credencial es la firma HMAC del cuerpo
      description: >
        Recibe la notificación de resultado de una validación de Kyverum. El `validationId` (nuestro id)
        viaja en el path porque el cuerpo del webhook no lo repite; se registra en la `webhookUrl` al
        crear la validación. La autenticidad se valida con la firma HMAC-SHA256 del cuerpo crudo en el
        header `x-kv-signature` con formato `sha256=<hex>` (firma inválida ⇒ 401, sin cambios).
        Idempotente: una validación ya resuelta devuelve 200 sin re-aplicar.
      parameters:
        - name: validationId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id de la validación FLIT (correlación).
        - name: x-kv-signature
          in: header
          required: true
          schema: { type: string }
          description: "sha256=<hex>, hex = HMAC_SHA256(webhookSecret, cuerpo crudo)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KyverumWebhookPayload"
      responses:
        "200":
          description: Webhook procesado (o ya procesado — idempotente).
        "400":
          description: Cuerpo del webhook inválido.
        "401":
          description: Firma HMAC inválida (sin cambios en BD).
        "404":
          description: Validación no encontrada.

  /api/v1/analytics/overview:
    get:
      tags: [Analytics · Dashboard]
      operationId: analyticsOverview
      summary: Métricas por categoría/estado del tenant en un rango de fechas (RF01, RF02, RF07)
      description: >
        Devuelve conteos de trámites por categoría (matriculas/traspasos/otros) y estado. El tenant
        se toma del claim JWT `tenant_id` (AC1); un SuperAdmin puede indicar `tenantId` por query para
        consultar otra compañía (AC2). Requiere JWT con rol de empresa o SuperAdmin (AdminCompany).
        `from` y `to` son opcionales y se acotan por separado; sin ninguno de los dos la respuesta
        cubre TODOS los trámites del tenant (BUG #12588), que es como arranca el dashboard.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: >
            Fecha inicial inclusiva (YYYY-MM-DD). Omitirlo NO acota por ese extremo: sin `from` ni `to` la respuesta cubre el universo completo (BUG #12588). El filtro es por fecha de creación del trámite.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: >
            Fecha final inclusiva (YYYY-MM-DD). Omitirlo NO acota por ese extremo: sin `from` ni `to` la respuesta cubre el universo completo (BUG #12588). El filtro es por fecha de creación del trámite.
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Solo SuperAdmin; selecciona la compañía a consultar (AC2).
      responses:
        "200":
          description: Métricas agregadas del periodo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverviewResponse"
        "400":
          description: Rango inválido (`from` posterior a `to`) o falta tenant (AC4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Tenant Admin solicitando métricas de otro tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/analytics/productivity/top:
    get:
      tags: [Analytics · Dashboard]
      operationId: analyticsTopProducers
      summary: Top de radicadores por trámites enviados en un rango (RF07, AC3)
      description: >
        Devuelve hasta `limit` usuarios ordenados por `submittedCount` descendente. Mismo
        modelo de tenant que el overview (claim `tenant_id`; SuperAdmin con `tenantId` opcional).
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 5, minimum: 1, maximum: 50 }
          description: Tamaño del ranking (por defecto 5).
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Solo SuperAdmin (AC2).
      responses:
        "200":
          description: Ranking de productividad del periodo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopProducersResponse"
        "400":
          description: Rango inválido o falta tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Tenant Admin solicitando otro tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/analytics/procedures:
    get:
      tags: [Analytics · Dashboard]
