    NetworkDomainRequiredResponse:
      description: >-
        403 aditivo de `POST /auth/login` (HU #12422 AC3, ADR-0060 D3): credencial válida de un
        usuario de una red MARCA_BLANCA con dominio activo, presentada por el dominio de FLIT.
      type: object
      required: [error, networkDomain, loginUrl]
