  /api/v1/tramites/network/reports/procedures:
    get:
      operationId: tramitesNetworkReportsProcedures
      tags: [Tramites, Red]
      summary: Reporte detallado de la red, paginado, filtrable por cliente hijo o agregado (cabeza de grupo)
      description: >
        HU #12360 — los MISMOS filtros y paginación que `GET /api/v1/detailed-report/procedures` (rango de
        fechas obligatorio; organismo, tipo, categoría, estado, radicado, documento, nombre, transformación,
        leasing; `page`/`pageSize` con tope 100) sobre el conjunto de lectura de la cabeza (padre y sus
        hijos) resuelto en el servidor. Cada fila lleva el cliente dueño (`tenantId`, `tenantName`) y los
        totales se desglosan además por cliente (`summary.byTenant`) (AC1). `childTenantId` acota a UN
        cliente de la red (puede ser la propia cabeza) y los totales son solo de ese cliente (AC2); uno
        fuera del conjunto de lectura responde 403 `network_child_out_of_scope` SIN ejecutar la consulta
        (AC3). El conjunto viaja a la base como un único parámetro de arreglo (`tenant_id = ANY(@tenants)`);
        un conjunto vacío produce un reporte sin registros, nunca uno sin filtro (AC4). Ni el listado ni la
        exportación incluyen contenido ni enlaces de documentos generados o anexos (AC6). Las rutas de
        `/api/v1/detailed-report` no cambian ni reciben parámetros nuevos (AC7). Cada petición deja un
        registro en la auditoría de acceso consolidado (`network.reports.procedures`, HU #12361) con los
        filtros de texto libre registrados solo por nombre.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NetworkStatsFrom"
        - $ref: "#/components/parameters/NetworkStatsTo"
        - $ref: "#/components/parameters/NetworkStatsChildTenantId"
        - $ref: "#/components/parameters/NetworkReportTransitOfficeId"
        - $ref: "#/components/parameters/NetworkReportProcedureTypeId"
        - $ref: "#/components/parameters/NetworkReportCategory"
        - $ref: "#/components/parameters/NetworkReportStatus"
        - $ref: "#/components/parameters/NetworkReportReferenceNumber"
        - $ref: "#/components/parameters/NetworkReportPersonDocument"
        - $ref: "#/components/parameters/NetworkReportPersonName"
        - $ref: "#/components/parameters/NetworkReportHasTransformation"
        - $ref: "#/components/parameters/NetworkReportIsLeasing"
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: Tamaño de página (por defecto 20; por encima de 100 cae al tope).
      responses:
        "200":
          description: Página del reporte detallado de la red.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkDetailedProceduresPage"
        "400":
          description: Rango inválido (`from` posterior a `to`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin token válido.
        "403":
          description: "`network_scope_required` (sin alcance de grupo: cliente sin jerarquía, SuperAdmin), `network_role_required` (cabeza sin rol AdminCompany) o `network_child_out_of_scope`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/network/reports/procedures/export:
    get:
      operationId: tramitesNetworkReportsExportExcel
