  /api/v1/analytics/ot-metrics:
    get:
      tags: [Analytics · Métricas (Reportes 2.0)]
      operationId: analyticsOtMetrics
      summary: Métricas del Organismo de Tránsito (rechazos, tiempos de decisión, reincidencia, ranking y atascados)
      description: >
        Reportes 2.0 (HU-B). Calcula sobre `procedure_instance_status_history` los KPIs de la
        pestaña OT del periodo [from, to]: transiciones a entregado/aprobado/rechazado, tasa de
        rechazo (global, por OT, por causal y por tipo de trámite), tiempos entregado→decisión
        (avg/p50/p90 en horas), reincidencia (rechazado→borrador), ranking de agilidad de OTs y
        trámites atascados (> `stuckDays` días sin transición en estado no final). Lectura abierta
        a cualquier autenticado del tenant (claim `tenant_id`). NO hay vista global: el SuperAdmin
        DEBE indicar `tenantId` por query (sin él → 400 en español). Con `compareWith` la
        respuesta envuelve además la ventana anterior (`previous`) y su metadato (`comparison`);
        la variación porcentual la calcula el frontend (el backend no manda deltas).
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          description: Fecha inicial inclusiva (YYYY-MM-DD).
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: Fecha final inclusiva (YYYY-MM-DD).
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Solo SuperAdmin; obligatorio para él (no hay vista global en métricas).
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filtra por Organismo de Tránsito.
        - name: procedureTypeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filtra por tipo de trámite.
        - name: operatorUserId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filtra por usuario radicador/operador.
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EstadoTramiteN03"
          description: Filtra por estado N03 del trámite.
        - name: reason
          in: query
          required: false
          schema: { type: string }
          description: Substring (case-insensitive, ILIKE) sobre la causal de la transición a rechazado.
        - name: compareWith
          in: query
          required: false
          schema: { type: string, enum: [previous_period, previous_year] }
          description: >
            Ventana de comparación: `previous_period` = misma duración inmediatamente anterior a
            `from`; `previous_year` = mismas fechas un año atrás. Ausente = sin comparación
            (`previous` y `comparison` en null).
        - name: stuckDays
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
          description: Días sin transición para considerar un trámite atascado.
      responses:
        "200":
          description: Métricas OT del periodo (con `previous`/`comparison` si se pidió `compareWith`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtMetricsResponse"
        "400":
          description: Rango inválido, `compareWith`/`stuckDays` inválidos o falta tenant (SuperAdmin sin `tenantId`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Tenant Admin consultando métricas de otro tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

