      description: >
        HU #12360 — XLSX generado con el MISMO generador OpenXml que `GET /api/v1/detailed-report/procedures/export`
        y las mismas columnas precedidas por «Compañía» (razón social del cliente dueño de cada fila). Usa la
        misma consulta y el mismo filtro resuelto que `/network/reports/procedures` para la misma petición:
        el archivo contiene exactamente los registros de la consulta y ninguno de un cliente ajeno a la red
        (AC5). Sin registros responde un archivo solo con la cabecera (AC4). Mismas reglas de
        `childTenantId` y mismos filtros (sin paginación). Requiere rol de administrador de compañía.
        Registra `network.reports.export` en la auditoría de acceso consolidado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NetworkStatsFrom"
        - $ref: "#/components/parameters/NetworkStatsTo"
        - $ref: "#/components/parameters/NetworkStatsChildTenantId"
        - $ref: "#/components/parameters/NetworkReportTransitOfficeId"
        - $ref: "#/components/parameters/NetworkReportProcedureTypeId"
        - $ref: "#/components/parameters/NetworkReportCategory"
        - $ref: "#/components/parameters/NetworkReportStatus"
        - $ref: "#/components/parameters/NetworkReportReferenceNumber"
        - $ref: "#/components/parameters/NetworkReportPersonDocument"
        - $ref: "#/components/parameters/NetworkReportPersonName"
        - $ref: "#/components/parameters/NetworkReportHasTransformation"
        - $ref: "#/components/parameters/NetworkReportIsLeasing"
      responses:
        "200":
