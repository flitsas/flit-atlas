  /api/v1/admin/generacion-documental/rues/generate:
    post:
      tags: [Admin · Generación documental]
      operationId: adminGeneracionDocumentalGenerateRues
      summary: Genera el Certificado RUES standalone (sin trámite)
      description: >
        Consulta el RUES EN VIVO por NIT, congela el snapshot inmutable, renderiza el PDF con la
        plantilla QuestPDF local (el mismo generador del expediente) y lo persiste en storage. NO
        devuelve el PDF: responde { id, status } en application/json con cualquier Accept, y la
        descarga va siempre por GET /{id}/download. El campo status solo puede valer generated o
        error (CF-21). Requiere el permiso generacion-documental.generate. El documento queda en el
        tenant del JWT, también para SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
          description: >
            Repetir la misma clave dentro del tenant devuelve el documento existente sin consultar
            al proveedor RUES y sin escribir un archivo nuevo (CF-16).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandaloneRuesRequest"
      responses:
        "200":
          description: Documento generado (o recuperado por idempotencia).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandaloneDocumentGenerateResult"
        "400":
          description: NIT ausente o con formato inválido. No se crea fila ni se consulta nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin token o token sin los claims tenant_id / sub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin el permiso generacion-documental.generate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            El NIT no tiene coincidencia en RUES. La fila queda en estado error con error_code
            identificable y NO se produce ningún archivo en storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: El proveedor RUES no respondió.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: El proveedor RUES no está registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/generacion-documental/transferencia/generate:
    post:
      tags: [Admin · Generación documental]
      operationId: adminGeneracionDocumentalGenerateTransferencia
      summary: Genera el Documento de Transferencia de Dominio (escenarios A, B y C)
      description: >
        Emite el instrumento privado de transferencia de dominio SIN abrir un trámite, conforme al
        anexo normativo docs/plantilla-transferencia-dominio.md (Resolución 20233040017145 de 2023).
        Los tres escenarios están disponibles: A traspaso ordinario (art. 5.3.2.1), B transferencia
        unilateral de leasing al locatario (art. 5.3.2.2) y C entidad financiera a un tercero
        (art. 5.3.2.1 SIN las exenciones del 5.3.2.2). El escenario es obligatorio y ÚNICO: cero o
        más de uno responde 422 con el código VB-05.
        VB-07 es un GATE PREVIO a la selección de escenario: mientras no se declare que ninguna de
        las once condiciones especiales de traspaso de los arts. 5.3.2.3 a 5.3.2.13 aplica, la
        generación se rechaza con 422 y el código VB-07; declarar cualquiera de las once también
        rechaza, con el artículo citado en el mensaje. El art. 5.3.2.14 (expedición de la nueva
        licencia de tránsito) NO es una condición especial y no bloquea.
        En el ESCENARIO B el locatario no es una parte del documento: no se envía adquirente, no hay
        campo de precio (si el cuerpo trae precio o contraprestación, 422 con VB-B-05) y el PDF se
        emite con UN solo bloque de firma, el de la entidad financiera.
        Validaciones bloqueantes: VB-02 placa, VB-06 partes distintas, VB-07 régimen aplicable,
        VB-A-04 gravamen, VB-A-06 precio de la compraventa, VB-A-07 título jurídico, VB-B-01 a
        VB-B-05 del escenario B y VB-C-01 del escenario C. Todas responden 422 con código, campo y
        mensaje, y NUNCA reflejan el valor capturado.
        Prevalidaciones advisory (VB-01, VB-03, VB-04, VB-A-01 a VB-A-03, VB-A-05, VB-A-08 a
        VB-A-10, VB-B-06 y VB-C-02 a VB-C-10): viajan en la respuesta 200 como aviso y no bloquean
        nunca; las verifica el Organismo de Tránsito. El modo de firma es MANUSCRITA fijo: el PDF
        lleva líneas de firma con nombre y documento y no contiene leyenda de firma electrónica ni
        sello alguno. NO devuelve el PDF: responde { id, status, advisories } en application/json
        con cualquier Accept, y la descarga va por GET /{id}/download. Requiere el permiso
        generacion-documental.generate.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
          description: >
            Repetir la misma clave dentro del tenant devuelve el documento existente sin renderizar
            de nuevo ni escribir otro archivo (CF-16).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandaloneTransferenciaRequest"
      responses:
        "200":
          description: Documento generado (o recuperado por idempotencia), con las advisory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandaloneTransferGenerateResult"
        "400":
          description: >
            Cuerpo incompleto o fuera de catálogo (nombres, documentos, ciudad de firma o las
            variables fiscales de la cláusula sexta). No es una validación normativa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin token o token sin los claims tenant_id / sub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin el permiso generacion-documental.generate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Al menos una validación bloqueante del anexo falló —incluido el gate VB-07 de régimen
            aplicable—. No se persiste ninguna fila ni se escribe archivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandaloneTransferValidationError"

  /api/v1/admin/generacion-documental/prefill/vehiculo:
    post:
      tags: [Admin · Generación documental]
      operationId: adminGeneracionDocumentalPrefillVehiculo
      summary: Prellena el bloque de vehículo a partir de la placa (RUNT)
      description: >
        Consulta la placa en la cadena de proveedores RUNT existente (el mismo
        IConsultationProviderChainResolver del expediente, con KyverumRuntVehicleResultMapper) y
        devuelve 12 de las 13 variables de vehículo del anexo normativo, cada una con su fuente. La
        restante, no_licencia_transito, no la entrega ninguna consulta y se captura a mano.
        Un trámite ACTIVO sobre la placa NO bloquea el prellenado: no se evalúa duplicidad de
        trámite ni el gate de organismo, y no se reutiliza el preflight del wizard (CF-25). Una
        placa sin antecedente responde 200 con found=false, nunca 404. NO persiste nada: no crea
        fila en admin.standalone_documents ni escribe archivo. Requiere el permiso
        generacion-documental.generate.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandalonePrefillVehiculoRequest"
      responses:
        "200":
          description: Campos hidratados con su fuente (found=false si la placa no tiene antecedente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandalonePrefillResult"
        "400":
          description: Placa ausente o vacía. No se gasta consulta al proveedor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin token o token sin claim tenant_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin el permiso generacion-documental.generate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Ninguna fuente respondió. Sin coincidencia no hay 502; eso es 200 con found=false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/generacion-documental/prefill/persona-juridica:
    post:
      tags: [Admin · Generación documental]
      operationId: adminGeneracionDocumentalPrefillPersonaJuridica
      summary: Prellena una parte jurídica por NIT (directorio primero, RUES de respaldo)
      description: >
        Precedencia explícita (CF-25): el directorio de representantes legales del tenant
        (admin.company_legal_representatives) PRIMERO, y el RUES SOLO si el directorio no responde
        —sea porque el NIT no está o porque la lectura falló—. La respuesta declara la fuente
        efectiva por campo. El dígito de verificación se CALCULA (módulo 11 DIAN) y viaja con fuente
        CALCULADO: no se consulta a ningún proveedor y no lo captura el usuario. Sin coincidencia en
        ninguna fuente: 200 con found=false, nunca 404. NO persiste nada. Requiere el permiso
        generacion-documental.generate.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandaloneRuesRequest"
      responses:
        "200":
          description: Campos hidratados con su fuente (DIRECTORIO o RUES; el DV, CALCULADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandalonePrefillResult"
        "400":
          description: NIT ausente o sin dígitos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin token o token sin claim tenant_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin el permiso generacion-documental.generate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Ninguna de las dos fuentes respondió.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/generacion-documental/prefill/persona-natural:
    post:
      tags: [Admin · Generación documental]
      operationId: adminGeneracionDocumentalPrefillPersonaNatural
      summary: Prellena una parte natural por documento (RUNT primero, contacto de respaldo)
      description: >
        Precedencia explícita (CF-25): la cadena RUNT persona PRIMERO —sin instancia de trámite, con
        el guardado de caché de consultas externas usando instancia nula— y contact-lookup
        (histórico de actores del tenant) como respaldo. El domicilio SIEMPRE declara CONTACT_LOOKUP:
        el RUNT no lo entrega. El respaldo nunca inventa el nombre, porque contact-lookup no
        devuelve nombre ni documento por contrato. Sin coincidencia en ninguna fuente: 200 con
        found=false, nunca 404. NO persiste nada. Requiere el permiso
        generacion-documental.generate.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandalonePrefillPersonaNaturalRequest"
      responses:
        "200":
          description: Campos hidratados con su fuente (RUNT o CONTACT_LOOKUP).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandalonePrefillResult"
        "400":
          description: Tipo o número de documento ausente, o tipo no admitido (NIT va por persona-juridica).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin token o token sin claim tenant_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin el permiso generacion-documental.generate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Ninguna de las dos fuentes respondió.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/generacion-documental:
    get:
      tags: [Admin · Generación documental]
      operationId: adminGeneracionDocumentalList
      summary: Historial paginado de documentos generados por la compañía
      description: >
        Historial tenant-scoped (CF-17/CF-18) con la metadata mínima de cada documento: tipo,
        escenario cuando aplica, empresa, usuario, fecha y resultado. NUNCA expone
        document_snapshot ni rues_snapshot (PII alta, CF-26), ni la ruta de storage, ni ninguna URL
        firmada. El aislamiento entre compañías es el filtro WHERE tenant_id del repositorio más la
        autorización del endpoint: la política RLS de la tabla no aísla nada (§5.4 del diseño).
        Requiere el permiso generacion-documental.read.
      security:
        - bearerAuth: []
      parameters:
        - name: documentType
          in: query
          required: false
          schema:
            type: string
            enum: [certificado_rues, transferencia_dominio_generada]
        - name: status
          in: query
          required: false
          description: >
            Estado INTERNO. Se repite una vez por estado: la opción de usuario «En proceso» viaja
            como status=pending&status=processing (CF-21, tres opciones para cuatro estados).
          schema:
            type: array
            items:
              type: string
              enum: [pending, processing, generated, error]
          style: form
          explode: true
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date }
          description: Límite inferior inclusivo sobre la fecha de generación.
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date }
          description: >
            Límite superior. Una fecha sin hora incluye el día completo (el backend la convierte en
            el límite exclusivo del día siguiente).
        - name: userId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Autor de la generación (created_by_user_id).
        - name: batchId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Lote XLSX del que provienen las filas (CF-18 en I3). Convive con los filtros de tipo,
            fecha, usuario y estado: todos se aplican a la vez con AND. Un batchId de otra compañía
            devuelve cero resultados, porque el filtro por tenant se aplica igual.
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Solo lo honra un SuperAdmin (CF-20): devuelve METADATA global de esa compañía y jamás
            document_snapshot ni presigned URLs. Para cualquier otro usuario se ignora y se consulta
            su propio tenant.
        - name: allTenants
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            Solo lo honra un SuperAdmin: lista los documentos de TODAS las compañías, sin filtro de
            tenant. Es el único camino del listado sin WHERE tenant_id, y exige las dos condiciones a
            la vez —ser SuperAdmin y pedirlo— así que no se alcanza por omisión. Gana sobre tenantId
            si llegan los dos. Para cualquier otro usuario se ignora, igual que tenantId. La
            respuesta sigue sin document_snapshot, sin ruta de storage y sin presigned URLs: es
            metadata, y la columna companyName permite distinguir de qué compañía es cada fila.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página del historial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandaloneDocumentsPagedResult"
        "400":
          description: Parámetro de fecha con formato inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin token o token sin claim tenant_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin el permiso generacion-documental.read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/generacion-documental/{id}/download:
    get:
      tags: [Admin · Generación documental]
      operationId: adminGeneracionDocumentalDownload
      summary: Presigned URL de descarga del PDF ya generado y auditoría (CF-19)
      description: >
        Devuelve una presigned URL de vida corta (ADR-0029) para el PDF ya generado y, en la misma
        operación, incrementa download_count y actualiza downloaded_at con un ÚNICO UPDATE atómico
        en SQL — dos descargas dejan el contador en 2. Aplica en CADA descarga, no solo la primera;
        el contador es de auditoría y no limita descargas. No regenera nada: no se invoca ningún
        generador ni proveedor externo y storage_sha256 no cambia (CF-03). La URL firmada no se
        escribe en ningún log ni traza de error. Un id de otra compañía responde 404 sin revelar su
        existencia, también para SuperAdmin (CF-20). Requiere el permiso generacion-documental.read.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Enlace de descarga vigente. La descarga queda auditada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandaloneDocumentDownloadLink"
        "401":
          description: Sin token o token sin claim tenant_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin el permiso generacion-documental.read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            No existe, pertenece a otro tenant o perdió su binario. Misma respuesta escueta en los
            tres casos: no revela existencia, presigned URL, snapshot ni PII.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El documento existe en el tenant pero no está en estado generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Admin · Generación documental · Lotes XLSX (I3, HU #12210) ──
  /api/v1/admin/generacion-documental/lotes/plantilla:
    get:
      tags: [Admin · Generación documental]
      operationId: adminGeneracionDocumentalPlantillaLote
      summary: Descarga la plantilla XLSX v1 de carga masiva (CF-11)
      description: >
        Devuelve el XLSX de la plantilla v1 con TODAS las columnas declaradas como texto. Que sean
        texto no es cosmética: evita que Excel guarde una fecha como serial numérico, que el parser
        RECHAZA en vez de convertir (una conversión a ciegas produce documentos con la fecha
        equivocada). El encabezado de este archivo es exactamente el que exige POST /lotes: se
        genera de la misma lista de columnas que valida la carga. Requiere el permiso
        generacion-documental.read.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plantilla v1 vacía, con la fila de encabezado.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401":
          description: Sin token o token sin claim tenant_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin el permiso generacion-documental.read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/generacion-documental/lotes:
    post:
      tags: [Admin · Generación documental]
      operationId: adminGeneracionDocumentalCrearLote
      summary: Carga un XLSX de hasta 100 filas y encola el lote (CF-11/CF-12/CF-13/CF-16)
      description: >
        Recibe multipart/form-data con el campo file y responde 202 con el identificador del lote,
        estado queued y el total de filas; el procesamiento ocurre en segundo plano. Cada fila se
        genera con el handler de SU tipo (certificado_rues o transferencia_dominio_generada con su
        escenario), de modo que un mismo lote admite tipos mezclados (CF-12). Una fila inválida NO
        cancela el lote (CF-13): queda en error con validation_errors —código, campo y mensaje, y el
        mensaje NUNCA refleja el valor capturado—, las demás se generan y el lote termina en
        partial_failure. Un document_type desconocido es una fila en error, no un aborto. Una fila
        que declare cualquiera de las once condiciones de traspaso especial de los arts. 5.3.2.3 a
        5.3.2.13 queda en error con el código VB-07 y el artículo citado, y el resto del lote
        continúa (CF-24 en lote). Rechazos del archivo COMPLETO, con 422 y sin persistir el archivo
        en storage: too_many_rows con más de 100 filas de datos, template_invalid si el encabezado no
        es exactamente el de la plantilla v1 e invalid_file si el contenido real no es un XLSX (el
        MIME se verifica por contenido, no por extensión). La cabecera Idempotency-Key repetida
        dentro del mismo tenant devuelve el lote existente sin crear lote, ni filas, ni archivo
        fuente nuevo (CF-16). El seguimiento del avance y la descarga ZIP del lote NO están en esta
        superficie. Requiere el permiso generacion-documental.generate.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
          description: Repetirla dentro del mismo tenant devuelve el lote existente (CF-16).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: XLSX conforme a la plantilla v1, máximo 100 filas de datos.
      responses:
        "202":
          description: Lote encolado. El procesamiento es asíncrono.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandaloneDocumentBatchCreated"
        "200":
          description: >
            Replay de idempotencia: el lote que ya existía para esa clave y ese tenant. No se creó
            nada nuevo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandaloneDocumentBatchCreated"
        "400":
          description: Falta el archivo o la petición no es multipart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin token o token sin claim tenant_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin el permiso generacion-documental.generate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Archivo rechazado entero (too_many_rows, template_invalid o invalid_file). El XLSX no se
            persistió en storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/generacion-documental/lotes/{batchId}:
    get:
      tags: [Admin · Generación documental]
      operationId: adminGeneracionDocumentalEstadoLote
      summary: Avance de un lote para el seguimiento in-app (CF-14)
      description: >
        Devuelve el estado del lote, el total de filas y cuántas van generadas y en error. Es la
        ruta que la interfaz sondea cada 4 segundos: no consulta storage, no firma ninguna URL y no
        toca proveedores externos. Los contadores se cuentan sobre las filas ya materializadas y no
        se leen de la cabecera del lote, que solo los escribe al cerrar: leerlos ahí dejaría el
        progreso clavado en cero durante todo el procesamiento. isTerminal viaja EXPLÍCITO porque es
        la señal con la que el cliente detiene el polling; si el contrato gana un estado terminal
        nuevo, el cliente deja de sondear sin cambiar de versión. No se envía correo ni notificación
        push: el avance se consulta, no se empuja. Un lote de otra compañía responde 404 sin revelar
        su existencia. Requiere el permiso generacion-documental.read.
      security:
        - bearerAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Avance del lote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandaloneDocumentBatchStatus"
        "401":
          description: Sin token o token sin claim tenant_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin el permiso generacion-documental.read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o no pertenece a la compañía del JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/generacion-documental/lotes/{batchId}/items:
    get:
      tags: [Admin · Generación documental]
      operationId: adminGeneracionDocumentalItemsLote
      summary: Filas de un lote con el detalle de sus errores (CF-13)
      description: >
        Listado paginado de las filas del lote, ordenado por número de fila ascendente —que es como
        el usuario mira su XLSX—. Cada fila trae número, tipo, escenario, estado y validationErrors
        con código, campo y mensaje. El mensaje NUNCA refleja el valor capturado que produjo el
        error: la fila puede traer un documento de identidad o una dirección, y el listado los
        enseñaría a cualquiera con permiso de lectura. OJO con documentType, que en algunas filas
        MIENTE por una limitación del esquema: los CHECK de admin.standalone_documents solo admiten
        dos literales, así que una fila con un tipo desconocido —o una transferencia sin escenario
        válido— se persiste como certificado_rues con escenario nulo y el error verdadero vive en
        validationErrors, que es lo que la interfaz debe mostrar. No expone document_snapshot,
        rues_snapshot ni rutas de storage. Un lote de otra compañía responde 404. Requiere el
        permiso generacion-documental.read.
      security:
        - bearerAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de filas del lote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandaloneDocumentBatchItemsPage"
        "401":
          description: Sin token o token sin claim tenant_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin el permiso generacion-documental.read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o no pertenece a la compañía del JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/generacion-documental/lotes/{batchId}/zip:
    get:
      tags: [Admin · Generación documental]
      operationId: adminGeneracionDocumentalZipLote
      summary: Descarga por streaming los documentos generados del lote (CF-15)
      description: >
        Devuelve application/zip armado AL VUELO sobre el cuerpo de la respuesta, con una entrada
        por cada fila en estado generated: un lote de nueve generadas y una en error produce un ZIP
        de nueve entradas, y la fila fallida no aparece. El filtro por estado va en SQL, no en el
        streamer, para que «solo los generados» sea una propiedad de la consulta y no un if que
        alguien pueda olvidar. El ZIP NO se persiste en storage ni en base de datos, y la memoria del
        proceso sostiene un PDF a la vez: cada binario se abre, se copia por bloques y se cierra
        antes de abrir el siguiente. Las entradas van prefijadas con el número de fila del XLSX
        porque dos filas pueden producir el mismo nombre de archivo y un ZIP con nombres repetidos
        pierde entradas al descomprimirse. Un lote cuyas filas quedaron TODAS en error responde 409
        con una explicación explícita, nunca un ZIP vacío que parecería una descarga corrupta. Un
        lote de otra compañía responde 404 sin revelar su existencia ni entregar presigned URLs.
        Requiere el permiso generacion-documental.read.
      security:
        - bearerAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ZIP por streaming con los documentos generados del lote.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401":
          description: Sin token o token sin claim tenant_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Sin el permiso generacion-documental.read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o no pertenece a la compañía del JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            El lote existe pero ninguna fila llegó a generated: no hay nada que descargar
            (code no_documents). No se entrega un ZIP vacío.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Trámites · Documentos (adjuntos, checklist, consolidado) — HU #10520 (RNF01) ──
  /api/v1/tramites/instances/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Trámites · Documentos]
      summary: Subir un adjunto (multipart)
      operationId: uploadProcedureInstanceAttachment
      security:
        - bearerAuth: []
      description: >
        Sube el binario de un documento del trámite (solo en estado borrador). Valida tipo,
        MIME y tamaño; si el tipo existe en el catálogo document_types se aplican sus reglas
        (mime_types_allowed/max_size_bytes), con respaldo a los límites globales (pdf/jpeg/png/webp, 20 MB).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tipo, file]
              properties:
                tipo: { type: string, example: factura }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Adjunto creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentDto" }
        "400": { description: "tipo/MIME/tamaño inválido o archivo faltante." }
        "404": { description: "Trámite no encontrado." }
        "409":
          description: >
            El trámite no está en borrador (`not_draft`, solo detail), o el trámite ya tiene un
            `liquidacion_impuesto` vigente cargado por FLITO (`adjunto_bloqueado_flito`, HU #13265): gana quien carga
            primero y el gestor no puede reemplazarlo; solo FLITO lo corrige reenviando. Se rechaza antes de guardar el binario.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/AdjuntoBloqueadoFlitoProblem" }
    get:
      tags: [Trámites · Documentos]
      summary: Listar adjuntos del trámite
      operationId: listProcedureInstanceAttachments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de adjuntos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: { $ref: "#/components/schemas/AttachmentDto" }
        "404": { description: "Trámite no encontrado." }

  /api/v1/tramites/instances/{id}/attachments/presign:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Trámites · Documentos]
      summary: Abrir subida directa a S3 (presigned POST)
      operationId: presignProcedureInstanceAttachment
      security:
        - bearerAuth: []
      description: >
        Valida tipo/MIME/tamaño y estado borrador y devuelve una política presigned POST para
        subir el binario directo a S3, sin crear aún la fila del adjunto (se registra luego).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresignAttachmentRequest" }
      responses:
        "200":
          description: Política presigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  storagePath: { type: string }
                  url: { type: string, format: uri }
                  fields:
                    type: object
                    additionalProperties: { type: string }
        "400": { description: "tipo/MIME/tamaño inválido." }
        "404": { description: "Trámite no encontrado." }
        "409":
          description: >
            El trámite no está en borrador (`not_draft`, solo detail), o el trámite ya tiene un
            `liquidacion_impuesto` vigente cargado por FLITO (`adjunto_bloqueado_flito`, HU #13265): gana quien carga
            primero y el gestor no puede reemplazarlo; solo FLITO lo corrige reenviando. Se rechaza ANTES de emitir la política presigned.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/AdjuntoBloqueadoFlitoProblem" }

  /api/v1/tramites/instances/{id}/attachments/register:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Trámites · Documentos]
      summary: Registrar la metadata de un adjunto ya subido a S3
      operationId: registerProcedureInstanceAttachment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterAttachmentRequest" }
      responses:
        "201":
          description: Adjunto registrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentDto" }
        "400": { description: "tipo/MIME/tamaño/storagePath/sha256 inválido." }
        "404": { description: "Trámite no encontrado." }
        "409":
          description: >
            El trámite no está en borrador (`not_draft`, solo detail), o el trámite ya tiene un
            `liquidacion_impuesto` vigente cargado por FLITO (`adjunto_bloqueado_flito`, HU #13265): gana quien carga
            primero y el gestor no puede reemplazarlo; solo FLITO lo corrige reenviando. El adjunto de FLITO no se retira.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/AdjuntoBloqueadoFlitoProblem" }

  /api/v1/tramites/instances/{id}/attachments/generate-impronta:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Trámites · Documentos]
      summary: Genera la impronta del trámite (Kyverum RUNT) y la adjunta
      description: >
        HU #13402 (Feature #13399) — la generación respeta el parámetro «generar improntas» de la
        compañía CONGELADO al crear el trámite (`improntaGeneracionHabilitada`). Con `false` responde 409
        `generacion_improntas_deshabilitada` sin llamar a Kyverum y sin crear adjunto; la impronta se sube
        a mano (su exigencia sigue gobernada por la matriz/checklist).
      operationId: generateProcedureInstanceImpronta
      security:
        - bearerAuth: []
      responses:
        "201": { description: "Impronta generada y adjuntada." }
        "401": { description: "Usuario no resuelto o Kyverum RUNT rechazó la autenticación." }
        "404": { description: "Trámite no encontrado." }
        "409":
          description: >
            `generacion_improntas_deshabilitada` (HU #13402, el trámite nació con la generación
            deshabilitada; el cuerpo trae `error`), `not_draft`, `impronta_ya_existe`,
            `organismo_requerido`, `identificador_vehiculo_requerido`, `documento_propietario_requerido`
            u `operador_no_resuelto`.
          content:
            application/problem+json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  error:
                    type: string
                    example: generacion_improntas_deshabilitada
        "422": { description: "Kyverum RUNT rechazó los datos de la impronta." }
        "502": { description: "Kyverum RUNT no disponible." }

  /api/v1/tramites/instances/{id}/checklist/impronta-diferida:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Trámites · Documentos]
      summary: Marca o desmarca la impronta como «se generará automáticamente»
      description: >
        Con `diferida = true` y un trámite creado con la generación de improntas deshabilitada
        (`improntaGeneracionHabilitada = false`, HU #13402) responde 409 `generacion_improntas_deshabilitada`.
        Desmarcar (`diferida = false`) sigue permitido.
      operationId: setProcedureInstanceImprontaDiferida
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                diferida: { type: boolean }
      responses:
        "204": { description: "Marca actualizada." }
        "404": { description: "Trámite no encontrado." }
        "409":
          description: >
            `generacion_improntas_deshabilitada` (HU #13402), `not_draft` o `impronta_no_aplica`.
          content:
            application/problem+json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  error: { type: string }

  /api/v1/tramites/instances/{id}/attachments/{attachmentId}/download:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Trámites · Documentos]
      summary: Descargar el binario de un adjunto
      operationId: downloadProcedureInstanceAttachment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Binario del adjunto.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: "Trámite o adjunto no encontrado, o binario perdido." }

  /api/v1/tramites/instances/{id}/attachments/{attachmentId}/preview-url:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Trámites · Documentos]
      summary: Presigned URL inline para previsualización de adjunto
      operationId: getProcedureInstanceAttachmentPreviewUrl
      description: |
        Devuelve una presigned GET URL con `Content-Disposition: inline` para visualizar el
        adjunto en el navegador sin forzar descarga (Feature #10701 / ADR-0029). TTL ≈ 10 min.
      security:
        - bearerAuth: []
