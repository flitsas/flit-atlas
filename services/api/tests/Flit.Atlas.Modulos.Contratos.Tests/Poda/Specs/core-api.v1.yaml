        error:
          type: string
          example: NETWORK_DOMAIN_REQUIRED
        networkDomain:
          type: string
          example: app.movilidad.ejemplo.com
        loginUrl:
          type: string
          example: https://app.movilidad.ejemplo.com/login
    SessionPolicyResponse:
      type: object
