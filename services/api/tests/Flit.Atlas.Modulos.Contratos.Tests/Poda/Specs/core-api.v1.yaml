          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Usuario de compañía solicitando los módulos activos de otro tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/analytics/export/excel:
    get:
      tags: [Analytics · Dashboard]
      operationId: analyticsExportExcel
      summary: Exporta a Excel (.xlsx) el detalle de trámites filtrado (RF06)
      description: >
