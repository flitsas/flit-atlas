        "200":
          description: "Firma encontrada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureVaultResponse"
        "401": { description: "No autenticado." }
        "403": { description: "Sin permiso (requiere SuperAdmin)." }
        "404": { description: "Firma no encontrada en el baúl de esta compañía." }
    put:
      operationId: adminSignatureVaultUpdate
      tags: ["Admin · Baúl de Firmas"]
      security:
        - bearerAuth: []
      summary: "Corrige los datos capturados de una firma del baúl"
      description: >
        Cierra el CRUD, que era alta + consulta + anulación: un dato mal digitado —el código hash sobre
        todo, que es lo que se estampa como «Hash» junto a la firma en los documentos— solo se podía
