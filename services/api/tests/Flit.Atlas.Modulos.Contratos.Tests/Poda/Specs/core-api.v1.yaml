      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
    ActivateAccountRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
