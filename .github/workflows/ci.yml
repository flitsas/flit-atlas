name: ci

on:
  push:
    branches: [develop, staging, release]
  pull_request:
    branches: [develop, staging, release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    # [por verificar] runners propios de la 177 (repo privado: consume minutos de Actions).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .markdownlint-cli2.jsonc

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo: escanea todos los commits, no solo el árbol
      - name: Instalar gitleaks (binario fijado y verificado)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o gitleaks.tgz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Escanear historial
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Compilar (advertencias como errores)
        run: dotnet build Flit.Atlas.slnx -c Release
      - name: Pruebas
        run: dotnet test --solution Flit.Atlas.slnx -c Release --no-build

  contratos:
    # HU 1.7 (ATLAS-ADR-0010 y ATLAS-ADR-0021): lint de los contratos propios con vacuum; el CI falla con errores.
    # Que atlas.v1.yaml coincida con el código lo comprueba ContratoOpenApiTests en el job dotnet.
    runs-on: ubuntu-latest
    env:
      VACUUM_VERSION: 0.32.0
      VACUUM_SHA256: 4edffd8e543a4320c1f8cbcd9dfdcba33edbb3e527c77e94bd2c72409ccc85e7
      OASDIFF_VERSION: 1.33.0
      OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar vacuum y oasdiff (binarios fijados y verificados)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o vacuum.tgz \
            "https://github.com/daveshanley/vacuum/releases/download/v${VACUUM_VERSION}/vacuum_${VACUUM_VERSION}_linux_x86_64.tar.gz"
          echo "${VACUUM_SHA256}  vacuum.tgz" | sha256sum -c -
          curl -fsSL --retry 3 --retry-all-errors -o oasdiff.tgz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  oasdiff.tgz" | sha256sum -c -
          tar -xzf vacuum.tgz vacuum
          tar -xzf oasdiff.tgz oasdiff
          sudo mv vacuum oasdiff /usr/local/bin/
          rm vacuum.tgz oasdiff.tgz
      - name: Lint OpenAPI
        run: vacuum lint --no-banner --details --no-clip -r contracts/vacuum/openapi.yaml --ignore-file contracts/vacuum/openapi-excepciones.yaml contracts/openapi/atlas.v1.yaml
      - name: Lint AsyncAPI
        run: vacuum lint --no-banner --details --no-clip -r contracts/vacuum/asyncapi.yaml contracts/asyncapi/atlas-events.v1.yaml
      - name: Lint del contrato de ICT de FLIT 2 enriquecido (reglas de lo compartible)
        # HU 3.8 (ATLAS-ADR-0037): valida el spec ya generado en contracts/ict/ y la propuesta para el repo flit; ni
        # el Excel ni el repo flit están en el CI. Que ningún dato sensible sobreviva y que cada campo del Excel esté
        # en el spec o en el informe lo comprueba services/docs/tests/ict/test_specs_versionados.py (job python).
        run: |
          set -euo pipefail
          fallo=0
          for spec in contracts/ict/core-ict.enriquecido.v1.yaml contracts/ict/propuesta-flit/core-ict.v1.yaml; do
            vacuum lint --no-banner --details --no-clip -r contracts/vacuum/openapi-compartible.yaml "$spec" || fallo=1
          done
          exit "$fallo"
      - name: Prueba del workflow reutilizable atlas-publicar (decisión de breaking y MAJOR, rulesets embebidos)
        # HU 3.3 (ATLAS-ADR-0035 §7): corre el bloque de decisión del workflow tal cual sobre specs ficticias.
        run: bash scripts/atlas-publicar/probar.sh

  atlas-publicar:
    # HU 3.3: flit-atlas valida (en PR) y publica (en push a develop) sus propios contratos con el workflow reutilizable,
    # llamado desde su propia rama (autopublicación, ATLAS-ADR-0035 §7). En los PR, un breaking frente a pdn (o, mientras
    # Atlas no la tenga, frente a release o la rama base) sin subir la MAJOR falla (reemplaza el aviso de F1,
    # ATLAS-ADR-0021). staging y release publican y marcan su canal desde cd.yml. Sin la variable ATLAS_URL, solo valida.
    needs: contratos
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { contrato: atlas, tipo: openapi, ruta: contracts/openapi/atlas.v1.yaml, ruleset: contracts/vacuum/openapi.yaml, excepciones: contracts/vacuum/openapi-excepciones.yaml }
          - { contrato: atlas-eventos, tipo: asyncapi, ruta: contracts/asyncapi/atlas-events.v1.yaml, ruleset: contracts/vacuum/asyncapi.yaml, excepciones: "" }
    uses: ./.github/workflows/atlas-publicar.yml
    with:
      aplicativo: atlas-api
      contrato: ${{ matrix.contrato }}
      tipo: ${{ matrix.tipo }}
      ruta: ${{ matrix.ruta }}
      ruleset: ${{ matrix.ruleset }}
      excepciones: ${{ matrix.excepciones }}
      atlas_url: ${{ vars.ATLAS_URL }}
      publicar: ${{ github.event_name == 'push' && github.ref_name == 'develop' }}

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/render
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/render/go.mod
          cache-dependency-path: services/render/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [ia, docs]
    defaults:
      run:
        working-directory: services/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"
          python-version: "3.13"
      - name: Dependencias (lockfile exacto)
        run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Marca FLIT sin ediciones a mano (ATLAS-ADR-0015 y ATLAS-ADR-0020)
        run: node ../../scripts/marca/sincronizar.mjs --verificar
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bundle

  imagenes:
    # Construye (sin publicar) las imágenes que publica cd.yml, para que un Dockerfile roto no llegue a staging.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { nombre: atlas-api, contexto: ., dockerfile: services/api/Dockerfile, target: api }
          - { nombre: atlas-migrador, contexto: ., dockerfile: services/api/Dockerfile, target: migrador }
          - { nombre: atlas-web, contexto: apps/web, dockerfile: apps/web/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.nombre }}
